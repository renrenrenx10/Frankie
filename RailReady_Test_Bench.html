<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RailReady Test Bench</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='27' font-size='26'>&#128678;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e1b2c; --ink-2:#3d4d61; --ink-3:#6b7c92;
  --ground:#f2f5fa; --surface:#ffffff; --surface-2:#f7f9fc;
  --line:#dbe3ee; --line-2:#eaeff6;
  --navy:#0a1628; --navy-2:#132339; --navy-line:rgba(255,255,255,.10);
  --navy-ink:rgba(255,255,255,.62); --navy-ink-2:rgba(255,255,255,.40);
  --cyan:#29b6e8; --cyan-deep:#1a96c8; --cyan-wash:rgba(41,182,232,.09);
  --bad:#e05252; --warn:#e09a3a; --mid:#c9b520; --good:#4caf7d;
  --bad-wash:rgba(224,82,82,.10); --good-wash:rgba(76,175,125,.11);
  --shadow:0 1px 2px rgba(14,27,44,.05), 0 8px 24px -12px rgba(14,27,44,.14);
  --rail:280px;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8eef7; --ink-2:#a9b8cb; --ink-3:#7e8ea4;
    --ground:#0d1826; --surface:#131f30; --surface-2:#18263a;
    --line:#25364c; --line-2:#1d2c40;
    --navy:#08111d; --navy-2:#0f1b2b;
    --cyan-wash:rgba(41,182,232,.14);
    --bad-wash:rgba(224,82,82,.16); --good-wash:rgba(76,175,125,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#e8eef7; --ink-2:#a9b8cb; --ink-3:#7e8ea4;
  --ground:#0d1826; --surface:#131f30; --surface-2:#18263a;
  --line:#25364c; --line-2:#1d2c40;
  --navy:#08111d; --navy-2:#0f1b2b;
  --cyan-wash:rgba(41,182,232,.14);
  --bad-wash:rgba(224,82,82,.16); --good-wash:rgba(76,175,125,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font:400 15px/1.6 'Barlow','Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-weight:700;text-wrap:balance;margin:0}
.lbl{font-family:'Barlow Condensed','Barlow',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
a{color:var(--cyan-deep)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── shell ───────────────────────────────────────────────────────────── */
.app{display:flex;min-height:100vh}
.rail{
  width:var(--rail);flex:0 0 var(--rail);background:var(--navy);color:#fff;
  display:flex;flex-direction:column;gap:22px;padding:22px 0 18px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;gap:11px;align-items:center;padding:0 20px}
.brand-mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--cyan),var(--cyan-deep));
}
.brand h1{font-size:1.32rem;letter-spacing:.01em;line-height:1}
.brand p{margin:3px 0 0;font-size:.7rem;color:var(--navy-ink-2);letter-spacing:.05em}
.rail-grp{padding:0 14px}
.rail-grp>.lbl{color:var(--navy-ink-2);padding:0 6px 8px}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;
  background:none;border:1px solid transparent;border-radius:8px;padding:9px 11px;
  color:var(--navy-ink);font:600 .84rem/1.3 'Barlow',sans-serif;transition:.14s;
}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn[aria-current="true"]{background:rgba(41,182,232,.16);border-color:rgba(41,182,232,.4);color:#fff}
.nav-ico{width:20px;text-align:center;flex:0 0 20px;font-size:.95rem}
.nav-meta{margin-left:auto;font-size:.7rem;color:var(--navy-ink-2);font-variant-numeric:tabular-nums}
.nav-btn[aria-current="true"] .nav-meta{color:rgba(255,255,255,.7)}
.rail-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--navy-line);font-size:.7rem;line-height:1.55;color:var(--navy-ink-2)}
.rail-foot strong{color:rgba(255,255,255,.8);font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:15px 32px;background:var(--surface);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.topbar h2{font-size:1.22rem;line-height:1.1}
.topbar p{margin:2px 0 0;font-size:.79rem;color:var(--ink-3)}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.wrap{padding:28px 32px 80px;max-width:1180px;width:100%}

/* ── controls ────────────────────────────────────────────────────────── */
.btn{
  cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);padding:8px 15px;font:600 .8rem/1 'Barlow Condensed',sans-serif;
  letter-spacing:.07em;text-transform:uppercase;transition:.14s;
}
.btn:hover{border-color:var(--cyan);color:var(--cyan-deep)}
.btn--primary{background:var(--cyan-deep);border-color:var(--cyan-deep);color:#fff}
.btn--primary:hover{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn--ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ── overview ────────────────────────────────────────────────────────── */
.hero{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow);
}
.hero .lbl{color:var(--cyan-deep)}
.hero h3{font-size:1.9rem;margin:6px 0 8px}
.hero p{margin:0;color:var(--ink-2);max-width:66ch}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-bottom:22px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;
  display:flex;flex-direction:column;gap:13px;box-shadow:var(--shadow);
}
.card h4{font-size:1.28rem}
.card p{margin:0;font-size:.87rem;color:var(--ink-2)}
.card-figs{display:flex;gap:22px;padding:12px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.fig .n{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.fig .l{font-size:.7rem;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;margin-top:3px}
.card-actions{display:flex;gap:8px;margin-top:auto}

.rulebox{
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--cyan);
  border-radius:10px;padding:20px 24px;margin-bottom:22px;
}
.rulebox h4{font-size:1.15rem;margin-bottom:8px}
.rulebox p{margin:0 0 9px;font-size:.87rem;color:var(--ink-2);max-width:78ch}
.rulebox p:last-child{margin-bottom:0}

/* ── section rail ────────────────────────────────────────────────────── */
.secbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.pill{
  cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);padding:6px 13px;
  font:600 .78rem/1 'Barlow',sans-serif;color:var(--ink-2);transition:.14s;
}
.pill:hover{border-color:var(--cyan)}
.pill[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.pill .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.pill .pc{font-variant-numeric:tabular-nums;font-size:.73rem;font-weight:700}
.pill .todo{font-size:.68rem;color:var(--ink-3)}
.pill[aria-current="true"] .todo{color:rgba(255,255,255,.55)}

.sec-head{margin-bottom:18px}
.sec-head h3{font-size:1.65rem}
.sec-head p{margin:4px 0 0;color:var(--ink-3);font-size:.85rem}

/* ── questions ───────────────────────────────────────────────────────── */
.q{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow);
}
.q-head{display:flex;gap:12px;align-items:baseline;margin-bottom:4px}
.q-ref{
  font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.08em;
  color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:4px;padding:2px 7px;flex:0 0 auto;
}
.q-topic{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--cyan-deep);font-weight:600}
.q-text{font-size:1.03rem;font-weight:600;line-height:1.45;margin:0 0 14px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;width:100%;
  border:1px solid var(--line);background:var(--surface-2);border-radius:8px;
  padding:11px 13px;font:400 .88rem/1.5 'Barlow',sans-serif;color:var(--ink-2);transition:.13s;
}
.opt:hover{border-color:var(--cyan);background:var(--cyan-wash)}
.opt[aria-pressed="true"]{border-color:var(--cyan-deep);background:var(--cyan-wash);color:var(--ink);box-shadow:inset 0 0 0 1px var(--cyan-deep)}
.opt-score{
  flex:0 0 30px;height:24px;border-radius:5px;display:grid;place-items:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.88rem;
  font-variant-numeric:tabular-nums;color:#fff;
}
.opt-bar{flex:0 0 3px;align-self:stretch;border-radius:2px;background:var(--line);display:none}
.opt[aria-pressed="true"] .opt-bar{display:block}
.fb{
  margin-top:12px;border-left:3px solid var(--line);border-radius:0 8px 8px 0;
  background:var(--surface-2);padding:12px 15px;font-size:.86rem;line-height:1.6;color:var(--ink-2);
}
.fb-row{display:flex;gap:8px;align-items:baseline}
.fb-tag{
  font-family:'Barlow Condensed',sans-serif;font-size:.66rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);flex:0 0 auto;padding-top:2px;
}
.fb-goal{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.q-tools{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.tool-btn{
  cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:6px;
  padding:5px 10px;font:600 .72rem/1 'Barlow',sans-serif;color:var(--ink-3);transition:.13s;
}
.tool-btn:hover{border-color:var(--cyan);color:var(--cyan-deep)}
.tool-btn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.note-box{
  margin-top:10px;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font:400 .86rem/1.55 'Barlow',sans-serif;background:var(--surface-2);color:var(--ink);resize:vertical;min-height:64px;
}
.note-box::placeholder{color:var(--ink-3)}
.q--flagged{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn),var(--shadow)}

.stepper{display:flex;align-items:center;gap:12px;margin-top:22px}
.stepper .spacer{flex:1}
.stepper .prog{font-size:.8rem;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ── results ─────────────────────────────────────────────────────────── */
.verdict{
  border-radius:12px;padding:22px 26px;margin-bottom:20px;border:1px solid var(--line);
  display:flex;gap:22px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);
}
.verdict--pass{background:var(--good-wash);border-color:var(--good)}
.verdict--fail{background:var(--bad-wash);border-color:var(--bad)}
.verdict--part{background:var(--surface);border-color:var(--line)}
.verdict-stamp{
  font-family:'Barlow Condensed',sans-serif;font-size:1.55rem;font-weight:800;letter-spacing:.03em;
  line-height:1;text-transform:uppercase;
}
.verdict p{margin:6px 0 0;font-size:.88rem;color:var(--ink-2);max-width:62ch}
.ring{
  --p:0; --col:var(--cyan);
  width:112px;height:112px;flex:0 0 112px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--col) calc(var(--p)*1%),var(--line) 0);position:relative;
}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.ring-in{position:relative;z-index:1;text-align:center;line-height:1}
.ring-in b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:1.85rem;font-variant-numeric:tabular-nums}
.ring-in span{display:block;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}

.res-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow)}
.panel h4{font-size:1.2rem;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:.87rem}
.tbl th{
  text-align:left;font:600 .68rem/1 'Barlow Condensed',sans-serif;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);padding:0 10px 9px;border-bottom:1px solid var(--line);
}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .nm{font-weight:600;color:var(--ink)}
.meter{height:7px;border-radius:4px;background:var(--line);overflow:hidden;min-width:110px}
.meter i{display:block;height:100%;border-radius:4px}
.tag{
  display:inline-block;border-radius:999px;padding:3px 10px;font:700 .68rem/1.5 'Barlow Condensed',sans-serif;
  letter-spacing:.08em;text-transform:uppercase;
}
.tag--pass{background:var(--good-wash);color:var(--good)}
.tag--block{background:var(--bad-wash);color:var(--bad)}
.tag--open{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.zero-list{margin:0;padding-left:20px;font-size:.87rem;color:var(--ink-2)}
.zero-list li{margin-bottom:6px}
.empty{color:var(--ink-3);font-size:.87rem;margin:0}

/* ── handbook ────────────────────────────────────────────────────────── */
.hb-switch{display:flex;gap:8px;margin-bottom:16px}
.hb-shell{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:72vh;box-shadow:var(--shadow)}
.hb-side{width:288px;flex:0 0 288px;border-right:1px solid var(--line);background:var(--surface-2);overflow-y:auto;max-height:78vh}
.hb-read{flex:1;min-width:0;overflow-y:auto;max-height:78vh;padding:30px 38px}
.hb-cat{
  display:flex;align-items:center;gap:9px;padding:11px 16px;cursor:pointer;
  font:600 .73rem/1.2 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);border-top:1px solid var(--line-2);transition:.13s;
}
.hb-cat:first-child{border-top:none}
.hb-cat:hover{background:var(--cyan-wash)}
.hb-cat-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.hb-ch{
  display:block;width:100%;text-align:left;cursor:pointer;background:none;border:none;
  padding:7px 16px 7px 32px;font:400 .82rem/1.35 'Barlow',sans-serif;color:var(--ink-2);transition:.12s;
}
.hb-ch:hover{color:var(--cyan-deep)}
.hb-ch[aria-current="true"]{color:var(--cyan-deep);font-weight:600;background:var(--cyan-wash);box-shadow:inset 2px 0 0 var(--cyan)}
.hb-eyebrow{display:flex;align-items:center;gap:9px;font:600 .7rem/1 'Barlow Condensed',sans-serif;letter-spacing:.13em;text-transform:uppercase;margin-bottom:9px}
.hb-read h1{font-family:'Barlow Condensed',sans-serif;font-size:2.05rem;font-weight:700;margin:0;line-height:1.1}
.hb-qref{font:600 .7rem/1 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:8px 0 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hb-jump{cursor:pointer;background:none;border:1px solid var(--line);border-radius:5px;padding:3px 9px;font:600 .68rem/1.4 'Barlow',sans-serif;color:var(--ink-3);text-transform:none;letter-spacing:0}
.hb-jump:hover{border-color:var(--cyan);color:var(--cyan-deep)}
.hb-intro{border-left:3px solid var(--cyan);background:var(--cyan-wash);border-radius:0 10px 10px 0;padding:18px 22px}
.hb-lead{font-size:1rem;line-height:1.65;color:var(--ink);margin:0 0 16px}
.hb-card{background:var(--surface);border:1px solid var(--line);border-radius:9px;margin-bottom:12px;overflow:hidden}
.hb-card-header{display:flex;align-items:center;gap:10px;padding:11px 15px;border-left:3px solid var(--cyan);background:var(--surface-2)}
.hb-card-header span{font:700 .84rem/1.3 'Barlow Condensed',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.hb-card-icon{width:17px;height:17px;flex:0 0 17px}
.hb-card-body{padding:14px 17px}
.hb-card-body>*:first-child{margin-top:0}
.hb-card-body>*:last-child{margin-bottom:0}
.hb-p{font-size:.89rem;line-height:1.65;color:var(--ink-2);margin:0 0 9px}
.hb-p strong{color:var(--ink)}
.hb-ul{margin:0 0 9px;padding-left:19px;font-size:.89rem;line-height:1.7;color:var(--ink-2)}
.hb-ul li{margin-bottom:3px}
.hb-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:17px 20px;margin-top:16px}
.hb-box h3{font-family:'Barlow Condensed',sans-serif;font-size:1.02rem;letter-spacing:.04em;margin:0 0 11px}
.hb-point{font-size:.85rem;line-height:1.6;color:var(--ink-2);padding-left:17px;position:relative;margin-bottom:6px}
.hb-point::before{content:"›";position:absolute;left:3px;color:var(--cyan);font-weight:700}
.hb-nav{display:flex;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.hb-nav-btn{cursor:pointer;border:1px solid var(--line);background:none;border-radius:6px;padding:8px 16px;font:600 .78rem/1 'Barlow Condensed',sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.hb-nav-btn:hover{border-color:var(--cyan);color:var(--cyan-deep)}

/* ── export ──────────────────────────────────────────────────────────── */
.export-out{
  width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  font:400 .78rem/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--surface-2);color:var(--ink);resize:vertical;white-space:pre;
}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--navy);color:#fff;border-radius:8px;padding:11px 20px;
  font:600 .84rem/1 'Barlow',sans-serif;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media (max-width:1000px){
  .app{flex-direction:column}
  .rail{width:100%;flex:none;height:auto;position:static;padding-bottom:14px}
  .wrap,.topbar{padding-left:18px;padding-right:18px}
  .hb-shell{flex-direction:column}
  .hb-side{width:100%;flex:none;max-height:260px;border-right:none;border-bottom:1px solid var(--line)}
  .hb-read{padding:22px 20px;max-height:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
          <rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10h14"/>
          <circle cx="9" cy="13" r="1.1" fill="#fff" stroke="none"/><circle cx="15" cy="13" r="1.1" fill="#fff" stroke="none"/>
          <path d="M8 16l-2 5M16 16l2 5M4 21h16"/>
        </svg>
      </div>
      <div><h1>RailReady</h1><p>Test bench</p></div>
    </div>

<script>
const DATA  = {"railready-manufacturing":{"Rail Industry Fundamentals":{"questions":[{"statement":"Does your organisation understand the regulatory framework governing the GB railway and how it shapes what your customers must deliver?","topic":"Rail Regulatory Framework","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-rail-regulatory-framework/","options":[{"score":0,"desc":"No awareness of how the railway is regulated or how customer obligations and funding are set.","feedback":"The regulatory context in which customers operate is unknown, so their requirements appear arbitrary rather than derived.","goalFeedback":""},{"score":2,"desc":"Some individuals have heard of the regulator, but this is not shared knowledge and does not inform how the business works.","feedback":"Awareness sits with individuals rather than the organisation and has no bearing on decisions.","goalFeedback":""},{"score":7,"desc":"The regulatory role is understood and documented, and briefed to relevant staff, and it informs how the organisation works.","feedback":"The regulatory framework is understood and documented, and staff can explain how it shapes customer requirements.","goalFeedback":"Document how the regulator's determinations shape what your customers are required to deliver, and brief it to commercial and technical staff rather than holding it in one head. Understanding why a customer requirement exists is what allows you to propose a better way of meeting it."},{"score":10,"desc":"Regulatory context is embedded in planning, and published determinations are tracked and used to anticipate changes in demand.","feedback":"Regulatory context is embedded in business planning and used proactively to anticipate changes in customer demand and requirements.","goalFeedback":"Track the determinations and monitoring publications relevant to your customers, and use them to anticipate changes in requirements before they reach you as a tender. Give the activity a named owner so it survives a busy quarter."}]},{"statement":"Does your organisation plan its capacity, investment and resourcing around the railway's funding cycle?","topic":"Planning Around The Funding Cycle","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-planning-around-the-funding-cycle/","options":[{"score":0,"desc":"Planning takes no account of the railway's funding cycle, and the business was unaware funding is set on a multi-year basis.","feedback":"Investment and capacity decisions are made blind to the cycle that determines when rail work appears, so the business is exposed to both peaks and troughs.","goalFeedback":""},{"score":2,"desc":"The cycle is known about, but the organisation's own planning horizon is short and does not reflect it.","feedback":"Awareness exists without application. Short-horizon planning forfeits the stability the funding cycle is designed to give the supply chain.","goalFeedback":""},{"score":7,"desc":"Published plans and delivery plan updates relevant to the organisation's work are tracked and used to inform capacity, skills and investment planning.","feedback":"The funding cycle informs capacity, skills and investment planning, though it may not yet be a formal input to the business plan.","goalFeedback":"Use the published plans and their published updates as an input to decisions about plant, floor space, tooling and recruitment. The cycle exists to give the supply chain certainty, so plan against it rather than reacting to individual orders."},{"score":10,"desc":"Funding cycle and delivery plan information is a standing input to the business plan with named ownership, and plans are adjusted when published information changes.","feedback":"Funding cycle information is a standing, owned input to business planning, and plans are adjusted proactively as published information changes.","goalFeedback":"Make this a standing agenda item with an owner, and adjust proactively when a published plan changes rather than waiting for the effect to reach your order book. Track how accurate your assumptions proved and refine them."}]},{"statement":"Does your organisation understand how its principal rail customers are organised, and direct its engagement accordingly?","topic":"Understanding Your Customer's Structure","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-understanding-your-customer-s-structure/","options":[{"score":0,"desc":"The customer is approached as a single undifferentiated organisation.","feedback":"Effort is directed at whoever answers. Without a map of the organisation, engagement is chance rather than strategy.","goalFeedback":""},{"score":2,"desc":"It is known that the customer has regions and functions, but contacts are ad hoc and not mapped to the structure.","feedback":"Relationships exist but are not deliberately placed. When a contact moves, the relationship is lost with them.","goalFeedback":""},{"score":7,"desc":"The regional, route and national function structure is understood, including that regions hold their own budgets, and engagement is directed accordingly.","feedback":"The customer's structure is understood and engagement is directed at the right parts of it, though the approach may not yet be planned or reviewed.","goalFeedback":"Map your contacts against the structure and identify where the decisions that affect you are actually taken. Recognise that a region with its own settlement and budget buys differently from a central function, and pitch accordingly."},{"score":10,"desc":"An engagement plan is built around the customer's structure, is leadership-owned and is reviewed for effectiveness.","feedback":"Engagement is planned around the customer's structure, owned at leadership level and reviewed for effectiveness.","goalFeedback":"Hold a written engagement plan covering regions, routes, the system operator and the national functions, own it at leadership level, and review it against results rather than activity. Adjust it when the customer reorganises."}]},{"statement":"Does your organisation understand the outcomes its rail customers are held to account for, and how what it supplies contributes to them?","topic":"Outcomes Your Customers Are Held To","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-outcomes-your-customers-are-held-to/","options":[{"score":0,"desc":"The objectives customers are regulated against are unknown; work is seen purely as delivering a specification.","feedback":"The organisation cannot explain why it matters, only what it makes. That is a weak position in any competitive evaluation.","goalFeedback":""},{"score":2,"desc":"There is a general sense that safety and performance matter to customers, but no link has been made to what is supplied.","feedback":"The connection between the product and the customer's regulated outcomes has not been made, so it cannot be argued in a bid.","goalFeedback":""},{"score":7,"desc":"The objectives are understood, their link to the product can be explained, and this is reflected in bids and delivery reporting.","feedback":"The customer's regulated outcomes are understood and their link to the product is articulated in bids and reporting.","goalFeedback":"Be specific about which outcome your product moves and how, rather than claiming all of them. A defensible claim on one objective, evidenced, beats a general assertion about four."},{"score":10,"desc":"Contribution to these outcomes is measured in the organisation's own performance data, reviewed by leadership and used to propose improvements.","feedback":"Contribution to customer outcomes is measured, reviewed by leadership and used to propose improvements to customers.","goalFeedback":"Measure your contribution rather than asserting it, review it at leadership level, and take proposals to customers based on what the data shows. This is what moves a supplier from responding to tenders to shaping them."}]},{"statement":"Does your organisation follow how its rail customers' delivery is publicly measured and reported, and use that to anticipate what will be asked of it?","topic":"Published Performance Information","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-published-performance-information/","options":[{"score":0,"desc":"How customers' performance is measured or reported is not known.","feedback":"A rich, free source of intelligence about customer priorities is going unread.","goalFeedback":""},{"score":2,"desc":"It is known that customers report on performance, but the measures are not followed and their meaning has not been considered.","feedback":"The information is recognised but not used, so it has no effect on how the organisation positions itself.","goalFeedback":""},{"score":7,"desc":"Published outcome and success measures relevant to the regions and assets served are followed, and inform how the organisation bids and reports.","feedback":"Published performance information is followed and reflected in bidding and reporting, though it may not yet be a formal planning input.","goalFeedback":"Follow the measures that relate to the assets and regions you actually serve rather than the whole picture, and reflect them in the language of your bids and your delivery reporting. Speaking your customer's measures back to them is persuasive."},{"score":10,"desc":"Published performance information is a routine, owned input to commercial planning, and is used to propose solutions before being asked.","feedback":"Published performance information is a routine, owned commercial input, and is used to bring solutions to customers proactively.","goalFeedback":"Give this a named owner and a routine place in commercial planning. Use a measure that is going the wrong way as the basis for an unsolicited proposal; that is how suppliers get in front of a requirement rather than behind it."}]},{"statement":"Does your organisation understand the funding pressures its rail customers face, and can it evidence value rather than assert it?","topic":"Value And Efficiency Under Funding Pressure","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-value-and-efficiency-under-funding-pressure/","options":[{"score":0,"desc":"Customer funding pressures are unrecognised; the organisation competes on price or availability alone.","feedback":"Without an understanding of where customer money is going, the offer cannot be shaped to what customers are able to buy.","goalFeedback":""},{"score":2,"desc":"It is known that budgets are tight, but what is offered and how value is evidenced have not changed.","feedback":"The pressure is acknowledged but not responded to. Bids continue to argue on price rather than on cost over life.","goalFeedback":""},{"score":7,"desc":"The shift in how customer funding is being spent is understood, and whole-life cost and efficiency benefits can be evidenced.","feedback":"Customer funding pressures are understood and whole-life value can be evidenced, though the organisation may not yet be tracking savings delivered.","goalFeedback":"Understand that a shift from renewal towards life-extending repair and maintenance changes what customers want to buy, and evidence your whole-life cost case with data rather than assertion. Say what the customer avoids spending, not only what you charge."},{"score":10,"desc":"The organisation actively seeks to reduce customers' whole-life costs, tracks the savings delivered and shares the evidence.","feedback":"The organisation actively reduces customer whole-life costs, measures the savings delivered and evidences them to customers.","goalFeedback":"Go looking for cost your customer could avoid, agree how the saving will be measured before you start, and share the evidence afterwards. A supplier with a track record of measured savings is difficult to displace on price."}]},{"statement":"Does your organisation understand where it sits in the rail supply chain, and pursue its routes to market deliberately?","topic":"Routes To Market And Positioning","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-routes-to-market-and-positioning/","options":[{"score":0,"desc":"The tiered structure of the rail supply chain is not understood, and no routes to market are actively pursued.","feedback":"The organisation waits to be found. It is also unlikely to be registered where opportunities are advertised, so it cannot see them.","goalFeedback":""},{"score":2,"desc":"It is known that larger contractors subcontract, but there is no planned approach and registrations are not maintained.","feedback":"Routes to market are pursued opportunistically. Lapsed or inaccurate registrations mean opportunities are missed before they are ever seen.","goalFeedback":""},{"score":7,"desc":"The organisation knows where its capability sits in the tiers, pursues direct and subcontract routes in a planned way, and keeps its registrations and pipeline monitoring current.","feedback":"Routes to market are understood and pursued in a planned way, with registrations maintained and pipelines monitored.","goalFeedback":"Identify the tier one contractors relevant to what you make, and pursue them alongside direct opportunities rather than instead of them. Keep every registration and portal profile accurate and current, and give someone responsibility for reviewing pipelines regularly."},{"score":10,"desc":"A route to market strategy is set at leadership level, covers direct and tiered routes, feeds a qualified opportunity plan, and is reviewed against results.","feedback":"Route to market is a leadership-owned strategy feeding a qualified opportunity plan, and is reviewed against results and changing contracting models.","goalFeedback":"Turn pipeline monitoring into a qualified opportunity plan with explicit bid or no bid decisions, and review win and loss outcomes to improve. Revisit the strategy when contracting models change, because the tier you sell into can change with them."}]},{"statement":"Is your organisation prepared for changes in how its rail customers are structured and how they buy?","topic":"Readiness For Industry Change","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-readiness-for-industry-change/","options":[{"score":0,"desc":"The organisation is unaware that the bodies it sells to are being reorganised.","feedback":"A structural change to the customer base is approaching unnoticed. Relationships and routes to market built on the current structure are at risk.","goalFeedback":""},{"score":2,"desc":"Individuals have picked up news of the change, but no assessment has been made of what it means.","feedback":"The change is known about but has not been thought through, so no preparation has begun.","goalFeedback":""},{"score":7,"desc":"Published material is followed, the direction of the change is understood, and management has assessed what it means for customers, contacts and routes to market.","feedback":"The direction of industry change is understood and its implications for the business have been assessed at management level.","goalFeedback":"Assess at management level which of your relationships and routes to market depend on the structure as it stands today, and where a reorganisation would put those decisions instead. Understanding that infrastructure and operations are being brought together locally tells you where to build new relationships."},{"score":10,"desc":"Industry transition is a standing item in leadership risk and strategy review, with a named owner and plans adjusted as published detail changes.","feedback":"Industry transition is actively owned at leadership level, with mapped impacts and plans that are adjusted as published detail changes.","goalFeedback":"Hold it as a standing risk and strategy item with a named owner and a mapped view of affected customers and relationships. Adjust the plan as published detail firms up, rather than waiting for the change to complete and then reacting."}]}],"excellence":"Suppliers to the GB mainline railway sell into a regulated, publicly funded system with its own multi-year funding cycle, its own organisational structure and its own published performance measures. Manufacturers who understand what their customers are being held to account for, how those customers are funded, and how work is advertised and qualified for, compete far more effectively than those relying on informal contacts. This module assesses how well your organisation understands the industry it sells into, and how deliberately it uses that understanding to plan, position and bid."},"Rail Safety Culture":{"questions":[{"statement":"Does your organisation actively find out what its safety culture is, rather than assuming it?","topic":"Understanding Your Safety Culture","handbookUrl":"https://nuccol.co.uk/railready-rail-safety-culture-understanding-your-safety-culture/","options":[{"score":0,"desc":"Safety culture is never discussed or assessed.","feedback":"Culture is neither described nor measured, so any statement made about it in a tender is untested.","goalFeedback":""},{"score":2,"desc":"Leadership has a view on the culture, but it is not tested with the workforce.","feedback":"A management view of culture exists but has not been checked against what staff experience, and the two often differ.","goalFeedback":""},{"score":7,"desc":"Culture is assessed periodically using a recognised method, and the findings are shared and acted on.","feedback":"Safety culture is assessed and the findings are acted on, giving a real rather than assumed picture.","goalFeedback":"Use a recognised approach such as a safety culture or safety climate assessment rather than a general staff survey, and gather informal intelligence during inspections and investigations as well. Share what you find with the workforce, including the uncomfortable parts, and act on it visibly."},{"score":10,"desc":"Culture is understood at the level of individual teams and areas, and is deliberately shaped as part of the safety management system.","feedback":"Safety culture is understood at team level, deliberately shaped and tracked over time as part of the safety management system.","goalFeedback":"Recognise that different cultural characteristics matter in different parts of the business, and set out a culture strategy as part of your safety management system. Track how the picture changes over time and use it to direct effort at the areas where the culture is weakest."}]},{"statement":"Do your people report things that could have caused harm or damage, and does the organisation act on them?","topic":"Close Call And Near Miss Reporting","handbookUrl":"https://nuccol.co.uk/railready-rail-safety-culture-close-call-and-near-miss-reporting/","options":[{"score":0,"desc":"There is no route to report a near miss or unsafe condition.","feedback":"Nothing is captured before it becomes an accident. The organisation only learns from harm that has already happened.","goalFeedback":""},{"score":2,"desc":"People can raise concerns informally, but few do and nothing is recorded.","feedback":"Reporting depends on individuals speaking up to the right person. With no record there is no trend and no evidence of action.","goalFeedback":""},{"score":7,"desc":"A formal reporting system is in place, reports are recorded and closed out, and reporters get feedback.","feedback":"Near miss and unsafe condition reporting is formal, recorded and closed out, with feedback to reporters.","goalFeedback":"Make sure the route is easy to use at the point where the hazard is seen, that every report gets a visible response, and that reporters hear what happened as a result. Feedback is what keeps reporting rates up once the initial push fades."},{"score":10,"desc":"Reporting is high, trends are analysed to find areas of high risk, and learning is shared beyond the team that reported.","feedback":"Reporting is strong, trends are analysed to identify areas of high risk, and learning is shared across the organisation.","goalFeedback":"Use the data strategically as well as tactically. Analyse trends to identify areas of high risk rather than only fixing individual reports, share learning across sites and with your rail customers, and treat a falling reporting rate as a warning rather than an improvement."}]},{"statement":"Does your organisation respond fairly and consistently when something goes wrong?","topic":"Just Culture And Response To Error","handbookUrl":"https://nuccol.co.uk/railready-rail-safety-culture-just-culture-and-response-to-error/","options":[{"score":0,"desc":"The response to an error is to find and discipline the individual.","feedback":"A blame response drives reporting underground. Fear prevents open communication about risk, and the organisational causes are never found.","goalFeedback":""},{"score":2,"desc":"The response varies with the manager and the seriousness of the outcome.","feedback":"Without an agreed approach the same behaviour is treated differently on different days, which staff read as unfairness whichever way it falls.","goalFeedback":""},{"score":7,"desc":"A documented just culture approach distinguishes honest error from negligence, and is applied consistently.","feedback":"A just culture approach is documented and consistently applied, distinguishing honest error from negligence.","goalFeedback":"Write down what counts as acceptable and unacceptable behaviour so expectations are transparent, and gain the workforce's agreement to it. When judging culpability, apply a test such as asking whether a comparably competent colleague in the same circumstances would have behaved differently."},{"score":10,"desc":"The just culture approach is trusted by the workforce and demonstrably shifts attention to organisational causes.","feedback":"The just culture approach is trusted by staff and demonstrably directs attention to underlying organisational weaknesses rather than to individuals.","goalFeedback":"Sustain trust by showing where the approach has led you to change a process rather than to sanction a person, reviewing decisions for consistency, and checking with staff whether they believe the system is fair. Trust is the outcome that matters, not the policy."}]},{"statement":"Do your people have a confidential route to raise a safety concern they do not feel able to raise internally?","topic":"Confidential Safety Reporting","handbookUrl":"https://nuccol.co.uk/railready-rail-safety-culture-confidential-safety-reporting/","options":[{"score":0,"desc":"There is no confidential route, only the line management chain.","feedback":"Anyone who does not feel able to speak to their manager has nowhere to go, so those concerns simply do not surface.","goalFeedback":""},{"score":2,"desc":"A confidential route exists on paper, but people are unaware of it or doubt it is confidential.","feedback":"The channel exists but is not trusted or not known about, which produces the appearance of assurance without the substance.","goalFeedback":""},{"score":7,"desc":"An independent confidential reporting channel is in place, actively publicised, and concerns raised through it are responded to.","feedback":"An independent confidential channel is in place and publicised, and concerns raised through it receive a response.","goalFeedback":"Publicise the channel repeatedly rather than once at induction, make clear how confidentiality is protected, and respond to what comes through it in a way people can see. Set it alongside strong internal reporting rather than as a replacement for it."},{"score":10,"desc":"Confidential reporting is used as leadership intelligence, with trends reviewed at senior level and learning shared.","feedback":"Confidential reporting is treated as leadership intelligence, reviewed at senior level and used to test whether reported safety performance is genuine.","goalFeedback":"Use the data as an independent test of what you believe about your culture. Review the trends in what is reported confidentially, and why people chose that route rather than an internal one, at senior level, and share the learning and the corrective actions taken."}]},{"statement":"Are your people involved in identifying safety risks and improving how work is done?","topic":"Workforce Involvement In Safety","handbookUrl":"https://nuccol.co.uk/railready-rail-safety-culture-workforce-involvement-in-safety/","options":[{"score":0,"desc":"Safety decisions are made by management alone, with no workforce input.","feedback":"The people who know most about how the work is actually done have no way to influence how it is controlled.","goalFeedback":""},{"score":2,"desc":"Staff are consulted occasionally, usually after a decision has been taken.","feedback":"Involvement is presentational rather than real, and staff will recognise it as such.","goalFeedback":""},{"score":7,"desc":"There are established arrangements for staff to contribute to risk assessment and safety improvement, and contributions are acted on.","feedback":"Workforce involvement in safety is established and contributions are acted on, though reach may be uneven across the organisation.","goalFeedback":"Involve people early, when a method or a control is still being decided rather than after it is fixed. Make sure the arrangements reach shop floor staff and not only representatives, and close the loop by telling people what changed as a result of what they said."},{"score":10,"desc":"Involvement is embedded, with staff at all levels expected to question and improve controls as part of normal work.","feedback":"Workforce involvement is fully embedded, with a questioning attitude and challenge treated as normal at every level.","goalFeedback":"Sustain a questioning attitude at every level, including the freedom to challenge a decision made higher up. Support it with debate between professionals and with work groups that own improvements, and treat the absence of challenge as a warning sign rather than as agreement."}]}],"excellence":"Safety culture is what your people do when nobody is checking. This section looks at whether your organisation understands its own culture rather than assuming it, whether hazards and near misses are reported freely, how you respond when someone makes a mistake, and whether your workforce has a route to raise a concern they cannot raise with their manager. Rail customers judge suppliers on this as much as on paperwork."},"Quality and Compliance":{"questions":[{"statement":"Does your organisation keep its supplier qualification information accurate and current?","topic":"Accuracy Of Qualification Information","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-accuracy-of-qualification-information/","options":[{"score":0,"desc":"There is no reliable picture of what the organisation's qualification records currently say about it.","feedback":"Nobody knows what buyers can see. The organisation may be presenting capability it no longer has, or hiding capability it does.","goalFeedback":""},{"score":2,"desc":"Details are updated occasionally, usually when someone chases.","feedback":"Records drift out of date between prompts, so what a buyer sees is a snapshot of an earlier business.","goalFeedback":""},{"score":7,"desc":"A named owner keeps registration details, documents and capability claims accurate and current.","feedback":"Qualification information is accurate and current, with clear ownership, though the process may not yet be joined up with bidding.","goalFeedback":"Give one person clear ownership, and make sure what you claim reflects what you can genuinely provide, including any realistic limits on volume or delivery location. Overstating capability is a faster route to losing a customer than declining the work."},{"score":10,"desc":"Accuracy is managed as a business process, reviewed by leadership and linked to bid and contract activity.","feedback":"Qualification information is managed as a governed business process, reviewed by leadership and aligned with bid and contract activity.","goalFeedback":"Link the record to what the business is actually pursuing, so a change in capability or capacity reaches the record before it reaches a bid. Review it at leadership level rather than leaving it to administration."}]},{"statement":"Does your organisation understand the qualification and assurance requirements that apply to what it supplies?","topic":"Assurance Requirements For What You Supply","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-assurance-requirements-for-what-you-supply/","options":[{"score":0,"desc":"It is not known which codes the organisation holds or what assurance each one requires.","feedback":"The organisation cannot tell whether it is qualified for the work it is bidding for, or what it would have to pass to become so.","goalFeedback":""},{"score":2,"desc":"Codes were selected at registration and have not been revisited since.","feedback":"Selections made once, often at speed, still govern what buyers can see and what assurance the organisation is exposed to.","goalFeedback":""},{"score":7,"desc":"Codes are reviewed deliberately, the assurance level attached to each is understood, and only codes that can be evidenced are held.","feedback":"Code holdings and their assurance requirements are understood and deliberately managed.","goalFeedback":"Understand that the assurance required depends on both the commodity and the lifecycle phase, so the same product can carry different requirements at supply and at maintenance. Hold only what you can evidence, and prepare for the assurance activity each code brings before you claim it."},{"score":10,"desc":"Code selection is reviewed with commercial and technical input, tracked against market strategy, and challenged where classification looks wrong.","feedback":"Code selection is a governed decision informed by technical and commercial input, aligned to strategy and challenged where it appears misclassified.","goalFeedback":"Bring technical and commercial people to the review together, so codes follow the strategy rather than history. Where you believe a classification is wrong for what you actually supply, raise it through the proper route rather than working around it."}]},{"statement":"Does your organisation control the scope of its qualification, so that it only takes on work it has been assured for?","topic":"Control Of Assured Scope","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-control-of-assured-scope/","options":[{"score":0,"desc":"There is no check on whether work taken on falls inside the assured scope.","feedback":"The organisation may already be supplying outside its scope. Discovery of that at audit can bring a limitation or a suspension.","goalFeedback":""},{"score":2,"desc":"Scope is considered informally at bid stage but is not documented or checked consistently.","feedback":"Scope is a matter of individual judgement, so an unfamiliar enquiry can be accepted before anyone checks.","goalFeedback":""},{"score":7,"desc":"Enquiries and bids are checked against the assured scope, and extensions to scope are arranged before the work is taken on.","feedback":"Assured scope is checked before work is accepted, and extensions are arranged in advance.","goalFeedback":"Build the scope check into your bid or order acceptance process so it cannot be skipped under time pressure, and start any scope extension early enough that assurance is in place before delivery rather than after."},{"score":10,"desc":"Scope control is embedded in governance, with limitations, restrictions and their causes tracked and acted on by leadership.","feedback":"Scope control is embedded in governance, and limitations and their root causes are owned and acted on at leadership level.","goalFeedback":"Track any limitations or restrictions placed on your qualification, and treat their causes as a governance matter rather than an administrative one. Where scope repeatedly constrains the business, decide deliberately whether to extend it or to stop pursuing that work."}]},{"statement":"Does your organisation prepare properly for assurance audits, including submitting evidence in advance when the scheme requires it?","topic":"Audit Readiness And Evidence","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-audit-readiness-and-evidence/","options":[{"score":0,"desc":"No preparation is made, and evidence is assembled only when the auditor asks for it.","feedback":"Audits are met unprepared. Findings that follow are usually about the absence of records rather than the absence of practice.","goalFeedback":""},{"score":2,"desc":"Preparation is a last minute effort by one or two people shortly before the audit date.","feedback":"Readiness rests on a short burst of effort by a few individuals, and any absence at the wrong moment leaves the organisation exposed.","goalFeedback":""},{"score":7,"desc":"Each audit is planned, required evidence is gathered and submitted within the scheme's timescales, and the people involved are briefed.","feedback":"Audits are planned for, evidence is submitted on time and staff are briefed.","goalFeedback":"Note that some schemes review a portion of your management system before the visit, so late submission costs you before the auditor arrives. Brief the staff who will be interviewed, so they can describe what they actually do rather than reciting a procedure."},{"score":10,"desc":"Audit readiness is continuous, tested by the organisation's own internal reviews, and owned by senior management.","feedback":"Audit readiness is continuous, internally tested and owned at senior level rather than created for the visit.","goalFeedback":"Keep evidence in a state where an audit could begin at short notice, and test that with your own internal reviews rather than waiting for the external one. Own readiness at senior level so it is a property of the business rather than a project."}]},{"statement":"Does your organisation close out audit findings and non-conformances with corrective action that prevents recurrence?","topic":"Non-Conformance Close-Out","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-non-conformance-close-out/","options":[{"score":0,"desc":"Findings are received but are not tracked or closed in any structured way.","feedback":"Findings accumulate unaddressed. Failure to close a minor finding can itself escalate into a major one.","goalFeedback":""},{"score":2,"desc":"Findings are responded to individually, but there is no tracker and closure is not verified.","feedback":"Action is taken but not evidenced or checked, so the organisation cannot show closure and the same finding tends to return.","goalFeedback":""},{"score":7,"desc":"All findings are logged with owners and target dates, and closure is verified with evidence.","feedback":"Findings are tracked, owned and closed with verified evidence.","goalFeedback":"Keep one tracker for findings from every source, internal and external, with an owner and a date each. Verify closure with evidence rather than assertion, and treat an overdue minor finding as a live risk rather than an administrative delay."},{"score":10,"desc":"Findings are analysed for root cause and trends, and used to improve the management system, with leadership review.","feedback":"Findings are analysed for root cause and trend, and drive management system improvement under leadership review.","goalFeedback":"Look past the individual finding to why the system allowed it, and act on the pattern rather than the instance. Review trends at leadership level so repeat findings drive a change to the system rather than another corrective action."}]},{"statement":"Does your organisation have management system policies for quality, environment and health and safety that set objectives and are actually used?","topic":"Management System Policies And Objectives","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-management-system-policies-and-objectives/","options":[{"score":0,"desc":"No management system policies exist for quality, environment or health and safety.","feedback":"There is nothing stating what the organisation commits to, so nothing to manage against and nothing a buyer can rely on.","goalFeedback":""},{"score":2,"desc":"Policies exist but are undated, unendorsed or not communicated, and set no objectives.","feedback":"Policies exist as documents rather than as commitments. Without objectives they cannot be monitored or improved against.","goalFeedback":""},{"score":7,"desc":"Current policies are endorsed at director level, communicated, reviewed at least annually, and set objectives that are monitored.","feedback":"Policies are current, endorsed, communicated and carry monitored objectives.","goalFeedback":"Make sure each policy is dated, endorsed at director level, covers the whole business and reaches employees at induction and after every change. Set quality, environmental and health and safety objectives and monitor them, and state in the policy whether you hold certification to any standard."},{"score":10,"desc":"The management system genuinely runs the business, supported by internal audit, management review and, where customers require it, third party certification.","feedback":"The management system is genuinely used to run the business, with internal audit, management review and certification where required driving improvement.","goalFeedback":"Move from holding a system to using one. Run internal audits and management reviews that change decisions, drive continual improvement against your objectives, and maintain third party certification where your customers or your codes require it, keeping findings closed."}]},{"statement":"Does your organisation identify, record and act on the legislation, standards and customer requirements that apply to what it supplies?","topic":"Legal And Standards Register","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-legal-and-standards-register/","options":[{"score":0,"desc":"There is no register of applicable legislation, standards or customer requirements.","feedback":"The organisation cannot demonstrate that it knows what applies to it, which is a common early audit failure.","goalFeedback":""},{"score":2,"desc":"Key requirements are known informally by individuals, but nothing is recorded or reviewed.","feedback":"Compliance rests on personal knowledge. When that person is unavailable, so is the knowledge.","goalFeedback":""},{"score":7,"desc":"A register of applicable legislation, standards and customer requirements is maintained, reviewed for changes, and updates are communicated.","feedback":"A register of applicable requirements is maintained, reviewed and communicated.","goalFeedback":"Scope the register to the work you actually do rather than listing everything, record the issue or version you are working to, and give someone responsibility for checking for changes. Communicate what changes to the people it affects, not only to the quality function."},{"score":10,"desc":"Requirement changes are horizon scanned, assessed for business impact by senior leaders, and implemented through a controlled process.","feedback":"Requirement changes are horizon scanned, assessed at senior level for impact and implemented through controlled change.","goalFeedback":"Look ahead for changes rather than reacting to them, assess their business impact at senior level, and implement through a controlled change process so drawings, procedures and training all move together. A superseded standard reached late is a non-conformance waiting to be found."}]},{"statement":"Does your organisation know which qualification schemes its rail customers use, and manage its position under each of them?","topic":"Managing Multiple Qualification Routes","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-managing-multiple-qualification-routes/","options":[{"score":0,"desc":"It is not known which qualification schemes rail buyers use, or whether the organisation is on them.","feedback":"The organisation may be invisible to buyers who search only the scheme it is not registered on.","goalFeedback":""},{"score":2,"desc":"A registration is held but is largely dormant, with codes, questionnaires and audit status untracked.","feedback":"A dormant registration gives no assurance to a buyer and can lapse without anyone noticing.","goalFeedback":""},{"score":7,"desc":"The organisation knows which schemes its buyers use, which codes it holds under each, and keeps questionnaires and audits current and renewed in time.","feedback":"Qualification routes are known and actively managed, with codes and renewals kept current under each scheme.","goalFeedback":"Find out which scheme each of your target buyers actually uses, since the rail sector runs more than one and they are not interchangeable. Track renewal dates, code accuracy and audit status for each, and start renewal early enough that qualification never lapses mid-bid."},{"score":10,"desc":"Qualification routes are managed together as part of a planned route to market, with readiness, code accuracy and renewal owned at leadership level.","feedback":"Qualification routes are managed together as a leadership-owned part of route to market, with readiness and accuracy maintained across schemes.","goalFeedback":"Manage your qualifications as one portfolio serving a route to market rather than as separate administrative obligations. Decide deliberately which schemes are worth the cost for the buyers you are targeting, and own that decision at leadership level."}]}],"excellence":"Rail buyers rely on shared, independent assurance rather than auditing every supplier themselves. A manufacturer's standing depends on registering accurately, claiming only the product codes it can evidence, keeping its qualification current, and passing audit where the codes it holds demand it. Excellent organisations treat qualification as a live management responsibility rather than an annual administrative task, controlling the scope of what they claim, closing findings at root cause, and running a management system that actually governs the work."},"Leadership and Governance":{"questions":[{"statement":"Does your leadership team clearly communicate and demonstrate the safety and quality expectations that apply to your rail work?","topic":"Leadership Commitment To Rail Safety","handbookUrl":"https://nuccol.co.uk/railready-leadership-governance-leadership-commitment-to-rail-safety/","options":[{"score":0,"desc":"Leadership does not communicate any specific expectations for rail work.","feedback":"There is no visible leadership commitment to rail safety and quality. Rail expectations need to be set and communicated by senior management before anything else can be embedded.","goalFeedback":""},{"score":2,"desc":"Rail expectations are mentioned occasionally, but not consistently or visibly.","feedback":"Leadership refers to rail requirements from time to time, but the message is inconsistent and staff are unlikely to be able to repeat it.","goalFeedback":""},{"score":7,"desc":"Leadership communicates clear, consistent rail safety and quality expectations that staff can describe.","feedback":"Rail safety and quality expectations are communicated clearly and consistently, and are understood across the organisation.","goalFeedback":"Keep leadership messaging on rail regular and specific rather than general. Use production meetings, briefings and shop floor visits to reinforce what rail customers expect of your product and your people, and check by asking staff what they believe the expectations are."},{"score":10,"desc":"Leaders model rail safety and quality expectations in their own decisions and are seen to do so.","feedback":"Leadership visibly models rail safety and quality expectations, including where those expectations conflict with commercial pressure.","goalFeedback":"Hold the position by making rail expectations visible in decisions that cost something, such as stopping a shipment on a quality concern. Develop the same behaviours in supervisors and team leaders so leadership is not confined to the senior team, and share your approach with your own supply chain."}]},{"statement":"Does your organisation have clear governance and defined accountabilities for its rail work?","topic":"Governance, Oversight And Accountabilities","handbookUrl":"https://nuccol.co.uk/railready-leadership-governance-governance-oversight-and-accountabilities/","options":[{"score":0,"desc":"No formal governance for rail work and no defined accountabilities.","feedback":"Nobody owns rail work at a senior level. Define who is accountable for rail safety, quality and delivery, and how that accountability is exercised.","goalFeedback":""},{"score":2,"desc":"Some oversight of rail work exists, but roles and accountabilities are unclear or overlapping.","feedback":"Oversight happens, but accountabilities are not written down or are held by several people at once, which makes it hard to see where a decision was taken.","goalFeedback":""},{"score":7,"desc":"A documented governance framework defines who is accountable for rail work and how it is overseen.","feedback":"Governance and accountabilities for rail work are clearly defined, documented and understood.","goalFeedback":"Keep the framework current as your rail work grows. Make sure the senior team receives rail performance information often enough to act on it, that named individuals own each rail obligation, and that conflicts between rail requirements and other business objectives have a route to resolution."},{"score":10,"desc":"Governance is embedded, with senior review that actively challenges rail performance and directs improvement.","feedback":"Governance is fully embedded, and senior review provides genuine challenge and direction rather than assurance alone.","goalFeedback":"Move oversight from reporting to challenge. Test the assumptions behind the rail performance you are shown, seek external comparison, and use governance to direct resource at the weakest area rather than to confirm that all is well."}]},{"statement":"Are your managers and supervisors held accountable for safety and quality performance, and are they present where the work is done?","topic":"Supervision And Visible Leadership","handbookUrl":"https://nuccol.co.uk/railready-leadership-governance-supervision-and-visible-leadership/","options":[{"score":0,"desc":"Managers and supervisors are not held accountable for safety or quality, and rarely visit the work area.","feedback":"Accountability stops at policy level. Managers and supervisors need defined safety and quality responsibilities and a reason to be present where work is happening.","goalFeedback":""},{"score":2,"desc":"Some managers take an interest, but accountability and presence depend on the individual.","feedback":"Supervisory engagement varies by person rather than by design, so standards are applied unevenly across shifts and areas.","goalFeedback":""},{"score":7,"desc":"Managers and supervisors have defined safety and quality accountabilities and engage regularly with the work area.","feedback":"Supervisory accountability is defined and engagement with the work area is regular, though the quality of that engagement can vary.","goalFeedback":"Make supervisory presence purposeful rather than routine. Give supervisors a structure for what to look at and how to record what they find, review spans of control so supervision is realistic for the work and shift pattern, and feed findings into improvement."},{"score":10,"desc":"Supervisory accountability is embedded, with realistic spans of control and engagement that measurably improves performance.","feedback":"Supervisory accountability is fully embedded, spans of control are realistic, and engagement demonstrably improves safety and quality performance.","goalFeedback":"Sustain this by reviewing supervisory ratios whenever work, staffing or shift patterns change, developing non-technical skills such as coaching and challenge in your supervisors, and using what supervision finds to drive change rather than to record compliance."}]}],"excellence":"Visible leadership and clear governance set the tone for everything a rail supplier does. This section assesses whether your leadership team communicates and demonstrates rail safety and quality expectations, whether accountabilities for rail work are defined and owned, and whether your board or senior team provides real direction and challenge rather than passive oversight. It looks for leadership that people recognise on the shop floor, not only in policy documents."},"Human Performance":{"questions":[{"statement":"Does your organisation have a system for establishing, developing and maintaining the competence its work requires?","topic":"Competence Management System","handbookUrl":"https://nuccol.co.uk/railready-human-performance-competence-management-system/","options":[{"score":0,"desc":"Competence requirements have not been identified and there is no system for managing them.","feedback":"The organisation cannot say what competence its work requires, so it cannot know whether it has it.","goalFeedback":""},{"score":2,"desc":"Training happens when someone asks for it or when a certificate expires, with no underlying system.","feedback":"Competence is managed reactively through certificates rather than deliberately through a system, so gaps only surface when a record lapses.","goalFeedback":""},{"score":7,"desc":"Activities and their risks are identified, standards are set, and staff are trained, assessed and recorded against them.","feedback":"A competence management system is in place covering requirements, training, assessment and records.","goalFeedback":"Start from the activities you carry out and the risks they carry, then set the standards competence will be measured against. Cover selection, training, assessment, records and how you control what a person is allowed to do, and remember that managers and assessors need maintained competence too."},{"score":10,"desc":"Performance is monitored and reassessed, sub-standard performance is managed, and the system itself is verified, audited and reviewed.","feedback":"The competence system is maintained and improved, with performance monitored, sub-standard performance managed, and the system itself audited and reviewed.","goalFeedback":"Close the loop. Monitor and reassess performance rather than relying on the original assessment, have a defined route for managing sub-standard performance, and verify and audit the system itself so you know it is working. Include non-technical skills such as communication, situational awareness and decision making."}]},{"statement":"Does your organisation design its work so that people are less likely to make mistakes, and look for underlying causes when they do?","topic":"Human Factors And Error Prevention","handbookUrl":"https://nuccol.co.uk/railready-human-performance-human-factors-and-error-prevention/","options":[{"score":0,"desc":"Human error is treated as carelessness and is not considered when work is designed.","feedback":"Error is treated as a personal failing rather than a predictable outcome of how work is set up, so the same mistakes recur.","goalFeedback":""},{"score":2,"desc":"Error-prone tasks are recognised informally, but nothing is done at the design stage.","feedback":"People know which jobs catch them out, but that knowledge does not reach the people who write procedures or specify equipment.","goalFeedback":""},{"score":7,"desc":"Error is considered when procedures, tasks and equipment are designed or changed, and investigations look beyond the individual's actions.","feedback":"Human factors are considered in task and procedure design, and investigations look beyond individual actions to underlying causes.","goalFeedback":"Build human factors into design and change rather than adding it afterwards, so procedures, workplaces and equipment suit the people using them. When something goes wrong, identify the underlying causes that influenced performance rather than stopping at what the person did."},{"score":10,"desc":"Trends in underlying causes are analysed across incidents, front-line staff shape safety decisions, and the organisation also learns from what goes well.","feedback":"Underlying causes are trended across incidents, front-line staff shape safety decisions, and learning is drawn from successful work as well as failures.","goalFeedback":"Look across incidents for trends in underlying causes rather than treating each one alone. Include front-line staff or their representatives in safety policy and decision making, and study the work that goes well as deliberately as the work that fails."}]},{"statement":"Does your organisation have a written fatigue policy setting out what it will do about fatigue risk, who is responsible, and what people should do when someone is too tired to work safely?","topic":"Fatigue Policy And Ownership","handbookUrl":"https://nuccol.co.uk/railready-human-performance-fatigue-policy-and-ownership/","options":[{"score":0,"desc":"Nothing is written on fatigue and there is no agreed position on what staff should do if they are too tired to work.","feedback":"Fatigue is unmanaged. Decisions about whether someone is fit to continue are being taken informally with nothing to support them.","goalFeedback":""},{"score":2,"desc":"Fatigue is mentioned in general health and safety material, but no policy sets out aims, responsibilities or expected behaviours.","feedback":"Fatigue is acknowledged without being managed. Nobody is accountable and nothing is expected of anyone in particular.","goalFeedback":""},{"score":7,"desc":"A documented fatigue policy covers aims, named responsibilities, expected behaviours and what to do when too tired to work safely, and is communicated to staff.","feedback":"A documented fatigue policy is in place, communicated, and covers aims, responsibilities and expected behaviours.","goalFeedback":"Set out your aims for managing fatigue, who will do what, and how. Be explicit about what you expect a person to do if they are too tired to work safely and what their manager should do in response, then communicate it so people know it applies to them."},{"score":10,"desc":"The policy is owned at director level, supports an open and just culture around fatigue, is consulted on with staff representatives, reviewed on a cycle, and extended to contracted resource.","feedback":"The fatigue policy is director-owned, consulted on, reviewed on a cycle, supports a just culture, and extends to contracted resource.","goalFeedback":"Own and sign the policy at director level, consult staff representatives on it, and review it on a defined cycle. Extend the same expectations to agency and subcontracted people, since fatigue risk does not respect the contract boundary and neither does the consequence."}]},{"statement":"Does your organisation monitor the hours its people actually work, rather than only the hours that were planned, and assess those patterns for fatigue risk?","topic":"Monitoring Actual Working Patterns","handbookUrl":"https://nuccol.co.uk/railready-human-performance-monitoring-actual-working-patterns/","options":[{"score":0,"desc":"Working patterns are not reviewed for fatigue risk, either as planned or as worked.","feedback":"The organisation has no idea what its people are actually working, so it cannot know whether anyone is at risk.","goalFeedback":""},{"score":2,"desc":"Planned rosters are looked at when designed, but what people actually worked is not checked.","feedback":"A roster designed within limits can be worked well outside them once overtime and cover are added, and none of that is visible.","goalFeedback":""},{"score":7,"desc":"Actual hours including overtime and shift swaps are monitored, compared against the organisation's standards, and deviations are acted on.","feedback":"Actual working patterns are monitored against standards and deviations are acted on.","goalFeedback":"Measure what was worked, not what was planned, and include overtime, call-outs and shift exchanges. Compare against your own limits and act on the exceedances you find rather than recording them, because a monitored limit that is never enforced is worse than no limit at all."},{"score":10,"desc":"Fatigue indicators are tracked over time, a fatigue assessment tool is used where appropriate, and trends are reported to senior management.","feedback":"Fatigue indicators are tracked and trended, assessed with appropriate tools, and reported to senior management.","goalFeedback":"Track the indicators that build a picture over time, including overtime, shift exchange, sickness absence and travel, and use a recognised fatigue assessment tool where the pattern of work warrants it. Report trends to senior management so resourcing decisions are informed by them."}]},{"statement":"Can your people report that they are too tired to work safely without fear of penalty, and does the organisation act on those reports?","topic":"Fatigue Reporting And Response","handbookUrl":"https://nuccol.co.uk/railready-human-performance-fatigue-reporting-and-response/","options":[{"score":0,"desc":"There is no route to raise fatigue, and doing so would be treated as a performance or attendance matter.","feedback":"Reporting fatigue carries a personal cost, so nobody does it and the organisation stays blind to the risk.","goalFeedback":""},{"score":2,"desc":"Fatigue can be mentioned to a line manager, but the response depends on the individual and nothing is recorded.","feedback":"Whether a tired person is stood down depends on which manager is on duty, and no record exists to learn from.","goalFeedback":""},{"score":7,"desc":"A stated non-punitive reporting route exists including asking to be relieved from duty, reports are recorded and acted on, and investigations prompt for fatigue.","feedback":"A non-punitive fatigue reporting route exists, reports are recorded and acted on, and investigations consider fatigue.","goalFeedback":"State clearly that reporting fatigue will not be penalised, and mean it, including where relief from duty is requested. Record what is reported and what was done, and prompt for fatigue as a possible factor in every incident investigation rather than only where it is obvious."},{"score":10,"desc":"Reports and survey findings are analysed for common causes, results are fed back to staff, and roster or resourcing changes follow with senior management sighted.","feedback":"Fatigue reports are analysed for common cause, fed back to staff, and drive roster and resourcing change under senior oversight.","goalFeedback":"Analyse reports for common causes rather than handling them one at a time, feed the findings back to staff so they see the point of reporting, and make the roster or resourcing changes the analysis points to. Keep senior management sighted on the outcome."}]},{"statement":"Does your organisation assess and reduce the risk of musculoskeletal injury from the handling its people do, and train them accordingly?","topic":"Manual Handling And Musculoskeletal Risk","handbookUrl":"https://nuccol.co.uk/railready-human-performance-manual-handling-and-musculoskeletal-risk/","options":[{"score":0,"desc":"Manual handling risk has not been assessed and no handling training is provided.","feedback":"Musculoskeletal injury is among the most common causes of lost time in the sector, and nothing is being done about it.","goalFeedback":""},{"score":2,"desc":"People are told to lift carefully and some equipment is provided, but no specific task is assessed and nothing is recorded.","feedback":"General advice substitutes for assessment. Without looking at the actual operations, the genuinely harmful ones go unnoticed.","goalFeedback":""},
