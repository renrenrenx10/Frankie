\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Look for Patterns, Not Just Peaks<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Who is repeatedly exceeding, and why<\/li><li>Which depots, routes or contracts generate the most overtime<\/li><li>Whether exceedances cluster around blockades and possession-heavy periods<\/li><li>Whether the same people always cover short notice<\/li><\/ul>\n<p class=\"hb-p\">A pattern concentrated on a few individuals is a resourcing failure, not an individual one.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Use a Tool and Report the Trend<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you track indicators over time and use a recognised fatigue assessment tool where the pattern of night and weekend work warrants it.<\/strong><\/p>\n<p class=\"hb-p\">Track overtime, shift exchange, sickness absence and travel together. Report the trend to senior management so resourcing decisions are made with it in view.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Every serious fatigue-related incident on the railway is preceded by hours somebody could have seen. Measurement is not the control, but nothing else works without it.<\/strong><\/p>"},{"id":"HUP05","order":5,"q_ref":"5.5","t":"Fatigue Reporting And Response","b":"<p class=\"hb-lead\">People will only tell you they are too tired if it is safe to do so. To score a 10 you need a stated non-punitive route including the right to ask for relief from duty, records of what was reported and done, and analysis that turns reports into roster and resourcing change.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. State the Non-Punitive Position Explicitly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's guidance describes a non-punitive fatigue reporting system as one that encourages staff to report instances when they feel excessively tired, and if necessary, request relief from duties.<\/strong><\/p>\n<p class=\"hb-p\">The guidance also states that fatigue should not be treated as sickness or subject to attendance at work processes, and that mutual trust is essential — staff must be confident that reporting will not result in being punished or losing pay.<\/p>\n<p class=\"hb-p\"><strong>Say all of that in writing. People will not infer it.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Include the Right to Ask for Relief<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Reporting tiredness is easy. Asking to be taken off the job is what people actually avoid, and it is the request that matters.<\/p>\n<ul class=\"hb-ul\"><li>Say clearly that relief from duty can be requested<\/li><li>Say who arranges cover<\/li><li>Say what happens to pay<\/li><li>Make sure the answer does not change depending on who is on duty<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Record and Respond<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Log every fatigue report and what was done<\/li><li>Give the person an answer<\/li><li>Watch for people who report once and never again — that usually means the response taught them not to<\/li><li>Track how long responses take<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Prompt for Fatigue in Every Investigation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Fatigue is rarely volunteered as a cause. It has to be asked about, every time.<\/strong><\/p>\n<p class=\"hb-p\">Put an explicit prompt in your incident and near miss investigation template, covering hours worked in the preceding days, travel, sleep opportunity and time of day. Asking only when fatigue looks obvious guarantees you find it only when it was severe.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Analyse and Change Something<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end reports and survey findings are analysed for common causes, results are fed back to staff, and roster or resourcing changes follow with senior management sighted.<\/strong><\/p>\n<p class=\"hb-p\">The feedback loop is what sustains reporting. If people report and nothing changes, the rate falls to zero and you lose the only early warning you had.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Fatigue reporting is a system that runs entirely on trust. Handle one report badly and you lose the next twenty, and you will never know what they would have told you.<\/strong><\/p>"},{"id":"HUP06","order":6,"q_ref":"5.6","t":"Manual Handling And Musculoskeletal Risk","b":"<p class=\"hb-lead\">Musculoskeletal injury is the quiet, cumulative cost of site work, and carrying over ballast in the dark is the worst of it. To score a 10 you need handling operations identified and assessed by observing the real job on site, aids provided, and cumulative exposure managed.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Avoid, Assess, Reduce<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's good practice guide advises assessing the risk of injury from manual handling that cannot be avoided, reducing the risk as far as possible, and observing each manual handling operation that takes place.<\/strong><\/p>\n<p class=\"hb-p\">Note the order. The biggest wins on site come from avoidance: getting materials closer to the worksite so they do not have to be carried.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Assess the Job as It Is Actually Done<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A manual handling assessment written in an office describes a job nobody does.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Go and watch, at night, in the conditions the work happens in<\/li><li>Include the carry from the access point, which is often the worst part<\/li><li>Include ballast, sleepers, cess and restricted spaces<\/li><li>Record what you observed, not what should happen<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Solve the Access Problem First<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">For site work the handling risk is usually created by where the materials were dropped, not by the task itself.<\/p>\n<ul class=\"hb-ul\"><li>Can materials be delivered closer to the worksite<\/li><li>Can they be delivered in smaller units<\/li><li>Can mechanical handling reach the location<\/li><li>Is there a lighting or ground condition problem making it worse<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Manage Cumulative Exposure<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The heaviest single lift is rarely the injury. Repetition across a shift and a roster is.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Look at total handling across a shift, not just peak weight<\/li><li>Consider rotation within the gang<\/li><li>Look at awkward posture, uneven ground and repetition, not only load<\/li><li>Account for handling done while wearing full PPE in poor weather<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Encourage Early Reporting, Then Design It Out<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Discomfort is heavily under-reported on site because it feels like part of the job.<\/p>\n<p class=\"hb-p\"><strong>Make it easy and normal to report, act when someone does, and use the reports to find the tasks worth engineering out through better delivery, mechanical aids or a method change.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Musculoskeletal disorders are among the largest causes of lost time in the sector, and site work concentrates every risk factor: weight, distance, poor ground, cold and darkness.<\/strong><\/p>"},{"id":"HUP07","order":7,"q_ref":"5.7","t":"Drugs And Alcohol Arrangements","b":"<p class=\"hb-lead\">Drugs and alcohol arrangements are judged on the moment a supervisor has to make a decision at 1am on a possession. To score a 10 you need your own documented process, grounds for suspicion recorded with the worker before a test is arranged, and someone competent reachable out of hours.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Hold Your Own Process<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Relying on a client's policy leaves you unable to act on your own worksite and unable to answer a qualification question.<\/strong><\/p>\n<p class=\"hb-p\">RISQS CORE audit protocols expect a drugs and alcohol policy, and further protocols cover testing and analysis requirements. Cover the test types relevant to your work — pre-employment, for-cause, post-incident and random where applicable — and say who arranges each.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Record the Grounds Before You Decide<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Rail's briefing on its drugs and alcohol standard records that the responsible manager is required to complete the For-Cause Test Form with the worker and to document any grounds of reasonable suspicion prior to determining if a for-cause test is required.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Use a defined form<\/li><li>Record specific observations, not conclusions<\/li><li>Complete it with the worker, and let them respond<\/li><li>Keep it whatever the test result<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Make It Work Out of Hours<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is the service provider's specific problem. Most of your work happens when the office is closed.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A named responsible manager contactable at any hour<\/li><li>A testing provider with a call-out arrangement, and the number where people can find it<\/li><li>A decision on what happens to the shift while you wait<\/li><li>Arrangements for getting the person home safely<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Cover Impairment More Broadly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>A declaration route for prescribed medication that does not require disclosing the condition<\/li><li>Advice on who assesses fitness for the specific task<\/li><li>A supportive route for dependency, distinct from the disciplinary route<\/li><li>Clarity that self-declaration before a shift will be handled fairly<\/li><\/ul>\n<p class=\"hb-p\"><strong>Someone who declares before the shift has done the right thing. Treat them that way or nobody will do it again.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Keep It Current and Check Your Provider<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end arrangements are reviewed against each new issue of the infrastructure manager's standard.<\/strong><\/p>\n<p class=\"hb-p\">Verify your testing provider's assessed scope and accreditation are current, and that their out-of-hours coverage is real rather than contractual.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: This process is most likely to be tested at 1am by a supervisor who has never used it, with a possession running and a person's job on the outcome. Everything has to be decided in advance.<\/strong><\/p>"}]},"supply_chain":{"color":"#f59e0b","label":"Supply Chain Readiness","order":6,"chapters":[{"id":"SCR01","order":1,"q_ref":"6.1","t":"Subcontractor Selection And Approval","b":"<p class=\"hb-lead\">Your client inherits whoever you put on their site. To score a 10 you need a controlled approved list, criteria proportionate to what each organisation provides, and approval decisions informed by how they have actually performed on site rather than by who was available.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Hold a Controlled Approved List<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS CORE audit protocols require selecting and approving suppliers from a controlled list before placing a contract, ensuring the supplier is competent and has the resource to carry out the work.<\/strong><\/p>\n<p class=\"hb-p\">'Controlled' means someone owns it, changes are recorded, and it is the only route in. The list should show:<\/p>\n<ul class=\"hb-ul\"><li>What each organisation is approved to provide, and what they are not<\/li><li>The date of approval and the next review<\/li><li>Insurance levels and expiry<\/li><li>Sentinel sponsorship and scheme qualification status<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Make the Criteria Proportionate<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Assessing a welfare unit provider as searchingly as a labour supplier putting people on the track wastes effort and teaches people to treat the process as paperwork.<\/p>\n<ul class=\"hb-ul\"><li>Band your subcontractors by the risk of what they provide<\/li><li>Set the depth of assessment by band, and say so in the procedure<\/li><li>Assess competence, resource, sponsorship and past site performance for the top band<\/li><li>Keep the bottom band genuinely light<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Check the Things Rail Clients Check<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocols call out specific checks that matter most for site work:<\/p>\n<ul class=\"hb-ul\"><li>Suppliers of designated services who are in an approved scheme or hold licences such as Sentinel, NSAR, IRSE or CIRAS have live certification, accreditation or contract in place<\/li><li>Suppliers hold the minimum insurance applicable to their scope<\/li><li>Overseas suppliers can meet UK regulatory requirements<\/li><li>Risk from modern slavery is not being introduced through the supply chain<\/li><\/ul>\n<p class=\"hb-p\"><strong>Check that certification is live at the point of engagement, not that it existed at onboarding.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Close the Back Door<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>An approved list that can be bypassed at 4pm on a Friday for a weekend possession is not a control.<\/strong><\/p>\n<p class=\"hb-p\">Make it impossible to engage an unapproved subcontractor without an authorised, documented exception, and review how often that exception is used. A rising count usually means your list does not cover the disciplines or geography you are actually winning work in.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Re-Approve, and Use Performance to Do It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocols require periodic review of supplier qualifications. At the top end, approval is risk-based and informed by evidence.<\/p>\n<ul class=\"hb-ul\"><li>Feed site performance, Close Call reporting and competence exceptions back into the approval decision<\/li><li>Revisit banding when your scope of railway work changes<\/li><li>Develop subcontractors who are close to the standard rather than only removing those below it<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Rail clients hold you responsible for everyone working under your name. An unapproved labour supplier putting an uncompetent person on the track is your incident, not theirs.<\/strong><\/p>"},{"id":"SCR02","order":2,"q_ref":"6.2","t":"Flow-Down Of Client Requirements","b":"<p class=\"hb-lead\">Requirements that stop at your door are requirements your subcontractor cannot meet. To score a 10 you need formal flow-down proportionate to risk, acknowledgement that it was received, and a mobilisation check that what turned up matches what you specified.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Put Requirements in the Subcontract Document<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A scope line and a rate is not a specification.<\/strong><\/p>\n<p class=\"hb-p\">Where the work matters, the order should carry everything the subcontractor needs to comply:<\/p>\n<ul class=\"hb-ul\"><li>Competence and Sentinel sponsorship requirements for each role<\/li><li>Medical screening and drugs and alcohol requirements<\/li><li>Fatigue and working hours limits<\/li><li>Briefing, induction and reporting expectations<\/li><li>Any client-specific requirement that applies to that work<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Match the Depth to the Risk<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Full flow-down on every order is unsustainable and it dilutes attention. Band it, the same way you band approval, and be generous at the top band.<\/p>\n<ul class=\"hb-ul\"><li>Organisations providing safety critical resource get the full package<\/li><li>Welfare, plant hire and consumables get standard terms<\/li><li>Say which is which in the procedure, so the resourcing team is not deciding case by case<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Get and Keep the Acknowledgement<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS CORE protocols require the process to ensure all information shared is understood.<\/strong><\/p>\n<p class=\"hb-p\">Ask for written acknowledgement, keep it, and treat a subcontractor who never acknowledges as a risk rather than as an administrative irritation. This matters most for resource engaged at short notice, where acknowledgement is exactly what gets skipped.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Verify at Mobilisation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Flow-down is only proven when people arrive. Check that who turned up matches what you specified:<\/p>\n<ul class=\"hb-ul\"><li>Do the individuals hold the competences named in the order<\/li><li>Are medicals and screening current<\/li><li>Has the subcontractor briefed their own people on what you sent them<\/li><\/ul>\n<p class=\"hb-p\">Record the check, and be prepared to turn people away. A mobilisation check that has never resulted in anyone being sent home is probably not a real check.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Reach the Second Tier Where It Matters<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you satisfy yourself that any second-tier labour supplier can work to the requirement, not just that your immediate subcontractor says so.<\/strong><\/p>\n<p class=\"hb-p\">Labour is routinely sub-let at short notice, and that is where competence and fatigue requirements get lost. Ask who is actually employing the people who will be on the track.<\/p>\n<p class=\"hb-p\">Revisit flow-down whenever the client changes a requirement, and make sure the change reaches the people already mobilised.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Most supply chain failures are not refusals to comply. They are subcontractors complying perfectly with a requirement nobody passed on.<\/strong><\/p>"},{"id":"SCR03","order":3,"q_ref":"6.3","t":"Monitoring Subcontractor Performance","b":"<p class=\"hb-lead\">Selecting a good subcontractor is the easy half. To score a 10 you need performance measured during and after the work, risk-based worksite inspection and audit of the ones that matter, corrective actions tracked to closure, and post-contract reviews whose findings reach beyond the commercial team.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Measure the Right Things<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Programme and cost are the measures every organisation has. They are not the measures rail clients care about.<\/strong><\/p>\n<p class=\"hb-p\">Add the measures that predict a problem on site:<\/p>\n<ul class=\"hb-ul\"><li>Close Call reporting rate — a subcontractor reporting nothing is a warning, not a star<\/li><li>Competence and medical exceptions found at mobilisation<\/li><li>Compliance with the safe system of work observed during inspections<\/li><li>Repeat findings from one contract to the next<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Inspect Worksites and Audit Systems<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">RISQS CORE protocols require monitoring and measuring suppliers' performance during and after use, including risk-based planned general inspections of suppliers' worksites and risk-based audits of their management systems.<\/p>\n<p class=\"hb-p\"><strong>Risk-based means you can explain why you inspected that subcontractor's worksite and not another one.<\/strong><\/p>\n<p class=\"hb-p\">Go at night if that is when they work. An inspection that only ever happens on a Tuesday morning tells you about Tuesday mornings.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Track Corrective Actions to Closure<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocols require recording and monitoring of any corrective actions raised at supply chain audits. Verify closure with evidence rather than accepting a subcontractor's confirmation.<\/p>\n<ul class=\"hb-ul\"><li>An action register per subcontractor, with owners and dates<\/li><li>Evidence of the fix, not a statement that it is fixed<\/li><li>Escalation when actions age<\/li><li>A route to remove a subcontractor who cannot close things out<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Hold Post-Contract Reviews and Circulate Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The protocols specifically require post contract reviews of supply chain performance and the results being communicated through the business.<\/strong><\/p>\n<p class=\"hb-p\">That last clause is the one organisations miss. A review that stays with the commercial team does not stop the resourcing desk booking the same labour supplier next week.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Give Feedback and Develop<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Tell subcontractors where they sit, good and bad<\/li><li>Agree improvement plans rather than issuing scores<\/li><li>Act where safety or delivery performance falls short<\/li><li>Keep the approved list current so engagement decisions reflect performance<\/li><\/ul>\n<p class=\"hb-p\">Small labour suppliers often want to improve and have never been told specifically what is wrong. Feedback is cheaper than replacement.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Subcontractor performance decays quietly. Without measurement you will discover it through your client, or through an incident, which are the two most expensive ways to find out.<\/strong><\/p>"},{"id":"SCR04","order":4,"q_ref":"6.4","t":"Control Of Subcontractors On Site","b":"<p class=\"hb-lead\">Subcontracted gangs do not know the site, and the site does not know them. To score a 10 you need site induction, agreed interfaces and defined supervision for anyone working under your control, plus an assessment of the hazards their activity introduces — including what is left behind at handback.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Induct Them Into This Site's Hazards<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's maturity model lists induction to site rules, procedures, hazards and emergency arrangements as a key feature of effective contractor control.<\/strong><\/p>\n<p class=\"hb-p\">A generic induction does not tell a gang what they need for tonight:<\/p>\n<ul class=\"hb-ul\"><li>Access and egress points, walking routes and where the open lines are<\/li><li>Adjacent lines, live OLE, and what is running<\/li><li>Emergency arrangements, casualty access and the nearest reference point<\/li><li>The Lifesaving Rules and the agreed exclusion zones for the plant on site<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Agree Who Does What, Before the Shift<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The maturity model calls for co-ordination between clients, contractors and sub-contractors covering who does what, when and how. On a shared possession that is not optional.<\/p>\n<ul class=\"hb-ul\"><li>Agree interfaces in writing before mobilisation<\/li><li>Say who holds the safe system of work and who the person in charge is<\/li><li>Identify where two organisations' activities overlap and how that is controlled<\/li><li>Nominate a single point of contact on each side<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Name Who Supervises and Who Checks<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The maturity model expects supervision by a named person, including on-the-job supervision and checks of completed work.<\/strong><\/p>\n<p class=\"hb-p\">Both halves matter. Supervision during the shift manages the risk; the check at the end catches what was left in the four foot or reassembled wrongly.<\/p>\n<p class=\"hb-p\">Record the handback check. This is the one an assessor will ask to see.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Assess the Hazards They Introduce<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">This is the step that separates a 7 from a 10. The maturity model asks for assessment of new hazards introduced by the activities of contractors, direct or indirect, including latent faults left behind when a contractor completes work.<\/p>\n<ul class=\"hb-ul\"><li>What does their activity obstruct, foul or disable while it is happening<\/li><li>What could be left behind, loose or incomplete at handback<\/li><li>Who else is affected, including the next shift and the train service<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Review the System, Not Just the Job<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The maturity model lists review of the contractor selection and management system as a key feature.<\/strong><\/p>\n<p class=\"hb-p\">Periodically look at the arrangements as a whole: are inductions site-specific and current, are interfaces agreed consistently across contracts, do handback checks actually happen, and is the same subcontractor generating the same findings.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Subcontracted and agency workers are consistently over-represented in serious incidents, because they are the people on site who know least about how it behaves.<\/strong><\/p>"},{"id":"SCR05","order":5,"q_ref":"6.5","t":"Intelligent Customer Capability","b":"<p class=\"hb-lead\">If you cannot challenge the work you subcontract, you are relying on the subcontractor's judgement and calling it assurance. To score a 10 you need to know which subcontracted activities carry the most risk, hold the knowledge to specify, supervise and accept them, and make sure that knowledge does not live in one person's head.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand What Intelligent Customer Means<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's maturity model states that maintaining a sound intelligent customer capability is essential, to ensure the organisation retains understanding and knowledge of the products or services being supplied by the range of contractors.<\/strong><\/p>\n<p class=\"hb-p\">It does not mean self-delivering. It means being able to write a scope that is right, recognise a method statement that is wrong, and know which questions to ask before the shift.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Identify Where It Actually Matters<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">You do not need deep capability across everything you subcontract. Work out where a subcontractor's error would reach the railway:<\/p>\n<ul class=\"hb-ul\"><li>Disciplines you do not self-deliver but take responsibility for<\/li><li>Work where you hold the safe system of work but not the technical expertise<\/li><li>Design or temporary works you have subcontracted<\/li><li>Anything where you could not judge whether a proposed method is acceptable<\/li><\/ul>\n<p class=\"hb-p\">Write that list down. It is the scope of the capability you need to hold.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Make Sure It Is Not One Person<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Capability that walks off site with one resignation is not organisational capability.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Document what that person knows, in a usable form<\/li><li>Build a genuine second person for each critical discipline<\/li><li>Record it in your competence system with succession noted<\/li><li>Use external technical support deliberately where you cannot justify holding it internally<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Put Technically Competent People in the Room<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Intelligent customer capability is worthless if it is not consulted.<\/p>\n<ul class=\"hb-ul\"><li>Require technical sign-off as well as commercial sign-off on critical subcontractor selection<\/li><li>Have someone competent review method statements before mobilisation, not after<\/li><li>Involve them in accepting completed work, not just in valuing it<\/li><li>Give them standing to reject, not only to advise<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Plan It as a Capability<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end this is maintained deliberately rather than assumed.<\/strong><\/p>\n<p class=\"hb-p\">Review it whenever you subcontract a new activity, take on an unfamiliar discipline, or lose a key person. Use it to challenge subcontractors constructively — a subcontractor who is asked good questions usually improves — rather than only to catch them out.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: The moment you cannot evaluate the work you have subcontracted, your assurance is only recording decisions that someone else made on your behalf, on your client's railway.<\/strong><\/p>"}]},"security_info":{"color":"#14b8a6","label":"Security of Information","order":7,"chapters":[{"id":"SOI01","order":1,"q_ref":"7.1","t":"Cyber Security Assurance","b":"<p class=\"hb-lead\">Cyber security is now a qualification question, not an IT question — and for a service provider it is also a workforce data question. To score a 10 you need a policy owned at the top, protection for the competence and medical records you hold on your people, and audits at a frequency set by risk with findings closed.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Write the Policy the Scheme Expects<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-034 requires a policy that clearly identifies top-level management commitment to preventing breaches of data under the organisation's control, and its cyber security protocols.<\/strong><\/p>\n<p class=\"hb-p\">The protocol is specific about what that policy must contain:<\/p>\n<ul class=\"hb-ul\"><li>Committing investment and resource into preventing breaches and improving cyber resilience<\/li><li>Commitment to training and development of employees<\/li><li>Reporting breaches to relevant external authorities<\/li><li>The organisational position on bribery, ransoms and threats<\/li><li>Disciplinary action<\/li><\/ul>\n<p class=\"hb-p\">Decide your position on ransom payment before you need it, not during.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Remember What Data You Actually Hold<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Competence records, medical screening results, drugs and alcohol test outcomes and fatigue data are all personal data, and some of it is special category.<\/strong><\/p>\n<p class=\"hb-p\">Service providers routinely underestimate this because the data lives in a resourcing system rather than an HR one.<\/p>\n<ul class=\"hb-ul\"><li>Keep a record of processing covering workforce data, with retention periods<\/li><li>Restrict access to medical and screening outcomes far more tightly than to competence validity<\/li><li>Have a data processing agreement with your occupational health provider<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Get the Technical Basics Right<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Cyber Essentials sets out the control themes that stop the large majority of commodity attacks. Whether or not you certify, work to them:<\/p>\n<ul class=\"hb-ul\"><li>Firewalls and secure configuration<\/li><li>User access control and separation of privilege<\/li><li>Malware protection<\/li><li>Security update management, applied within a defined period<\/li><li>Multi-factor authentication on anything internet-facing<\/li><\/ul>\n<p class=\"hb-p\"><strong>Pay particular attention to mobile devices used at the worksite, which are the most commonly lost and least commonly managed.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Certify Where Your Market Requires It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">AP-034 covers management system certification, and contracts increasingly require Cyber Essentials, Cyber Essentials Plus or ISO 27001 by name.<\/p>\n<ul class=\"hb-ul\"><li>Find out what your target clients and principal contractors actually require, and by when<\/li><li>Hold the certificate and the assessment findings together<\/li><li>Evidence that findings raised were actioned and closed<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Audit by Risk and Improve Forwards<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end, audits and management reviews run at a frequency set by risk and contract requirements, not annually by default.<\/strong><\/p>\n<p class=\"hb-p\">Track corrective actions to closure, and maintain an improvement plan with leadership support that takes account of new and emerging risks.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: You hold your client's asset data and your workforce's medical records on the same systems. Losing either one is a contract-ending event, and the second is also a serious personal harm.<\/strong><\/p>"},{"id":"SOI02","order":2,"q_ref":"7.2","t":"Access To Information And Premises","b":"<p class=\"hb-lead\">This is the question that replaced personnel vetting, and it is better sourced than vetting ever was. To score a 10 you need access granted by role and withdrawn on leaving — including for agency staff whose engagements end without notice — an audit trail, periodic review that removes redundant access, and a security culture on site as well as in the office.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Build an Access Governance Framework<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-034 requires a process for identifying and implementing a governance framework for access to systems, applications and data.<\/strong><\/p>\n<p class=\"hb-p\">In practice that is a role-based access matrix. Set out, for each role:<\/p>\n<ul class=\"hb-ul\"><li>Which systems and applications they need, including client-supplied portals<\/li><li>Which data they may reach, such as asset data or possession plans<\/li><li>Who approves the grant<\/li><li>What happens when someone moves off the contract, not just when they leave the company<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Work to Minimum Necessary Access<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocol requires assessing resource levels to ensure the minimum number of people have access to data and systems without it impacting service delivery. That balance is the point: security that stops a mobilisation gets bypassed.<\/p>\n<ul class=\"hb-ul\"><li>Start from what the role needs, not from what the last holder had<\/li><li>Time-limit access granted for a single scheme<\/li><li>Review anyone with administrator rights separately and often<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Identify Who Presents Risk, and Screen Accordingly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>AP-034 requires identifying the groups of people that present a risk, and identifying the security screening levels for specified work activities that is above the standard recruitment process requirements.<\/strong><\/p>\n<p class=\"hb-p\">That is the closest thing rail has to a vetting requirement, and it is activity-based rather than blanket. What you will actually meet in practice is Sentinel sponsorship identity checks, medical screening, and occasional client-specific clearance on particular contracts.<\/p>\n<p class=\"hb-p\">Document which activities warrant more than a standard recruitment check, and why. Do not claim a rail vetting standard that does not exist.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Handle Agency and Subcontracted Access<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is where service providers fail. Agency engagements end without an HR process, and access outlives them.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Put agency and subcontracted staff on the same joiners, movers and leavers process<\/li><li>Reconcile access lists against who is actually booked on shift<\/li><li>Give the resourcing team a duty to notify when someone comes off<\/li><li>Log and monitor access to client-supplied information specifically<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Cover the Physical Side and the Culture<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">AP-034 section 4.5 covers physically protecting assets that present a cyber risk, considering site layout, visibility, accessibility and personnel requirements — which for you means offices, compounds, welfare units and vehicles.<\/p>\n<p class=\"hb-p\">The protocol also asks for a positive security culture. Drawings and access plans left in a van or a welfare unit are a routine loss route, and only culture prevents it.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Most data losses at supplier scale are not break-ins. They are agency workers who kept access after their last shift, or a set of plans left in an unlocked cabin.<\/strong><\/p>"},{"id":"SOI03","order":3,"q_ref":"7.3","t":"Security Incident Response","b":"<p class=\"hb-lead\">Everyone believes they would cope with a breach until it happens at 22:00 on a Saturday with a possession booked. To score a 10 you need a documented plan covering detection, resolution and recovery, continuity for the systems your site operations actually depend on, and evidence you have exercised it.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Plan Detection as Well as Response<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-034 requires incident management including steps for detection, resolution and recovery, ensuring the detection levels are appropriate to the risks identified.<\/strong><\/p>\n<p class=\"hb-p\">Detection is the half most plans skip. If you only find out when a system stops working, you have already lost the window.<\/p>\n<ul class=\"hb-ul\"><li>Alerting on your critical systems, proportionate to their risk<\/li><li>A defined route for staff to report something suspicious quickly<\/li><li>Someone who actually looks at what the alerting produces<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Risk Assess Your Resource Needs in a Crisis<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocol requires risk assessing and identifying resource needs and availability in a crisis, factoring in personnel required, assets required, and the full scope of services carrying a breach risk.<\/p>\n<p class=\"hb-p\"><strong>Do this before you need it. Working out at 2am who has authority to disconnect the network is how a weekend gets lost.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Cover the Systems Site Work Depends On<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is the service provider's specific exposure. Losing your systems does not just stop the office; it can stop you putting people to work.<\/strong><\/p>\n<p class=\"hb-p\">Work through what happens if you cannot reach:<\/p>\n<ul class=\"hb-ul\"><li>Competence verification and swipe-in<\/li><li>Resource planning and shift booking<\/li><li>Access and possession information from the client<\/li><li>Fatigue and working hours records<\/li><\/ul>\n<p class=\"hb-p\">Have a documented, authorised fallback for verifying competence when systems are unavailable — and be clear about the circumstances in which the honest answer is that work does not go ahead.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Say Who Communicates, to Whom, and by When<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Who decides that this is an incident<\/li><li>Who tells the client and the Principal Contractor, and when<\/li><li>Who reports to the relevant external authorities, and within what period<\/li><li>Who speaks publicly, and who must not<\/li><\/ul>\n<p class=\"hb-p\"><strong>Name people and timescales in the plan, not in a policy nobody opens at the weekend.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Exercise It, Then Check the Fix Worked<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Run a desktop exercise using the scenario above — a systems outage before a night shift — and capture what it exposed.<\/p>\n<p class=\"hb-p\"><strong>The protocol requires monitoring and measuring all changes implemented following a breach or following recommendations. Prove the fix worked, do not just record that you made it.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: For a service provider a systems outage is not only a data problem, it is an operational stop. The organisations that keep working are the ones that decided in advance how they would.<\/strong><\/p>"},{"id":"SOI04","order":4,"q_ref":"7.4","t":"Supply Chain Cyber Risk","b":"<p class=\"hb-lead\">Your subcontractors can reach your client's data through you, and some of them hold your workforce's medical records. To score a 10 you need to know which present cyber risk, set requirements small labour suppliers can actually meet, and keep the assurance live rather than checking once at onboarding.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Identify Who Actually Presents Risk<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-034 requires identifying the members of the supply chain that may present a risk to cyber security, ensuring to factor in the life cycle of products and services.<\/strong><\/p>\n<p class=\"hb-p\">For a service provider the list is often shorter than expected but more sensitive:<\/p>\n<ul class=\"hb-ul\"><li>Anyone holding client asset data, possession plans or access information<\/li><li>Your occupational health provider, holding medical and screening outcomes<\/li><li>Labour suppliers holding competence and personal data on people working for you<\/li><li>Anyone providing systems you use to book, verify or record work<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Set Proportionate Contract Requirements<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Requirements a small labour supplier cannot meet do not improve security; they just get signed and ignored.<\/strong><\/p>\n<p class=\"hb-p\">AP-034 expects requirements to be justifiable, achievable and proportionate to the service, product or data involved.<\/p>\n<ul class=\"hb-ul\"><li>Tier your requirements the same way you tier approval<\/li><li>Ask for Cyber Essentials where reasonable, something lighter where not<\/li><li>Include breach notification obligations and a timescale<\/li><li>Put a data processing agreement in place wherever personal data is involved<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Assure It More Than Once<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A certificate checked at onboarding tells you about the day it was issued. Keep assurance live through routine audits or technical assessments, and hold the records where you can produce them at short notice for a client spot check.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Give Particular Attention to Health Data<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Medical screening and drugs and alcohol results are special category personal data held by a third party on your behalf.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Confirm what your provider stores, where, and for how long<\/li><li>Confirm who at your end can see outcomes rather than fitness status<\/li><li>Make sure the agreement covers breach notification to you<\/li><li>Check the arrangement when you change provider, and that old data is dealt with<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Act When Performance Falls Short<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Monitor and measure performance and act where it falls short. Escalate, require improvement, and be willing to replace a subcontractor who cannot meet the requirements you set.<\/p>\n<p class=\"hb-p\"><strong>A requirement you never enforce becomes a requirement your subcontractor correctly ignores.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Attackers go after the smallest, least defended organisation connected to the target. A labour supplier's mailbox is a well-travelled route into a major infrastructure owner.<\/strong><\/p>"}]},"contracting":{"color":"#fb923c","label":"Contracting & Commercial","order":8,"chapters":[{"id":"CCF01","order":1,"q_ref":"8.1","t":"Contract And Scope Review Before Signature","b":"<p class=\"hb-lead\">Most contract losses are decided before signature, and for site work the access risk clauses decide the most. To score a 10 you need a documented review covering form, options, amendments, contract data and scope, briefed to the site team, with findings flowed down to subcontractors.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Check the Contract Data Is Complete<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>NEC guidance notes that completion of the data in full, according to the Options chosen, is essential to create a complete contract.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Are all the required entries populated<\/li><li>Are the named roles actually named<\/li><li>Are the periods and dates present<\/li><li>Is the scope document the one referred to<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Read the Access and Possession Clauses First<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>For a service provider this is where the money is won or lost.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Who bears the risk of a possession being refused, altered or cancelled<\/li><li>What happens if you are given less time than planned<\/li><li>Who is responsible for obtaining access, and by when<\/li><li>What relief you get for a late handover of the site<\/li><li>Whether disruption or overrun costs sit with you<\/li><\/ul>\n<p class=\"hb-p\">Amendments to these clauses are common and they are rarely in your favour. Price what you are being asked to carry.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Interrogate the Scope<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>What is not said that you are assuming<\/li><li>Who provides what, including welfare, plant and protection<\/li><li>What standard applies, at which issue<\/li><li>What handback actually requires<\/li><li>Where the scope contradicts the access assumptions in the programme<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Brief the Site Team, Not Just the Office<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The person who has to give an early warning is usually on site, and they cannot do it if nobody told them the contract requires it.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A short briefing on key obligations, notices and deadlines<\/li><li>What to report, to whom, and how quickly<\/li><li>The specific things this contract does differently<\/li><li>Written down, so it survives a change of site management<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Govern It, Flow It Down, Review the Portfolio<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end review is a governed step whose findings feed the price, the plan and the scopes you issue to subcontractors.<\/strong><\/p>\n<p class=\"hb-p\">Risk you accepted upstream and did not flow down is risk you are carrying twice. And senior management should review the pattern of terms accepted across contracts, because it accumulates.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Every hour spent before signature is worth ten after it. Access risk in particular is almost impossible to renegotiate once you have signed for it.<\/strong><\/p>"},{"id":"CCF02","order":2,"q_ref":"8.2","t":"Contract Form And Edition Awareness","b":"<p class=\"hb-lead\">Teams administer contracts from memory of the last one. To score a 10 you need the form, edition and options recorded for every contract, people working to the terms actually in use, and training and templates that make the right version the default.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Record What Actually Governs Each Contract<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>An NEC4 Option B contract states that the conditions of contract are the core clauses, the clauses for the main Option, the Option for resolving and avoiding disputes and the secondary Options of that named edition and date.<\/strong><\/p>\n<p class=\"hb-p\">That is four things to record, not one:<\/p>\n<ul class=\"hb-ul\"><li>The form and the edition, with its date<\/li><li>The main Option<\/li><li>The dispute resolution Option<\/li><li>The secondary Options selected, including any Z clauses<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Keep It Somewhere Your Teams Can Reach<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A contract register held by the commercial team does not help the person drafting a notice at short notice.<\/p>\n<ul class=\"hb-ul\"><li>One register, accessible to delivery as well as commercial<\/li><li>A column for each of the four items above<\/li><li>A link to the executed contract itself<\/li><li>Kept current when contracts are varied<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Know Where the Editions Differ<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Working to the wrong edition's defined terms and timescales is a common and avoidable way to lose entitlement.<\/strong><\/p>\n<p class=\"hb-p\">The terminology moves between editions — NEC3 refers to Works Information where NEC4 refers to the Scope — and so do some periods and processes. Someone who learned the older edition will use its vocabulary by habit.<\/p>\n<p class=\"hb-p\">Note this is one of the areas where published guidance is practitioner commentary rather than a standard, so treat detailed edition comparisons as informed opinion and check the contract itself.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Build It Into Templates<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The most reliable control is making the correct version the easy one.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Separate notice templates per edition, carrying the right defined terms<\/li><li>The register referenced from the template<\/li><li>Training that covers the differences, not just the current edition<\/li><li>A check before issue that the right template was used<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Document Any Agreed Variation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Where parties agree to work a legacy contract differently — commonly, adopting a newer edition's process on an older contract — document it formally.<\/p>\n<p class=\"hb-p\"><strong>Custom and practice is not a variation, and it evaporates the moment there is a dispute.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Contractual rights are lost by using the wrong form of words, to the wrong person, outside the right period. None of those failures are about the merits of your claim.<\/strong><\/p>"},{"id":"CCF03","order":3,"q_ref":"8.3","t":"Early Warning Of Problems","b":"<p class=\"hb-lead\">Early warning is the cheapest risk management the contract offers, and on site the person who spots the matter is rarely the person who knows the contract. To score a 10 you need site staff who know what to report, notices issued on awareness, and a register that is actually worked.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Notify on Awareness, Not on Certainty<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Waiting until you are sure is waiting until the options have gone.<\/strong><\/p>\n<p class=\"hb-p\">The point is joint mitigation while something can still be done — a different method, a re-sequenced possession, an earlier decision.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Tell Site Staff What Counts<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Your supervisors see the early warnings. They will not raise them unless they know they should.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>An unexpected buried service or unrecorded asset<\/li><li>Ground or structure conditions different from the information given<\/li><li>An access or possession constraint that has appeared<\/li><li>A design or specification that does not work on the ground<\/li><li>Anything that will make you late, cost more, or reduce quality<\/li><\/ul>\n<p class=\"hb-p\">Give them a simple route to flag it to whoever issues the notice, and a deadline for doing so.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Use the Contractual Route and Work the Register<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Under NEC4 the Project Manager revises the Early Warning Register to record decisions made at each early warning meeting and issues the revised register within one week of the meeting.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>The right medium, recipient and period<\/li><li>A clear statement that this is an early warning<\/li><li>Attendance at the meetings, with someone who knows the site<\/li><li>A check that the revised register reflects what was agreed<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Remove the Internal Penalty<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Say at leadership level that raising early warnings is expected<\/li><li>Never criticise someone for raising one that came to nothing<\/li><li>Ask about them in project reviews as a positive indicator<\/li><li>Treat a scheme with no early warnings as a warning in itself<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Measure How Early You Actually Are<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you measure the gap between becoming aware and notifying, and work to shrink it.<\/strong><\/p>\n<p class=\"hb-p\">Record the date the site knew alongside the date the notice went out. That gap is usually where the entitlement was lost.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Early warning converts a dispute into a decision. On site the information exists days before the notice does, and closing that gap is almost free.<\/strong><\/p>"},{"id":"CCF04","order":4,"q_ref":"8.4","t":"Programme And Delivery Planning","b":"<p class=\"hb-lead\">A programme nobody accepted protects nobody, and for site work it has to reflect the access you were actually granted. To score a 10 you need compliant submissions with a narrative, non-response pursued, and an accepted programme held at all times.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Submit What the Contract Asks For<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A bar chart is not a contract programme.<\/strong><\/p>\n<p class=\"hb-p\">Include the information the contract specifies — planned completion, method and resources, float and time risk allowance, and the order and timing of the work and of what others must do.<\/p>\n<ul class=\"hb-ul\"><li>Check the required content list before each submission<\/li><li>Include what the client must provide, particularly access<\/li><li>Show float honestly rather than hiding it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"
