{"score":7,"desc":"Handling operations are identified, those that cannot be avoided are assessed, controls and mechanical aids are in place, and staff are trained.","feedback":"Handling operations are assessed, controlled and supported by training and equipment.","goalFeedback":"Avoid the handling you can, assess what remains, and reduce the risk as far as possible. Observe the operations rather than assessing them on paper, since what people actually do often differs from the method. Provide aids that suit the task and train people to use them."},{"score":10,"desc":"Cumulative exposure is managed as well as single lifts, early reporting of discomfort is encouraged and acted on, and handling is designed out where possible.","feedback":"Cumulative exposure is managed, early discomfort is reported and acted on, and handling is designed out where practicable.","goalFeedback":"Manage cumulative exposure across a shift and a week, not only the heaviest single lift. Encourage people to report discomfort early and act when they do, and keep looking for opportunities to design handling out of the work through product, packaging or process change."}]},{"statement":"Does your organisation have its own documented drugs and alcohol arrangements, including how it decides that a test is required?","topic":"Drugs And Alcohol Arrangements","handbookUrl":"https://nuccol.co.uk/railready-human-performance-drugs-and-alcohol-arrangements/","options":[{"score":0,"desc":"There are no drugs and alcohol arrangements, and it is unclear who would decide on or carry out a test.","feedback":"The organisation could not meet a customer's requirement at short notice and has no defensible basis for acting on a suspicion.","goalFeedback":""},{"score":2,"desc":"The customer's policy is relied on and testing is arranged when asked, with managers deciding case by case and little written down.","feedback":"Decisions rest on individual judgement without a record, which is difficult to defend afterwards for either the organisation or the worker.","goalFeedback":""},{"score":7,"desc":"A documented process covers the test types that apply, and grounds for suspicion are recorded on a form completed with the worker before a test is arranged.","feedback":"Documented drugs and alcohol arrangements are in place, with the decision to test recorded and evidenced.","goalFeedback":"Hold your own process rather than relying on a customer's, covering the test types relevant to your work. Have the responsible manager document the grounds of reasonable suspicion with the worker before deciding a for-cause test is required, so the decision is evidenced at the time rather than reconstructed later."},{"score":10,"desc":"Responsible managers are trained in the decision process, arrangements are reviewed against each new issue of the applicable standard, and support routes for impairment and prescribed medicines are defined.","feedback":"Managers are trained, arrangements are kept current with the standard, and impairment and medicines are covered by defined support routes.","goalFeedback":"Train the managers who make these decisions rather than assuming the form is enough, and review your arrangements against each new issue of the standard your customers work to. Define how prescribed medicines and other sources of impairment are declared and supported, and verify that your testing provider's scope and accreditation are current."}]}],"excellence":"People are the part of any rail supplier most easily overloaded and least easily inspected. Competence gaps, fatigue, impairment, physical strain and error-prone task design rarely announce themselves; they are visible in rosters, training records, task design and reporting culture long before they appear in an incident. This module looks at how your organisation builds and maintains the competence its work requires, designs work so that people are less likely to make mistakes, controls fatigue and impairment, and manages the handling that causes most musculoskeletal injury. The bar throughout is not awareness but arrangements that are written down, applied consistently and reviewed."},"Supply Chain Readiness":{"questions":[{"statement":"Does your organisation select and approve its suppliers against defined criteria before placing work with them?","topic":"Supplier Selection And Approval","handbookUrl":"https://nuccol.co.uk/railready-supply-chain-readiness-supplier-selection-and-approval/","options":[{"score":0,"desc":"Suppliers are used without any approval step or defined selection criteria.","feedback":"There is no supplier approval process. Purchases are placed on price, availability or habit, so nothing prevents an unsuitable supplier entering rail work.","goalFeedback":""},{"score":2,"desc":"Suppliers are checked informally, and the criteria vary between buyers or jobs.","feedback":"Some checking happens, but it is not written down or applied consistently, so approval depends on who places the order.","goalFeedback":""},{"score":7,"desc":"A controlled approved supplier list is maintained, and suppliers are assessed against documented criteria before award.","feedback":"Supplier selection and approval are controlled and documented, with a maintained approved supplier list.","goalFeedback":"Keep the criteria proportionate to what each supplier provides, so that a supplier of safety-related material is assessed more searchingly than a stationery supplier. Record the assessment, re-check approval periodically rather than only at first use, and make it impossible to raise an order against an unapproved supplier."},{"score":10,"desc":"Supplier approval is risk-based, periodically reviewed, and informed by past performance.","feedback":"Supplier approval is risk-based, evidence-led and periodically reviewed, with past performance feeding directly into future award decisions.","goalFeedback":"Sustain this by feeding delivery, quality and non-conformance data back into approval decisions, reviewing the criteria as your rail scope changes, and developing suppliers who are close to the standard rather than only removing those who fall below it."}]},{"statement":"Does your organisation pass the requirements of its rail customers down to its own suppliers?","topic":"Flow-Down Of Customer Requirements","handbookUrl":"https://nuccol.co.uk/railready-supply-chain-readiness-flow-down-of-customer-requirements/","options":[{"score":0,"desc":"Customer requirements are not passed on to suppliers in any form.","feedback":"Requirements stop at your door. Suppliers cannot meet obligations they have never been told about, and the shortfall will surface at inspection or in service.","goalFeedback":""},{"score":2,"desc":"Some requirements are passed on, usually verbally or only when a supplier asks.","feedback":"Flow-down happens by exception rather than by design, so what a supplier knows depends on who spoke to them.","goalFeedback":""},{"score":7,"desc":"Rail customer requirements are formally flowed down in purchase documents, and suppliers confirm they understand them.","feedback":"Customer requirements are formally flowed down and acknowledged, giving suppliers a clear basis for compliance.","goalFeedback":"Make flow-down proportionate to risk, so a supplier of a safety-related item receives the full specification, inspection and certification requirements rather than a part number. Record the supplier's acknowledgement, and check on receipt that what arrived reflects what was specified."},{"score":10,"desc":"Flow-down is systematic and verified, with evidence that suppliers can and do meet the requirements passed to them.","feedback":"Flow-down is systematic and independently verified, and you can demonstrate that sub-suppliers are able to meet the requirements passed to them.","goalFeedback":"Move from telling to verifying. Satisfy yourself that each sub-supplier is genuinely able to supply in accordance with the customer requirement, revisit flow-down whenever the customer changes a specification, and check that requirements reach the second tier and beyond where risk warrants it."}]},{"statement":"Does your organisation monitor how its suppliers actually perform, during and after the work?","topic":"Monitoring Supplier Performance","handbookUrl":"https://nuccol.co.uk/railready-supply-chain-readiness-monitoring-supplier-performance/","options":[{"score":0,"desc":"Supplier performance is not monitored.","feedback":"You have no view of whether suppliers deliver what they promised. Problems are discovered only when they reach your customer.","goalFeedback":""},{"score":2,"desc":"Poor performance is noticed and dealt with case by case, but nothing is recorded or trended.","feedback":"Performance is managed reactively. Without records you cannot tell a one-off from a pattern, or justify removing a supplier.","goalFeedback":""},{"score":7,"desc":"Supplier performance is measured against defined criteria and recorded, with issues formally raised and closed out.","feedback":"Supplier performance is measured, recorded and acted on, though the depth of monitoring may not yet be matched to risk.","goalFeedback":"Extend monitoring beyond delivery and price to the things rail customers care about, such as certification, documentation and non-conformance rates. Carry out risk-based audits or inspections of the suppliers that matter most, and make sure corrective actions raised are tracked to closure."},{"score":10,"desc":"Monitoring is risk-based and includes audit or inspection, with results reviewed after contract and used to improve.","feedback":"Supplier monitoring is risk-based, includes audit and inspection, and post-contract review results are used to improve both suppliers and your own process.","goalFeedback":"Keep the loop closed. Hold post-contract reviews, communicate what they find across the business rather than only within procurement, and use the results to develop suppliers and refine your selection criteria."}]},{"statement":"Are the contractors and agency staff who work in your facility co-ordinated, inducted and supervised?","topic":"Control Of Contractors On Your Work","handbookUrl":"https://nuccol.co.uk/railready-supply-chain-readiness-control-of-contractors-on-your-work/","options":[{"score":0,"desc":"Contractors and agency staff work with no induction, co-ordination or supervision.","feedback":"People who do not know your hazards, rules or emergency arrangements are working in your facility unsupervised. This is the most common route to a serious incident involving a visiting worker.","goalFeedback":""},{"score":2,"desc":"Some induction happens, but co-ordination and supervision depend on who is running the job.","feedback":"Arrangements exist but are applied unevenly, so the level of control a contractor receives varies by department or shift.","goalFeedback":""},{"score":7,"desc":"Contractors receive a documented induction, interfaces are agreed in advance and supervision is defined.","feedback":"Contractor induction, co-ordination and supervision are defined and applied, though the depth may not always be matched to the risk of the task.","goalFeedback":"Make sure the induction covers your specific hazards and emergency arrangements rather than generic content, that who does what and when is agreed before work starts, and that someone is named to supervise and to check the completed work."},{"score":10,"desc":"Contractor control is fully embedded, including assessment of the new hazards their activities introduce.","feedback":"Contractor control is fully embedded, and you assess and manage the hazards that contractors' own activities introduce.","goalFeedback":"Sustain this by assessing the hazards a contractor's activity introduces to your operation, including latent faults left behind after they leave, and by reviewing your contractor management system rather than only individual jobs."}]},{"statement":"Does your organisation retain enough technical understanding of what it buys in to specify and challenge it?","topic":"Intelligent Customer Capability","handbookUrl":"https://nuccol.co.uk/railready-supply-chain-readiness-intelligent-customer-capability/","options":[{"score":0,"desc":"The organisation relies entirely on suppliers to define what is needed and to confirm it is right.","feedback":"You cannot specify or challenge what you buy. If a supplier's judgement is wrong, nothing in your organisation is capable of catching it.","goalFeedback":""},{"score":2,"desc":"A few individuals hold the knowledge, and it is not documented or developed.","feedback":"Understanding sits with particular people rather than with the organisation, so capability walks out of the door when they do.","goalFeedback":""},{"score":7,"desc":"The organisation has identified and maintains the technical knowledge needed to specify, review and accept what it buys.","feedback":"The organisation retains the technical understanding needed to specify and accept bought-in items, though it may rest on a small number of people.","goalFeedback":"Identify which bought-in items and outsourced processes carry the most risk, and make sure the knowledge to specify and challenge them is held by more than one person and is written down. Involve technical staff in supplier selection and in reviewing what is delivered, not only in procurement's paperwork."},{"score":10,"desc":"Intelligent customer capability is deliberately maintained, resourced and refreshed as the supply base changes.","feedback":"Intelligent customer capability is deliberately maintained and resourced, and is refreshed as the supply base and product range change.","goalFeedback":"Treat this as a capability to be planned rather than assumed. Review it whenever you outsource a new process or enter a new product area, build succession into the roles that hold it, and use it to challenge suppliers constructively rather than only to check them."}]}],"excellence":"A rail customer inherits the weaknesses of everyone in your supply chain. This section assesses how you select, approve and monitor the organisations that supply your materials, components and outsourced processes, whether you pass your rail customers' requirements down to them intact, and whether you understand what you are buying well enough to challenge it. It is about supplier assurance, not social value, which is covered separately."},"Security of Information":{"questions":[{"statement":"Does your organisation have documented cyber security and data protection arrangements with defined ownership?","topic":"Cyber Security Assurance","handbookUrl":"https://nuccol.co.uk/railready-security-of-information-cyber-security-assurance/","options":[{"score":0,"desc":"No documented cyber security or data protection arrangements exist.","feedback":"Cyber security is unmanaged. The organisation would fail any assurance requirement covering digital systems or personal data.","goalFeedback":""},{"score":2,"desc":"Basic IT measures such as antivirus and passwords are relied on, with no documented policy or ownership.","feedback":"Technical controls exist without a management framework. Responsibilities, incident handling and data protection obligations are undefined.","goalFeedback":""},{"score":7,"desc":"Documented cyber security and data protection arrangements exist with defined ownership, applied consistently and reviewed.","feedback":"Cyber security is managed through a documented system with named ownership. External certification may not be held, and monitoring may still be developing.","goalFeedback":"Hold a top-level policy that states leadership commitment to preventing breaches, commits investment and resource to cyber resilience, and covers training, reporting breaches to the relevant external authorities and disciplinary action. Where you hold external certification, keep evidence that findings raised have been actioned and closed."},{"score":10,"desc":"Certification is maintained, arrangements are audited on a risk-based schedule, and improvement plans address emerging threats.","feedback":"Cyber security is mature, externally assured and continually improved against a changing threat picture.","goalFeedback":"Run audits and management reviews at a frequency set by risk and by contract requirements, and track corrective actions through to closure. Maintain a forward-looking improvement plan with leadership support that takes account of new and emerging risks, so resilience keeps pace with the threat rather than the last incident."}]},{"statement":"Does your organisation control who has access to sensitive information, systems and premises?","topic":"Access To Information And Premises","handbookUrl":"https://nuccol.co.uk/railready-security-of-information-access-to-information-and-premises/","options":[{"score":0,"desc":"Access to information, systems and premises is uncontrolled.","feedback":"Anyone inside the building can reach anything. There is no basis on which to accept customer information that carries handling conditions.","goalFeedback":""},{"score":2,"desc":"Some access controls exist, but they are not defined by role and are rarely reviewed.","feedback":"Controls exist but have grown by accident. Access accumulates as people change roles and is seldom withdrawn.","goalFeedback":""},{"score":7,"desc":"Access to systems, data and premises is granted by role, recorded, and withdrawn when people leave or change role.","feedback":"Access to information, systems and premises is controlled by role, recorded and withdrawn on leaving, though review may not yet be routine.","goalFeedback":"Work to the principle that the minimum number of people have the access they need without it impacting delivery. Identify which groups of people present a risk, apply any additional screening a particular work activity warrants, log and monitor who reaches sensitive data, and check the physical controls on the areas where you store devices and drawings."},{"score":10,"desc":"Access governance is formally defined, monitored and periodically reviewed, and supported by a positive security culture.","feedback":"Access governance is formally defined, monitored and reviewed, and is reinforced by a security culture that people recognise and act on.","goalFeedback":"Sustain this with a documented access governance framework, an audit trail of who accessed what, and periodic review that actually removes redundant access. Reinforce it by promoting a positive security culture so people challenge unescorted visitors and question unexpected requests rather than relying on the technical controls alone."}]},{"statement":"Would your organisation know if it suffered a cyber security or data breach, and would it know what to do?","topic":"Security Incident Response","handbookUrl":"https://nuccol.co.uk/railready-security-of-information-security-incident-response/","options":[{"score":0,"desc":"There is no plan for detecting or responding to a breach.","feedback":"A breach would be discovered late, if at all, and the response would be improvised under pressure. Customers would not be told in time.","goalFeedback":""},{"score":2,"desc":"The response would depend on the IT provider or on whoever noticed the problem.","feedback":"There is an assumption that someone would deal with it, but no defined roles, no continuity arrangements and no notification route.","goalFeedback":""},{"score":7,"desc":"A documented incident management plan defines detection, resolution and recovery, and roles are assigned.","feedback":"Incident management is documented and roles are assigned, covering detection, resolution and recovery.","goalFeedback":"Make sure detection is proportionate to the risks you have identified rather than assumed, that business continuity arrangements sit alongside the incident plan, and that the plan names who communicates with customers and with the relevant external authorities and by when."},{"score":10,"desc":"The plan is exercised, incidents and actions are tracked, and changes made after an incident are monitored for effectiveness.","feedback":"Incident management is exercised and reviewed, with post-incident changes monitored to confirm they were effective.","goalFeedback":"Test the plan rather than only holding it, so weaknesses appear in an exercise rather than in a real event. Track incidents and actions through to closure, and monitor and measure the changes you made afterwards to confirm they worked."}]},{"statement":"Does your organisation identify which of its own suppliers present a cyber security risk, and set proportionate requirements for them?","topic":"Supply Chain Cyber Risk","handbookUrl":"https://nuccol.co.uk/railready-security-of-information-supply-chain-cyber-risk/","options":[{"score":0,"desc":"Cyber security is not considered when selecting or managing suppliers.","feedback":"Supply chain cyber risk is not recognised. The organisation may be exposing customer systems and data through third parties it has not assessed.","goalFeedback":""},{"score":2,"desc":"Reliance is placed on a supplier's general reputation, with no assessment and no contract requirements.","feedback":"Supplier selection is informal on cyber matters. Without contractual expectations there is no basis for holding a supplier to account after a breach.","goalFeedback":""},{"score":7,"desc":"Suppliers presenting cyber risk are identified, and proportionate cyber requirements are written into contract conditions.","feedback":"Supply chain cyber risk is identified and reflected in contracts. Ongoing assurance and monitoring may not yet be routine.","goalFeedback":"Make sure the expectations you set are justifiable, achievable and proportionate to the product, service or data involved, so smaller suppliers are not shut out by requirements they cannot meet. Factor in the life cycle of what you buy, since risk arises at support, update and disposal as well as at purchase."},{"score":10,"desc":"Supplier cyber assurance is maintained through routine audit or technical assessment, with performance monitored and acted on.","feedback":"Supply chain cyber risk is actively assured and monitored, and you can demonstrate both the requirement and the evidence of compliance.","goalFeedback":"Keep supplier assurance live through routine audits and technical assessments rather than a one-off check at onboarding, and hold the records so a spot check can be answered immediately. Monitor supplier performance and act where it falls short, escalating or replacing suppliers who cannot meet the requirements you have set."}]}],"excellence":"Rail suppliers hold information their customers cannot afford to lose: drawings, specifications, asset data and personal data about their own people. This section assesses whether cyber security and data protection are managed rather than assumed, who can reach your systems and your premises, what happens when something goes wrong, and whether the same expectations reach the suppliers you pass information to."},"Contracting and Commercial":{"questions":[{"statement":"Before signing, does your organisation review and understand the contract terms and the scope of supply, and brief the delivery team on what they mean?","topic":"Contract And Scope Review Before Signature","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-contract-and-scope-review-before-signature/","options":[{"score":0,"desc":"Contracts are signed without a structured review of the terms or the scope.","feedback":"The organisation cannot say what it has agreed to. Obligations and liabilities are discovered during delivery or in dispute.","goalFeedback":""},{"score":2,"desc":"Someone reads the contract before signing, but the review is informal and findings are not passed on.","feedback":"Understanding stays with the reviewer. The people delivering the contract work to their assumptions rather than to its terms.","goalFeedback":""},{"score":7,"desc":"A documented pre-signature review covers the form, the options selected, client amendments, completeness of the contract data and the scope of supply, and the delivery team is briefed.","feedback":"A documented pre-signature review is carried out and its findings are briefed to the delivery team.","goalFeedback":"Check that the contract data is complete, since gaps in it create ambiguity rather than flexibility. Read the client's amendments as carefully as the standard terms, because that is where risk is usually transferred. Then brief the people who will deliver, not only those who signed."},{"score":10,"desc":"Pre-signature review is a governed step with defined sign-off, findings feed the price and the delivery plan, and the pattern of terms accepted is reviewed by senior management.","feedback":"Pre-signature review is governed, feeds pricing and planning, and the portfolio-level pattern of accepted terms is reviewed at senior level.","goalFeedback":"Make review a governed step with a named sign-off, and let its findings shape the price and the plan rather than sitting in a file. Have senior management review the terms the business is accepting across its whole portfolio, because risk accepted one contract at a time accumulates."}]},{"statement":"Does your organisation know which contract form and edition governs each of its contracts, and work to the terms of the edition actually in use?","topic":"Contract Form And Edition Awareness","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-contract-form-and-edition-awareness/","options":[{"score":0,"desc":"Which form or edition each contract uses is not tracked and would have to be looked up.","feedback":"Teams administer contracts from memory of a different one. Notices go to the wrong person, in the wrong form, or too late.","goalFeedback":""},{"score":2,"desc":"The broad family of contract is known, but terms and processes are used interchangeably across editions and projects.","feedback":"Working to the wrong edition's defined terms and timescales is a common and avoidable source of lost entitlement.","goalFeedback":""},{"score":7,"desc":"The form, edition and options are recorded for every contract, and teams work to the terms of the edition actually in use.","feedback":"Contract form, edition and options are recorded and teams work to the correct terms.","goalFeedback":"Record the form, edition, main option, dispute option and secondary options for every contract in one place your teams can reach. Where an older edition uses different defined terms and processes, make sure the people administering it know which set applies to them."},{"score":10,"desc":"Awareness is maintained across the business through training and templates, and any agreed variation to the terms of a legacy contract is formally documented.","feedback":"Edition awareness is maintained through training and templates, and variations to legacy contracts are formally documented.","goalFeedback":"Cover the differences between editions in training and build them into your templates and notice formats, so the right form is used by default. Where the parties agree to work a legacy contract differently, document the variation formally rather than relying on custom and practice."}]},{"statement":"Does your organisation warn its customer of matters that could affect cost, time or quality as soon as it becomes aware of them?","topic":"Early Warning Of Problems","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-early-warning-of-problems/","options":[{"score":0,"desc":"Issues are raised only once they have already caused a delay or a cost.","feedback":"By the time the customer hears, the options for avoiding the impact have gone. This is the single most common cause of avoidable dispute.","goalFeedback":""},{"score":2,"desc":"Concerns are flagged informally in meetings or by email, with no consistent process for issuing them formally.","feedback":"An informal mention is not a notice. Entitlement and goodwill are both lost when the record does not show a warning was given.","goalFeedback":""},{"score":7,"desc":"Matters are notified through the contractual route as soon as the organisation becomes aware, the register is maintained, and the meetings are attended.","feedback":"Early warnings are notified contractually and on time, and the register and meetings are maintained.","goalFeedback":"Notify as soon as you become aware, not once you are certain, and use the route the contract specifies rather than an email. Keep the register live and attend the meetings, because the value of early warning is in the joint decision it produces, not in the notice."},{"score":10,"desc":"Early warning is treated as a risk management tool with visible leadership support, mitigation is agreed jointly with the customer, and how early matters are raised is measured.","feedback":"Early warning is a leadership-backed risk tool, mitigation is agreed jointly, and timeliness of warnings is measured and improved.","goalFeedback":"Make clear at leadership level that raising an early warning is expected and never penalised internally, since the fear of looking incompetent is what suppresses them. Work with the customer on mitigation rather than only recording the risk, and measure how early you raise matters so you can improve it."}]},{"statement":"Does your organisation keep a live delivery programme, submit it when the contract requires, and explain what has changed since the last one?","topic":"Programme And Delivery Planning","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-programme-and-delivery-planning/","options":[{"score":0,"desc":"No programme is maintained beyond the one produced at tender, if that.","feedback":"There is no agreed picture of when anything will happen, so delay cannot be demonstrated and entitlement cannot be established.","goalFeedback":""},{"score":2,"desc":"Programmes are submitted occasionally, are often rejected or unanswered, and acceptance is not pursued.","feedback":"An unaccepted programme protects nobody. Submitting without pursuing acceptance leaves the organisation with the effort and none of the benefit.","goalFeedback":""},{"score":7,"desc":"A compliant programme is submitted at the required interval with a narrative explaining what has changed, and the contractual route is followed when no response is received.","feedback":"A compliant programme is submitted on time with a narrative, and non-response is pursued contractually.","goalFeedback":"Include the information the contract asks for rather than a bar chart, and add a short narrative explaining what changed and why, which is what usually secures acceptance. Where no response arrives within the contractual period, follow the contractual route rather than letting it lapse."},{"score":10,"desc":"An accepted programme is held for every period, programme reviews are held with the customer, and internal controls are aligned to the accepted programme.","feedback":"An accepted programme is maintained each period, reviewed jointly with the customer, and internal controls are aligned to it.","goalFeedback":"Aim to hold an accepted programme at all times rather than an outstanding submission. Review it with the customer regularly, and keep your internal project controls aligned to the accepted version so your reporting and your contractual position tell the same story."}]},{"statement":"Does your organisation notify and price change promptly and on the basis the contract requires, rather than letting it accumulate?","topic":"Managing Change And Its Cost","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-managing-change-and-its-cost/","options":[{"score":0,"desc":"Change is dealt with informally and settled, if at all, at the end of the job.","feedback":"Change is being absorbed rather than recovered. The organisation is funding its customer's variations out of its own margin.","goalFeedback":""},{"score":2,"desc":"Some events are notified but often late, and quotations and assessments build up unresolved.","feedback":"Late notification risks losing entitlement altogether, and an unresolved backlog is settled later with hindsight and less evidence.","goalFeedback":""},{"score":7,"desc":"Events are notified as soon as the organisation becomes aware and within the contractual period, quotations are submitted on time, and assessment uses the correct contractual basis.","feedback":"Change is notified and priced on time and on the correct contractual basis.","goalFeedback":"Notify within the contractual period, since some contracts bar a late claim outright. Price on the basis the contract specifies rather than on actual cost recovered afterwards, and be clear about the date at which the assessment is made, because that determines whose forecast applies."},{"score":10,"desc":"Change is managed to closure through a regular commercial meeting, the age and value of unresolved events are reported to leadership, and root causes feed back into bidding.","feedback":"Change is managed to closure with leadership visibility of the unresolved position, and root causes feed back into bidding and delivery.","goalFeedback":"Hold a regular commercial meeting that closes events rather than listing them, and report the age and value of what remains unimplemented to leadership as a live exposure. Feed the root causes back into how you bid and plan, since repeated change often signals a scope you accepted too readily."}]},{"statement":"Does your organisation plan and manage contract close-out, including completion requirements, correction of defects and final settlement?","topic":"Contract Close Out","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-contract-close-out/","options":[{"score":0,"desc":"There is no close-out process; contracts are left open until someone chases the final payment.","feedback":"Cash and resource stay tied up in finished work, and defect liabilities remain open with no record of when they end.","goalFeedback":""},{"score":2,"desc":"Completion and final account matters are dealt with reactively as the customer raises them.","feedback":"Close-out is driven by the customer's timetable rather than the organisation's, which usually costs both time and money.","goalFeedback":""},{"score":7,"desc":"Close-out is planned in advance, completion requirements are checked, outstanding change and defects are cleared, and the defect correction period and final settlement are managed through to final payment.","feedback":"Close-out is planned and managed through defects and final settlement to final payment.","goalFeedback":"Check what the scope actually requires before completion can be certified, and clear outstanding change before it becomes a final account argument. Know when your defect correction obligation begins and ends for each notified defect, and manage the final assessment and any retention release actively."},{"score":10,"desc":"Close-out requirements are identified at award, tracked through delivery, and reviewed at completion with lessons carried into the next contract.","feedback":"Close-out is planned from award, tracked through delivery and reviewed, with lessons carried forward.","goalFeedback":"Identify what close-out will require at award rather than at the end, and track it through delivery so the evidence exists when you need it. Review each close-out and carry the lessons into how you bid and administer the next contract."}]}],"excellence":"Rail work is let under standard contract forms that place active administrative duties on the supplier, not just a price and a delivery date. Knowing which form and edition you have signed, what the client has amended, what your scope actually says, when you must warn of a problem, how change is priced and how the contract is closed out is the difference between a profitable contract and a disputed one. This module looks at how well your organisation understands the terms it works under and administers them in practice."},"Social Value and Sustainability":{"questions":[{"statement":"Can your organisation demonstrate that it has an effective payment system, with recorded evidence of how quickly it actually pays its own suppliers?","topic":"Payment Performance Evidence","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-payment-performance-evidence/","options":[{"score":0,"desc":"There are no defined payment terms for suppliers, and payment speed is not measured.","feedback":"The organisation cannot answer a prompt payment question in a bid, and its own suppliers carry the cost of the uncertainty.","goalFeedback":""},{"score":2,"desc":"Payment terms exist but are applied inconsistently, and performance is not measured or reported.","feedback":"Terms without measurement mean nobody knows whether they are met. What is not measured cannot be evidenced to a buyer.","goalFeedback":""},{"score":7,"desc":"Payment terms are documented and applied consistently, and payment performance is measured and recorded over defined reporting periods.","feedback":"Payment terms are applied consistently and performance is measured and recorded over defined periods.","goalFeedback":"Measure what proportion of invoices you pay within your stated terms and hold the record over defined periods, since a bid may ask for it at short notice. Understand that above certain contract values this stops being a preference and becomes a condition of bidding."},{"score":10,"desc":"Fair payment is a leadership commitment, performance is tracked continuously, published or externally recognised, and improvement targets are set and acted on.","feedback":"Fair payment is leadership-owned, continuously tracked, externally visible, and improved against targets.","goalFeedback":"Own fair payment at leadership level and track it continuously rather than at reporting points. Publishing your performance, or gaining external recognition for it, turns a compliance obligation into a competitive position, particularly with buyers who are themselves measured on supply chain treatment."}]},{"statement":"Does your organisation agree payment terms in writing before work begins, pass required terms down its own supply chain, and handle delays openly?","topic":"Payment Terms And Disputes","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-payment-terms-and-disputes/","options":[{"score":0,"desc":"Payment terms are not agreed in writing, and disputes are handled case by case with no set approach.","feedback":"Terms are established after the fact, usually in the supplier's disfavour, and every dispute starts from nothing.","goalFeedback":""},{"score":2,"desc":"Terms are usually in writing but not always agreed before work starts, and dispute handling is informal.","feedback":"Agreeing terms after work has begun removes the supplier's ability to decline them, which is exactly what fair payment principles exist to prevent.","goalFeedback":""},{"score":7,"desc":"Payment terms are agreed and recorded in writing before work begins, required terms are passed down, and suppliers are told promptly when payment may be delayed.","feedback":"Payment terms are agreed in writing in advance, flowed down, and delays are communicated promptly.","goalFeedback":"Put terms in writing in plain English before work starts, and check that the supplier actually understands them rather than assuming. Where your own contract requires particular terms to be passed down, pass them down unchanged, and tell a supplier early when a payment will be late rather than letting them discover it."},{"score":10,"desc":"Clear terms, prompt communication and conflict avoidance are embedded in contract management, lower tier payment is checked, and leadership reviews recurring causes.","feedback":"Fair payment practice is embedded in contract management, extends to lower tiers, and recurring causes are reviewed at leadership level.","goalFeedback":"Embed this in how contracts are managed rather than in a policy, and look beyond your immediate suppliers to check that money is reaching the tier below them. Have leadership review the recurring causes of late payment, since most of them are internal process problems rather than cash problems."}]},{"statement":"Where your organisation bids for public sector work, does it plan, commit to and then deliver measurable social value outcomes?","topic":"Social Value In Bidding","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-social-value-in-bidding/","options":[{"score":0,"desc":"Social value is not considered when bidding and no commitments are made.","feedback":"Bids score nothing on a criterion that is weighted in most public sector evaluations, which is a straightforward competitive loss.","goalFeedback":""},{"score":2,"desc":"Social value questions are answered when asked, but commitments are written for the tender and not tracked afterwards.","feedback":"Commitments made to win and then abandoned are increasingly caught by contract KPIs, and the reputational cost outweighs the score gained.","goalFeedback":""},{"score":7,"desc":"Social value commitments are planned before bidding, are realistic for the organisation's size, and are tracked through delivery against agreed indicators.","feedback":"Social value commitments are planned, proportionate and tracked through delivery against agreed indicators.","goalFeedback":"Decide what you can genuinely deliver before you write the answer, and commit only to that. Expect commitments to be monitored through contractual indicators communicated to contract managers, so make sure whoever delivers the contract knows what was promised."},{"score":10,"desc":"Outcomes are set at leadership level, aligned to the communities affected by each contract, measured continuously and fed back into future bids.","feedback":"Social value outcomes are leadership-set, contract-specific, continuously measured and fed back into future bidding.","goalFeedback":"Set the outcomes at leadership level and align them to the communities each contract actually affects rather than offering the same package everywhere. Measure continuously and feed what worked back into future bids, so your commitments become more credible over time rather than more ambitious."}]},{"statement":"Does your organisation have a documented strategy for social value, with objectives, allocated resource and people competent to deliver it?","topic":"Social Value Strategy And Competence","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-social-value-strategy-and-competence/","options":[{"score":0,"desc":"There is no social value strategy and no objectives for social, economic or community impact.","feedback":"Any social value claimed in a bid is invented for that bid, which is both fragile and, once tested, damaging.","goalFeedback":""},{"score":2,"desc":"Local or community activity is supported occasionally, with no strategy, objectives or measurement.","feedback":"Good intentions without structure produce activity that cannot be evidenced and does not accumulate into anything.","goalFeedback":""},{"score":7,"desc":"A documented strategy sets objectives and allocates resource, and named people understand social value and how it relates to the organisation's other strategies.","feedback":"A documented social value strategy is in place with objectives, resource and competent named ownership.","goalFeedback":"Write down what you are trying to achieve and why, allocate real resource to it, and name who is responsible. Make sure those people understand the difference between activities, outputs, outcomes and impact, because that distinction is what separates a credible claim from a list of good deeds."},{"score":10,"desc":"Social value is embedded across the organisation, reviewed for social inequalities, built into purchasing, and promoted through the supply chain.","feedback":"Social value is embedded organisation-wide, reflected in purchasing, and promoted through the supply chain.","goalFeedback":"Embed social value in how you buy as well as how you bid, and review your own practices for the inequalities they may sustain. Promote the same expectations through your own supply chain, which is where a small organisation can create disproportionate value."}]},{"statement":"Can your organisation show what its social value activity actually achieved, rather than only what it did?","topic":"Evidencing Social Value Outcomes","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-evidencing-social-value-outcomes/","options":[{"score":0,"desc":"Nothing is recorded about what social value activity produced, and its effect is unknown.","feedback":"The organisation cannot answer the question a buyer will ask next, which is what changed as a result.","goalFeedback":""},{"score":2,"desc":"A record is kept of activities carried out, such as events held or hours volunteered, but nothing about what changed.","feedback":"Counting activity is not evidence of value. Buyers increasingly discount input measures entirely.","goalFeedback":""},{"score":7,"desc":"Intended outcomes are defined before starting, qualitative and quantitative data are collected against them, and what changed is reported as well as what was done.","feedback":"Intended outcomes are defined in advance and evidenced with data, and reporting covers change rather than activity alone.","goalFeedback":"Decide what change you are aiming for before you begin, and collect the data that will show whether it happened. Report the change alongside the activity, and be honest where a result fell short, since a candid account of a mixed outcome is more credible than an unbroken run of successes."},{"score":10,"desc":"Social value work is properly evaluated, considering attribution, cost effectiveness, and what should be repeated, scaled or stopped.","feedback":"Social value work is evaluated for attribution and cost effectiveness, and findings drive decisions about what to repeat, scale or stop.","goalFeedback":"Ask whether the change can fairly be attributed to you, what it cost to achieve, and whether the same effort elsewhere would have achieved more. Use the answers to decide what to repeat, scale or stop, which is what turns social value spending into a strategy."}]},{"statement":"Does your organisation operate a documented environmental management system with a defined scope, objectives and a compliance register, and manage waste within it?","topic":"Environmental Management And Waste","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-environmental-management-and-waste/","options":[{"score":0,"desc":"There are no environmental management arrangements and no environmental objectives.","feedback":"Environmental obligations are unidentified, so compliance is a matter of luck and no bid question on the subject can be answered.","goalFeedback":""},{"score":2,"desc":"An environmental policy exists but has no defined system scope, objectives or compliance tracking behind it, and waste is treated as disposal.","feedback":"A policy without a system behind it is a statement of intent. Treating waste purely as a disposal cost misses both the compliance risk and the savings.","goalFeedback":""},{"score":7,"desc":"A documented environmental management system defines scope, interested parties and objectives, maintains a current compliance register, and manages and monitors waste reduction.","feedback":"A documented environmental management system with scope, objectives and compliance tracking is in place, and waste is managed within it.","goalFeedback":"Define what the system covers and who is affected by it, set objectives you can measure, and keep an up to date register of what you must comply with. Manage waste as a reduction target rather than a disposal line, starting with process scrap and packaging."},{"score":10,"desc":"The system is externally assured or independently audited, leadership-driven and continually improved, with circular thinking applied to design and purchasing and supply chain performance measured.","feedback":"The environmental system is independently assured and leadership-driven, with circular thinking in design and purchasing and supply chain performance measured.","goalFeedback":"Apply circular thinking to what you design and buy, so material is designed to be recovered rather than disposed of. Have the system independently audited, drive it from leadership, and measure your supply chain's environmental performance alongside your own."}]},{"statement":"Does your organisation understand and manage its carbon emissions, with a documented carbon plan covering its operations and its supply chain?","topic":"Carbon And Net Zero Management","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-carbon-and-net-zero-management/","options":[{"score":0,"desc":"Carbon emissions are not measured and there is no reduction plan.","feedback":"The organisation cannot answer a carbon question in a bid, and cannot respond when a customer asks for the embodied carbon of what it supplies.","goalFeedback":""},{"score":2,"desc":"Some estimates of energy use or emissions exist, but there is no documented plan, ownership or reduction strategy.","feedback":"Numbers without a plan behind them satisfy nobody, and estimates that cannot be explained are worse than none.","goalFeedback":""},{"score":7,"desc":"The emissions profile has been assessed and a documented carbon management plan sets out ownership, a reduction strategy and monitoring methods.","feedback":"The emissions profile is assessed and a documented carbon management plan with ownership and monitoring is in place.","goalFeedback":"Assess your direct emissions and those from the energy you buy first, since they are the ones you can measure reliably and act on quickly. Document the plan with named ownership, a reduction strategy and how you will monitor progress, and be clear about what your figures do and do not cover."},{"score":10,"desc":"Emissions across operations and the value chain are measured and independently verified, targets are set, and progress is reported transparently.","feedback":"Emissions are measured across operations and value chain, independently verified, and progress against targets is reported transparently.","goalFeedback":"Extend measurement into your value chain, including the materials you buy and the products you ship, since that is usually where most of your footprint sits. Have the figures independently verified, set targets against them and report progress openly, including where you are behind."}]}],"excellence":"Rail buyers increasingly look past price and technical capability to how a supplier treats its own supply chain and what social and environmental value it creates. Fair payment, credible social value commitments, a working environmental management system and a carbon plan now feature routinely in qualification and tendering, and some are conditions of bidding rather than preferences. Smaller manufacturers are not expected to carry a tier one contractor's overheads, but they are expected to show a documented approach and real evidence of it working."},"Product Assurance":{"questions":[{"statement":"Does your organisation know which of its products require formal acceptance before they can be used on the network?","topic":"Knowing What Needs Acceptance","handbookUrl":"https://nuccol.co.uk/railready-product-assurance-conformity-knowing-what-needs-acceptance/","options":[{"score":0,"desc":"It is not known whether any of the organisation's products require formal acceptance.","feedback":"The organisation may be supplying, or bidding to supply, products that cannot lawfully be installed. This is usually discovered at the worst possible moment.","goalFeedback":""},{"score":2,"desc":"There is a general awareness that some products need approval, but no assessment of which of the organisation's own products do.","feedback":"Awareness without assessment leaves the question open on every enquiry, and the answer is usually assumed rather than established.","goalFeedback":""},{"score":7,"desc":"Each product is assessed against the published guidance to establish whether acceptance is required, and the conclusion is recorded.","feedback":"Acceptance requirements are assessed per product and recorded, giving a defensible position on each.","goalFeedback":"Assess each product line against the published guidance on what does and does not require acceptance, and record the conclusion with its reasoning. Where an item is not covered by the guidance, ask rather than assume, and reassess whenever you modify a product, since a change to an accepted product needs assessing too."},{"score":10,"desc":"Acceptance status is tracked as part of the product portfolio, informs development decisions, and is reassessed when products or their applications change.","feedback":"Acceptance status is tracked across the portfolio, informs development decisions and is reassessed on change.","goalFeedback":"Track acceptance status alongside the rest of your product data, so a salesperson can see it. Let the acceptance route inform development decisions early, because criticality determines the assurance you will have to fund. Reassess whenever a product changes or is proposed for a new application."}]},{"statement":"Does your organisation understand how the acceptance process works, including that it needs a sponsor to apply on its behalf?","topic":"The Product Acceptance Process And Sponsorship","handbookUrl":"https://nuccol.co.uk/railready-product-assurance-conformity-the-product-acceptance-process-and-sponsorship/","options":[{"score":0,"desc":"The acceptance process is not understood and no sponsor relationship exists.","feedback":"A manufacturer cannot apply for acceptance on its own. Without a sponsor, a product that needs acceptance simply cannot get it.","goalFeedback":""},{"score":2,"desc":"The process is broadly known about, but the organisation has not identified who could sponsor an application or what evidence would be needed.","feedback":"The route exists in principle but has never been walked. Timescales and evidence requirements will come as a surprise.","goalFeedback":""},{"score":7,"desc":"The process and the sponsor's role are understood, sponsors are identified, and the organisation can produce the generic and technical evidence requested.","feedback":"The acceptance process and sponsorship route are understood, and the organisation can meet evidence requests.","goalFeedback":"Identify sponsors before you need them, and understand that the sponsor establishes the business need and submits the application while you supply the evidence. Expect requests against both generic and technical requirements, and be ready for an operational trial where criticality demands one."},{"score":10,"desc":"Sponsor relationships are actively managed, acceptance timescales are built into product and commercial planning, and evidence packs are maintained ready.","feedback":"Sponsorship is actively managed, acceptance is planned into product timelines, and evidence is maintained in a ready state.","goalFeedback":"Manage sponsor relationships as you would customer relationships, and build acceptance lead time into your product and commercial planning rather than treating it as an obstacle discovered late. Keep evidence packs current so an application can be supported quickly."}]},{"statement":"Does your organisation's quality management system address the requirements that rail customers apply in addition to a general quality standard?","topic":"Rail Quality Management System","handbookUrl":"https://nuccol.co.uk/railready-product-assurance-conformity-rail-quality-management-system/","options":[{"score":0,"desc":"There is no quality management system, or it makes no reference to rail-specific requirements.","feedback":"A general quality system does not address what rail customers additionally expect, such as configuration management, first article inspection and life cycle costing.","goalFeedback":""},{"score":2,"desc":"A general quality system is held, and rail-specific expectations are handled case by case as customers raise them.","feedback":"Each customer's rail requirements are met individually, which is expensive and produces inconsistent evidence.","goalFeedback":""},{"score":7,"desc":"The quality system addresses the rail-specific requirements the organisation's customers apply, and the gap against the rail sector standard is understood.","feedback":"The quality system addresses rail-specific requirements and the gap against the sector standard is understood.","goalFeedback":"Understand what the rail sector quality standard adds to a general one, particularly around project management, configuration management, special processes and first article inspection, and close those gaps in your own system whether or not you certify to it. Rail customers evaluate suppliers on the availability of qualifications like this."},{"score":10,"desc":"The organisation holds or is working towards rail sector certification, and uses the system to compete rather than only to comply.","feedback":"Rail sector quality certification is held or being pursued, and the system is used competitively as well as for compliance.","goalFeedback":"Where your market makes it worthwhile, hold or work towards certification to the rail sector quality standard, and use the performance data the system generates in your customer conversations. Remember that your customers are being told to target suppliers who hold it."}]},{"statement":"Does your organisation control the design and configuration of its products, so that it knows exactly what it built and what it changed?","topic":"Design And Configuration Control","handbookUrl":"https://nuccol.co.uk/railready-product-assurance-conformity-design-and-configuration-control/","options":[{"score":0,"desc":"There is no configuration control; drawings and specifications are changed without a controlled process.","feedback":"The organisation cannot say what it actually built. A defect cannot be bounded, and a repeat order cannot be guaranteed to match.","goalFeedback":""},{"score":2,"desc":"Drawings are version controlled, but there is no defined configuration process and no baselines.","feedback":"Version control on individual documents is not configuration control of a product. The relationship between the parts is unmanaged.","goalFeedback":""},{"score":7,"desc":"A documented configuration management process defines the product breakdown, identifies configuration items and establishes baselines, with change controlled against them.","feedback":"Configuration management is documented, with a product breakdown, identified configuration items and controlled baselines.","goalFeedback":"Break the product down to the lowest replaceable unit, identify the configuration items, and establish baselines for at least the as-designed, as-built and as-maintained states. Identify the safety-related configuration items as a minimum, and control every change against a baseline rather than against the last drawing."},{"score":10,"desc":"Configuration is managed across hardware and software through life, with change assessed for impact and the as-maintained state kept current with the customer.","feedback":"Configuration is managed through life across hardware and software, with impact-assessed change and an as-maintained state aligned with the customer.","goalFeedback":"Extend configuration management to software as well as hardware, and keep it live through the product's service life rather than closing it at delivery. Assess each proposed change for its impact across the baselines, and keep the as-maintained picture aligned with what your customer holds."}]},{"statement":"Can your organisation trace the material in its products, and does it prove the first article before serial production?","topic":"Traceability And First Article","handbookUrl":"https://nuccol.co.uk/railready-product-assurance-conformity-traceability-and-first-article/","options":[{"score":0,"desc":"Material is not traceable and no first article inspection is carried out.","feedback":"A material problem cannot be bounded to the affected batch, so any recall becomes total. Serial production begins without proof that the process makes a conforming part.","goalFeedback":""},{"score":2,"desc":"Certificates are kept for some material, and first-off checks happen informally without a defined process.","feedback":"Partial traceability gives partial protection, and an informal first-off check is not evidence that the production process is capable.","goalFeedback":""},{"score":7,"desc":"Items are traceable through production and a documented first article inspection process defines planning, verification and release criteria.","feedback":"Traceability is established through production and first article inspection is run to a documented process with defined release criteria.","goalFeedback":"Make items traceable from their origin to at least the end of warranty wherever contract, regulation or configuration management requires it, and define how you identify them. Run first article inspection to a documented process with criteria for release, conditional release and rejection, and review the production processes as part of it rather than only measuring the part."},{"score":10,"desc":"Traceability extends into the supply chain and through the product's service life, and first article inspection is applied to internal and externally provided items with corrective actions followed up.","feedback":"Traceability extends across the supply chain and through life, and first article inspection covers bought-in items with corrective actions followed up.","goalFeedback":"Extend traceability upstream into your own supply chain and downstream through service life. Apply first article inspection to significant bought-in items as well as your own, follow up corrective actions arising from it, and repeat it when a process, tool, site or supplier changes."}]},{"statement":"Can your organisation be confident that the items it buys in are genuine and are what they claim to be?","topic":"Counterfeit, Fraudulent And Suspect Items","handbookUrl":"https://nuccol.co.uk/railready-product-assurance-conformity-counterfeit-fraudulent-and-suspect-items/","options":[{"score":0,"desc":"Bought-in items are used as received, with no verification of what they are or where they came from.","feedback":"A counterfeit or misrepresented item would pass straight into a rail product undetected. The organisation could not identify affected deliveries afterwards.","goalFeedback":""},{"score":2,"desc":"Paperwork is filed on receipt but is not checked against the item or the requirement.","feedback":"A certificate that nobody reads provides no assurance. Counterfeit material is usually accompanied by convincing documentation.","goalFeedback":""},{"score":7,"desc":"Bought-in items are verified as conforming before use, with documentation checked against requirements, and purchasing is restricted to approved sources.","feedback":"Bought-in items are verified before use, documentation is checked against requirements, and sourcing is controlled.","goalFeedback":"Do not release an item into production until it has been verified against the requirement, or released under an authorised concession. Check that certificates, test reports and process records actually correspond to the item and to your acceptance criteria, and buy through franchised or approved sources rather than open market brokers for anything critical."},{"score":10,"desc":"Risk-based verification, supplier evaluation and traceability combine to make substitution detectable, and staff are trained to recognise the warning signs.","feedback":"Risk-based verification, supplier evaluation and traceability make substitution detectable, and staff are trained to recognise warning signs.","goalFeedback":"Set the extent, frequency and method of verification by risk rather than uniformly, and combine it with evaluation of your providers' people, infrastructure and processes. Train purchasing and inspection staff to recognise the warning signs, and keep traceability good enough that if one item proves suspect you can find every other item from the same source."}]},{"statement":"Are the processes whose results cannot be fully verified by inspecting the finished product properly qualified and controlled?","topic":"Special Process Qualification","handbookUrl":"https://nuccol.co.uk/railready-product-assurance-conformity-special-process-qualification/","options":[{"score":0,"desc":"Processes of this kind are not identified, and their operators hold no formal qualification.","feedback":"The organisation is relying on inspection to catch defects that inspection cannot see. For welded rail components this would also fail the sector's own requirements.","goalFeedback":""},{"score":2,"desc":"Operators hold qualifications, but the processes themselves are not identified, qualified or controlled as a group.","feedback":"Qualified people running an unqualified process is only half the control. Nothing establishes that the process itself produces a conforming result.","goalFeedback":""},{"score":7,"desc":"Special processes are identified and documented, with defined responsibilities, applicable standards, work instructions, personnel qualification and process qualification.","feedback":"Special processes are identified, documented and qualified, with personnel and process qualification both in place.","goalFeedback":"Identify which of your processes cannot be verified by inspecting the output, and for each one define responsibilities, the applicable standard, the work instructions, the competences required and how the process itself is qualified. Where you weld rail vehicle components, expect certification at the classification level matching the safety relevance of what you weld, with a welding coordinator of the right level."},{"score":10,"desc":"Processes are risk assessed, validated for each application and re-validated after change, with certification maintained and subcontracted special processes controlled to the same standard.","feedback":"Special processes are risk assessed, validated per application and re-validated on change, with certification maintained and subcontractors held to the same standard.","goalFeedback":"Risk assess each special process with an appropriate method, validate it for each specific application and re-validate after any change of material, equipment, method or personnel. Keep your certification and your coordinators current, and hold subcontracted special processes to the same standard as your own."}]}],"excellence":"A manufacturer selling into the railway has to prove not only that it can make the thing, but that the thing is allowed on the network and that every one it makes is the same as the one that was approved. This module looks at whether you know what needs formal acceptance and how that process works, whether design and configuration are controlled, whether material can be traced and the first article proven, whether you can be confident that what you buy in is genuine, and whether the processes whose quality cannot be verified by inspecting the finished product are properly qualified."}},"railready-siteservices":{"Rail Industry Fundamentals":{"questions":[{"statement":"Does your organisation understand the regulatory framework governing the GB railway and how it shapes what your clients must deliver?","topic":"Rail Regulatory Framework","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-rail-regulatory-framework/","options":[{"score":0,"desc":"No awareness of how the railway is regulated or how client obligations and funding are set.","feedback":"The regulatory context in which clients operate is unknown, so their requirements appear arbitrary rather than derived.","goalFeedback":""},{"score":2,"desc":"Some individuals have heard of the regulator, but this is not shared knowledge and does not inform how the business works.","feedback":"Awareness sits with individuals rather than the organisation and has no bearing on decisions.","goalFeedback":""},{"score":7,"desc":"The regulatory role is understood and documented, and briefed to relevant staff, and it informs how the organisation works.","feedback":"The regulatory framework is understood and documented, and staff can explain how it shapes client requirements.","goalFeedback":"Document how the regulator's determinations shape what your clients are required to deliver, and brief it to commercial and delivery staff rather than holding it in one head. Understanding why a client requirement exists is what allows you to propose a better way of meeting it."},{"score":10,"desc":"Regulatory context is embedded in planning, and published determinations are tracked and used to anticipate changes in workload.","feedback":"Regulatory context is embedded in business planning and used proactively to anticipate changes in client demand and requirements.","goalFeedback":"Track the determinations and monitoring publications relevant to your clients, and use them to anticipate changes in workload and requirements before they reach you as a tender. Give the activity a named owner so it survives a busy quarter."}]},{"statement":"Does your organisation plan its resourcing, competence and plant around the railway's funding cycle?","topic":"Planning Around The Funding Cycle","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-planning-around-the-funding-cycle/","options":[{"score":0,"desc":"Planning takes no account of the railway's funding cycle, and the business was unaware funding is set on a multi-year basis.","feedback":"Resourcing and competence decisions are made blind to the cycle that determines when work appears, so the business is exposed to both peaks and troughs.","goalFeedback":""},{"score":2,"desc":"The cycle is known about, but the organisation's own planning horizon is short and does not reflect it.","feedback":"Awareness exists without application. Short-horizon planning forfeits the stability the funding cycle is designed to give the supply chain.","goalFeedback":""},{"score":7,"desc":"Published plans and delivery plan updates relevant to the organisation's work are tracked and used to inform resourcing, competence and plant planning.","feedback":"The funding cycle informs resourcing, competence and plant planning, though it may not yet be a formal input to the business plan.","goalFeedback":"Use the published plans and their published updates as an input to decisions about headcount, sponsorship of competences, and plant. Competence takes months to build, so plan against the cycle rather than reacting to individual awards."},{"score":10,"desc":"Funding cycle and delivery plan information is a standing input to the business plan with named ownership, and plans are adjusted when published information changes.","feedback":"Funding cycle information is a standing, owned input to business planning, and plans are adjusted proactively as published information changes.","goalFeedback":"Make this a standing agenda item with an owner, and adjust proactively when a published plan changes rather than waiting for the effect to reach your order book. Track how accurate your assumptions proved and refine them."}]},{"statement":"Does your organisation understand how its principal rail clients are organised, and direct its engagement accordingly?","topic":"Understanding Your Customer's Structure","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-understanding-your-customer-s-structure/","options":[{"score":0,"desc":"The client is approached as a single undifferentiated organisation.","feedback":"Effort is directed at whoever answers. Without a map of the organisation, engagement is chance rather than strategy.","goalFeedback":""},{"score":2,"desc":"It is known that the client has regions and functions, but contacts are ad hoc and not mapped to the structure.","feedback":"Relationships exist but are not deliberately placed. When a contact moves, the relationship is lost with them.","goalFeedback":""},{"score":7,"desc":"The regional, route and national function structure is understood, including that regions hold their own budgets, and engagement is directed accordingly.","feedback":"The client's structure is understood and engagement is directed at the right parts of it, though the approach may not yet be planned or reviewed.","goalFeedback":"Map your contacts against the structure and identify where the decisions that affect you are actually taken. Recognise that a region with its own settlement and budget lets work differently from a central function or a principal contractor's framework, and pitch accordingly."},{"score":10,"desc":"An engagement plan is built around the client's structure, is leadership-owned and is reviewed for effectiveness.","feedback":"Engagement is planned around the client's structure, owned at leadership level and reviewed for effectiveness.","goalFeedback":"Hold a written engagement plan covering regions, routes, the system operator and the national functions, own it at leadership level, and review it against results rather than activity. Adjust it when the client reorganises."}]},{"statement":"Does your organisation understand the outcomes its rail clients are held to account for, and how the work it delivers contributes to them?","topic":"Outcomes Your Customers Are Held To","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-outcomes-your-customers-are-held-to/","options":[{"score":0,"desc":"The objectives clients are regulated against are unknown; work is seen purely as delivering a scope.","feedback":"The organisation cannot explain why it matters, only what it does. That is a weak position in any competitive evaluation.","goalFeedback":""},{"score":2,"desc":"There is a general sense that safety and performance matter to clients, but no link has been made to the work delivered.","feedback":"The connection between the service and the client's regulated outcomes has not been made, so it cannot be argued in a bid.","goalFeedback":""},{"score":7,"desc":"The objectives are understood, their link to the work can be explained, and this is reflected in bids and delivery reporting.","feedback":"The client's regulated outcomes are understood and their link to the work is articulated in bids and reporting.","goalFeedback":"Be specific about which outcome your delivery moves and how, rather than claiming all of them. Handing a possession back on time protects performance; a defensible, evidenced claim on one objective beats a general assertion about four."},{"score":10,"desc":"Contribution to these outcomes is measured in the organisation's own performance data, reviewed by leadership and used to propose improvements.","feedback":"Contribution to client outcomes is measured, reviewed by leadership and used to propose improvements to clients.","goalFeedback":"Measure your contribution rather than asserting it, review it at leadership level, and take proposals to clients based on what the data shows. This is what moves a supplier from responding to tenders to shaping them."}]},{"statement":"Does your organisation follow how its rail clients' delivery is publicly measured and reported, and use that to anticipate what will be asked of it?","topic":"Published Performance Information","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-published-performance-information/","options":[{"score":0,"desc":"How clients' performance is measured or reported is not known.","feedback":"A rich, free source of intelligence about client priorities is going unread.","goalFeedback":""},{"score":2,"desc":"It is known that clients report on performance, but the measures are not followed and their meaning has not been considered.","feedback":"The information is recognised but not used, so it has no effect on how the organisation positions itself.","goalFeedback":""},{"score":7,"desc":"Published outcome and success measures relevant to the regions and assets served are followed, and inform how the organisation bids and reports.","feedback":"Published performance information is followed and reflected in bidding and reporting, though it may not yet be a formal planning input.","goalFeedback":"Follow the measures that relate to the routes and assets you actually work on rather than the whole picture, and reflect them in the language of your bids and your delivery reporting. Speaking your client's measures back to them is persuasive."},{"score":10,"desc":"Published performance information is a routine, owned input to commercial planning, and is used to propose solutions before being asked.","feedback":"Published performance information is a routine, owned commercial input, and is used to bring solutions to clients proactively.","goalFeedback":"Give this a named owner and a routine place in commercial planning. Use a measure that is going the wrong way as the basis for an unsolicited proposal; that is how suppliers get in front of a requirement rather than behind it."}]},{"statement":"Does your organisation understand the funding pressures its rail clients face, and can it evidence value rather than assert it?","topic":"Value And Efficiency Under Funding Pressure","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-value-and-efficiency-under-funding-pressure/","options":[{"score":0,"desc":"Client funding pressures are unrecognised; the organisation competes on rate or availability alone.","feedback":"Without an understanding of where client money is going, the offer cannot be shaped to what clients are able to buy.","goalFeedback":""},{"score":2,"desc":"It is known that budgets are tight, but what is offered and how value is evidenced have not changed.","feedback":"The pressure is acknowledged but not responded to. Bids continue to argue on rate rather than on delivered outcome.","goalFeedback":""},{"score":7,"desc":"The shift in how client funding is being spent is understood, and efficiency and productivity benefits can be evidenced.","feedback":"Client funding pressures are understood and value can be evidenced, though the organisation may not yet be tracking savings delivered.","goalFeedback":"Understand that a shift from renewal towards life-extending repair and maintenance changes the shape of the work, favouring shorter, more frequent interventions. Evidence your productivity within an access window with data rather than assertion."},{"score":10,"desc":"The organisation actively seeks to reduce clients' delivery costs, tracks the savings delivered and shares the evidence.","feedback":"The organisation actively reduces client delivery costs, measures the savings delivered and evidences them to clients.","goalFeedback":"Go looking for cost your client could avoid, whether through better use of an access window or fewer return visits, agree how the saving will be measured before you start, and share the evidence afterwards. A measured track record is difficult to displace on rate."}]},{"statement":"Does your organisation understand where it sits in the rail supply chain, and pursue its routes to market deliberately?","topic":"Routes To Market And Positioning","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-routes-to-market-and-positioning/","options":[{"score":0,"desc":"The tiered structure of the rail supply chain is not understood, and no routes to market are actively pursued.","feedback":"The organisation waits to be called. It is also unlikely to be registered where opportunities are advertised, so it cannot see them.","goalFeedback":""},{"score":2,"desc":"It is
