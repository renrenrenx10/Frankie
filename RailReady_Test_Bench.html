>\n<ul class=\"hb-ul\"><li>The possession and any isolation required<\/li><li>Worksite limits<\/li><li>Open lines that could be fouled<\/li><li>Control of crossings and points<\/li><li>How the arrangements will be briefed and to whom<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Identify Long Access Programmes Early<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Code Part D deals separately with works requiring a programme of Restrictions of Use extending over more than one calendar year, or containing two or more Timetable Change Dates.<\/strong><\/p>\n<p class=\"hb-p\">If your scheme needs sustained access across timetable periods, that is a different route and a longer conversation. Identify it at the outset and raise it with asset protection early, rather than discovering it after you have committed to a programme.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Use Competent Planners and Review Afterwards<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end plans are produced by competent planners, briefed to everyone involved, subject to change control, and reviewed after the work against what actually happened.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Hold a live record of proposed against confirmed possessions<\/li><li>Put plans under change control, so the version on site is the current one<\/li><li>Review outturn against plan, and feed it into the next one<\/li><li>Work to minimise the disruptive access your methods require<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: A possession is a short, expensive, irreversible window in which a lot of people work close to things that can kill them. Everything about it should be decided before anyone arrives.<\/strong><\/p>"},{"id":"SAR08","order":8,"q_ref":"10S.8","t":"CDM Duty Holder Roles And Appointments","b":"<p class=\"hb-lead\">The construction regulations allocate duties by role, and the role can differ scheme to scheme. To score a 10 you need your duty holder role established and recorded on each project, documented arrangements for those duties, and appointee capability assessed and recorded before appointment.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Establish Your Role on Every Project<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The RISQS CDM audit protocol requires evidence demonstrating your understanding of the management responsibilities for the duty you are discharging under the Construction (Design and Management) Regulations 2015.<\/strong><\/p>\n<p class=\"hb-p\">You may be a contractor on one scheme and a principal contractor on the next, and you may be a designer without having noticed — temporary works design counts.<\/p>\n<ul class=\"hb-ul\"><li>Record the role held on each scheme, and who determined it<\/li><li>Record the other duty holders and who they are<\/li><li>Hold documented arrangements for the duties attaching to your role<\/li><li>Re-check when the scope changes<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Know the Duties That Come With It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Do not rely on a general awareness of CDM. Write down, for your role, what you must actually do and who does it.<\/p>\n<ul class=\"hb-ul\"><li>What you must plan, manage and monitor<\/li><li>What information you must provide, and to whom<\/li><li>What you must obtain before starting<\/li><li>What you must record<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Assess Capability Before You Appoint<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>HSE guidance on CDM 2015 provides that anyone appointed to work on a project must have the skills, knowledge and experience and, if they are an organisation, the organisational capability, necessary to fulfil the role that they are appointed to undertake.<\/strong><\/p>\n<p class=\"hb-p\">That is four things, and the fourth — organisational capability — is the one usually skipped, because it is about the company rather than the individual.<\/p>\n<ul class=\"hb-ul\"><li>Assess and record before appointment, not after<\/li><li>Cover skills, knowledge, experience and organisational capability<\/li><li>Make it proportionate to the risk of the package<\/li><li>Keep the record<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Do Not Substitute Reputation for Assessment<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Having used someone before is not evidence of capability, and it is not a defence.<\/strong><\/p>\n<p class=\"hb-p\">Familiarity is the most common basis for appointment and the weakest. Assess the organisation you are appointing for this project, not the one you remember.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Resource the Duties and Monitor Through Delivery<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end roles and duties are formally assigned, resourced and monitored with competent oversight, and capability assessment is embedded in procurement and monitored through delivery.<\/strong><\/p>\n<p class=\"hb-p\">Assigning a duty to someone with no time and no authority is assigning it in name only. And capability can decay during a contract — a subcontractor who loses key staff mid-scheme is a live issue, not a historic one.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: CDM duties attach to what you actually do, not to what your contract calls you. Organisations that have not established their role are discharging duties by accident, or not at all.<\/strong><\/p>"},{"id":"SAR09","order":9,"q_ref":"10S.9","t":"Construction Phase Plan And Project Information","b":"<p class=\"hb-lead\">The construction phase plan is the document that governs how the site runs, and on the railway it has to account for the operational railway too. To score a 10 you need it in place before the site is set up, project-specific, kept current, and built from information that was actually used rather than filed.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Have It Before the Site Is Set Up<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Rail's standard requires that the construction phase plan sets out the health and safety arrangements and site rules taking account of any operational railway activities taking place on the construction site.<\/strong><\/p>\n<p class=\"hb-p\">That last clause is the rail-specific element a generic construction plan will miss entirely, and it is the first thing an assessor looks for.<\/p>\n<p class=\"hb-p\">HSE guidance on CDM 2015 sets the underlying duties, including that the plan must be drawn up before the construction phase begins.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Make It Specific, Not Generic<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A plan that could describe any site describes none.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>This site's access, egress and walking routes<\/li><li>This site's adjacent lines, electrification and services<\/li><li>This site's emergency arrangements, including casualty access and reference points<\/li><li>This site's interfaces with the operational railway and with other contractors<\/li><li>The actual hazards from the pre-construction information<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Actually Use the Pre-Construction Information<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Pre-construction information that is filed rather than read is the most common cause of an avoidable site hazard.<\/strong><\/p>\n<p class=\"hb-p\">Work through it and trace each significant hazard to a control in your plan. An assessor may well ask you to show three things in the plan that could only have come from that site's information — be able to.<\/p>\n<ul class=\"hb-ul\"><li>Read it before writing the plan, not after<\/li><li>Chase what is missing rather than proceeding without it<\/li><li>Record what you did with each item<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Contribute to the Health and Safety File<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The standard records that the file shall only contain information which is relevant to the protection of people on construction projects, with the contents agreed during the pre-construction phase.<\/p>\n<ul class=\"hb-ul\"><li>Agree the contents early, so you collect during delivery rather than reconstructing at the end<\/li><li>Provide what you hold, in the format agreed<\/li><li>Keep it to what is genuinely relevant — a file nobody can use protects nobody<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Keep It Live and Verify It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end the plan is developed with designers and other contractors, verified against what actually happens on site, and reviewed project to project.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Review and update it as the work changes, and re-brief the changes<\/li><li>Check on site whether people are working to it<\/li><li>Record the revision history<\/li><li>Carry the lessons into the next project's plan<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: The construction phase plan is the only document that ties the design, the hazards and the site rules together. On the railway it also has to reconcile all of that with trains still running.<\/strong><\/p>"}]}}};
const CHMAP = {"railready-manufacturing":[["rail_fundamentals",0,"1.1","Rail Regulatory Framework"],["rail_fundamentals",1,"1.2","Planning Around The Funding Cycle"],["rail_fundamentals",2,"1.3","Understanding Your Customer's Structure"],["rail_fundamentals",3,"1.4","Outcomes Your Customers Are Held To"],["rail_fundamentals",4,"1.5","Published Performance Information"],["rail_fundamentals",5,"1.6","Value And Efficiency Under Funding Pressure"],["rail_fundamentals",6,"1.7","Routes To Market And Positioning"],["rail_fundamentals",7,"1.8","Readiness For Industry Change"],["safety_culture",0,"2.1","Understanding Your Safety Culture"],["safety_culture",1,"2.2","Close Call And Near Miss Reporting"],["safety_culture",2,"2.3","Just Culture And Response To Error"],["safety_culture",3,"2.4","Confidential Safety Reporting"],["safety_culture",4,"2.5","Workforce Involvement In Safety"],["quality_compliance",0,"3.1","Accuracy Of Qualification Information"],["quality_compliance",1,"3.2","Assurance Requirements For What You Supply"],["quality_compliance",2,"3.3","Control Of Assured Scope"],["quality_compliance",3,"3.4","Audit Readiness And Evidence"],["quality_compliance",4,"3.5","Non-Conformance Close-Out"],["quality_compliance",5,"3.6","Management System Policies And Objectives"],["quality_compliance",6,"3.7","Legal And Standards Register"],["quality_compliance",7,"3.8","Managing Multiple Qualification Routes"],["leadership_gov",0,"4.1","Leadership Commitment To Rail Safety"],["leadership_gov",1,"4.2","Governance, Oversight And Accountabilities"],["leadership_gov",2,"4.3","Supervision And Visible Leadership"],["human_perf",0,"5.1","Competence Management System"],["human_perf",1,"5.2","Human Factors And Error Prevention"],["human_perf",2,"5.3","Fatigue Policy And Ownership"],["human_perf",3,"5.4","Monitoring Actual Working Patterns"],["human_perf",4,"5.5","Fatigue Reporting And Response"],["human_perf",5,"5.6","Manual Handling And Musculoskeletal Risk"],["human_perf",6,"5.7","Drugs And Alcohol Arrangements"],["supply_chain",0,"6.1","Supplier Selection And Approval"],["supply_chain",1,"6.2","Flow-Down Of Customer Requirements"],["supply_chain",2,"6.3","Monitoring Supplier Performance"],["supply_chain",3,"6.4","Control Of Contractors On Your Work"],["supply_chain",4,"6.5","Intelligent Customer Capability"],["security_info",0,"7.1","Cyber Security Assurance"],["security_info",1,"7.2","Access To Information And Premises"],["security_info",2,"7.3","Security Incident Response"],["security_info",3,"7.4","Supply Chain Cyber Risk"],["contracting",0,"8.1","Contract And Scope Review Before Signature"],["contracting",1,"8.2","Contract Form And Edition Awareness"],["contracting",2,"8.3","Early Warning Of Problems"],["contracting",3,"8.4","Programme And Delivery Planning"],["contracting",4,"8.5","Managing Change And Its Cost"],["contracting",5,"8.6","Contract Close Out"],["social_value",0,"9.1","Payment Performance Evidence"],["social_value",1,"9.2","Payment Terms And Disputes"],["social_value",2,"9.3","Social Value In Bidding"],["social_value",3,"9.4","Social Value Strategy And Competence"],["social_value",4,"9.5","Evidencing Social Value Outcomes"],["social_value",5,"9.6","Environmental Management And Waste"],["social_value",6,"9.7","Carbon And Net Zero Management"],["product_assurance",0,"10M.1","Knowing What Needs Acceptance"],["product_assurance",1,"10M.2","The Product Acceptance Process And Sponsorship"],["product_assurance",2,"10M.3","Rail Quality Management System"],["product_assurance",3,"10M.4","Design And Configuration Control"],["product_assurance",4,"10M.5","Traceability And First Article"],["product_assurance",5,"10M.6","Counterfeit, Fraudulent And Suspect Items"],["product_assurance",6,"10M.7","Special Process Qualification"]],"railready-siteservices":[["rail_fundamentals",0,"1.1","Rail Regulatory Framework"],["rail_fundamentals",1,"1.2","Planning Around The Funding Cycle"],["rail_fundamentals",2,"1.3","Understanding Your Client's Structure"],["rail_fundamentals",3,"1.4","Outcomes Your Clients Are Held To"],["rail_fundamentals",4,"1.5","Published Performance Information"],["rail_fundamentals",5,"1.6","Value And Efficiency Under Funding Pressure"],["rail_fundamentals",6,"1.7","Routes To Market And Positioning"],["rail_fundamentals",7,"1.8","Readiness For Industry Change"],["safety_culture",0,"2.1","Understanding Your Safety Culture"],["safety_culture",1,"2.2","Close Call And Near Miss Reporting"],["safety_culture",2,"2.3","Just Culture And Response To Error"],["safety_culture",3,"2.4","Confidential Safety Reporting"],["safety_culture",4,"2.5","Workforce Involvement In Safety"],["quality_compliance",0,"3.1","Accuracy Of Qualification Information"],["quality_compliance",1,"3.2","Assurance Requirements For What You Supply"],["quality_compliance",2,"3.3","Control Of Assured Scope"],["quality_compliance",3,"3.4","Audit Readiness And Evidence"],["quality_compliance",4,"3.5","Non-Conformance Close-Out"],["quality_compliance",5,"3.6","Management System Policies And Objectives"],["quality_compliance",6,"3.7","Legal And Standards Register"],["quality_compliance",7,"3.8","Managing Multiple Qualification Routes"],["leadership_gov",0,"4.1","Leadership Commitment To Rail Safety"],["leadership_gov",1,"4.2","Governance, Oversight And Accountabilities"],["leadership_gov",2,"4.3","Supervision And Visible Leadership"],["human_perf",0,"5.1","Competence Management System"],["human_perf",1,"5.2","Human Factors And Error Prevention"],["human_perf",2,"5.3","Fatigue Policy And Ownership"],["human_perf",3,"5.4","Monitoring Actual Working Patterns"],["human_perf",4,"5.5","Fatigue Reporting And Response"],["human_perf",5,"5.6","Manual Handling And Musculoskeletal Risk"],["human_perf",6,"5.7","Drugs And Alcohol Arrangements"],["supply_chain",0,"6.1","Subcontractor Selection And Approval"],["supply_chain",1,"6.2","Flow-Down Of Client Requirements"],["supply_chain",2,"6.3","Monitoring Subcontractor Performance"],["supply_chain",3,"6.4","Control Of Subcontractors On Site"],["supply_chain",4,"6.5","Intelligent Customer Capability"],["security_info",0,"7.1","Cyber Security Assurance"],["security_info",1,"7.2","Access To Information And Premises"],["security_info",2,"7.3","Security Incident Response"],["security_info",3,"7.4","Supply Chain Cyber Risk"],["contracting",0,"8.1","Contract And Scope Review Before Signature"],["contracting",1,"8.2","Contract Form And Edition Awareness"],["contracting",2,"8.3","Early Warning Of Problems"],["contracting",3,"8.4","Programme And Delivery Planning"],["contracting",4,"8.5","Managing Change And Its Cost"],["contracting",5,"8.6","Contract Close Out"],["social_value",0,"9.1","Payment Performance Evidence"],["social_value",1,"9.2","Payment Terms And Disputes"],["social_value",2,"9.3","Social Value In Bidding"],["social_value",3,"9.4","Social Value Strategy And Competence"],["social_value",4,"9.5","Evidencing Social Value Outcomes"],["social_value",5,"9.6","Environmental Management And Waste"],["social_value",6,"9.7","Carbon And Net Zero Management"],["site_access",0,"10S.1","Sentinel Sponsorship Arrangements"],["site_access",1,"10S.2","Competence Verification At Site"],["site_access",2,"10S.3","Track Safety Competence"],["site_access",3,"10S.4","Lifesaving Rules And Exclusion Zones"],["site_access",4,"10S.5","Asset Protection Engagement And Agreement"],["site_access",5,"10S.6","Restrictions Of Use And Access Planning"],["site_access",6,"10S.7","Possession And Worksite Arrangements"],["site_access",7,"10S.8","CDM Duty Holder Roles And Appointments"],["site_access",8,"10S.9","Construction Phase Plan And Project Information"]]};
</script>
<script>
'use strict';

const TYPES = ['railready-manufacturing','railready-siteservices'];
const LABEL = {'railready-manufacturing':'RailReady – Manufacturing','railready-siteservices':'RailReady – Site Services'};
const SHORT = {'railready-manufacturing':'Manufacturing','railready-siteservices':'Site Services'};
const BANDS = [
  {min:0, max:39, col:'var(--bad)',  label:'Needs attention'},
  {min:40,max:59, col:'var(--warn)', label:'Developing'},
  {min:60,max:69, col:'var(--mid)',  label:'Progressing'},
  {min:70,max:100,col:'var(--good)', label:'At or above the bar'},
];
const PASS_MARK = 7;   // per question, and as a category mean out of 10

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $  = id => document.getElementById(id);
const pct = (s,m) => m ? Math.round(s/m*100) : 0;
const band = p => BANDS.find(b=>p>=b.min&&p<=b.max) || BANDS[3];

// ── state, persisted per assessment ────────────────────────────────────
let S = { view:'overview', type:TYPES[0], sec:0, hbType:TYPES[0], hbCat:null, hbCh:0 };
let ANS = {};   // type -> { "s:q": optionIndex }
let NOTE = {};  // type -> { "s:q": {flag:bool, text:string} }

const KEY = 'railready-testbench-v1';
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({ANS,NOTE})); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o=JSON.parse(raw); ANS=o.ANS||{}; NOTE=o.NOTE||{}; }
  }catch(e){}
  TYPES.forEach(t=>{ ANS[t]=ANS[t]||{}; NOTE[t]=NOTE[t]||{}; });
}

// ── data helpers ───────────────────────────────────────────────────────
const secs   = t => Object.entries(DATA[t]);
const secOf  = (t,i) => secs(t)[i];
const qkey   = (s,q) => s+':'+q;
const flatIdx = (t,s,q) => { let n=0; const S2=secs(t); for(let i=0;i<s;i++) n+=S2[i][1].questions.length; return n+q; };
const chapOf = (t,s,q) => CHMAP[t][flatIdx(t,s,q)];   // [catKey, chIdx, q_ref, title]

function secScore(t,si){
  const [,sec]=secOf(t,si); let score=0,max=0,answered=0;
  sec.questions.forEach((q,qi)=>{
    max += Math.max(...q.options.map(o=>o.score));
    const sel = ANS[t][qkey(si,qi)];
    if(sel!==undefined){ score += q.options[sel].score; answered++; }
  });
  return {score,max,answered,total:sec.questions.length};
}
function totals(t){
  let score=0,max=0,answered=0,total=0;
  secs(t).forEach((_,i)=>{const s=secScore(t,i);score+=s.score;max+=s.max;answered+=s.answered;total+=s.total;});
  return {score,max,answered,total};
}
function catMean(t,si){ // mean score out of 10 across ANSWERED questions
  const [,sec]=secOf(t,si); let sum=0,n=0;
  sec.questions.forEach((q,qi)=>{ const sel=ANS[t][qkey(si,qi)]; if(sel!==undefined){sum+=q.options[sel].score;n++;} });
  return n ? sum/n : null;
}
function zeros(t){
  const out=[];
  secs(t).forEach(([name,sec],si)=>sec.questions.forEach((q,qi)=>{
    const sel=ANS[t][qkey(si,qi)];
    if(sel!==undefined && q.options[sel].score===0) out.push({name,si,qi,topic:q.topic,ref:chapOf(t,si,qi)[2]});
  }));
  return out;
}
function flagged(t){
  const out=[];
  secs(t).forEach(([name,sec],si)=>sec.questions.forEach((q,qi)=>{
    const n=NOTE[t][qkey(si,qi)];
    if(n&&(n.flag||(n.text||'').trim())) out.push({name,si,qi,topic:q.topic,ref:chapOf(t,si,qi)[2],flag:!!n.flag,text:(n.text||'').trim()});
  }));
  return out;
}

// ── shell ──────────────────────────────────────────────────────────────
function go(view,opts){
  S.view=view; Object.assign(S,opts||{});
  render();
  window.scrollTo(0,0);
}
function render(){
  renderRail();
  const T=$('tTitle'), P=$('tSub');
  const A=$('topActions'); A.innerHTML='';
  if(S.view==='overview'){ T.textContent='RailReady Test Bench'; P.textContent='Internal testing — two question sets, two handbooks, no login.'; }
  if(S.view==='assess'){ T.textContent=LABEL[S.type]; P.textContent=secOf(S.type,S.sec)[0]; A.innerHTML=`<button class="btn" onclick="resetType('${S.type}')">Clear answers</button><button class="btn btn--primary" onclick="go('results',{type:'${S.type}'})">Results</button>`; }
  if(S.view==='results'){ T.textContent=LABEL[S.type]+' — Results'; P.textContent='Scored against the granting rule.'; A.innerHTML=`<button class="btn" onclick="go('assess',{type:'${S.type}',sec:0})">Back to questions</button>`; }
  if(S.view==='handbook'){ T.textContent='RailReady Handbook'; P.textContent='One chapter per question, in both variants.'; }
  if(S.view==='export'){ T.textContent='Export session'; P.textContent='Answers, scores and tester notes.'; }
  const w=$('wrap');
  w.innerHTML = ({overview:vOverview,assess:vAssess,results:vResults,handbook:vHandbook,export:vExport})[S.view]();
  if(S.view==='assess') wireAssess();
  if(S.view==='handbook') hbRender();
  if(S.view==='export') buildExport();
}
function renderRail(){
  const item=(view,ico,label,meta,active,extra)=>
    `<button class="nav-btn" aria-current="${active}" onclick="${extra||`go('${view}')`}">

  h += `<div class="rail-grp"><div class="lbl">Assessments</div>`;
  TYPES.forEach(t=>{
    const tt=totals(t);
    h += item('assess','🚆',SHORT[t],`${tt.answered}/${tt.total}`, S.view!=='handbook'&&S.view!=='overview'&&S.view!=='export'&&S.type===t, `go('assess',{type:'${t}',sec:0})`);
  });
  h += `</div><div class="rail-grp"><div class="lbl">Reference</div>`;
  h += item('handbook','📖','Handbook','',S.view==='handbook');
  h += item('export','⇪','Export session','',S.view==='export');
  h += `</div>`;
  $('railNav').innerHTML = h;
}

// ── overview ───────────────────────────────────────────────────────────
function vOverview(){
  const cards = TYPES.map(t=>{
    const tt=totals(t), n=secs(t).length, hbN=Object.values(HB[t]).reduce((a,c)=>a+c.chapters.length,0);
    const p=pct(tt.score,tt.max);
    return `<div class="card">
      <div>
        <div class="lbl" style="color:var(--cyan-deep)">${tt.answered?`${tt.answered} of ${tt.total} answered`:'Not started'}</div>
        <h4>${esc(LABEL[t])}</h4>
      </div>
      <p>${t==='railready-manufacturing'
          ? 'For organisations that make things for the railway. Ends with Product Assurance &amp; Conformity — acceptance, configuration control, first article, special processes.'
          : 'For organisations that work on or near the operational railway. Ends with Site &amp; Access Readiness — sponsorship, competence, possessions, CDM.'}</p>
      <div class="card-figs">
        <div class="fig"><div class="n">${tt.total}</div><div class="l">Questions</div></div>
        <div class="fig"><div class="n">${n}</div><div class="l">Categories</div></div>
        <div class="fig"><div class="n">${hbN}</div><div class="l">Chapters</div></div>
        ${tt.answered?`<div class="fig"><div class="n" style="color:${band(p).col}">${p}%</div><div class="l">Score so far</div></div>`:''}
      </div>
      <div class="card-actions">
        <button class="btn btn--primary" onclick="go('assess',{type:'${t}',sec:0})">${tt.answered?'Continue':'Start assessment'}</button>
        ${tt.answered?`<button class="btn" onclick="go('results',{type:'${t}'})">Results</button>`:''}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="hero">
    <div class="lbl">Internal testing</div>
    <h3>Try the question sets end to end</h3>
    <p>Both RailReady variants, scored live, with the handbook chapter for every question one click away.
       Answers save in this browser, so you can stop and come back. Nothing is sent anywhere.</p>
  </div>
  <div class="card-grid">${cards}</div>
  <div class="rulebox">
    <h4>How scoring works here</h4>
    <p>Each question offers four options scored <b>0, 2, 7 and 10</b>. <b>7 is the bar</b> — systematic, documented,
       evidenced and consistently applied. 10 is fully embedded and improving.</p>
    <p><b>Granting is not an average.</b> It needs 7 in every category, with no compensation between them,
       so one weak category blocks the whole assessment however strong the rest are. The results page shows

       is the single most useful thing to look at while testing.</p>

  <div class="rulebox">

// ── assessment ─────────────────────────────────────────────────────────
function vAssess(){
  const t=S.type, S2=secs(t), [name,sec]=secOf(t,S.sec);
  const pills = S2.map(([n],i)=>{
    const s=secScore(t,i), p=pct(s.score,s.max), done=s.answered===s.total;
    const col = Object.values(HB[t])[i].color;
    return `<button class="pill" aria-current="${i===S.sec}" onclick="go('assess',{sec:${i}})" title="${esc(n)}">
      <span class="dot" style="background:${col}"></span><span>${esc(n)}</span>
      ${s.answered?`<span class="pc" style="color:${done?band(p).col:'var(--ink-3)'}">${p}%</span>`
                 :`<span class="todo">${s.total}</span>`}
    </button>`;
  }).join('');

  const qs = sec.questions.map((q,qi)=>{
    const k=qkey(S.sec,qi), sel=ANS[t][k], note=NOTE[t][k]||{}, ch=chapOf(t,S.sec,qi);
    const opts = q.options.map((o,oi)=>{
      const p=pct(o.score,10), col=band(p).col;
      return `<button class="opt" aria-pressed="${sel===oi}" data-q="${qi}" data-o="${oi}" type="button">
        <span class="opt-bar" style="background:${col}"></span>
        <span class="opt-score" style="background:${col}">${o.score}</span>
        <span>${esc(o.desc)}</span>
      </button>`;
    }).join('');
    let fb='';
    if(sel!==undefined){
      const o=q.options[sel], col=band(pct(o.score,10)).col;
      fb = `<div class="fb" style="border-left-color:${col}">
        <div class="fb-row"><span class="fb-tag">Assessor</span><span>${esc(o.feedback)}</span></div>
        ${o.goalFeedback?`<div class="fb-goal fb-row"><span class="fb-tag">To improve</span><span>${esc(o.goalFeedback)}</span></div>`:''}
      </div>`;
    }
    return `<div class="q${note.flag?' q--flagged':''}" data-q="${qi}">
      <div class="q-head"><span class="q-ref">${esc(ch[2])}</span><span class="q-topic">${esc(q.topic||'')}</span></div>
      <p class="q-text">${esc(q.statement)}</p>
      <div class="opts">${opts}</div>
      ${fb}
      <div class="q-tools">
        <button class="tool-btn" type="button" data-hb="${qi}">📖 Handbook chapter</button>
        <button class="tool-btn" type="button" aria-pressed="${!!note.flag}" data-flag="${qi}">${note.flag?'⚑ Flagged':'⚑ Flag this question'}</button>
        ${sel!==undefined?`<button class="tool-btn" type="button" data-clear="${qi}">Clear answer</button>`:''}
      </div>
      <textarea class="note-box" data-note="${qi}" placeholder="Tester note on this question — wording, options, evidence expectations…">${esc(note.text||'')}</textarea>
    </div>`;
  }).join('');

  const s=secScore(t,S.sec);
  const last = S.sec===S2.length-1;
  return `<div class="secbar">${pills}</div>
    <div class="sec-head">
      <h3>${esc(name)}</h3>
      <p>${sec.questions.length} questions · choose the option that best describes the organisation</p>
    </div>
    ${qs}
    <div class="stepper">
      ${S.sec>0?`<button class="btn" onclick="go('assess',{sec:${S.sec-1}})">← ${esc(S2[S.sec-1][0])}</button>`:''}
      <span class="spacer"></span>
      <span class="prog">${s.answered}/${s.total} answered in this category · ${totals(t).answered}/${totals(t).total} overall</span>
      ${last?`<button class="btn btn--primary" onclick="go('results')">See results →</button>`
            :`<button class="btn btn--primary" onclick="go('assess',{sec:${S.sec+1}})">${esc(S2[S.sec+1][0])} →</button>`}
    </div>`;
}

function wireAssess(){
  const t=S.type, w=$('wrap');
  w.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    ANS[t][qkey(S.sec,+b.dataset.q)] = +b.dataset.o; save(); render();
  }));
  w.querySelectorAll('[data-clear]').forEach(b=>b.addEventListener('click',()=>{
    delete ANS[t][qkey(S.sec,+b.dataset.clear)]; save(); render();
  }));
  w.querySelectorAll('[data-flag]').forEach(b=>b.addEventListener('click',()=>{
    const k=qkey(S.sec,+b.dataset.flag); NOTE[t][k]=NOTE[t][k]||{};
    NOTE[t][k].flag=!NOTE[t][k].flag; save(); render();
  }));
  w.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{
    const k=qkey(S.sec,+el.dataset.note); NOTE[t][k]=NOTE[t][k]||{};
    NOTE[t][k].text=el.value; save();
  }));
  w.querySelectorAll('[data-hb]').forEach(b=>b.addEventListener('click',()=>{
    const ch=chapOf(t,S.sec,+b.dataset.hb);
    go('handbook',{hbType:t,hbCat:ch[0],hbCh:ch[1]});
  }));
}
function resetType(t){
  if(!confirm('Clear every answer, flag and note for '+LABEL[t]+'?')) return;
  ANS[t]={}; NOTE[t]={}; save(); render(); toast('Cleared');
}

// ── results ────────────────────────────────────────────────────────────
function vResults(){
  const t=S.type, tt=totals(t), p=pct(tt.score,tt.max), b=band(p);
  const rows = secs(t).map(([name],i)=>{
    const s=secScore(t,i), mean=catMean(t,i), sp=pct(s.score,s.max);
    const complete = s.answered===s.total;
    const state = !s.answered ? 'open' : (!complete ? 'open' : (mean>=PASS_MARK ? 'pass':'block'));
    return {name,i,...s,mean,pct:sp,state,col:Object.values(HB[t])[i].color};
  });
  const blocking = rows.filter(r=>r.state==='block');
  const open = rows.filter(r=>r.state==='open');
  const allDone = tt.answered===tt.total;

  let stamp,cls,msg;
  if(!allDone){
    cls='part'; stamp='Incomplete';
    msg=`${tt.total-tt.answered} of ${tt.total} questions still unanswered. The granting verdict needs every question answered, because a category cannot be judged on a partial set.`;
  } else if(blocking.length===0){
    cls='pass'; stamp='Would be granted';
    msg='Every category reaches the bar of 7.0. On the no-compensation rule this assessment passes.';
  } else {
    cls='fail'; stamp='Blocked';
    msg=`${blocking.length} categor${blocking.length===1?'y is':'ies are'} below the bar of 7.0. Because there is no compensation between categories, this blocks granting regardless of the overall percentage.`;
  }

  const z=zeros(t), fl=flagged(t);

  return `
  <div class="verdict verdict--${cls}">
    <div class="ring" style="--p:${p};--col:${b.col}">
      <span class="ring-in"><b>${p}%</b><span>${esc(b.label)}</span></span>
    </div>
    <div style="flex:1;min-width:260px">
      <div class="lbl" style="color:var(--ink-3)">Granting verdict</div>
      <div class="verdict-stamp" style="color:${cls==='pass'?'var(--good)':cls==='fail'?'var(--bad)':'var(--ink)'}">${stamp}</div>
      <p>${msg}</p>
      <p style="margin-top:8px"><b class="num">${tt.score}</b> of <b class="num">${tt.max}</b> points ·
         <b class="num">${tt.answered}</b> of <b class="num">${tt.total}</b> answered</p>
    </div>
  </div>

  <div class="res-grid">
    <div class="panel">
      <h4>Category breakdown</h4>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>Category</th><th class="r">Mean /10</th><th style="width:34%">Against the bar</th><th class="r">Score</th><th class="r">Verdict</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr>
            <td class="nm"><span class="dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${r.col};margin-right:8px"></span>${esc(r.name)}</td>
            <td class="r num" style="font-weight:700;color:${r.mean===null?'var(--ink-3)':(r.mean>=PASS_MARK?'var(--good)':'var(--bad)')}">${r.mean===null?'—':r.mean.toFixed(1)}</td>
            <td><div class="meter" title="Bar is 70%"><i style="width:${r.pct}%;background:${r.mean!==null&&r.mean>=PASS_MARK?'var(--good)':band(r.pct).col}"></i></div></td>
            <td class="r num">${r.score}/${r.max}</td>
            <td class="r">${r.state==='pass'?'<span class="tag tag--pass">Meets bar</span>'
                          :r.state==='block'?'<span class="tag tag--block">Below bar</span>'
                          :`<span class="tag tag--open">${r.total-r.answered} left</span>`}</td>
          </tr>`).join('')}</tbody>
      </table></div>
    </div>

    <div class="panel">
      <h4>What is blocking granting</h4>
      ${blocking.length?`<ul class="zero-list">${blocking.sort((a,b)=>a.mean-b.mean).map(r=>
        `<li><b>${esc(r.name)}</b> — mean ${r.mean.toFixed(1)}, needs ${PASS_MARK}.0.
         <button class="hb-jump" onclick="go('assess',{type:'${t}',sec:${r.i}})">Open category</button></li>`).join('')}</ul>`
        : open.length?`<p class="empty">Nothing yet — ${open.length} categor${open.length===1?'y is':'ies are'} still incomplete.</p>`
        : `<p class="empty">Nothing. Every category is at or above the bar.</p>`}
    </div>

    <div class="panel">
      <h4>Questions scored zero <span class="tag tag--open">${z.length}</span></h4>
      <p class="empty" style="margin-bottom:${z.length?'12px':'0'}">A zero is worth checking during testing: either the supplier genuinely has nothing, or the option ladder starts too high.</p>
      ${z.length?`<ul class="zero-list">${z.map(r=>
        `<li><b>${esc(r.ref)}</b> ${esc(r.topic)} <span style="color:var(--ink-3)">· ${esc(r.name)}</span>
         <button class="hb-jump" onclick="go('assess',{type:'${t}',sec:${r.si}})">Open</button></li>`).join('')}</ul>`:''}
    </div>

    <div class="panel">
      <h4>Flagged by testers <span class="tag tag--open">${fl.length}</span></h4>
      ${fl.length?`<ul class="zero-list">${fl.map(r=>
        `<li><b>${esc(r.ref)}</b> ${esc(r.topic)}${r.flag?' <span class="tag tag--block">Flagged</span>':''}
          ${r.text?`<div style="color:var(--ink-2);margin-top:3px">${esc(r.text)}</div>`:''}
          <button class="hb-jump" onclick="go('assess',{type:'${t}',sec:${r.si}})">Open</button></li>`).join('')}</ul>`
        : `<p class="empty">No flags or notes yet. Use the Flag button and note box on any question that does not work.</p>`}
    </div>
  </div>

  <div class="stepper">
    <button class="btn" onclick="go('assess',{type:'${t}',sec:0})">Back to questions</button>
    <span class="spacer"></span>
    <button class="btn" onclick="go('export')">Export this session</button>
  </div>`;
}

function hbRender(){
  const BK=HB[S.hbType];
  if(!S.hbCat || !BK[S.hbCat]) S.hbCat=Object.keys(BK)[0];
  const cat=BK[S.hbCat];

  $('hbSide').innerHTML = Object.entries(BK).map(([k,c])=>{
    let h=`<div class="hb-cat" style="${k===S.hbCat?`color:${c.color}`:''}" onclick="go('handbook',{hbCat:'${k}',hbCh:0})">
      <span class="hb-cat-dot" style="background:${c.color}"></span>${esc(c.label)}</div>`;
    if(k===S.hbCat) h+=c.chapters.map((ch,i)=>

  const ch=cat.chapters[S.hbCh];

  const next=S.hbCh<cat.chapters.length-1?`<button class="hb-nav-btn" onclick="go('handbook',{hbCh:${S.hbCh+1}})">Next →</button>`:'<span></span>';
  $('hbRead').innerHTML = `
    <div class="hb-eyebrow" style="color:${cat.color}"><span style="display:block;width:16px;height:2px;background:${cat.color}"></span>${esc(cat.label)}</div>
    <h1>${esc(ch.t)}</h1>
    <div class="hb-qref">
      <span>${esc(ch.id)} · question ${esc(ch.q_ref)} · ${esc(SHORT[S.hbType])}</span>
      ${loc?`<button class="hb-jump" onclick="go('assess',{type:'${S.hbType}',sec:${loc.si}})">Go to this question →</button>`:''}
    </div>
    <div class="hb-intro" style="border-color:${cat.color}">${ch.b}</div>
    <div class="hb-box">
      <h3 style="color:${cat.color}">✓ What good looks like</h3>
      <div class="hb-point">Evidence of the principle embedded in procedures, processes and daily work, not just policy documentation</div>
      <div class="hb-point">Staff at all levels can explain what this means for their role and demonstrate it in practice</div>
      <div class="hb-point">Measurable indicators showing the approach is working, reviewed regularly</div>
      <div class="hb-point">Leadership visibly engaged with and championing this area</div>
      <div class="hb-point">Continuous improvement activity with evidence of positive change over time</div>
      <div class="hb-point">Records and audit trails demonstrating sustained compliance and improvement</div>
    </div>
    <div class="hb-box">
      <h3 style="color:${cat.color}">🚆 Rail sector context</h3>
      <p class="hb-p">Rail buyers and assessors will test the depth and authenticity of your approach. Surface-level answers will not score well — they want to see that this is genuinely how your business operates. Prepare real examples, show records, and be ready to walk through specific scenarios where these principles shaped a decision or outcome in your organisation. The standards and schemes behind this question are named in the verification assessment guidance, not in the question itself.</p>
    </div>
    <div class="hb-nav">${prev}${next}</div>`;
  $('hbRead').scrollTop=0;
}
function findQuestion(t,ref){
  let n=0;
  const S2=secs(t);
  for(let si=0;si<S2.length;si++){
    for(let qi=0;qi<S2[si][1].questions.length;qi++,n++){
      if(CHMAP[t][n][2]===ref) return {si,qi};
    }
  }
  return null;
}

function vExport(){
  return `<div class="panel" style="margin-bottom:16px">
      <h4>Send your session to Roy</h4>
      <p class="empty" style="margin-bottom:14px">Everything below is generated from your answers, flags and notes.
        Copy it and paste it into an email or a message. Nothing leaves this page on its own.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn--primary" onclick="copyOut()">Copy to clipboard</button>
        <button class="btn" onclick="setFmt('md')" id="fmtMd">Readable summary</button>
        <button class="btn" onclick="setFmt('json')" id="fmtJson">JSON</button>
        <button class="btn btn--ghost" onclick="downloadOut()">Download file</button>
      </div>
    </div>
    <textarea class="export-out" id="exportOut" readonly></textarea>`;
}
let FMT='md';
function setFmt(f){ FMT=f; buildExport(); }
function buildExport(){
  const el=$('exportOut'); if(!el) return;
  $('fmtMd')?.classList.toggle('btn--primary',FMT==='md');
  $('fmtJson')?.classList.toggle('btn--primary',FMT==='json');
  el.value = FMT==='json' ? exportJSON() : exportMD();
}
function exportJSON(){
  const out={generated:new Date().toISOString(),assessments:{}};
  TYPES.forEach(t=>{
    const tt=totals(t);
    out.assessments[t]={label:LABEL[t],score:tt.score,max:tt.max,percent:pct(tt.score,tt.max),
      answered:tt.answered,total:tt.total,categories:[],questions:[]};
    secs(t).forEach(([name],i)=>{
      const s=secScore(t,i),m=catMean(t,i);
      out.assessments[t].categories.push({name,score:s.score,max:s.max,mean:m===null?null:+m.toFixed(2),
        answered:s.answered,total:s.total,meetsBar:m===null?null:m>=PASS_MARK});
    });
    secs(t).forEach(([name,sec],si)=>sec.questions.forEach((q,qi)=>{
      const sel=ANS[t][qkey(si,qi)], n=NOTE[t][qkey(si,qi)]||{}, ch=chapOf(t,si,qi);
      if(sel===undefined && !n.flag && !(n.text||'').trim()) return;
      out.assessments[t].questions.push({ref:ch[2],category:name,topic:q.topic,
        statement:q.statement, score:sel===undefined?null:q.options[sel].score,
        chose:sel===undefined?null:q.options[sel].desc,
        flagged:!!n.flag, note:(n.text||'').trim()||null});
    }));
  });
  return JSON.stringify(out,null,2);
}
function exportMD(){
  const L=[];
  L.push('# RailReady test session');
  L.push('');
  L.push('Generated '+new Date().toLocaleString('en-GB'));
  TYPES.forEach(t=>{
    const tt=totals(t);
    L.push(''); L.push('## '+LABEL[t]); L.push('');
    if(!tt.answered){ L.push('_Not started._'); return; }
    const rows=secs(t).map(([name],i)=>({name,s:secScore(t,i),m:catMean(t,i)}));
    const blocking=rows.filter(r=>r.s.answered===r.s.total && r.m<PASS_MARK);
    const incomplete=rows.filter(r=>r.s.answered!==r.s.total);
    L.push(`**Score** ${tt.score}/${tt.max} (${pct(tt.score,tt.max)}%) · **Answered** ${tt.answered}/${tt.total}`);
    L.push('');
    L.push(incomplete.length ? `**Verdict** Incomplete — ${tt.total-tt.answered} questions unanswered.`
      : blocking.length ? `**Verdict** Blocked — ${blocking.length} categor${blocking.length===1?'y':'ies'} below the bar of 7.0: ${blocking.map(r=>r.name).join(', ')}.`
      : '**Verdict** Would be granted — every category at or above 7.0.');
    L.push('');
    L.push('| Category | Mean /10 | Score | Answered | Meets bar |');
    L.push('|---|---:|---:|---:|---|');
    rows.forEach(r=>L.push(`| ${r.name} | ${r.m===null?'—':r.m.toFixed(1)} | ${r.s.score}/${r.s.max} | ${r.s.answered}/${r.s.total} | ${r.m===null?'—':(r.m>=PASS_MARK?'yes':'NO')} |`));
    const z=zeros(t), fl=flagged(t);
    if(z.length){ L.push(''); L.push('**Scored zero:** '+z.map(r=>`${r.ref} ${r.topic}`).join('; ')); }
    if(fl.length){
      L.push(''); L.push('### Tester feedback'); L.push('');
      fl.forEach(r=>{ L.push(`- **${r.ref} ${r.topic}** (${r.name})${r.flag?' — FLAGGED':''}`);
                      if(r.text) L.push(`  - ${r.text}`); });
    }
  });
  L.push(''); L.push('---'); L.push('');
  L.push('Bar: 7 of 10 per question. Granting needs a category mean of 7.0 in every category, no compensation between categories.');
  return L.join('\n');
}
function copyOut(){
  const el=$('exportOut'); el.select(); el.setSelectionRange(0,el.value.length);
  const done=()=>toast('Copied to clipboard');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.value).then(done,()=>{ document.execCommand('copy'); done(); });
  } else { document.execCommand('copy'); done(); }
}
// Saving a file: the hosted copy goes through the artifact downloads capability
// (the viewer confirms); a local copy falls back to an ordinary blob download.
let DL;
async function dlNamespace(){
  if(DL!==undefined) return DL;
  try{ DL = (typeof claude!=='undefined' && claude.use) ? await claude.use('downloads') : null; }
  catch(e){ DL = null; }
  return DL;
}
async function downloadOut(){
  const el=$('exportOut');
  const name='railready-test-session.'+(FMT==='json'?'json':'md');
  const ns=await dlNamespace();
  if(ns){
    try{ await ns.save({filename:name,data:el.value}); toast('Saved'); }
    catch(err){
      const c=err&&err.code;
      toast(c==='declined'?'Save cancelled'
          :c==='rate_limited'?'A save prompt is already open — try again in a moment'
          :'Could not save the file — use Copy to clipboard instead');
    }
    return;
  }
  try{
    const blob=new Blob([el.value],{type:FMT==='json'?'application/json':'text/markdown'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('Download started');
  }catch(e){ toast('Download blocked here — use Copy to clipboard'); }
}

let toastT;
function toast(msg){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2400);
}

load();
render();
</script>
