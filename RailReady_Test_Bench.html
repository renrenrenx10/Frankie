ck":"An unaccepted programme protects nobody. Submitting without pursuing acceptance leaves the organisation with the effort and none of the benefit.","goalFeedback":""},{"score":7,"desc":"A compliant programme is submitted at the required interval with a narrative explaining what has changed, and the contractual route is followed when no response is received.","feedback":"A compliant programme is submitted on time with a narrative, and non-response is pursued contractually.","goalFeedback":"Include the information the contract asks for, including how the work is sequenced against the access you have been granted, and add a short narrative explaining what changed and why. Where no response arrives within the contractual period, follow the contractual route rather than letting it lapse."},{"score":10,"desc":"An accepted programme is held for every period, programme reviews are held with the client, and internal controls are aligned to the accepted programme.","feedback":"An accepted programme is maintained each period, reviewed jointly with the client, and internal controls are aligned to it.","goalFeedback":"Aim to hold an accepted programme at all times rather than an outstanding submission. Review it with the client regularly, and keep your internal project controls aligned to the accepted version so your reporting and your contractual position tell the same story."}]},{"statement":"Does your organisation notify compensation events promptly and assess them on the basis the contract requires, rather than letting them accumulate?","topic":"Managing Change And Its Cost","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-managing-change-and-its-cost/","options":[{"score":0,"desc":"Change is dealt with informally and settled, if at all, at the end of the job.","feedback":"Change is being absorbed rather than recovered. The organisation is funding its client's variations out of its own margin.","goalFeedback":""},{"score":2,"desc":"Some events are notified but often late, and quotations and assessments build up unresolved.","feedback":"Late notification risks losing entitlement altogether, and an unresolved backlog is settled later with hindsight and less evidence.","goalFeedback":""},{"score":7,"desc":"Events are notified as soon as the organisation becomes aware and within the contractual period, quotations are submitted on time, and assessment uses the correct contractual basis.","feedback":"Change is notified and priced on time and on the correct contractual basis.","goalFeedback":"Notify within the contractual period, since some contracts bar a late claim outright. Make sure site supervisors know that a lost or shortened possession, or an instruction given on site, can be a notifiable event. Be clear about the date at which the assessment is made, because that determines whose forecast applies."},{"score":10,"desc":"Change is managed to closure through a regular commercial meeting, the age and value of unresolved events are reported to leadership, and root causes feed back into bidding.","feedback":"Change is managed to closure with leadership visibility of the unresolved position, and root causes feed back into bidding and delivery.","goalFeedback":"Hold a regular commercial meeting that closes events rather than listing them, and report the age and value of what remains unimplemented to leadership as a live exposure. Feed the root causes back into how you bid and plan, since repeated change often signals a scope or an access assumption you accepted too readily."}]},{"statement":"Does your organisation plan and manage contract close-out, including completion requirements, correction of defects and final settlement?","topic":"Contract Close Out","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-contract-close-out/","options":[{"score":0,"desc":"There is no close-out process; contracts are left open until someone chases the final payment.","feedback":"Cash and resource stay tied up in finished work, and defect liabilities remain open with no record of when they end.","goalFeedback":""},{"score":2,"desc":"Completion and final account matters are dealt with reactively as the client raises them.","feedback":"Close-out is driven by the client's timetable rather than the organisation's, which usually costs both time and money.","goalFeedback":""},{"score":7,"desc":"Close-out is planned in advance, completion requirements are checked, outstanding change and defects are cleared, and the defect correction period and final settlement are managed through to final payment.","feedback":"Close-out is planned and managed through defects and final settlement to final payment.","goalFeedback":"Check what the scope actually requires before completion can be certified, including handback and as-built records, and clear outstanding change before it becomes a final account argument. Know when your defect correction obligation begins and ends for each notified defect, and manage the final assessment and any retention release actively."},{"score":10,"desc":"Close-out requirements are identified at award, tracked through delivery, and reviewed at completion with lessons carried into the next contract.","feedback":"Close-out is planned from award, tracked through delivery and reviewed, with lessons carried forward.","goalFeedback":"Identify what close-out will require at award rather than at the end, and track it through delivery so the records exist when you need them. Review each close-out and carry the lessons into how you bid and administer the next contract."}]}],"excellence":"Rail work is let under standard contract forms that place active administrative duties on the supplier, not just a price and a programme. Knowing which form and edition you have signed, what the client has amended, what your scope actually says, when you must give early warning, how change is priced and how the contract is closed out is the difference between a profitable contract and a disputed one. This module looks at how well your organisation understands the terms it works under and administers them in practice."},"Social Value and Sustainability":{"questions":[{"statement":"Can your organisation demonstrate that it has an effective payment system, with recorded evidence of how quickly it actually pays its own subcontractors?","topic":"Payment Performance Evidence","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-payment-performance-evidence/","options":[{"score":0,"desc":"There are no defined payment terms for subcontractors, and payment speed is not measured.","feedback":"The organisation cannot answer a prompt payment question in a bid, and its own subcontractors carry the cost of the uncertainty.","goalFeedback":""},{"score":2,"desc":"Payment terms exist but are applied inconsistently, and performance is not measured or reported.","feedback":"Terms without measurement mean nobody knows whether they are met. What is not measured cannot be evidenced to a client.","goalFeedback":""},{"score":7,"desc":"Payment terms are documented and applied consistently, and payment performance is measured and recorded over defined reporting periods.","feedback":"Payment terms are applied consistently and performance is measured and recorded over defined periods.","goalFeedback":"Measure what proportion of invoices you pay within your stated terms and hold the record over defined periods, since a bid may ask for it at short notice. Small labour and plant suppliers feel late payment quickly, so this is also a retention issue for the resource you depend on."},{"score":10,"desc":"Fair payment is a leadership commitment, performance is tracked continuously, published or externally recognised, and improvement targets are set and acted on.","feedback":"Fair payment is leadership-owned, continuously tracked, externally visible, and improved against targets.","goalFeedback":"Own fair payment at leadership level and track it continuously rather than at reporting points. Publishing your performance, or gaining external recognition for it, turns a compliance obligation into a competitive position, particularly with clients who are themselves measured on supply chain treatment."}]},{"statement":"Does your organisation agree payment terms in writing before work begins, pass required terms down its own supply chain, and handle delays openly?","topic":"Payment Terms And Disputes","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-payment-terms-and-disputes/","options":[{"score":0,"desc":"Payment terms are not agreed in writing, and disputes are handled case by case with no set approach.","feedback":"Terms are established after the fact, usually in the subcontractor's disfavour, and every dispute starts from nothing.","goalFeedback":""},{"score":2,"desc":"Terms are usually in writing but not always agreed before work starts, and dispute handling is informal.","feedback":"Agreeing terms after mobilisation removes the subcontractor's ability to decline them, which is exactly what fair payment principles exist to prevent.","goalFeedback":""},{"score":7,"desc":"Payment terms are agreed and recorded in writing before work begins, required terms are passed down, and suppliers are told promptly when payment may be delayed.","feedback":"Payment terms are agreed in writing in advance, flowed down, and delays are communicated promptly.","goalFeedback":"Put terms in writing in plain English before anyone goes to site, including for resource engaged at short notice, and check that the subcontractor actually understands them. Where your own contract requires particular terms to be passed down, pass them down unchanged, and tell a subcontractor early when a payment will be late."},{"score":10,"desc":"Clear terms, prompt communication and conflict avoidance are embedded in contract management, lower tier payment is checked, and leadership reviews recurring causes.","feedback":"Fair payment practice is embedded in contract management, extends to lower tiers, and recurring causes are reviewed at leadership level.","goalFeedback":"Embed this in how contracts are managed rather than in a policy, and look beyond your immediate subcontractors to check that money is reaching the labour and plant suppliers below them. Have leadership review the recurring causes of late payment, since most of them are internal process problems rather than cash problems."}]},{"statement":"Where your organisation bids for public sector work, does it plan, commit to and then deliver measurable social value outcomes?","topic":"Social Value In Bidding","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-social-value-in-bidding/","options":[{"score":0,"desc":"Social value is not considered when bidding and no commitments are made.","feedback":"Bids score nothing on a criterion that is weighted in most public sector evaluations, which is a straightforward competitive loss.","goalFeedback":""},{"score":2,"desc":"Social value questions are answered when asked, but commitments are written for the tender and not tracked afterwards.","feedback":"Commitments made to win and then abandoned are increasingly caught by contract KPIs, and the reputational cost outweighs the score gained.","goalFeedback":""},{"score":7,"desc":"Social value commitments are planned before bidding, are realistic for the organisation's size, and are tracked through delivery against agreed indicators.","feedback":"Social value commitments are planned, proportionate and tracked through delivery against agreed indicators.","goalFeedback":"Decide what you can genuinely deliver before you write the answer, and commit only to that. Expect commitments to be monitored through contractual indicators communicated to contract managers, so make sure the site and delivery teams know what was promised on their contract."},{"score":10,"desc":"Outcomes are set at leadership level, aligned to the communities affected by each contract, measured continuously and fed back into future bids.","feedback":"Social value outcomes are leadership-set, contract-specific, continuously measured and fed back into future bidding.","goalFeedback":"Set the outcomes at leadership level and align them to the communities each worksite actually affects rather than offering the same package everywhere. Measure continuously and feed what worked back into future bids, so your commitments become more credible over time rather than more ambitious."}]},{"statement":"Does your organisation have a documented strategy for social value, with objectives, allocated resource and people competent to deliver it?","topic":"Social Value Strategy And Competence","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-social-value-strategy-and-competence/","options":[{"score":0,"desc":"There is no social value strategy and no objectives for social, economic or community impact.","feedback":"Any social value claimed in a bid is invented for that bid, which is both fragile and, once tested, damaging.","goalFeedback":""},{"score":2,"desc":"Local or community activity is supported occasionally, with no strategy, objectives or measurement.","feedback":"Good intentions without structure produce activity that cannot be evidenced and does not accumulate into anything.","goalFeedback":""},{"score":7,"desc":"A documented strategy sets objectives and allocates resource, and named people understand social value and how it relates to the organisation's other strategies.","feedback":"A documented social value strategy is in place with objectives, resource and competent named ownership.","goalFeedback":"Write down what you are trying to achieve and why, allocate real resource to it, and name who is responsible. Make sure those people understand the difference between activities, outputs, outcomes and impact. Local recruitment and training into rail competences is often the most credible thing a service provider can offer."},{"score":10,"desc":"Social value is embedded across the organisation, reviewed for social inequalities, built into purchasing, and promoted through the supply chain.","feedback":"Social value is embedded organisation-wide, reflected in purchasing and resourcing, and promoted through the supply chain.","goalFeedback":"Embed social value in how you buy and resource as well as how you bid, and review your own practices for the inequalities they may sustain. Promote the same expectations through your own subcontractors and labour suppliers, which is where a service provider can create disproportionate value."}]},{"statement":"Can your organisation show what its social value activity actually achieved, rather than only what it did?","topic":"Evidencing Social Value Outcomes","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-evidencing-social-value-outcomes/","options":[{"score":0,"desc":"Nothing is recorded about what social value activity produced, and its effect is unknown.","feedback":"The organisation cannot answer the question a client will ask next, which is what changed as a result.","goalFeedback":""},{"score":2,"desc":"A record is kept of activities carried out, such as events held or hours volunteered, but nothing about what changed.","feedback":"Counting activity is not evidence of value. Clients increasingly discount input measures entirely.","goalFeedback":""},{"score":7,"desc":"Intended outcomes are defined before starting, qualitative and quantitative data are collected against them, and what changed is reported as well as what was done.","feedback":"Intended outcomes are defined in advance and evidenced with data, and reporting covers change rather than activity alone.","goalFeedback":"Decide what change you are aiming for before you begin, and collect the data that will show whether it happened. If you recruited locally, follow what happened to those people afterwards rather than counting the hires. Be honest where a result fell short."},{"score":10,"desc":"Social value work is properly evaluated, considering attribution, cost effectiveness, and what should be repeated, scaled or stopped.","feedback":"Social value work is evaluated for attribution and cost effectiveness, and findings drive decisions about what to repeat, scale or stop.","goalFeedback":"Ask whether the change can fairly be attributed to you, what it cost to achieve, and whether the same effort elsewhere would have achieved more. Use the answers to decide what to repeat, scale or stop, which is what turns social value spending into a strategy."}]},{"statement":"Does your organisation operate a documented environmental management system with a defined scope, objectives and a compliance register, and manage waste within it?","topic":"Environmental Management And Waste","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-environmental-management-and-waste/","options":[{"score":0,"desc":"There are no environmental management arrangements and no environmental objectives.","feedback":"Environmental obligations are unidentified, so compliance is a matter of luck and no bid question on the subject can be answered.","goalFeedback":""},{"score":2,"desc":"An environmental policy exists but has no defined system scope, objectives or compliance tracking behind it, and waste is treated as disposal.","feedback":"A policy without a system behind it is a statement of intent. Treating waste purely as a disposal cost misses both the compliance risk and the savings.","goalFeedback":""},{"score":7,"desc":"A documented environmental management system defines scope, interested parties and objectives, maintains a current compliance register, and manages and monitors waste reduction.","feedback":"A documented environmental management system with scope, objectives and compliance tracking is in place, and waste is managed within it.","goalFeedback":"Define what the system covers and who is affected by it, set objectives you can measure, and keep an up to date register of what you must comply with, including your duty of care for waste removed from site. Give attention to spoil, arisings, fuel storage and watercourse protection, which are where site work carries most of its environmental risk."},{"score":10,"desc":"The system is externally assured or independently audited, leadership-driven and continually improved, with circular thinking applied to what is specified and bought and supply chain performance measured.","feedback":"The environmental system is independently assured and leadership-driven, with circular thinking in specification and purchasing and supply chain performance measured.","goalFeedback":"Apply circular thinking to what you specify and buy, and look for opportunities to reuse arisings rather than removing and replacing them. Have the system independently audited, drive it from leadership, and measure your subcontractors' environmental performance alongside your own."}]},{"statement":"Does your organisation understand and manage its carbon emissions, with a documented carbon plan covering its operations and its supply chain?","topic":"Carbon And Net Zero Management","handbookUrl":"https://nuccol.co.uk/railready-social-value-sustainability-carbon-and-net-zero-management/","options":[{"score":0,"desc":"Carbon emissions are not measured and there is no reduction plan.","feedback":"The organisation cannot answer a carbon question in a bid, and cannot respond when a client asks for the carbon associated with a scheme.","goalFeedback":""},{"score":2,"desc":"Some estimates of energy use or emissions exist, but there is no documented plan, ownership or reduction strategy.","feedback":"Numbers without a plan behind them satisfy nobody, and estimates that cannot be explained are worse than none.","goalFeedback":""},{"score":7,"desc":"The emissions profile has been assessed and a documented carbon management plan sets out ownership, a reduction strategy and monitoring methods.","feedback":"The emissions profile is assessed and a documented carbon management plan with ownership and monitoring is in place.","goalFeedback":"Assess your direct emissions and those from the energy you buy first, which for a service provider usually means plant, generators and vehicle fleet. Document the plan with named ownership, a reduction strategy and how you will monitor progress, and be clear about what your figures do and do not cover."},{"score":10,"desc":"Emissions across operations and the value chain are measured and independently verified, targets are set, and progress is reported transparently.","feedback":"Emissions are measured across operations and value chain, independently verified, and progress against targets is reported transparently.","goalFeedback":"Extend measurement into your value chain, including subcontracted plant and hired equipment and the materials brought to site. Have the figures independently verified, set targets against them and report progress openly, including where you are behind."}]}],"excellence":"Rail buyers increasingly look past price and resource availability to how a supplier treats its own supply chain and what social and environmental value it creates. Fair payment, credible social value commitments, a working environmental management system and a carbon plan now feature routinely in qualification and tendering, and some are conditions of bidding rather than preferences. Smaller service providers are not expected to carry a tier one contractor's overheads, but they are expected to show a documented approach and real evidence of it working."},"Site and Access Readiness":{"questions":[{"statement":"Does your organisation hold and maintain approved sponsorship arrangements for everyone it puts to work on managed infrastructure?","topic":"Sentinel Sponsorship Arrangements","handbookUrl":"https://nuccol.co.uk/railready-site-access-readiness-sentinel-sponsorship-arrangements/","options":[{"score":0,"desc":"There are no sponsorship arrangements and no documented process for putting people to work on managed infrastructure.","feedback":"The organisation cannot legitimately put anyone trackside in its own right. Every deployment depends on somebody else's arrangements.","goalFeedback":""},{"score":2,"desc":"Other parties are relied on to sponsor the organisation's workers, and it holds no documented sponsorship processes of its own.","feedback":"Sponsorship is borrowed. The organisation carries the operational risk without holding the controls, and cannot mobilise independently.","goalFeedback":""},{"score":7,"desc":"Approved sponsor status is held, with documented management system processes for sponsorship that are audited and kept current.","feedback":"Approved sponsorship is held with documented, audited management system processes.","goalFeedback":"Hold documented processes for each of the key management system requirements a sponsor must meet, and keep them current between audits rather than reconstructing them beforehand. Make sure work experience is recorded in the required system, since that requirement sits in the competence standard rather than in the scheme rules."},{"score":10,"desc":"Sponsorship is owned at senior level, with self-checking against the scheme rules, trend analysis of findings and continual improvement.","feedback":"Sponsorship is senior-owned, self-assured against the scheme rules, and improved on the basis of trend analysis.","goalFeedback":"Own sponsorship at senior level and check yourself against the scheme rules rather than waiting for an audit to do it. Analyse the trend in findings across audits, and improve the processes rather than closing individual actions."}]},{"statement":"Does your organisation verify that every worker's competence record is valid before they start work on the infrastructure?","topic":"Competence Verification At Site","handbookUrl":"https://nuccol.co.uk/railready-site-access-readiness-competence-verification-at-site/","options":[{"score":0,"desc":"Competence records are not checked before work begins.","feedback":"People may be working trackside without the competence the work requires, and the organisation would not know until something happened.","goalFeedback":""},{"score":2,"desc":"Checks happen informally or only when someone remembers to ask, with no record kept.","feedback":"An unrecorded check cannot be evidenced afterwards, and an informal one is the first thing to be skipped when a shift starts late.","goalFeedback":""},{"score":7,"desc":"Every worker is checked in against their competence record before starting work, and the check is recorded.","feedback":"Competence is verified and recorded before work begins on every deployment.","goalFeedback":"Check every individual in before they undertake work, using the card whether virtual or physical, and keep the record. Make sure the check covers the specific competences the task requires rather than only that a valid card exists, and that it is possible at every site including remote ones."},{"score":10,"desc":"Verification is fully embedded, with exceptions escalated, trends reviewed by management, and the means to check available at every site.","feedback":"Verification is embedded across all sites, exceptions are escalated, and trends are reviewed by management.","goalFeedback":"Provide the means to check at every worksite so verification never depends on signal or goodwill, escalate exceptions rather than working around them, and review the trend in failed and missing checks at management level. A rising exception rate usually points to a resourcing problem rather than an individual one."}]},{"statement":"Do the people your organisation sends on or near the line hold and carry valid track safety competence for the work they are doing?","topic":"Track Safety Competence","handbookUrl":"https://nuccol.co.uk/railready-site-access-readiness-track-safety-competence/","options":[{"score":0,"desc":"Staff go on or near the line without holding track safety competence.","feedback":"This is a direct breach of the Rule Book and would be treated as such by any infrastructure manager or principal contractor.","goalFeedback":""},{"score":2,"desc":"Most staff hold track safety competence, but there is no check that it is valid and carried on site.","feedback":"Holding a competence and carrying evidence of it are separate requirements, and the second is the one checked at the worksite.","goalFeedback":""},{"score":7,"desc":"All staff going on or near the line hold current track safety competence, carry it with them, and are briefed on their personal responsibilities.","feedback":"Track safety competence is held, carried and understood by everyone going on or near the line.","goalFeedback":"Make sure everyone going on or near the line has valid personal track safety competence with them, whether they are working alone or with a group. Brief people on their own responsibilities under the Rule Book rather than assuming the person in charge covers everything."},{"score":10,"desc":"Competence is planned ahead of expiry, supported by mentoring and supervision, and reinforced by leaders in the field.","feedback":"Track safety competence is planned ahead, supported by mentoring, and visibly reinforced by leaders in the field.","goalFeedback":"Plan renewals well ahead of expiry so competence never becomes the constraint on a shift, and support newly competent people with mentoring and supervision rather than leaving the certificate to carry them. Have leaders reinforce it in the field, where it counts."}]},{"statement":"Are the Lifesaving Rules briefed to everyone your organisation puts to work, and treated as limits that are never crossed?","topic":"Lifesaving Rules And Exclusion Zones","handbookUrl":"https://nuccol.co.uk/railready-site-access-readiness-lifesaving-rules-and-exclusion-zones/","options":[{"score":0,"desc":"The Lifesaving Rules are not briefed or referred to in the work.","feedback":"Workers do not know the rules their client treats as absolute, including the rule on exclusion zones around moving equipment.","goalFeedback":""},{"score":2,"desc":"Some rules are mentioned at induction, coverage is patchy, and people are not clear they are expected to stop unsafe work.","feedback":"Partial briefing gives partial protection, and without the expectation to intervene the rules become something to be judged rather than obeyed.","goalFeedback":""},{"score":7,"desc":"All the rules are briefed and displayed, including exclusion zones around moving equipment, and everyone including agency and subcontract staff is told they must never be broken.","feedback":"All rule areas are briefed and displayed, exclusion zones are planned and controlled, and the rules are held as absolute across the whole workforce.","goalFeedback":"Brief every rule area rather than the ones that feel most relevant, and be explicit that the rules must never be broken and that everyone is expected to intervene personally where something looks unsafe. Agree exclusion zones as part of the work plan with a named person in charge controlling entry, and cover visitors and subcontractors too."},{"score":10,"desc":"Leaders visibly model the rules, interventions are welcomed and recorded, and findings are used to remove the conditions that put people in breach.","feedback":"Leaders model the rules, interventions are welcomed and recorded, and findings drive removal of the conditions that cause breaches.","goalFeedback":"Welcome and record interventions rather than counting breaches, and investigate near misses involving plant for cause. Use what you find to remove the conditions that push people into breach, such as unrealistic programme, poor lighting or a worksite layout that makes the exclusion zone impractical."}]},{"statement":"Does your organisation engage the asset protection function early, on the right basis, and understand the risk it takes on under the resulting agreement?","topic":"Asset Protection Engagement And Agreement","handbookUrl":"https://nuccol.co.uk/railready-site-access-readiness-asset-protection-engagement-and-agreement/","options":[{"score":0,"desc":"The infrastructure manager is contacted only if a problem arises during the works, and the agreement types and their risk allocation are not understood.","feedback":"The scheme will stall. Engaging after design and programme are fixed is the most expensive point at which to discover what asset protection requires.","goalFeedback":""},{"score":2,"desc":"Contact is usually made at some point before starting, informally, with a broad sense that an agreement is needed but not which type or what risk it carries.","feedback":"Engagement without a consistent trigger point means it happens too late as often as not, and an unexamined agreement is signed on trust.","goalFeedback":""},{"score":7,"desc":"Each scheme is classified against the published definitions, a formal initial enquiry is submitted at concept stage, the likely agreement type is identified, and the risks carried are reflected in estimates and the risk register.","feedback":"Classification, early formal engagement, agreement selection and risk allocation are all established before commitments are made.","goalFeedback":"Establish first whether your scheme is third party or outside party work, since that determines the engagement route, and record the classification. Submit a formal initial enquiry with location, scope and drawings at concept stage rather than after design freeze, and record the reference and assigned contact. Work through the default risk allocation for your agreement type and price what you carry."},{"score":10,"desc":"Early engagement is a fixed gate in the scheme lifecycle, agreement selection is owned commercially with obligations flowed down, and risk allocation is reviewed by leadership and revisited as schemes develop.","feedback":"Asset protection engagement is a governed lifecycle gate, agreements are commercially owned and flowed down, and risk allocation is reviewed at leadership level and revisited on change.","goalFeedback":"Make early engagement a gate that a scheme cannot pass without, re-test the classification at each scope change, and maintain relationships with route teams between projects rather than only during them. Have named commercial owners manage agreement selection, flow the obligations down to your own supply chain, and feed realised risks back into future bids."}]},{"statement":"Does your organisation understand that track access is created by restricting the use of the network, and plan its work around the published access opportunities and notice periods?","topic":"Restrictions Of Use And Access Planning","handbookUrl":"https://nuccol.co.uk/railready-site-access-readiness-restrictions-of-use-and-access-planning/","options":[{"score":0,"desc":"Work is planned on the assumption that track access can be arranged whenever it is needed, and the published access documents are unknown.","feedback":"The programme is built on an assumption that will not survive contact with the access planning process. Delay and cost are certain.","goalFeedback":""},{"score":2,"desc":"It is known that access must be requested well in advance and some contingency is added, but the actual planning stages and published documents are not worked to.","feedback":"Contingency is not a substitute for working to the process. Requests made outside the stages are handled as exceptions, which is where cost and refusal come from.","goalFeedback":""},{"score":7,"desc":"The organisation works to the access planning stages, asks what access opportunities are published for the relevant part of the network, and shapes methods and programme around them.","feedback":"Access planning stages and published access opportunities are understood and shape both method and programme.","goalFeedback":"Understand that the access you need is delivered as a restriction of use planned in advance of each timetable week, and set your programme dates around those stages rather than around your own preferences. For each scheme, ask what access opportunities are published for that part of the network and design your method to fit them."},{"score":10,"desc":"Access requirements are settled early enough to enter the planning process comfortably, are tracked against each stage, alternative methods are tested against published opportunities, and short-notice requests are measured and reduced.","feedback":"Access is planned from concept against published opportunities, tracked through each stage, and short-notice requests are measured and reduced.","goalFeedback":"Settle access requirements early enough to enter the process without pressure, and track them stage by stage. Test alternative methods against the published access opportunities from the concept stage, and raise your future requirements in time to influence the next revision. Treat short-notice requests as an exception you measure and drive down."}]},{"statement":"Does your organisation plan and document the possession, isolation and worksite arrangements its work requires, and plan for not getting the access it asked for?","topic":"Possession And Worksite Arrangements","handbookUrl":"https://nuccol.co.uk/railready-site-access-readiness-possession-and-worksite-arrangements/","options":[{"score":0,"desc":"Possession, isolation and worksite arrangements are settled on site rather than planned, and requested possessions are assumed to be granted.","feedback":"Arrangements decided at the worksite under time pressure are where protection failures originate, and a refused possession would leave the scheme with no plan at all.","goalFeedback":""},{"score":2,"desc":"These arrangements are considered when planning, but the reasoning is not documented, is inconsistent between jobs, and there is no fallback if a possession is not obtained.","feedback":"Undocumented planning cannot be briefed, checked or learned from, and a single refused possession propagates through the whole programme.","goalFeedback":""},{"score":7,"desc":"Planning determines and documents the possession and isolation required, worksite limits, open lines that could be fouled and control of crossings and points, and a revised programme option is held in case access is not obtained.","feedback":"Possession, isolation and worksite arrangements are planned and documented, and a fallback exists if access is not obtained.","goalFeedback":"Take account of the work activities and plant involved when determining protection arrangements, and document the possession and isolation required, the worksite limits, which open lines could be fouled and how crossings and points will be controlled. Follow the consultation on your possessions and hold a revised programme option, since possessions are altered and cancelled routinely."},{"score":10,"desc":"Plans are produced by competent planners, briefed, change controlled and reviewed after the work; the organisation minimises the disruptive access its methods need and identifies at the outset where a longer-term access strategy applies.","feedback":"Planning is competent, briefed, change controlled and reviewed, disruptive access is actively minimised, and long access programmes are identified and routed correctly from the outset.","goalFeedback":"Have competent planners produce the plans, brief everyone involved, put them under change control and review them afterwards against what actually happened. Work to minimise the disruptive access your methods require, hold a live record of proposed against confirmed possessions, and identify at the outset whether a scheme needs access spanning more than one timetable period so the right longer-term route is used."}]},{"statement":"Does your organisation identify which duty holder role it holds under the construction regulations on each project, and satisfy itself that those it appoints are capable?","topic":"CDM Duty Holder Roles And Appointments","handbookUrl":"https://nuccol.co.uk/railready-site-access-readiness-cdm-duty-holder-roles-and-appointments/","options":[{"score":0,"desc":"The organisation's duty holder role is not identified, and designers and contractors are appointed with no check on their capability.","feedback":"Legal duties are going undischarged because nobody has established which ones apply. Appointments are being made with no basis for believing the appointee can do the job safely.","goalFeedback":""},{"score":2,"desc":"There is a general awareness of the roles, but the organisation's own role is not formally recorded project by project, and appointments rely on familiarity or reputation.","feedback":"A general awareness does not tell a project team what it must do this week, and reputation is not evidence of capability.","goalFeedback":""},{"score":7,"desc":"The duty holder role is established and recorded on each project with documented arrangements for the duties attached, and the capability of designers and contractors is assessed and recorded before appointment.","feedback":"Duty holder roles are established and recorded per project, and appointee capability is assessed and recorded before appointment.","goalFeedback":"Establish and record your role on every project, since it can differ between schemes, and hold documented arrangements for the duties that come with it. Before appointing anyone, assess and record their skills, knowledge and experience and, for an organisation, its organisational capability for the role in question."},{"score":10,"desc":"Roles and duties are formally assigned, resourced and monitored with competent oversight, and capability assessment is embedded in procurement, proportionate to risk and monitored through delivery.","feedback":"Duties are assigned, resourced and independently overseen, and capability assessment is embedded in procurement and monitored through delivery.","goalFeedback":"Assign and resource the duties rather than only naming the role, and provide competent oversight and assurance across all projects. Embed capability assessment in procurement, make it proportionate to the risk of the package, and keep monitoring capability through delivery rather than treating the appointment check as the end of it."}]},{"statement":"Is a construction phase plan in place before the site is set up, and does your organisation use and contribute the project health and safety information?","topic":"Construction Phase Plan And Project Information","handbookUrl":"https://nuccol.co.uk/railready-site-access-readiness-construction-phase-plan-and-project-information/","options":[{"score":0,"desc":"No construction phase plan is produced or received before work starts, pre-construction information is not reviewed, and nothing is contributed to the health and safety file.","feedback":"The site is being set up without the document that is supposed to govern how it is run safely, and known hazards recorded by others are going unread.","goalFeedback":""},{"score":2,"desc":"A plan is produced but is generic, prepared late and not used to manage the work; information is received and passed on unsystematically.","feedback":"A generic plan describes a project that does not exist. Information that arrives late or leaves incomplete is of no use to anyone.","goalFeedback":""},{"score":7,"desc":"A project-specific plan is in place before the site is set up, sets out arrangements and site rules including for any operational railway activity on the site, and is reviewed and briefed as work changes; pre-construction information is used to plan and the required information is provided for the health and safety file.","feedback":"A project-specific construction phase plan governs the site and is kept current, and project health and safety information is both used and contributed.","goalFeedback":"Have the plan in place before the site is set up, make it specific to the project, and make sure it accounts for any operational railway activity taking place on the construction site. Review, update and brief it as the work changes. Use the pre-construction information to plan rather than filing it, and provide what you hold for the health and safety file, keeping it to what is relevant to protecting people on future projects."},{"score":10,"desc":"The plan is developed with designers and other contractors, verified against what actually happens on site, and reviewed project to project; information exchange is planned, timely and quality-checked with cooperation evidenced.","feedback":"The plan is developed collaboratively and verified against site reality, and information exchange is planned, timely and evidenced.","goalFeedback":"Develop the plan with the designers and other contractors rather than in isolation, and verify it against what actually happens on site rather than assuming compliance. Plan the information exchange with the client and other duty holders so it is timely and quality-checked, and review effectiveness from one project to the next."}]}],"excellence":"Working on or near the operational railway is not like working on any other site. Access has to be created by restricting the use of the network, which is planned in advance to a national timetable; the people who go trackside must hold and carry proven competence; and the construction regulations apply on top of everything the infrastructure manager requires. This module looks at whether your organisation can put competent people to work legitimately, engage the asset protection function properly, plan its work around the access it can actually obtain, and discharge its duties as a duty holder under the construction regulations."}}};
const HB    = {"railready-manufacturing":{"rail_fundamentals":{"color":"#00c8d4","label":"Rail Industry Fundamentals","order":1,"chapters":[{"id":"RIF01","order":1,"q_ref":"1.1","t":"Rail Regulatory Framework","b":"<p class=\"hb-lead\">Rail requirements are not arbitrary; they are downstream of a regulatory settlement. To score a 10 you need this written down and briefed rather than held in one head, and you need to be tracking the regulator's publications closely enough to see changes coming before they arrive as a tender.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Machinery<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A periodic review is a statutory process led by the Office of Rail and Road. Its key objective is to establish the level of funding for the mainline GB rail network, and what has to be delivered for it.<\/p>\n<p class=\"hb-p\"><strong>Everything that reaches you as a specification, a volume or a cost pressure starts there.<\/strong><\/p>\n<p class=\"hb-p\">You do not need to be an expert. You need to be able to explain, in two minutes, who decides what your customers must deliver and how that becomes a requirement on you.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Write a One-Page Internal Briefing<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is the cheapest possible improvement on this question, and most suppliers have never done it.<\/strong><\/p>\n<p class=\"hb-p\">One page covering:<\/p>\n<ul class=\"hb-ul\"><li>Who the regulator is and what it does, economic and safety<\/li><li>What the periodic review sets, and over what period<\/li><li>Who the infrastructure manager is and how it is funded<\/li><li>How that reaches you as an order, a standard or a cost expectation<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Brief It to the People Who Need It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Regulatory understanding sitting with one director is a single point of failure and does not change behaviour.<\/p>\n<ul class=\"hb-ul\"><li>Include it in commercial and bid team induction<\/li><li>Cover it with technical staff who write compliance responses<\/li><li>Refresh it when a determination or a major publication lands<\/li><\/ul>\n<p class=\"hb-p\"><strong>A bid team that understands why a requirement exists writes better answers than one that only knows the requirement.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Track the Publications That Matter to You<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Determinations, settlement documents and monitoring publications are public and free. Pick the ones that touch the regions and assets you serve rather than trying to follow everything.<\/p>\n<ul class=\"hb-ul\"><li>The current determination and the settlement for your regions<\/li><li>Annual delivery plan updates<\/li><li>The regulator's monitoring and performance reporting<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Give It a Name and a Slot<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Assign a named owner with regulatory monitoring in their objectives, so it survives a busy quarter.<\/strong><\/p>\n<p class=\"hb-p\">At the top end this feeds planning: you use published material to anticipate changes in demand and requirements before they reach you, rather than reacting once a tender is issued.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Suppliers who understand the regulatory logic can argue about how a requirement is met. Suppliers who do not can only comply with it, expensively.<\/strong><\/p>"},{"id":"RIF02","order":2,"q_ref":"1.2","t":"Planning Around The Funding Cycle","b":"<p class=\"hb-lead\">Rail funding is set on a multi-year cycle precisely so the supply chain can plan. To score a 10 you need that cycle as a standing, owned input to your business plan, driving decisions about plant, capacity and recruitment — and adjusted when published plans change.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand Why the Cycle Exists<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's guidance states that setting funding and outputs on a five-year basis is designed to facilitate efficient and longer-term decision-making by providing stability and certainty about what the railway, including the supply chain, needs to deliver.<\/strong><\/p>\n<p class=\"hb-p\">That certainty is offered to you. A supplier planning on a twelve-month horizon is declining it.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Track the Right Documents<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>The current Strategic Business Plan for the regions you serve<\/li><li>The final determination settlement documents for those regions<\/li><li>Annual delivery plan updates, which are where volumes actually move<\/li><li>Any published pipeline for the asset types you supply<\/li><\/ul>\n<p class=\"hb-p\">Note that plans are updated during a control period. The original plan is the starting position, not the answer.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Turn It Into Capacity and Investment Decisions<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The test is whether a published volume has ever changed a decision you took.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Plant and machine investment timed against expected renewals volumes<\/li><li>Floor space, tooling and fixturing<\/li><li>Recruitment and training lead times for skills you cannot buy quickly<\/li><li>Inventory and long-lead material positions<\/li><\/ul>\n<p class=\"hb-p\">Write the assumption into the business case, so you can check later whether it held.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Make It Standing and Owned<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">At the top end this is a standing input with named ownership, not an annual exercise.<\/p>\n<ul class=\"hb-ul\"><li>A fixed agenda item at business planning<\/li><li>A named owner who watches for published changes<\/li><li>A defined trigger for revisiting the plan when something moves<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Adjust Proactively<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The difference between a 7 and a 10 is whether you move before the effect reaches your order book.<\/strong><\/p>\n<p class=\"hb-p\">When a delivery plan update shifts volumes in a region you serve, that is the moment to act — not when enquiries dry up six months later. Track how accurate your assumptions turned out to be, and refine them next cycle.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Manufacturing capacity takes months to add and years to justify. The funding cycle is the only forward view of demand the industry publishes, and it is free.<\/strong><\/p>"},{"id":"RIF03","order":3,"q_ref":"1.3","t":"Understanding Your Customer's Structure","b":"<p class=\"hb-lead\">Network Rail is not one customer. To score a 10 you need to understand that its regions each hold their own settlement, report separately and hold their own budget, map your relationships onto that structure, and run an engagement plan that leadership owns and reviews against results rather than activity.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Devolved Structure<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's settlement documents state plainly that each region has its own settlement as part of Network Rail's overall determination, will report separately on what it is delivering, and will have its own budget to fund its activities.<\/strong><\/p>\n<p class=\"hb-p\">That is why the same pitch lands differently in two regions, and why a national relationship does not automatically open a regional door.<\/p>\n<ul class=\"hb-ul\"><li>Regions, and the routes within them<\/li><li>The System Operator<\/li><li>National functions, which buy differently again<\/li><li>Major programmes and enhancement schemes, which may sit outside the regional structure<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Map Your Contacts Onto It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Most suppliers have relationships they cannot place. Put every contact against the structure and see what you actually have.<\/p>\n<ul class=\"hb-ul\"><li>Who do you know, where do they sit, and what can they decide<\/li><li>Where are the gaps in regions you claim to serve<\/li><li>Which relationships depend entirely on one individual<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Find Where the Decision Is Actually Taken<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The person who wants your product is often not the person who can buy it.<\/strong><\/p>\n<p class=\"hb-p\">For each opportunity, work out who specifies, who approves, who buys and who accepts. In a devolved structure those can sit in four different places, and a bid aimed at the wrong one goes nowhere quietly.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Pitch to the Buying Behaviour<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A region with its own settlement and budget is managing a defined outcome within a fixed envelope. A central function is often managing standards, consistency or a whole-life position. They respond to different arguments.<\/p>\n<ul class=\"hb-ul\"><li>Regions: deliverability, disruption, cost within this control period<\/li><li>National functions: standardisation, whole-life cost, assurance<\/li><li>Programmes: schedule certainty and interface risk<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Own the Plan and Review It on Results<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end engagement is planned, owned at leadership level and reviewed for effectiveness.<\/strong><\/p>\n<p class=\"hb-p\">Review it against enquiries and awards, not against meetings held. And revisit it when the customer reorganises, which in rail is not a rare event.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Selling into a devolved organisation as though it were a single entity wastes most of the effort. The structure is published; using it is free advantage.<\/strong><\/p>"},{"id":"RIF04","order":4,"q_ref":"1.4","t":"Outcomes Your Customers Are Held To","b":"<p class=\"hb-lead\">Your customers are held to account against a small set of published objectives. To score a 10 you need to be able to say specifically which one your product moves and how, evidence it in bids and reporting, then measure your contribution and take proposals back on the strength of it.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know the Objectives<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR set out at the start of PR23 that its focus would remain on four objectives: safety, performance, asset sustainability and efficiency.<\/strong><\/p>\n<p class=\"hb-p\">Those four words are the language your customer is measured in. Using them accurately is not jargon; it is speaking to what they are accountable for.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Pick One and Be Specific<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A claim to support all four is a claim to support none of them.<\/strong><\/p>\n<p class=\"hb-p\">Work out which objective your product actually moves, and by what mechanism:<\/p>\n<ul class=\"hb-ul\"><li>A longer-life component reduces intervention frequency, which supports asset sustainability<\/li><li>A faster-fit design reduces time in possession, which supports performance<\/li><li>A more reliable part reduces failures in service, which supports performance and safety<\/li><li>A lower whole-life cost supports efficiency<\/li><\/ul>\n<p class=\"hb-p\">One defensible, evidenced claim beats four assertions.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Get It Into Bids and Reporting<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Write the link explicitly rather than leaving the evaluator to infer it.<\/p>\n<ul class=\"hb-ul\"><li>A standard bid paragraph per product, kept current<\/li><li>The same language in your delivery reporting<\/li><li>Case study evidence where you have it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Measure Your Own Contribution<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you measure it rather than asserting it.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Track in-service failures, returns and warranty claims<\/li><li>Track intervention frequency where your customer will share it<\/li><li>Agree with the customer what would count as evidence, before you start<\/li><\/ul>\n<p class=\"hb-p\">Review the data at leadership level, so it informs decisions rather than only marketing.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Take Proposals Back<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Once you can evidence a contribution, you can propose rather than respond. That is the shift from being a supplier who answers tenders to one who influences what the tender asks for.<\/p>\n<p class=\"hb-p\"><strong>Bring a proposal built on data, not on an offer of a meeting.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Every supplier claims quality. Very few can name the regulated outcome they improve and show the number. That difference is visible in an evaluation.<\/strong><\/p>"},{"id":"RIF05","order":5,"q_ref":"1.5","t":"Published Performance Information","b":"<p class=\"hb-lead\">Your customers publish how they are being judged. To score a 10 you need to follow the measures relevant to the parts of the network you serve, use their language in your bids and reporting, and turn a deteriorating measure into a proposal rather than waiting for a tender.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know What Is Published<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">ORR's outcomes framework includes a small number of top-tier success measures used to publicly hold Network Rail to account, alongside regional settlement documents, delivery plan updates and routine monitoring publications.<\/p>\n<p class=\"hb-p\"><strong>All of it is free, and almost none of your competitors read it.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Follow Only What Is Relevant to You<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Following everything means following nothing.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Pick the regions and routes you actually serve<\/li><li>Pick the asset types you actually touch<\/li><li>Pick two or three measures, not twenty<\/li><li>Write the list down so it survives a change of personnel<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Speak Their Measures Back to Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Using your customer's own measure in your bid is disproportionately persuasive, because it shows you understand what they are being judged on.<\/p>\n<ul class=\"hb-ul\"><li>Reference the specific measure, not 'performance' generally<\/li><li>Say how your offer affects it<\/li><li>Repeat it in delivery reporting so the claim is continuous<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Give It an Owner and a Slot<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">At the top end this is a routine, owned input to commercial planning rather than something a keen individual does.<\/p>\n<ul class=\"hb-ul\"><li>A named owner with it in their objectives<\/li><li>A standing item in commercial or business development review<\/li><li>A short internal note when something significant is published<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Turn a Bad Number Into a Proposal<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is the highest-value move available on this question.<\/strong><\/p>\n<p class=\"hb-p\">When a measure goes the wrong way in a region you serve, that is a customer with a problem and a published admission of it. Bring them something specific: a method, a product, a change that addresses that measure.<\/p>\n<p class=\"hb-p\">That is how suppliers get in front of a requirement rather than behind it.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Published performance data is a free, continuously updated list of your customers' current problems. Reading it costs an hour a month.<\/strong><\/p>"},{"id":"RIF06","order":6,"q_ref":"1.6","t":"Value And Efficiency Under Funding Pressure","b":"<p class=\"hb-lead\">Rail money is tight and it has moved. To score a 10 you need to understand where it has moved to, reshape what you offer accordingly, and evidence whole-life value with data rather than assertion — including savings you agreed how to measure before you started.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Shift<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's conclusion of the 2023 periodic review records that constrained funding means Network Rail will be spending less on renewals and more on life-extending repairs and maintenance in CP7 than in CP6.<\/strong><\/p>\n<p class=\"hb-p\">That is a change in what your customers want to buy, not just how much:<\/p>\n<ul class=\"hb-ul\"><li>More repair, refurbishment and life extension<\/li><li>Fewer wholesale replacements<\/li><li>More interest in components that extend an existing asset's life<\/li><li>More scrutiny of whole-life cost, less tolerance for capital cost alone<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Reshape the Offer, Not Just the Price<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Discounting into a constrained market is a race you lose slowly. Look instead at whether you can offer:<\/p>\n<ul class=\"hb-ul\"><li>A repair or refurbishment route alongside replacement<\/li><li>Components sold to extend rather than replace<\/li><li>Longer warranty or supported life<\/li><li>Predictable cost over a period rather than a low unit price<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Build a Whole-Life Case With Real Numbers<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Say what the customer avoids spending, not only what you charge.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Purchase cost against intervention frequency over an asset life<\/li><li>Your own in-service failure and warranty data as the evidence base<\/li><li>Access and disruption avoided, which often dwarfs the component cost<\/li><li>State your assumptions, so the case survives challenge<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Agree the Measurement Before You Start<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A saving nobody agreed how to measure is a saving the customer will not accept afterwards.<\/p>\n<ul class=\"hb-ul\"><li>Agree the baseline and the method up front, in writing<\/li><li>Agree who collects the data<\/li><li>Agree when you will both look at it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Go Looking for Cost to Remove<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you actively seek out cost your customer could avoid, then measure and share what was delivered.<\/strong><\/p>\n<p class=\"hb-p\">A supplier with a track record of measured savings is hard to displace on price, because the buyer knows what they would be giving up.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: In a constrained control period the supplier who only competes on unit price is competing in the one dimension where the customer has least room to reward them.<\/strong><\/p>"},{"id":"RIF07","order":7,"q_ref":"1.7","t":"Routes To Market And Positioning","b":"<p class=\"hb-lead\">Rail work reaches suppliers through more than one route, and most of it is not advertised where you are looking. To score a 10 you need to know where your capability sits in the tiers, pursue direct and subcontract routes deliberately, keep your registrations accurate, and run a qualified opportunity plan with real bid or no bid decisions.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Tiers<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Rail's CP7 Strategic Business Plan describes a focus on timely payment to suppliers and incentivising Tier 1 suppliers to employ Tier 2 and 3 suppliers.<\/strong><\/p>\n<p class=\"hb-p\">That means the subcontract route is not second best; it is a deliberately encouraged part of how work reaches smaller suppliers.<\/p>\n<p class=\"hb-p\">Work out honestly which tier your capability, capacity and balance sheet actually support, and pursue that.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Pursue Both Routes on Purpose<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Identify the tier one contractors and OEMs relevant to what you make<\/li><li>Get onto their approved supplier lists, which is a different process from public qualification<\/li><li>Pursue direct opportunities where your scale supports it<\/li><li>Do not let one route crowd out the other<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Keep Registrations Current and Accurate<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>An out-of-date registration is worse than none, because it makes you findable and then disappoints.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Review your profile at least annually, and after any capability change<\/li><li>Make sure the codes and capability claims match what you can deliver now<\/li><li>Keep certificates and insurances in date on the portal, not just in your files<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Actually Watch the Pipelines<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Network Rail's SME Supplier Guide notes that it advertises contract opportunities on the government's Find a Tender Service above threshold, and that suppliers can use it to search for upcoming contract and framework opportunities.<\/p>\n<ul class=\"hb-ul\"><li>Give someone the job of reviewing pipelines on a defined rhythm<\/li><li>Set up alerts rather than relying on memory<\/li><li>Watch framework renewal dates, which is when positions change<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Qualify, Decide, and Review<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end pipeline monitoring feeds a qualified opportunity plan with explicit bid or no bid decisions.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Score opportunities against your real capability and capacity<\/li><li>Say no in writing, with reasons, and stop spending on it<\/li><li>Review wins and losses and change something as a result<\/li><li>Revisit the strategy when contracting models change, because the tier you sell into can change with them<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Most suppliers who complain that rail is closed to them are registered somewhere out of date and watching the wrong route to market.<\/strong><\/p>"},{"id":"RIF08","order":8,"q_ref":"1.8","t":"Readiness For Industry Change","b":"<p class=\"hb-lead\">The organisations you sell to are being restructured. To score a 10 you do not need to predict the outcome; you need to have assessed which of your relationships and routes to market depend on the structure as it stands, and to hold that as a live risk with a named owner.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Follow the Published Material<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The Railways Bill factsheet on Great British Railways states that it will be structured to focus on delivering for its customers locally, with a structure based on geographic business units, each bringing together infrastructure management and passenger operations into a single local team.<\/p>\n<p class=\"hb-p\"><strong>Read the primary material rather than the trade press summary of it. It is short and it is free.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Assess What It Means for You, at Management Level<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The point is not to become an expert on the reform. It is to know your own exposure.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Which relationships depend on a body that may not exist in its current form<\/li><li>Which routes to market run through a structure that may change<\/li><li>Where would an equivalent decision sit afterwards<\/li><li>Which of your registrations or qualifications are tied to a particular buyer<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-ca
