3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Show the Work Against the Access You Have<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is what makes a site programme credible or not.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Sequence the work against confirmed possession dates, not hoped-for ones<\/li><li>Show which activities depend on which access<\/li><li>Show what happens if a possession is not obtained<\/li><li>Distinguish confirmed access from requested access<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Always Include a Narrative<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>What changed since the last accepted version<\/li><li>Why<\/li><li>What effect it has on completion<\/li><li>What you need from the client<\/li><\/ul>\n<p class=\"hb-p\"><strong>Without a narrative the reviewer has to reverse-engineer the changes, which produces rejection by default.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Pursue the Response<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Under NEC4, within two weeks of submission the Project Manager notifies acceptance or the reasons for not accepting.<\/p>\n<p class=\"hb-p\"><strong>If no response arrives, follow the contractual route. An unanswered submission is not an accepted programme, and the difference matters enormously when a possession is lost.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Align Your Internal Controls<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you hold an accepted programme every period, review it with the client, and keep internal controls aligned to the accepted version.<\/strong><\/p>\n<p class=\"hb-p\">Where your site reporting and your contractual programme disagree, you will end up defending both.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: The programme proves delay and entitlement, and on the railway delay usually originates in access. Without an accepted programme you are arguing from memory about a possession that no longer exists.<\/strong><\/p>"},{"id":"CCF05","order":5,"q_ref":"8.5","t":"Managing Change And Its Cost","b":"<p class=\"hb-lead\">Change absorbed is margin donated, and on site the change usually arrives as an instruction or a lost possession. To score a 10 you need events notified within the period, priced on the correct basis, and supervisors who know that access changes are notifiable.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Notify Within the Period, Every Time<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Some contracts bar a late claim outright. Missing the period can extinguish an otherwise good entitlement.<\/strong><\/p>\n<p class=\"hb-p\">Diary the deadline from the date of awareness. On site that is the date of the shift, not the date the paperwork reached the office.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Tell Supervisors What Is Notifiable<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The most commonly missed events on site are the ones that feel like normal disruption.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A possession that was cancelled, shortened or started late<\/li><li>An instruction given verbally on site by the client's representative<\/li><li>Being prevented from accessing the worksite<\/li><li>Conditions materially different from the information provided<\/li><li>A change to the sequence imposed on the night<\/li><\/ul>\n<p class=\"hb-p\">Give them a same-shift route to report it to whoever issues notices.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Price on the Contractual Basis<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Use the assessment basis the contract specifies<\/li><li>Be clear about the date at which the assessment is made, because that determines whose forecast applies<\/li><li>Include time as well as cost<\/li><li>Keep the build-up so it can be interrogated<\/li><\/ul>\n<p class=\"hb-p\"><strong>Published guidance on the dividing date exists precisely because this is where assessments are most often argued.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Close Them, Do Not Just List Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>A regular commercial meeting whose purpose is closure<\/li><li>Oldest first<\/li><li>Escalation when an event ages past a threshold<\/li><li>A decision to accept or reject, rather than perpetual clarification<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Report the Aged Position and Learn From It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end the age and value of unimplemented events is reported to leadership, and root causes feed back into bidding and access assumptions.<\/strong><\/p>\n<p class=\"hb-p\">If most of your change comes from access you did not get, that is telling you something about how you priced the access risk.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Unresolved change is unfunded work you have already done at night, in a possession, with no way to redo it. The evidence decays fast and so does the goodwill.<\/strong><\/p>"},{"id":"CCF06","order":6,"q_ref":"8.6","t":"Contract Close Out","b":"<p class=\"hb-lead\">Contracts that never close consume cash, resource and attention indefinitely. To score a 10 you need close-out planned from award, completion requirements checked before certification, defect correction periods tracked, and lessons carried into the next contract.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know When Your Defect Obligation Starts and Ends<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Under NEC4 the Contractor corrects a notified Defect before the end of the defect correction period, which begins at Completion for Defects notified before Completion, and when the Defect is notified for other Defects.<\/strong><\/p>\n<p class=\"hb-p\">That means every notified defect has its own clock. Tracking one project-level date is not enough, and it is how organisations end up believing they are free of an obligation they still hold.<\/p>\n<ul class=\"hb-ul\"><li>Record the notification date for each defect<\/li><li>Record when its correction period began and ends<\/li><li>Track them individually, not as a batch<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Check What Completion Actually Requires<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Completion is defined by the scope, not by the work looking finished. Go and read what it says before you ask for certification.<\/p>\n<ul class=\"hb-ul\"><li>Documentation, records and certificates required<\/li><li>Testing, commissioning or acceptance activity<\/li><li>Handover or handback requirements<\/li><li>Anything the scope requires that is easy to leave until later<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Clear Change Before It Becomes a Final Account<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Outstanding compensation events settled at the end are settled with hindsight, less evidence and no leverage.<\/strong><\/p>\n<p class=\"hb-p\">Aim to arrive at completion with the change position substantially closed. What remains should be a short, well-documented list rather than a reconstruction.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Manage the Final Assessment and Retention<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Know when the Defects Certificate is due and what triggers it<\/li><li>Diary the final assessment date and prepare for it<\/li><li>Track retention release dates actively — nobody else will<\/li><li>Chase the final payment as a task with an owner<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Plan It From Award and Learn From It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end close-out requirements are identified at award, tracked through delivery, and reviewed at completion with lessons carried forward.<\/strong><\/p>\n<p class=\"hb-p\">Most close-out pain is caused by records that were never collected during delivery because nobody knew they would be needed. Identifying that on day one costs nothing.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: An open contract is working capital you cannot use and a liability you cannot quantify. The cost is invisible, which is exactly why it persists.<\/strong><\/p>"}]},"social_value":{"color":"#84cc16","label":"Social Value & Sustainability","order":9,"chapters":[{"id":"SVS01","order":1,"q_ref":"9.1","t":"Payment Performance Evidence","b":"<p class=\"hb-lead\">How quickly you pay your own supply chain is now a bid question with a number attached. To score a 10 you need measured payment performance over defined periods, and at the top end a leadership commitment that is tracked continuously and visible externally.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand That This Is a Condition, Not a Preference<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Cabinet Office prompt payment policy records that from 1 September 2019, any supplier bidding for a central government contract above five million pounds per year has needed to demonstrate that they have effective payment systems.<\/strong><\/p>\n<p class=\"hb-p\">Above certain values this stops being a virtue and becomes a gate. Network Rail's own strategic business plan also records a focus on timely payment to suppliers.<\/p>\n<p class=\"hb-p\">Find out which of your target contracts sit above the relevant threshold before you need the answer.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Measure the Right Number<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The question is what proportion of invoices you paid within your stated terms, over a defined period.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Set up the report so it can be produced on demand, not reconstructed<\/li><li>Measure by invoice count and by value<\/li><li>Keep historical periods, since bids often ask for a run of them<\/li><li>Know your average payment days as well as your compliance percentage<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Fix the Internal Causes<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Most late payment at supplier scale is not a cash decision. It is an approval step nobody owns.<\/p>\n<ul class=\"hb-ul\"><li>Where do invoices sit longest, and why<\/li><li>Is the delay in receipt, approval, or payment run timing<\/li><li>Are disputes being used as a reason to hold whole invoices<\/li><li>Does anyone own the metric<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Describe the System, Not Just the Result<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The policy guidance is about demonstrating an effective payment system. Be able to describe it:<\/p>\n<ul class=\"hb-ul\"><li>How invoices are received and matched<\/li><li>Who approves, within what timescale<\/li><li>How exceptions and queries are handled<\/li><li>Payment run frequency<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Publish It and Set a Target<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end fair payment is a leadership commitment, tracked continuously, published or externally recognised, with improvement targets set and acted on.<\/strong><\/p>\n<p class=\"hb-p\">Signing up to a recognised payment code, or publishing your performance, converts a compliance obligation into a competitive position — particularly with buyers who are themselves measured on how their supply chain is treated.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Buyers increasingly treat payment performance as a proxy for how you will behave generally. It is also one of the few bid answers that is a hard number you cannot dress up.<\/strong><\/p>"},{"id":"SVS02","order":2,"q_ref":"9.2","t":"Payment Terms And Disputes","b":"<p class=\"hb-lead\">Payment terms agreed after work starts are terms your supplier could not decline. To score a 10 you need terms agreed in writing before work begins, required terms flowed down unchanged, and prompt communication when payment will be late.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Agree Terms Before Work Starts<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The Fair Payment Code guidance requires organisations to establish clear and fair payment terms, ensuring their suppliers understand the payment terms laid out in their contracts, and to agree payment terms with suppliers and put them in writing, before work begins, in clear plain English contracts.<\/strong><\/p>\n<p class=\"hb-p\">Before work begins is the operative phrase, and it is the one broken most often on urgent orders.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Write Them in Plain English<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Terms a small supplier cannot understand are terms they cannot plan around.<\/p>\n<ul class=\"hb-ul\"><li>State the payment period in days and from what event<\/li><li>State what triggers the clock — receipt, acceptance, or a valuation<\/li><li>State what makes an invoice valid<\/li><li>Avoid making payment contingent on your own receipt of payment unless the contract genuinely permits it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Flow Required Terms Down Unchanged<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Where your own contract requires particular payment terms to be passed down, pass them down as they are.<\/strong><\/p>\n<p class=\"hb-p\">Extending terms as money moves down the chain is exactly the behaviour prompt payment policy exists to stop, and it is easy for a buyer to detect.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Tell People Early When Payment Will Be Late<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A supplier who is told is inconvenienced. A supplier who discovers it is damaged.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Notify before the due date, not after<\/li><li>Say when it will be paid<\/li><li>Give a route to escalate<\/li><li>Never use a minor query to hold an entire invoice<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Check the Tier Below and Review the Causes<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end this is embedded in contract management, lower tier payment is checked, and leadership reviews recurring causes.<\/strong><\/p>\n<p class=\"hb-p\">Ask whether money is reaching the organisations below your immediate suppliers, particularly small labour and materials providers. And review the causes of your own late payment — they are almost always internal process, not cash.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Your supply chain's financial stability is your delivery risk. A supplier who fails because of your payment behaviour fails on your contract.<\/strong><\/p>"},{"id":"SVS03","order":3,"q_ref":"9.3","t":"Social Value In Bidding","b":"<p class=\"hb-lead\">Social value commitments are now monitored through contract KPIs, so promising what you cannot deliver is a trap rather than a tactic. To score a 10 you need commitments planned before bidding, proportionate to your size, tracked through delivery, and known to whoever runs the contract.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know How It Will Be Policed<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>PPN 026, the Social Value Model, provides that in scope organisations should ensure that all social value commitments made by suppliers during the procurement process are appropriately monitored and measured via contractual mechanisms, for example key performance indicators, which are communicated to contract managers.<\/strong><\/p>\n<p class=\"hb-p\">The underlying duty on authorities sits in the Public Services (Social Value) Act 2012.<\/p>\n<p class=\"hb-p\">So a commitment made to win becomes a measured obligation. Bid accordingly.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Decide What You Can Deliver First<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Write the answer from what you will actually do, not from what scores well.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>What are you already doing that you have never claimed<\/li><li>What could you add at reasonable cost<\/li><li>What is specific to the community this contract affects<\/li><li>What would you be embarrassed to be measured on<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Be Proportionate<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A small supplier promising a large employment programme is not credible and will not be believed. Evaluators see a great many of these.<\/p>\n<p class=\"hb-p\"><strong>A modest, specific, evidenced commitment scores better than an ambitious vague one, and it survives the contract.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Hand It Over Properly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The single most common failure is that the delivery team never learns what the bid promised.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A handover note listing every commitment<\/li><li>The KPIs they will be measured against<\/li><li>Who owns each one<\/li><li>A reporting rhythm from the start, not from the first review<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Align to the Community and Feed It Back<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end outcomes are set at leadership level, aligned to the communities affected by each contract, measured continuously and fed back into future bids.<\/strong><\/p>\n<p class=\"hb-p\">Offering the same package everywhere is visibly generic. Ask what this particular scheme's neighbours would actually value, and let what worked shape the next bid so your commitments become more credible over time rather than more ambitious.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Social value is weighted in almost every public sector evaluation. Scoring nothing on it is a straightforward competitive loss; promising and failing is worse.<\/strong><\/p>"},{"id":"SVS04","order":4,"q_ref":"9.4","t":"Social Value Strategy And Competence","b":"<p class=\"hb-lead\">Social value without a strategy is a series of donations. For a service provider the most credible offer is usually local recruitment and training into rail competences — treated as strategy, not charity.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Meet the Scheme Expectation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-032 Sustainable Railways requires evidence that arrangements are in place to support social value initiatives.<\/strong><\/p>\n<p class=\"hb-p\">Arrangements means something structured. A record of charitable giving is not arrangements.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Lead With What You Are Actually Good At<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>You employ people, in places, in an industry with a skills shortage. That is your strongest card.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Local recruitment on the schemes you deliver<\/li><li>Sponsorship into rail competences for people entering the industry<\/li><li>Apprenticeships and structured progression<\/li><li>Routes in for people facing barriers to employment<\/li><\/ul>\n<p class=\"hb-p\">It is credible because it is what you do anyway, and it is measurable.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Write Objectives You Would Defend<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>What are you trying to change, and for whom<\/li><li>Why this rather than something else<\/li><li>What will be different in two years<\/li><li>How much are you prepared to spend on it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Build the Competence<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's Social Value Competency Guide sets out what competence looks like, including understanding the difference between activities, outputs, outcomes and impact.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Activity: what you did<\/li><li>Output: how much of it<\/li><li>Outcome: what changed for someone<\/li><li>Impact: what changed that would not have anyway<\/li><\/ul>\n<p class=\"hb-p\">For local recruitment that means following what happened to people afterwards, not counting hires.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Build It Into How You Resource and Buy<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end social value is embedded across the organisation, reviewed for social inequalities, built into purchasing and resourcing, and promoted through your subcontractors.<\/strong><\/p>\n<p class=\"hb-p\">Where you recruit, which labour suppliers you use and whether they pay fairly are all social value decisions you are already making. Make them deliberately.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Buyers can tell within a paragraph whether social value is a strategy or a scrapbook. For a service provider the honest answer — we employ local people and train them — is also the strongest one.<\/strong><\/p>"},{"id":"SVS05","order":5,"q_ref":"9.5","t":"Evidencing Social Value Outcomes","b":"<p class=\"hb-lead\">Counting activity is not evidence of value. To score a 10 you need intended outcomes defined before you start, data collected against them, and at the top end an evaluation that asks whether the change can fairly be attributed to you and what it cost.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Learn the Four Levels<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's Social Value Competency Guide expects an understanding of the difference between activities, outputs, outcomes and impact in a social value context, and ways of assessing and evidencing them.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Activity — we ran a careers programme<\/li><li>Output — forty students attended<\/li><li>Outcome — six entered the industry<\/li><li>Impact — four of those would not have done so otherwise<\/li><\/ul>\n<p class=\"hb-p\">Most reporting stops at output. Buyers have started asking for outcome.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Define the Outcome Before You Start<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>You cannot evidence a change you did not decide to look for.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Write down the intended outcome, dated, before the activity<\/li><li>Say how you will know<\/li><li>Say who will collect the data<\/li><li>Agree it with the client where it is a contractual commitment<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Collect Both Kinds of Evidence<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Numbers show scale; accounts show meaning. You need both, and one without the other is unconvincing.<\/p>\n<ul class=\"hb-ul\"><li>Quantitative: how many, how much, over what period<\/li><li>Qualitative: what participants say happened<\/li><li>Follow-up at a later date, not just at the end of the activity<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Report Honestly, Including Shortfalls<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A candid account of a mixed result is more credible than an unbroken run of successes, and considerably more useful.<\/strong><\/p>\n<p class=\"hb-p\">Say what did not work and what you concluded. Evaluators read a great many social value reports and the uniformly positive ones stop registering.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Evaluate Attribution and Cost<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you ask whether the change can fairly be attributed to you, what it cost to achieve, and what should be repeated, scaled or stopped.<\/strong><\/p>\n<p class=\"hb-p\">Note that no published rail guidance on evaluating social value outcomes exists, so this expectation is drawn from the competency framework rather than a standard. Use a recognised general approach and be transparent about your method.<\/p>\n<p class=\"hb-p\">The point of asking is that it changes what you do next, which is what makes it a strategy rather than a report.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: The next question after 'what did you do' is always 'and did it work'. Organisations that cannot answer it lose the credibility their activity earned them.<\/strong><\/p>"},{"id":"SVS06","order":6,"q_ref":"9.6","t":"Environmental Management And Waste","b":"<p class=\"hb-lead\">An environmental policy is not an environmental management system, and on site the exposure is immediate: spoil, fuel and watercourses. To score a 10 you need a defined scope, measured objectives, a current compliance register including duty of care, and waste managed as a reduction target.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Build a System, Not a Statement<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-032 requires evidence that arrangements are in place to establish, maintain and continually improve on a management system required for managing environmental responsibilities.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A defined scope — what the system covers<\/li><li>Identified interested parties and what they require<\/li><li>Objectives with targets and data<\/li><li>A compliance register, current and reviewed<\/li><li>Internal audit and management review<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Control the Site Risks That Actually Bite<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>For site work, most serious environmental incidents come from a short list.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Fuel and oil storage, bunding and refuelling practice<\/li><li>Silt and runoff reaching a watercourse or drain<\/li><li>Spoil and arisings — what they are, and where they go<\/li><li>Concrete washout<\/li><li>Protected species and vegetation clearance seasons<\/li><\/ul>\n<p class=\"hb-p\">Have a spill response provision on site, and make sure people know where it is and how to use it.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Get Duty of Care Right<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>What leaves your site remains your responsibility, and this is a routine audit finding.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Waste transfer and consignment notes, complete and retained<\/li><li>Carrier registration checked, and current<\/li><li>Destination checked — know where it actually went<\/li><li>Reconcile paperwork against what left site<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Manage Waste as a Reduction Target<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">AP-032 covers zero waste. Treating waste purely as a disposal cost misses the savings and the exposure.<\/p>\n<ul class=\"hb-ul\"><li>Measure by stream, not as a single total<\/li><li>Set a reduction target against a baseline<\/li><li>Look hard at reuse of arisings on site, which avoids both disposal and import<\/li><li>Track segregation and diversion from landfill<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Apply Circular Thinking and Look at Your Chain<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end the system is externally assured or independently audited, leadership-driven, and circular thinking is applied to what you specify and buy.<\/strong><\/p>\n<p class=\"hb-p\">RSSB's Sustainable Rail Blueprint sets the sector direction. Measure your subcontractors' environmental performance alongside your own — most of your site risk is delivered by them.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: A pollution incident on the railway is an immediate regulatory matter and an immediate client relationship problem. Most of them are caused by fuel, silt or spoil, and all three are preventable.<\/strong><\/p>"},{"id":"SVS07","order":7,"q_ref":"9.7","t":"Carbon And Net Zero Management","b":"<p class=\"hb-lead\">Carbon is now a bid question and increasingly a contract condition. For a service provider it is mostly plant, generators and vehicles. To score a 10 you need the profile assessed, a documented plan with an owner, and at the top end hired plant and materials included and verified.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Assess the Profile the Scheme Expects<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-032 requires evidence that the supplier has assessed their own emissions profile, considering direct emissions from their operations, which are Scope 1, and those indirectly associated with their activities, which are Scope 2.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Scope 1 — fuel you burn: plant, generators, vans and welfare units<\/li><li>Scope 2 — electricity you buy for depots and offices<\/li><li>Scope 3 — hired plant, subcontractors, materials brought to site<\/li><\/ul>\n<p class=\"hb-p\">Fuel data is the single most valuable thing you can start collecting.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Be Explicit About Boundaries<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Which depots, contracts and entities are included<\/li><li>Which period it covers<\/li><li>What methodology and emission factors you used<\/li><li>What is excluded, and why<\/li><\/ul>\n<p class=\"hb-p\"><strong>A carbon number without a stated boundary is not a number, and an assessor will ask.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Write a Plan With an Owner<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>A named owner with it in their objectives<\/li><li>Dated reduction actions, not aspirations<\/li><li>The expected saving from each<\/li><li>A monitoring method and reporting rhythm<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Start With Plant and Fleet<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">This is where a service provider's emissions and costs sit together, which makes reduction fundable.<\/p>\n<ul class=\"hb-ul\"><li>Right-sizing generators, which are routinely oversized and idling<\/li><li>Alternatives to diesel generators for welfare and lighting<\/li><li>Vehicle fleet efficiency and journey planning<\/li><li>Plant idle time on site<\/li><li>Fewer return visits, which removes whole journeys<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Extend Into the Value Chain and Verify<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end emissions are measured across operations and value chain, independently verified, and progress reported transparently.<\/strong><\/p>\n<p class=\"hb-p\">Hired plant is the biggest omission for most service providers — it burns your fuel on your job but sits on someone else's balance sheet. Ask your hire supplier for the data.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Rail clients have their own carbon targets and need supplier data to meet them. Plant and fuel are visible, measurable and increasingly specified in tenders.<\/strong><\/p>"}]},"site_access":{"color":"#ec4899","label":"Site & Access Readiness","order":10,"chapters":[{"id":"SAR01","order":1,"q_ref":"10S.1","t":"Sentinel Sponsorship Arrangements","b":"<p class=\"hb-lead\">Sponsorship is what lets you put people to work in your own right. To score a 10 you need approved sponsor status backed by documented management system processes, work experience recorded as the competence standard requires, and self-checking between audits rather than preparation before them.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand What Sponsorship Requires<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The Sentinel Scheme Rules require that all Sponsors demonstrate they have a management system in place with documented processes for the key management system requirements required to be a Sponsor.<\/strong><\/p>\n<p class=\"hb-p\">That is a management system requirement, not an administrative registration. Map your procedures against the sponsor requirements one by one and be able to show the mapping.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Do Not Borrow Someone Else's<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Relying on another organisation to sponsor your people leaves you carrying the operational risk without holding the controls.<\/strong><\/p>\n<p class=\"hb-p\">It also means you cannot mobilise independently, which limits what work you can take and how quickly. If you intend to grow, sponsorship is a prerequisite rather than an option.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Get the Work Experience Requirement Right<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>NR/L2/CTM/021 Issue 5, with a compliance date of 06 December 2025, states that work experience shall be recorded in the Sentinel system.<\/strong><\/p>\n<p class=\"hb-p\">This is the point that causes most confusion, because the Scheme Rules are silent on it — the requirement sits in the competence standard, not in the scheme.<\/p>\n<ul class=\"hb-ul\"><li>Make sure your people are recording work experience in the required system<\/li><li>Make sure supervisors know they are responsible for it<\/li><li>Check it is happening rather than assuming<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Keep It Current Between Audits<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Review your processes against the Scheme Rules on a defined cycle<\/li><li>Sample-check that the process is being followed, not just that it exists<\/li><li>Watch for scheme rule updates and brief them<\/li><li>Do not reconstruct evidence before an audit<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Own It Senior and Analyse the Trend<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end sponsorship is owned at senior level with self-checking, trend analysis of findings, and continual improvement.<\/strong><\/p>\n<p class=\"hb-p\">Look across audits rather than closing individual actions. The same finding twice is a process problem; three times is a governance problem.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Sponsorship is the licence that lets you trade. Losing or limiting it stops the business, not just the contract.<\/strong><\/p>"},{"id":"SAR02","order":2,"q_ref":"10S.2","t":"Competence Verification At Site","b":"<p class=\"hb-lead\">Competence verification is the last control before someone goes on the infrastructure. To score a 10 you need every individual checked in before they work, the check recorded, and exceptions escalated rather than worked around — with the means to check available at every site.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Check Every Individual, Every Time<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The Sentinel Scheme Rules require that all individuals provide their Sentinel card, virtual or physical, for swipe in before they undertake work on the Managed Infrastructure.<\/strong><\/p>\n<p class=\"hb-p\">Every individual. Not the gang leader on behalf of the gang, and not the people you do not recognise.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Check Competence, Not Just Validity<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A valid card does not mean the right competence for tonight's task.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Confirm the specific competences the role requires<\/li><li>Confirm any medical or screening requirement is current<\/li><li>Confirm the person is authorised by you, not just carded<\/li><li>Check the person matches the card<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Make It Possible at Every Site<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Verification that only works where there is a signal will be skipped where there is not, and remote worksites are exactly where you are least able to correct a problem.<\/p>\n<ul class=\"hb-ul\"><li>Provide the means to check at every worksite, including offline capability<\/li><li>Make sure the person in charge knows how to use it<\/li><li>Have a documented fallback for a systems outage, and be clear when the answer is that work does not proceed<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Escalate Exceptions Rather Than Absorbing Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>An exception absorbed at 23:00 to save a shift is the exact failure this control exists to prevent.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Define what happens when someone fails the check — they do not work<\/li><li>Give the person in charge authority to turn someone away, and back them<\/li><li>Record every exception, including who was turned away and why<\/li><li>Make sure there is someone to call<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Review the Trend, Because It Means Something<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end exceptions are escalated and trends reviewed by management.<\/strong><\/p>\n<p class=\"hb-p\">A rising exception rate is almost never an individual discipline problem. It usually means resourcing is running too tight, a supplier is sending people without checking, or renewals are not being planned. Fix that rather than the symptom.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: This is the control that stops an uncompetent person going on the track under your name. There is no second line of defence behind it.<\/strong><\/p>"},{"id":"SAR03","order":3,"q_ref":"10S.3","t":"Track Safety Competence","b":"<p class=\"hb-lead\">Everyone who goes on or near the line has to hold and carry personal track safety competence. To score a 10 you need that verified rather than assumed, renewals planned well ahead of expiry, and newly competent people supported rather than left to the certificate.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know the Requirement<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The Trackworkers Manual states, in the section on going on or near the line with others, that you must have with you a valid certificate of competence in personal track safety issued by your employer. The same requirement applies to going on or near the line alone.<\/strong><\/p>\n<p class=\"hb-p\">Two obligations, not one: hold it, and have it with you. The second is the one checked at the worksite.<\/p>\n<p class=\"hb-p\">Note that the Rule Book module for non-track workers is a different document with a different audience. Do not rely on it for trackworker competence.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Brief Individual Responsibilities<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>People routinely assume the person in charge carries all the responsibility. The Rule Book does not work that way.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Brief individuals on their own Rule Book responsibilities, not just the method<\/li><li>Cover what to do if they believe the arrangement is unsafe<\/li><li>Cover what to do if they become separated from the group<\/li><li>Make sure agency and subcontracted staff get the same briefing<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Plan Renewals Long Before Expiry<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Competence renewal takes time to arrange and courses are not always available at short notice.<\/p>\n<ul class=\"hb-ul\"><li>Report on expiries a long way out, not thirty days before<\/li><li>Plan renewals around your workload, not into your peak<\/li><li>Watch for clusters where a whole gang expires together<\/li><li>Treat a lapse as a resourcing failure and review why it happened<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Support People Who Are Newly Competent<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A certificate says someone passed an assessment. It does not say they have done the job at night, in the rain, when something unexpected happened.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Mentor newly competent people rather than deploying them straight<\/li><li>Pair them with experienced staff for a defined period<\/li><li>Check on them in the workplace<\/li><li>Ask them what they found hardest, and act on the answers<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Reinforce It in the Field<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end competence is planned ahead, supported by mentoring, and reinforced by leaders in the field.<\/strong><\/p>\n<p class=\"hb-p\">Senior people who go trackside and ask about competence — rather than only about programme — change what the workforce believes the organisation cares about.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Personal track safety competence is the baseline qualification for being on the infrastructure at all. Working without it is a Rule Book breach that no amount of good practice elsewhere offsets.<\/strong><\/p>"},{"id":"SAR04","order":4,"q_ref":"10S.4","t":"Lifesaving Rules And Exclusion Zones","b":"<p class=\"hb-lead\">The Lifesaving Rules are the small set of things that must never be broken. To score a 10 you need every rule area briefed and displayed, everyone including agency and subcontract staff told the rules are absolute, exclusion zones planned rather than agreed on the day, and interventions welcomed.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Brief Every Rule Area, Not the Familiar Ones<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Rail's Lifesaving Rules cover working responsibly, working with electricity, driving, working at height, and working with moving equipment.<\/strong><\/p>\n<p class=\"hb-p\">Suppliers routinely brief the two or three that feel relevant to their discipline and skip the rest. Driving in particular is often omitted, and it kills people in this industry.<\/p>\n<ul class=\"hb-ul\"><li>Plans and permits in place before starting a job or going on or near the line<\/li><li>Equipment fit for its intended purpose<\/li><li>Never undertaking a job without being trained and assessed as competent<\/li><li>Never working or driving under the influence of drugs or alcohol<\/li><li>Testing before applying earths or straps, and never assuming equipment is isolated<\/li><li>No hand-held or hands-free phone use or device programming while driving<\/li><li>Speed limits and seat belts<\/li><li>Safety harness at height unless other protection is in place<\/li><li>Never entering the agreed exclusion zone unless directed by the person in charge<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Say That They Are Absolute<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Rail's poster states that these Rules are in place to keep us safe and must never be broken, and that we will all personally intervene if we feel a situation or behaviour might be unsafe.<\/strong><\/p>\n<p class=\"hb-p\">Both halves matter. Absolute, and everyone intervenes. A rule presented as strong guidance will be weighed against programme pressure at three in the morning, and it will lose.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Plan Exclusion Zones, Do Not Improvise Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The rule is: never enter the agreed exclusion zone, unless directed to by the person in charge.<\/strong><\/p>\n<p class=\"hb-p\">That only works if the zone was agreed in advance and someone is clearly in charge of it.<\/p>\n<ul class=\"hb-ul\"><li>Define exclusion zones as part of the work plan, not on the night<\/li><li>Name who controls entry, and make sure everyone knows who that is<\/li><li>Brief it to everyone on site, including visitors and subcontractors<\/li><li>Make the zone physically obvious where you can<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Cover Everyone on Site<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Agency and subcontracted staff, at induction and at the pre-work briefing<\/li><li>Visitors, including client representatives<\/li><li>Delivery drivers and plant operators, who are often missed<\/li><li>Anyone joining part way through a shift<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Welcome Interventions and Fix the Conditions<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end leaders visibly model the rules, interventions are welcomed and recorded, and findings are used to remove the conditions that put people in breach.<\/strong><\/p>\n<p class=\"hb-p\">Record interventions as a positive indicator rather than counting breaches as a negative one. Then ask why someone was in a position to breach: unrealistic programme, poor lighting, or a worksite layout that made the exclusion zone impractical are the usual answers, and all three are yours to fix.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: These rules exist because each one has already killed someone in this industry. They are the shortest, clearest safety document your workforce will ever be given.<\/strong><\/p>"},{"id":"SAR05","order":5,"q_ref":"10S.5","t":"Asset Protection Engagement And Agreement","b":"<p class=\"hb-lead\">Asset protection engagement decides whether a scheme runs or stalls. To score a 10 you need the classification established before design, a formal initial enquiry at concept stage, the right agreement identified, and the risks the default allocation places on you priced and on your risk register.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Establish Which Route You Are On<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Rail's standard defines a Third Party as an organisation, other than Network Rail, intending to undertake works which will physically change or impact the operation, assets, design or other functionality of Network Rail's infrastructure. A separate standard covers outside party works.<\/strong><\/p>\n<p class=\"hb-p\">The classification determines the engagement route, the agreement type and the risk allocation, so getting it wrong at the start propagates through everything.<\/p>\n<ul class=\"hb-ul\"><li>Check each scheme against the published definitions<\/li><li>Record the classification and the basis for it<\/li><li>Confirm it with the asset protection team rather than assuming<\/li><li>Re-test it at each significant scope change<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Engage at Concept, Not at Design Freeze<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The guidance records that the asset protection team will advise an outside party to complete and submit an initial enquiry questionnaire via the customer portal.<\/strong><\/p>\n<p class=\"hb-p\">Submit it at concept stage, with location, scope and drawings, and record the reference and the assigned contact.<\/p>\n<p class=\"hb-p\">Engaging after your design and programme are fixed is the most expensive point at which to discover what asset protection requires, because the only remaining options are delay or redesign.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Identify the Right Agreement<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">There is a family of template agreements rather than one form. The guide describes, among others, a simple agreement for straightforward, low risk customer-led work on the controlled railway infrastructure, where Network Rail facilitates the project through asset protection.<\/p>\n<ul class=\"hb-ul\"><li>Understand which agreements exist and what distinguishes them<\/li><li>Identify the likely form early, based on who is delivering and the scale and risk<\/li><li>Do not simply sign what arrives<\/li><li>Get named commercial ownership of the choice<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Work Through the Risk Allocation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The default risk allocation is designed so that the consequences of any project risk would be felt by the party best able to mitigate or control the risk.<\/strong><\/p>\n<p class=\"hb-p\">That is a principle, not a promise that the allocation suits you. Work through it line by line.<\/p>\n<ul class=\"hb-ul\"><li>Identify which risks sit with you under your agreement type<\/li><li>Price them, and put them on the risk register with values<\/li><li>Decide which you can genuinely mitigate<\/li><li>Flow the relevant obligations down to your own supply chain<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Make It a Gate and Learn From It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end early engagement is a fixed gate in the scheme lifecycle, agreement selection is commercially owned, and risk allocation is reviewed at leadership level.<\/strong><\/p>\n<p class=\"hb-p\">Maintain relationships with route asset protection teams between projects, not only during them, and feed realised risks back into how you price the next scheme.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Asset protection is not an approval you obtain at the end. It shapes what is buildable, when, and at whose risk — and every week of delay in engaging costs more than the week before.<\/strong><\/p>"},{"id":"SAR06","order":6,"q_ref":"10S.6","t":"Restrictions Of Use And Access Planning","b":"<p class=\"hb-lead\">Track access is not booked, it is created by restricting the use of the network, and that is planned to a national timetable. To score a 10 you need to work to the planning stages, shape your method around the access that is actually published, and drive short-notice requests down.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand Where Access Comes From<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Code Part D records that its procedures are designed to facilitate the planning of Network Rail Restrictions of Use at least twelve weeks prior to the start of each Timetable Week.<\/strong><\/p>\n<p class=\"hb-p\">Your worksite access is the output of a timetabling process that balances your work against train services. It is not a booking system and it does not respond to urgency in the way a contractor expects.<\/p>\n<p class=\"hb-p\"><strong>Understanding that changes how you plan, and it changes how you talk to your client.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Read What Is Actually Published<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The Engineering Access Statement is defined in Part D as setting out, for any part of the network, the location, number, timing and duration of Restrictions of Use, read alongside the Timetable Planning Rules.<\/p>\n<ul class=\"hb-ul\"><li>Ask, for each scheme, what access opportunities are published for that part of the network<\/li><li>Find out what the normal pattern of access is on that route<\/li><li>Understand what is realistically available before you promise a programme<\/li><\/ul>\n<p class=\"hb-p\">Most disappointment about access comes from never having looked at what was on offer.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Design the Method Around the Access<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The access shapes the method, not the other way round.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Break the work into units that fit the available windows<\/li><li>Plan set-up and clear-down as part of the window, not around it<\/li><li>Consider whether a different method needs less disruptive access<\/li><li>Be honest about how much productive time a window actually yields<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Work to the Stages<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Set your programme dates around the planning stages, not around your preference<\/li><li>Know which stage you are at for each access requirement<\/li><li>Track each requirement through the stages<\/li><li>Settle requirements early enough to enter the process comfortably<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Reduce Short-Notice Requests and Influence the Future<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end short-notice requests are treated as an exception you measure and reduce, and you raise future requirements in time to influence the next revision.<\/strong><\/p>\n<p class=\"hb-p\">Short-notice access is expensive, unreliable and damages your standing with the people who allocate it. Measuring how often you need it is usually enough to start reducing it.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Access is the scarcest resource on the railway and the one your programme depends on entirely. Suppliers who understand how it is created get more of it than those who simply ask for more.<\/strong><\/p>"},{"id":"SAR07","order":7,"q_ref":"10S.7","t":"Possession And Worksite Arrangements","b":"<p class=\"hb-lead\">Possession and worksite arrangements settled on the night are the ones that go wrong. To score a 10 you need them planned and documented, a fallback for access you do not get, competent planners producing the plans, and a review afterwards against what actually happened.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know How Possessions Are Confirmed<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The asset protection agreement template records that once a proposed Possession Plan is established, Network Rail will undertake consultation on behalf of the customer in accordance with Part D of the Network Code to gain approval for the relevant possessions.<\/strong><\/p>\n<p class=\"hb-p\">So your possessions are consulted on, not granted on request. Follow the consultation rather than waiting to be told, and know where each of your requirements has reached.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Always Hold a Fallback<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Possessions are altered and cancelled routinely. A programme with no alternative is a programme that fails on the first change.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Hold a revised programme option for the loss of each critical possession<\/li><li>Know which work could be brought forward or deferred<\/li><li>Know what you would do with the resource already booked<\/li><li>Plan your response to cancellation before it happens, not on the night<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Document the Arrangements Properly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Where the work involves mobile operated plant, the relevant code of practice requires that, taking account of work activities and plant requirements including access arrangements, the arrangements are determined so that protection is suitable for the work and the site.<\/p>\n<p class=\"hb-p\">Whatever the work, document:<\/p
