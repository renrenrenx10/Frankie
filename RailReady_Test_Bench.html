ve supervisors something to look at and somewhere to record it:<\/p>\n<ul class=\"hb-ul\"><li>A short workplace inspection or process check sheet<\/li><li>A defined frequency, so it survives a busy week<\/li><li>A place to record what was found and what was done<\/li><li>A route for anything they cannot fix themselves<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Close the Loop<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Findings that go nowhere teach supervisors that looking is pointless.<\/strong><\/p>\n<p class=\"hb-p\">Track what supervision raises alongside your other findings, and make sure at least some of it visibly changes a process, a tool or a work instruction. Then tell the supervisor who raised it.<\/p>\n<p class=\"hb-p\">Be able to point at one process change and trace it back to a supervisory observation.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Develop the Non-Technical Skills<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Most supervisors are promoted for technical ability and then asked to coach, challenge and have difficult conversations. Those are separate skills and they can be taught.<\/p>\n<ul class=\"hb-ul\"><li>Coaching and giving feedback<\/li><li>Challenging upwards without confrontation<\/li><li>Running an effective briefing<\/li><li>Recognising fatigue and pressure in their team<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Supervisors are the only management layer most of your workforce experiences directly. If supervision is stretched thin or purely administrative, everything above it is theory.<\/strong><\/p>"}]},"human_perf":{"color":"#a78bfa","label":"Human Performance","order":5,"chapters":[{"id":"HUP01","order":1,"q_ref":"5.1","t":"Competence Management System","b":"<p class=\"hb-lead\">A pile of certificates is not a competence management system. To score a 10 you need a system built from the activities you carry out and the risks they carry, with performance monitored and reassessed, sub-standard performance managed, and the system itself verified and audited.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Start From Activities and Risk, Not From Courses<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's guidance sets out fifteen principles across five phases, and the first phase is establishing requirements: identify activities and assess risks, then select standards.<\/strong><\/p>\n<p class=\"hb-p\">Note that competence and fitness are required by the Railways and Other Guided Transport Systems (Safety) Regulations 2006 in Part 4 on safety critical work — this is a legal duty, not good practice.<\/p>\n<ul class=\"hb-ul\"><li>List the activities your people actually perform<\/li><li>Assess which carry safety or quality risk, and how much<\/li><li>Set the standard competence will be measured against for each<\/li><li>Then decide what training and assessment delivers it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Design the System Before You Run It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Phase two covers developing procedures and methods, deciding how to meet the standards, establishing requirements for training, development and assessment, and maintaining managers' competencies.<\/p>\n<p class=\"hb-p\"><strong>That last one is the most commonly missed. Assessors and managers need maintained competence too, and an assessor whose own competence has lapsed invalidates everything they signed.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Control What People Are Allowed to Do<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Phase three is implementation: select and recruit, train, develop and assess, and control activities undertaken.<\/p>\n<ul class=\"hb-ul\"><li>An authorisation record saying what each person may do, not just what they have been trained in<\/li><li>A check before a task that the person is authorised for it<\/li><li>A defined route for someone working under supervision toward authorisation<\/li><li>Removal of authorisation when it lapses, automatically rather than by memory<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Monitor, Reassess and Manage Shortfalls<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Phase four is where most systems stop. Monitoring and reassessing performance, updating competence, managing sub-standard performance, and keeping records.<\/strong><\/p>\n<p class=\"hb-p\">Have a defined, fair route for sub-standard performance that is not automatically disciplinary. Most competence shortfalls are training or supervision problems, and treating them as conduct problems drives them underground.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Audit the System Itself<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Phase five is verify, audit and review the system, and it is the difference between a 7 and a 10.<\/p>\n<ul class=\"hb-ul\"><li>Audit whether assessments are being done properly, not just whether they exist<\/li><li>Check that records match reality on the floor<\/li><li>Review the system when work, technology or organisation changes<\/li><li>Include non-technical skills — communication, situational awareness, decision making — which ORR's 2016 edition specifically emphasises<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Competence is a legal requirement for safety critical work and the thing every rail customer probes first. A system of certificates without assessment behind it fails on contact.<\/strong><\/p>"},{"id":"HUP02","order":2,"q_ref":"5.2","t":"Human Factors And Error Prevention","b":"<p class=\"hb-lead\">Human error is a predictable consequence of how work is set up, not a character flaw. To score a 10 you need error considered when procedures, tasks and equipment are designed, investigations that reach underlying causes, and trend analysis that treats error as a system output.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Adopt the Principle<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's guidance on applying human factors within safety management systems states principle P2.1: identify underlying causes that influence human performance and do not focus solely on an individual's actions.<\/strong><\/p>\n<p class=\"hb-p\">That is the whole discipline in one sentence. Everything else follows from taking it seriously.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Design Error Out, Rather Than Training It Out<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The guidance covers applying human factors in the design and re-design of procedures, systems, tasks and equipment, and in supporting change management.<\/p>\n<ul class=\"hb-ul\"><li>Make the right action the easy action, and the wrong one difficult<\/li><li>Remove look-alike parts, ambiguous labelling and mirror-image assemblies<\/li><li>Write procedures in the order the work is done, not the order the engineer thought of it<\/li><li>Consider the environment: lighting, noise, interruption, time pressure<\/li><\/ul>\n<p class=\"hb-p\"><strong>A control that depends on someone being careful is not a control.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Bring Human Factors Into Change<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Change is where error risk spikes and where it is least often assessed. When you introduce a new process, tool or system, ask what it makes harder, not only what it makes better.<\/p>\n<ul class=\"hb-ul\"><li>What has to be remembered that did not before<\/li><li>What now looks similar to something else<\/li><li>Who has to work differently, and have they been involved<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Investigate Past the Individual<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>If an investigation concludes with what someone did, it has stopped one step early.<\/strong><\/p>\n<p class=\"hb-p\">Use a structured approach and identify the factors that influenced performance. The rail industry's ten incident factors approach exists for exactly this.<\/p>\n<ul class=\"hb-ul\"><li>What made the error likely, or easy<\/li><li>What defences should have caught it and did not<\/li><li>Would a competent colleague have done the same<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Trend, Involve and Learn From Success<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you look across incidents for trends in underlying causes, involve front-line staff in safety decision making, and learn from what goes well.<\/strong><\/p>\n<p class=\"hb-p\">That last one is unfamiliar but powerful: studying why work normally succeeds tells you what your people are quietly compensating for, which is the failure waiting to happen.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: You cannot train people out of being human. The organisations with the fewest errors are not the ones with the most careful people; they are the ones whose work is designed so care is not the last line of defence.<\/strong><\/p>"},{"id":"HUP03","order":3,"q_ref":"5.3","t":"Fatigue Policy And Ownership","b":"<p class=\"hb-lead\">Fatigue is a risk you manage or a risk you carry. To score a 10 you need a written policy that says what you will do, who will do it and how, an explicit position on what happens when someone is too tired to work safely, and director ownership with staff consultation behind it.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Write the Policy the Guidance Describes<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's guidance states that the purpose of a Fatigue Policy is to set out a dutyholder's intention regarding their aims for managing fatigue, what they will do, who will do it and how they will do it.<\/strong><\/p>\n<p class=\"hb-p\">Four questions. Answer all four explicitly rather than producing a general statement about wellbeing.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Say What Happens When Someone Is Too Tired<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is the clause that makes the policy real, and the one most often missing.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>What a person should do if they believe they are too tired to work safely<\/li><li>What their manager must do in response<\/li><li>That making that call will not be penalised<\/li><li>Who decides, and who can be contacted if the manager is unavailable<\/li><\/ul>\n<p class=\"hb-p\">Without this, the decision falls to whoever is on shift, under pressure, with nothing to point at.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Name Responsibilities<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Who owns the policy<\/li><li>Who plans and approves rosters and overtime<\/li><li>Who monitors actual hours<\/li><li>Who can stand someone down, and who authorises replacement cover<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Communicate It Properly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A policy that lives on the intranet has not been communicated. Brief it, and brief the parts people care about: what will happen to them, and to their pay, if they raise fatigue.<\/p>\n<p class=\"hb-p\"><strong>People assume the worst unless told otherwise, and the assumption suppresses reporting.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Own It at Director Level and Extend It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end the policy is owned and signed at director level, consulted on with staff representatives, reviewed on a defined cycle, and extended to agency and subcontracted people.<\/strong><\/p>\n<p class=\"hb-p\">Fatigue does not respect the contract boundary and neither does the consequence. Someone who worked a shift for another employer before yours is your risk once they are on your premises.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Fatigue degrades exactly the capabilities rail work depends on: attention, judgement and the willingness to speak up. Unlike most hazards it is invisible until it produces an incident.<\/strong><\/p>"},{"id":"HUP04","order":4,"q_ref":"5.4","t":"Monitoring Actual Working Patterns","b":"<p class=\"hb-lead\">Rosters are designed within limits and then worked outside them. To score a 10 you need to measure what people actually worked including overtime and swaps, compare it against your own standards, and act on the exceedances rather than filing them.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Measure Actual, Not Planned<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's guidance states that to be effective, a fatigue risk management system should incorporate procedures for measuring and monitoring the levels of fatigue of actual, not only planned, working patterns.<\/strong><\/p>\n<p class=\"hb-p\">A compliant roster tells you what you intended. It tells you nothing about the person who covered two absences and a call-out.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Capture Everything That Adds Hours<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Overtime, planned and unplanned<\/li><li>Call-outs and callbacks<\/li><li>Shift exchanges and swaps between individuals<\/li><li>Cover for absence<\/li><li>Second jobs, where you can reasonably establish them<\/li><\/ul>\n<p class=\"hb-p\"><strong>Shift swaps are the biggest blind spot, because the roster still looks correct afterwards.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Set Your Own Limits and Mean Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Set limits appropriate to your work and write them down. Then enforce them.<\/p>\n<p class=\"hb-p\"><strong>A monitored limit that is never enforced is worse than no limit at all: it documents that you knew and did nothing.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Define what constitutes an exceedance<\/li><li>Define who is notified and what they must do<\/li><li>Record the action taken in each case, including where you accepted the risk and why<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Look for Patterns, Not Just Peaks<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A single long week is a manageable event. A pattern of them concentrated on a few individuals is a resourcing failure that will keep producing exceedances.<\/p>\n<ul class=\"hb-ul\"><li>Who is repeatedly exceeding, and why<\/li><li>Which areas or shifts generate the most overtime<\/li><li>Whether exceedances cluster around particular customers or deadlines<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Use a Tool and Report the Trend<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you track indicators over time and use a recognised fatigue assessment tool where the pattern of work warrants it.<\/strong><\/p>\n<p class=\"hb-p\">Track overtime, shift exchange, sickness absence and travel together — they move together and no single one tells the story. Report the trend to senior management so resourcing decisions are made with it in view.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Every serious fatigue-related incident is preceded by hours that somebody could have seen. The measurement is not the control, but nothing else works without it.<\/strong><\/p>"},{"id":"HUP05","order":5,"q_ref":"5.5","t":"Fatigue Reporting And Response","b":"<p class=\"hb-lead\">People will only tell you they are too tired if it is safe to do so. To score a 10 you need a stated non-punitive route including the right to ask for relief from duty, records of what was reported and done, and analysis that turns reports into roster and resourcing change.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. State the Non-Punitive Position Explicitly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's guidance describes a non-punitive fatigue reporting system as one that encourages staff to report instances when they feel excessively tired, and if necessary, request relief from duties.<\/strong><\/p>\n<p class=\"hb-p\">The guidance also states that fatigue should not be treated as sickness or subject to attendance at work processes, and that mutual trust is essential — staff must be confident that reporting will not result in being punished or losing pay.<\/p>\n<p class=\"hb-p\"><strong>Say all of that in writing. People will not infer it.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Include the Right to Ask for Relief<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Reporting tiredness is easy. Asking to be taken off the job is what people actually avoid, and it is the request that matters.<\/p>\n<ul class=\"hb-ul\"><li>Say clearly that relief from duty can be requested<\/li><li>Say who arranges cover<\/li><li>Say what happens to pay<\/li><li>Make sure the answer does not change depending on who is on duty<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Record and Respond<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Log every fatigue report and what was done<\/li><li>Give the person an answer<\/li><li>Watch for people who report once and never again — that usually means the response taught them not to<\/li><li>Track how long responses take<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Prompt for Fatigue in Every Investigation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Fatigue is rarely volunteered as a cause. It has to be asked about, every time.<\/strong><\/p>\n<p class=\"hb-p\">Put an explicit prompt in your incident and near miss investigation template, covering hours worked in the preceding days, travel, sleep opportunity and time of day. Asking only when fatigue looks obvious guarantees you find it only when it was severe.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Analyse and Change Something<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end reports and survey findings are analysed for common causes, results are fed back to staff, and roster or resourcing changes follow with senior management sighted.<\/strong><\/p>\n<p class=\"hb-p\">The feedback loop is what sustains reporting. If people report and nothing changes, the rate falls to zero and you lose the only early warning you had.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Fatigue reporting is a system that runs entirely on trust. Handle one report badly and you lose the next twenty, and you will never know what they would have told you.<\/strong><\/p>"},{"id":"HUP06","order":6,"q_ref":"5.6","t":"Manual Handling And Musculoskeletal Risk","b":"<p class=\"hb-lead\">Musculoskeletal injury is the quiet, cumulative cost of physical work. To score a 10 you need handling operations identified and assessed by observation, controls and aids provided, and — at the top end — cumulative exposure managed and handling designed out.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Avoid, Assess, Reduce<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's good practice guide advises assessing the risk of injury from manual handling that cannot be avoided, reducing the risk as far as possible, and observing each manual handling operation that takes place.<\/strong><\/p>\n<p class=\"hb-p\">Note the order. Avoid what you can first — a lift that never happens needs no assessment.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Assess by Watching, Not by Reading<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>What people actually do differs from what the method says, and the difference is where the injuries come from.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Go and watch the operation being performed, at the pace it is really done<\/li><li>Watch on more than one shift, and with more than one person<\/li><li>Note the workarounds — they usually mark where the design is wrong<\/li><li>Record what you observed, not what should happen<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Provide Aids That Suit the Actual Task<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Equipment that is slower than lifting will not be used, whatever the policy says.<\/p>\n<ul class=\"hb-ul\"><li>Choose aids for the real task, including access and space constraints<\/li><li>Put them where the work happens, not in a store<\/li><li>Train people to use them, and check they do<\/li><li>Maintain them, so they stay quicker than the manual alternative<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Manage Cumulative Exposure<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The heaviest single lift is rarely the injury. Repetition over a shift and a week is.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Look at total handling across a shift, not just peak weight<\/li><li>Consider rotation and task variety<\/li><li>Look at awkward posture and repetition, not only load<\/li><li>Pay attention to the tasks people describe as easy but do constantly<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Encourage Early Reporting, Then Design It Out<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Musculoskeletal damage announces itself as discomfort long before it becomes an injury, and discomfort is under-reported because it feels trivial.<\/p>\n<p class=\"hb-p\"><strong>Make it easy and normal to report discomfort, act when someone does, and use the reports to find the tasks worth engineering out through product, packaging or process change.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Musculoskeletal disorders are among the largest causes of lost time in the sector and one of the few risks that damages people gradually enough to be ignored until it is permanent.<\/strong><\/p>"},{"id":"HUP07","order":7,"q_ref":"5.7","t":"Drugs And Alcohol Arrangements","b":"<p class=\"hb-lead\">Drugs and alcohol arrangements are judged on the moment a manager has to make a decision. To score a 10 you need your own documented process rather than reliance on a customer's, the grounds for suspicion recorded with the worker before a test is arranged, and managers trained in the decision itself.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Hold Your Own Process<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Relying on a customer's policy leaves you unable to act on your own premises and unable to answer a qualification question.<\/strong><\/p>\n<p class=\"hb-p\">Cover the test types relevant to your work — typically pre-employment, for-cause, post-incident and, where applicable, random — and say who arranges each.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Record the Grounds Before You Decide<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Rail's briefing on its drugs and alcohol standard records that the responsible manager is required to complete the For-Cause Test Form with the worker and to document any grounds of reasonable suspicion prior to determining if a for-cause test is required.<\/strong><\/p>\n<p class=\"hb-p\">Prior to determining. The record is made before the decision, with the worker present, not reconstructed afterwards.<\/p>\n<ul class=\"hb-ul\"><li>Use a defined form<\/li><li>Record specific observations, not conclusions<\/li><li>Complete it with the worker, and let them respond<\/li><li>Keep it whatever the test result<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Train the People Who Make the Call<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A form does not make a decision. The manager does, usually once every few years, under pressure and with a colleague in front of them.<\/p>\n<ul class=\"hb-ul\"><li>Train responsible managers in the decision process and the form<\/li><li>Refresh it, because the skill decays<\/li><li>Make sure someone competent is always reachable<\/li><li>Rehearse it, so the first time is not the real time<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Cover Impairment More Broadly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Prescribed and over-the-counter medicines impair performance and are not covered by a drugs and alcohol test.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A declaration route for prescribed medication that does not require disclosing the condition<\/li><li>Advice on who assesses fitness for the specific task<\/li><li>A supportive route for someone with a dependency, distinct from the disciplinary route<\/li><li>Clarity that self-declaration will be handled fairly<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Keep It Current and Check Your Provider<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end arrangements are reviewed against each new issue of the applicable standard.<\/strong><\/p>\n<p class=\"hb-p\">Standards reissue and requirements change. Also verify your testing provider's assessed scope and accreditation are current — you are relying on their result to make a decision about someone's employment.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: This is the process most likely to be tested at the worst possible moment, by a manager who has never used it before, with a person's job and someone's safety on the outcome.<\/strong><\/p>"}]},"supply_chain":{"color":"#f59e0b","label":"Supply Chain Readiness","order":6,"chapters":[{"id":"SCR01","order":1,"q_ref":"6.1","t":"Supplier Selection And Approval","b":"<p class=\"hb-lead\">Your rail customer inherits whatever you let into your supply chain. To score a 10 you need a controlled approved supplier list, criteria proportionate to what each supplier provides, and approval decisions that are informed by how suppliers have actually performed rather than by how long you have used them.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Hold a Controlled Approved List<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS CORE audit protocols require selecting and approving suppliers from a controlled list before placing a contract, ensuring the supplier is competent and has the resource to carry out the work.<\/strong><\/p>\n<p class=\"hb-p\">'Controlled' means someone owns it, changes are recorded, and it is the only route in. The list should show:<\/p>\n<ul class=\"hb-ul\"><li>What each supplier is approved to provide, and what they are not<\/li><li>The date of approval and the next review<\/li><li>Insurance levels and expiry<\/li><li>Any conditions or limitations attached<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Make the Criteria Proportionate<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Assessing a stationery supplier as searchingly as a castings supplier wastes effort and teaches people to treat the process as paperwork.<\/p>\n<ul class=\"hb-ul\"><li>Band your suppliers by the risk of what they provide<\/li><li>Set the depth of assessment by band, and say so in the procedure<\/li><li>Assess capability, capacity, certification and past performance for the top band<\/li><li>Keep the bottom band genuinely light<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Check the Things Rail Customers Check<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocols call out specific checks that are easy to miss:<\/p>\n<ul class=\"hb-ul\"><li>Suppliers of designated services who are in an approved scheme, trade association or hold relevant approvals have live certification or accreditation in place<\/li><li>Suppliers hold the minimum insurance applicable to their scope<\/li><li>Overseas suppliers can meet UK regulatory requirements<\/li><li>Risk from modern slavery is not being introduced through the supply chain<\/li><li>Products and components procured are approved and fit for purpose<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Close the Back Door<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>An approved list that can be bypassed under time pressure is not a control.<\/strong><\/p>\n<p class=\"hb-p\">Configure your purchasing system so an order cannot be raised against an unapproved supplier, and define a documented, authorised exception route for the genuine emergency. Then review how often the exception is used — a rising count is telling you the list is too narrow or too slow.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Re-Approve, and Use Performance to Do It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocols require periodic review of supplier qualifications. At the top end, approval is risk-based and informed by evidence rather than by habit.<\/p>\n<ul class=\"hb-ul\"><li>Feed delivery, quality and non-conformance data back into the approval decision<\/li><li>Revisit banding when your rail scope changes<\/li><li>Develop suppliers who are close to the standard rather than only removing those below it<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Rail customers audit their supply chain through you. An unapproved supplier who ships a non-conforming part becomes your non-conformance, your recall and your reputation.<\/strong><\/p>"},{"id":"SCR02","order":2,"q_ref":"6.2","t":"Flow-Down Of Customer Requirements","b":"<p class=\"hb-lead\">Requirements that stop at your door are requirements your supplier cannot meet. To score a 10 you need formal flow-down proportionate to risk, acknowledgement that it was received, and evidence that you satisfied yourself the supplier can actually deliver against it rather than simply that you told them.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Put Requirements in the Purchase Document<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A part number is not a specification.<\/strong><\/p>\n<p class=\"hb-p\">Where the item matters, the order should carry everything the supplier needs to conform:<\/p>\n<ul class=\"hb-ul\"><li>The specification and its issue or revision<\/li><li>Inspection, test and acceptance requirements<\/li><li>Certification and documentation required with delivery<\/li><li>Traceability and marking requirements<\/li><li>Any customer-specific requirement that applies to that item<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Match the Depth to the Risk<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Full flow-down on every line is unsustainable and it dilutes attention. Band it, the same way you band supplier approval, and be generous at the top band.<\/p>\n<ul class=\"hb-ul\"><li>Safety-related and rail-specific items get the full package<\/li><li>Standard commercial items get standard terms<\/li><li>Say which is which in the procedure, so buyers are not deciding case by case<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Get and Keep the Acknowledgement<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS CORE protocols require the process to ensure all information shared is understood, and ISO/TS 22163 requires acknowledgement of purchase orders to be requested and the record retained.<\/strong><\/p>\n<p class=\"hb-p\">Ask for written acknowledgement, keep it, and treat a supplier who never acknowledges as a risk rather than as an administrative irritation.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Verify on the Way Back In<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Flow-down is only proven at goods inwards. Check that what arrived reflects what was specified:<\/p>\n<ul class=\"hb-ul\"><li>Does the certificate correspond to the item, and to the acceptance criteria you stated<\/li><li>Is the revision the one you ordered<\/li><li>Is the documentation complete enough to satisfy your own customer<\/li><\/ul>\n<p class=\"hb-p\">Record the check. A verification you cannot evidence did not happen as far as an assessor is concerned.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Reach the Second Tier Where It Matters<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you satisfy yourself that sub-suppliers can supply in accordance with the requirement, not just that your immediate supplier says so.<\/strong><\/p>\n<p class=\"hb-p\">RISQS AP-035 expects sub-suppliers in the supply chain to hold sufficient knowledge, commensurate with risk, of the main supplier's quality plan. For a critical item that means asking who actually makes it and whether they know what it is for.<\/p>\n<p class=\"hb-p\">Revisit flow-down whenever your customer changes a specification. A specification change that stops at your buyer is a recall waiting to happen.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Most supply chain failures are not refusals to comply. They are suppliers complying perfectly with a requirement nobody passed on.<\/strong><\/p>"},{"id":"SCR03","order":3,"q_ref":"6.3","t":"Monitoring Supplier Performance","b":"<p class=\"hb-lead\">Selecting a good supplier is the easy half. To score a 10 you need performance measured during and after the work, risk-based audit and inspection of the suppliers that matter, corrective actions tracked to closure, and post-contract reviews whose findings reach beyond the procurement team.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Measure the Right Things<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Delivery and price are the measures every organisation has. They are not the measures rail customers care about.<\/strong><\/p>\n<p class=\"hb-p\">Add the measures that predict a problem reaching your customer:<\/p>\n<ul class=\"hb-ul\"><li>Non-conformance rate and severity<\/li><li>Completeness and accuracy of certification and documentation<\/li><li>Response time and quality when a problem is raised<\/li><li>Repeat findings from one period to the next<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Audit and Inspect by Risk<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">RISQS CORE protocols require monitoring and measuring suppliers' performance during and after use, including risk-based planned general inspections of suppliers' premises and risk-based audits of their management systems.<\/p>\n<p class=\"hb-p\"><strong>Risk-based means you can explain why you audited that supplier and not another one.<\/strong><\/p>\n<p class=\"hb-p\">ISO/TS 22163 goes further, expecting defined criteria to audit external providers and the results of reviews used as the basis for setting the level of control applied.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Track Corrective Actions to Closure<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocols require recording and monitoring of any corrective actions raised at supply chain audits. Verify closure with evidence rather than accepting a supplier's confirmation.<\/p>\n<ul class=\"hb-ul\"><li>An action register per supplier, with owners and dates<\/li><li>Evidence of the fix, not a statement that it is fixed<\/li><li>Escalation when actions age<\/li><li>A route to remove a supplier who cannot close things out<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Hold Post-Contract Reviews and Circulate Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The protocols specifically require post contract reviews of supply chain performance and the results being communicated through the business.<\/strong><\/p>\n<p class=\"hb-p\">That last clause is the one organisations miss. A review that stays inside procurement does not stop engineering specifying the same supplier again next quarter.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Give Feedback and Develop<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">ISO/TS 22163 expects feedback to be given to the external provider on their performance, and regular joint performance reviews.<\/p>\n<ul class=\"hb-ul\"><li>Tell suppliers where they sit, good and bad<\/li><li>Agree improvement plans rather than issuing scores<\/li><li>Take action where technical or performance targets are missed<\/li><li>Keep the ranking current so purchasing decisions reflect it<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Supplier performance decays quietly. Without measurement you will discover it through your own customer, which is the most expensive possible way to find out.<\/strong><\/p>"},{"id":"SCR04","order":4,"q_ref":"6.4","t":"Control Of Contractors On Your Work","b":"<p class=\"hb-lead\">Visiting contractors do not know your hazards, and your people do not know theirs. To score a 10 you need induction, agreed interfaces and defined supervision for anyone working in your facility, plus an assessment of the new hazards their activity introduces — including what they leave behind.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Induct Them Into Your Hazards, Not Generic Ones<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's maturity model lists induction to site rules, procedures, hazards and emergency arrangements as a key feature of effective contractor control.<\/strong><\/p>\n<p class=\"hb-p\">A generic construction induction does not tell a visiting engineer about your particular hazards:<\/p>\n<ul class=\"hb-ul\"><li>Where the traffic routes and pedestrian segregation are<\/li><li>Which processes are running nearby and what they release<\/li><li>Your emergency alarm, muster points and who to call<\/li><li>Permit requirements and who issues them<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Agree Who Does What, Before They Arrive<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The maturity model calls for co-ordination between clients, contractors and sub-contractors covering who does what, when and how.<\/p>\n<ul class=\"hb-ul\"><li>Agree the interfaces in writing before the work starts<\/li><li>Say who isolates, who tests and who authorises return to service<\/li><li>Identify what your own people must stop doing while the work happens<\/li><li>Nominate a single point of contact on each side<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Name Who Supervises and Who Checks<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The maturity model expects supervision by a named person, including on-the-job supervision and checks of completed work.<\/strong><\/p>\n<p class=\"hb-p\">Both halves matter. Supervision during the task manages the risk; the check afterwards catches what was left behind or reassembled wrongly.<\/p>\n<p class=\"hb-p\">Record the check before the equipment goes back into use.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Assess the Hazards They Introduce<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">This is the step that separates a 7 from a 10. The maturity model asks for assessment of new hazards introduced by the activities of contractors, which could be direct, or indirect, such as latent faults left behind when a contractor completes work.<\/p>\n<ul class=\"hb-ul\"><li>What does their activity release, obstruct or disable while it is happening<\/li><li>What could be left incorrectly assembled, loose, or bypassed<\/li><li>Who else is affected, including people on other shifts<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Review the System, Not Just the Job<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The maturity model lists review of the contractor selection and management system as a key feature.<\/strong><\/p>\n<p class=\"hb-p\">Periodically look at the arrangements as a whole rather than at individual jobs: are inductions current, are interfaces agreed consistently, do checks actually happen, and is the same contractor causing the same problem repeatedly.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Visiting workers are consistently over-represented in serious incidents, because they are the only people on site who do not know how the place behaves.<\/strong><\/p>"},{"id":"SCR05","order":5,"q_ref":"6.5","t":"Intelligent Customer Capability","b":"<p class=\"hb-lead\">If you cannot challenge what you buy, you are relying on your supplier's judgement and calling it assurance. To score a 10 you need to know which bought-in items and outsourced processes carry the most risk, hold the technical knowledge to specify and accept them, and make sure that knowledge does not live in one person's head.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand What Intelligent Customer Means<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's maturity model states that maintaining a sound intelligent customer capability is essential, to ensure the organisation retains understanding and knowledge of the products or services being supplied by the range of contractors.<\/strong><\/p>\n<p class=\"hb-p\">It does not mean doing the work yourself. It means being able to write a specification that is right, recognise an answer that is wrong, and know which questions to ask.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Identify Where It Actually Matters<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">You do not need deep capability across everything you buy. Work out where a supplier's error would reach your customer:<\/p>\n<ul class=\"hb-ul\"><li>Safety-related items and materials<\/li><li>Outsourced special processes you cannot verify by inspection<\/li><li>Design or calculation you have subcontracted<\/li><li>Anything where you would struggle to say whether a concession request is acceptable<\/li><\/ul>\n<p class=\"hb-p\">Write that list down. It is the scope of the capability you need to hold.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Make Sure It Is Not One Person<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Capability that walks out of the door with one retirement is not organisational capability.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Document what that person knows, in a usable form<\/li><li>Build a genuine second person for each critical area<\/li><li>Record it in your competence system with succession noted<\/li><li>Use external technical support deliberately where you cannot justify holding it internally<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Put Technical People in the Room<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Intelligent customer capability is worthless if it is not consulted.<\/p>\n<ul class=\"hb-ul\"><li>Require technical sign-off as well as commercial sign-off on critical supplier selection<\/li><li>Involve technical staff in reviewing what was delivered, not just the paperwork<\/li><li>Give them standing to reject, not only to advise<\/li><\/ul>\n<p class=\"hb-p\">ISO/TS 22163 supports this, requiring evaluation of external providers to cover their people, infrastructure and processes rather than their certificates alone.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Plan It as a Capability<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end this is maintained deliberately rather than assumed.<\/strong><\/p>\n<p class=\"hb-p\">Review it whenever you outsource a new process, enter a new product area, or lose a key person. Use it to challenge suppliers constructively — a supplier who is asked good questions usually improves — rather than only to catch them out.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: The moment you cannot evaluate what you are buying, your quality system is only recording decisions that someone else made for you.<\/strong><\/p>"}]},"security_info":{"color":"#14b8a6","label":"Security of Information","order":7,"chapters":[{"id":"SOI01","order":1,"q_ref":"7.1","t":"Cyber Security Assurance","b":"<p class=\"hb-lead\">Cyber security is now a qualification question, not an IT question. To score a 10 you need a policy owned at the top, certification maintained where your customers expect it, and audits at a frequency set by risk rather than by habit — with findings closed and an improvement plan that looks forward rather than backwards.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Write the Policy the Scheme Expects<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-034 requires a policy that clearly identifies top-level management commitment to preventing breaches of data under the organisation's control, and its cyber security protocols.<\/strong><\/p>\n<p class=\"hb-p\">The protocol is specific about what that policy must contain:<\/p>\n<ul class=\"hb-ul\"><li>Committing investment and resource into preventing breaches and improving cyber resilience<\/li><li>Commitment to training and development of employees<\/li><li>Reporting breaches to relevant external authorities<\/li><li>The organisational position on bribery, ransoms and threats<\/li><li>Disciplinary action<\/li><\/ul>\n<p class=\"hb-p\">That last set is the one most policies omit. Decide your position on ransom payment before you need it.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Give It an Owner With Authority<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Name someone accountable who can actually spend money and stop a project. In a smaller business that is usually a director rather than an IT manager, and that is the right answer.<\/p>\n<ul class=\"hb-ul\"><li>Named in the policy<\/li><li>Reports to the senior team on a defined cycle<\/li><li>Has a budget line, however small<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Get the Technical Basics Right<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Cyber Essentials sets out the control themes that stop the large majority of commodity attacks. Whether or not you certify, work to them:<\/p>\n<ul class=\"hb-ul\"><li>Firewalls and secure configuration<\/li><li>User access control and separation of privilege<\/li><li>Malware protection<\/li><li>Security update management, applied within a defined period<\/li><li>Multi-factor authentication on anything internet-facing<\/li><\/ul>\n<p class=\"hb-p\"><strong>Most breaches at supplier scale are unpatched software and reused passwords, not sophisticated attacks.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Certify Where Your Market Requires It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">AP-034 covers management system certification, and contracts increasingly require Cyber Essentials, Cyber Essentials Plus or ISO 27001 by name. Treat certification as a commercial decision with a clear answer:<\/p>\n<ul class=\"hb-ul\"><li>Find out what your target customers actually require, and by when<\/li><li>Hold the certificate and the assessment findings together<\/li><li>Evidence that findings raised were actioned and closed, which is what assessors ask for<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Audit by Risk and Improve Forwards<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end, audits and management reviews run at a frequency set by risk and contract requirements, not annually by default.<\/strong><\/p>\n<p class=\"hb-p\">Track corrective actions to closure, and maintain an improvement plan with leadership support that takes account of new and emerging risks. A plan that only addresses the last incident guarantees you are always one step behind.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Your rail customer's asset data and your own design information both sit on your systems. A breach at supplier level is now a routine route into a major infrastructure owner, and buyers know it.<\/strong><\/p>"},{"id":"SOI02","order":2,"q_ref":"7.2","t":"Access To Information And Premises","b":"<p class=\"hb-lead\">This is the question that replaced personnel vetting, and it is better sourced than vetting ever was. To score a 10 you need access granted by role and withdrawn on leaving, an audit trail of who reached what, periodic review that actually removes redundant access, and a security culture that makes people challenge the unexpected.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Build an Access Governance Framework<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-034 requires a process for identifying and implementing a governance framework for access to systems, applications and data.<\/strong><\/p>\n<p class=\"hb-p\">In practice that is a role-based access matrix. Set out, for each role:<\/p>\n<ul class=\"hb-ul\"><li>Which systems and applications they need<\/li><li>Which data classifications they may reach<\/li><li>Who approves the grant<\/li><li>What happens on a role change, not just on leaving<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Work to Minimum Necessary Access<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocol requires assessing resource levels to ensure the minimum number of people have access to data and systems without it impacting service delivery. That balance is the point: security that stops delivery gets bypassed.<\/p>\n<ul class=\"hb-ul\"><li>Start from what the role needs, not from what the last holder had<\/li><li>Time-limit temporary elevations<\/li><li>Review anyone with administrator rights separately and often<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Identify Who Presents Risk, and Screen Accordingly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>AP-034 requires identifying the groups of people that present a risk to cyber security and data management, and identifying the security screening levels for specified work activities that is above the standard recruitment process requirements.<\/strong><\/p>\n<p class=\"hb-p\">That is the closest thing rail has to a vetting requirement, and it is activity-based rather than blanket. Decide which activities warrant more than a standard recruitment check, document the decision and the reasoning, and apply it consistently.<\/p>\n<p class=\"hb-p\">Note there is no general rail vetting standard. Do not invent one; justify what you do from the activity.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Log, Monitor and Actually Review<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocol requires logging and monitoring of those who access data and systems, and evidence of a tracking system for data and system access.<\/p>\n<p class=\"hb-p\"><strong>A review that never removes anything is not a review.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Run periodic access reviews with a named reviewer per system<\/li><li>Record what was removed, not just that a review happened<\/li><li>Reconcile the access list against the current payroll and contractor list<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Cover the Physical Side and the Culture<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">AP-034 section 4.5 covers physically protecting assets that present a cyber risk, including the areas where devices and hardware are stored, considering site layout, visibility, accessibility and personnel requirements.<\/p>\n<p class=\"hb-p\">The protocol also asks for implementation of a positive security culture. Technical controls fail quietly; a culture where people challenge an unescorted visitor or an unexpected request fails loudly, which is what you want.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Most data losses at supplier scale are not break-ins. They are people who kept access they no longer needed, or a visitor nobody challenged.<\/strong><\/p>"},{"id":"SOI03","order":3,"q_ref":"7.3","t":"Security Incident Response","b":"<p class=\"hb-lead\">Everyone believes they would cope with a breach until it happens on a Friday night. To score a 10 you need a documented incident plan covering detection, resolution and recovery, business continuity behind it, and evidence that you have exercised it and measured whether the changes you made afterwards actually worked.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Plan Detection as Well as Response<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-034 requires incident management including steps for detection, resolution and recovery, ensuring the detection levels are appropriate to the risks identified.<\/strong><\/p>\n<p class=\"hb-p\">Detection is the half most plans skip. If you only find out when a system stops working, you have already lost the window.<\/p>\n<ul class=\"hb-ul\"><li>Alerting on your critical systems, proportionate to their risk<\/li><li>A defined route for staff to report something suspicious quickly<\/li><li>Someone who actually looks at what the alerting produces<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Risk Assess Your Resource Needs in a Crisis<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocol requires risk assessing and identifying resource needs and availability in a crisis, factoring in personnel required, assets required, and the full scope of services carrying a breach risk.<\/p>\n<p class=\"hb-p\"><strong>Do this before you need it. Working out at 2am who has the authority to disconnect the network is how days get lost.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Sit Business Continuity Alongside It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">AP-034 requires business continuity arrangements as part of incident management. Decide what you would actually do without your systems:<\/p>\n<ul class=\"hb-ul\"><li>Which production or delivery activities can continue, and for how long<\/li><li>What paper or offline fallback exists<\/li><li>How you would keep supplying your customers<\/li><li>How long you can operate before it becomes a customer problem<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Say Who Communicates, to Whom, and by When<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Name the people and the timescales in the plan, not in a policy nobody opens.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Who decides that this is an incident<\/li><li>Who tells the customer, and when<\/li><li>Who reports to the relevant external authorities, and within what period<\/li><li>Who speaks publicly, and who must not<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Exercise It, Then Check the Fix Worked<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A plan that has never been tested is a document. Run a desktop exercise, capture the lessons, and fix them.<\/p>\n<p class=\"hb-p\"><strong>The protocol goes one step further than most organisations do: it requires monitoring and measuring all changes implemented following a breach or following recommendations.<\/strong><\/p>\n<p class=\"hb-p\">In other words, prove the fix worked, do not just record that you made it.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: The gap between organisations that recover from a cyber incident in days and those that take months is almost entirely preparation done beforehand.<\/strong><\/p>"},{"id":"SOI04","order":4,"q_ref":"7.4","t":"Supply Chain Cyber Risk","b":"<p class=\"hb-lead\">Your suppliers can reach your customer's data through you. To score a 10 you need to know which of them present cyber risk, set requirements proportionate enough that small suppliers can actually meet them, and keep the assurance live rather than checking once at onboarding.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Identify Who Actually Presents Risk<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-034 requires identifying the members of the supply chain that may present a risk to cyber security, ensuring to factor in the life cycle of products and services.<\/strong><\/p>\n<p class=\"hb-p\">That life cycle clause matters. Risk does not stop at purchase:<\/p>\n<ul class=\"hb-ul\"><li>Anyone hosting, processing or reaching your data or your customer's<\/li><li>Anyone supplying software, firmware or connected hardware<\/li><li>Anyone who provides support, updates or remote access<\/li><li>Disposal, where old equipment leaves with data on it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"
