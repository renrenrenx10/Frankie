border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Set Proportionate Contract Requirements<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Requirements a small supplier cannot meet do not improve security; they just get signed and ignored.<\/strong><\/p>\n<p class=\"hb-p\">AP-034 expects requirements to be justifiable, achievable and proportionate to the service, product or data involved.<\/p>\n<ul class=\"hb-ul\"><li>Tier your requirements the same way you tier approval<\/li><li>Ask for Cyber Essentials where it is reasonable, and something lighter where it is not<\/li><li>Include breach notification obligations and a timescale<\/li><li>Say what happens to your data at the end of the contract<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Assure It More Than Once<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A certificate checked at onboarding tells you about the day it was issued. Keep assurance live through routine audits or technical assessments.<\/p>\n<ul class=\"hb-ul\"><li>Re-check certification at renewal, in the calendar not by memory<\/li><li>Technical assessment for the suppliers with the deepest access<\/li><li>Hold the evidence where you can produce it at short notice for a customer spot check<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Manage the Interfaces You Create<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">AP-034 section 4.3 covers managing risk from supplied digital systems used or managed by multiple parties, including identifying who they interface with, the authority levels of the organisations involved, communication and co-ordination during implementation and delivery, a risk assessment identifying required controls, access requirements and restriction controls for each party, support arrangements, and reporting and escalation.<\/p>\n<p class=\"hb-p\"><strong>If you supply anything that connects to a customer system, this applies to you.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Act When Performance Falls Short<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Monitor and measure supplier performance and act where it falls short. Escalate, require improvement, and be willing to replace a supplier who cannot meet the requirements you set.<\/p>\n<p class=\"hb-p\"><strong>A requirement you never enforce becomes a requirement your supplier correctly ignores.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Attackers increasingly go after the smallest, least defended organisation with a connection to the target. In rail, that is frequently a tier three supplier who did not think they held anything valuable.<\/strong><\/p>"}]},"contracting":{"color":"#fb923c","label":"Contracting & Commercial","order":8,"chapters":[{"id":"CCF01","order":1,"q_ref":"8.1","t":"Contract And Scope Review Before Signature","b":"<p class=\"hb-lead\">Most contract losses are decided before signature. To score a 10 you need a documented review covering the form, options, client amendments, contract data and scope, briefed to the people who will deliver — and at the top end a governed sign-off whose findings shape the price.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Check the Contract Data Is Complete<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>NEC guidance notes that completion of the data in full, according to the Options chosen, is essential to create a complete contract.<\/strong><\/p>\n<p class=\"hb-p\">Gaps in contract data create ambiguity, not flexibility, and ambiguity is resolved later at the point of maximum disagreement.<\/p>\n<ul class=\"hb-ul\"><li>Are all the required entries populated<\/li><li>Are the named roles actually named<\/li><li>Are the periods and dates present<\/li><li>Is the scope document the one referred to<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Read the Amendments Hardest<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Standard terms are published and balanced. Amendments are where risk is transferred, and they are written by the party transferring it.<\/strong><\/p>\n<p class=\"hb-p\">Compare what you have been sent against the standard form and list every departure with a comment. Published amendment sets, such as the Crown Commercial Service and Infrastructure and Projects Authority standard boilerplate amendments for NEC4, are a useful benchmark for what is normal and what is not.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Interrogate the Scope<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Poor scope is the largest single source of dispute, and it is usually poor by omission.<\/p>\n<ul class=\"hb-ul\"><li>What is not said that you are assuming<\/li><li>Who provides what, and by when<\/li><li>What standard or specification applies, at which issue<\/li><li>What acceptance actually requires<\/li><li>Where the scope contradicts the drawings or the programme<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Brief the People Who Will Deliver It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Understanding held only by the person who signed is understanding that will not survive the first difficulty.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A short briefing covering the key obligations and deadlines<\/li><li>Who must be notified of what, and within what period<\/li><li>The specific things this contract does differently from your usual<\/li><li>Written down, so it survives a change of personnel<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Govern It and Look at the Portfolio<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end review is a governed step with a named sign-off, and its findings feed the price and the delivery plan rather than sitting in a file.<\/strong><\/p>\n<p class=\"hb-p\">Then look across contracts: senior management should periodically review the pattern of terms the business is accepting, because risk accepted one contract at a time accumulates into a position nobody chose.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Every hour spent before signature is worth ten after it. After signature you are negotiating from inside the position you accepted.<\/strong><\/p>"},{"id":"CCF02","order":2,"q_ref":"8.2","t":"Contract Form And Edition Awareness","b":"<p class=\"hb-lead\">Teams administer contracts from memory of the last one. To score a 10 you need the form, edition and options recorded for every contract, people working to the terms actually in use, and training and templates that make the right version the default.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Record What Actually Governs Each Contract<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>An NEC4 Option B contract states that the conditions of contract are the core clauses, the clauses for the main Option, the Option for resolving and avoiding disputes and the secondary Options of that named edition and date.<\/strong><\/p>\n<p class=\"hb-p\">That is four things to record, not one:<\/p>\n<ul class=\"hb-ul\"><li>The form and the edition, with its date<\/li><li>The main Option<\/li><li>The dispute resolution Option<\/li><li>The secondary Options selected, including any Z clauses<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Keep It Somewhere Your Teams Can Reach<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A contract register held by the commercial team does not help the person drafting a notice at short notice.<\/p>\n<ul class=\"hb-ul\"><li>One register, accessible to delivery as well as commercial<\/li><li>A column for each of the four items above<\/li><li>A link to the executed contract itself<\/li><li>Kept current when contracts are varied<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Know Where the Editions Differ<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Working to the wrong edition's defined terms and timescales is a common and avoidable way to lose entitlement.<\/strong><\/p>\n<p class=\"hb-p\">The terminology moves between editions — NEC3 refers to Works Information where NEC4 refers to the Scope — and so do some periods and processes. Someone who learned the older edition will use its vocabulary by habit.<\/p>\n<p class=\"hb-p\">Note this is one of the areas where published guidance is practitioner commentary rather than a standard, so treat detailed edition comparisons as informed opinion and check the contract itself.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Build It Into Templates<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The most reliable control is making the correct version the easy one.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Separate notice templates per edition, carrying the right defined terms<\/li><li>The register referenced from the template<\/li><li>Training that covers the differences, not just the current edition<\/li><li>A check before issue that the right template was used<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Document Any Agreed Variation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Where parties agree to work a legacy contract differently — commonly, adopting a newer edition's process on an older contract — document it formally.<\/p>\n<p class=\"hb-p\"><strong>Custom and practice is not a variation, and it evaporates the moment there is a dispute.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Contractual rights are lost by using the wrong form of words, to the wrong person, outside the right period. None of those failures are about the merits of your claim.<\/strong><\/p>"},{"id":"CCF03","order":3,"q_ref":"8.3","t":"Early Warning Of Problems","b":"<p class=\"hb-lead\">Early warning is the cheapest risk management the contract offers and the most under-used. To score a 10 you need matters notified as soon as you become aware, the register maintained and meetings attended, and leadership making clear internally that raising one is never penalised.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Notify on Awareness, Not on Certainty<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Waiting until you are sure is waiting until the options have gone.<\/strong><\/p>\n<p class=\"hb-p\">The point of early warning is joint mitigation while something can still be done. A matter that is certain is no longer an early warning; it is a problem report.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Use the Contractual Route<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A mention in a meeting is not a notice. Use the route and the form the contract specifies, to the person the contract names, within the period it sets.<\/p>\n<ul class=\"hb-ul\"><li>The right medium — a notice, not an email chain<\/li><li>The right recipient — the named role, not a friendly contact<\/li><li>A clear statement that this is an early warning<\/li><li>A record you can produce later<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Work the Register and the Meetings<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Under NEC4 the Project Manager revises the Early Warning Register to record the decisions made at each early warning meeting and issues the revised register to the Contractor within one week of the meeting.<\/strong><\/p>\n<p class=\"hb-p\">The value sits in that cycle, not in the notice. Attend the meetings, propose mitigations, and check the revised register reflects what was agreed.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Remove the Internal Penalty<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The reason people do not raise early warnings is that it looks like admitting a problem.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Say at leadership level that raising early warnings is expected<\/li><li>Never criticise someone for raising one that came to nothing<\/li><li>Ask about them in project reviews as a positive indicator<\/li><li>Watch for a project with no early warnings — that is a warning in itself<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Measure How Early You Actually Are<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you measure the gap between becoming aware and notifying, and work to shrink it.<\/strong><\/p>\n<p class=\"hb-p\">Record the date of awareness alongside the date of notification. The average tells you something real about your culture, and it improves quickly once people know it is measured.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Early warning is the mechanism that converts a dispute into a decision. Organisations that use it properly spend far less time in the argument that follows.<\/strong><\/p>"},{"id":"CCF04","order":4,"q_ref":"8.4","t":"Programme And Delivery Planning","b":"<p class=\"hb-lead\">A programme nobody accepted protects nobody. To score a 10 you need compliant submissions at the required interval with a narrative explaining what changed, non-response pursued contractually, and an accepted programme held at all times.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Submit What the Contract Asks For<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A bar chart is not a contract programme.<\/strong><\/p>\n<p class=\"hb-p\">Include the information the contract specifies, which typically covers planned completion, method statements and resources, float and time risk allowance, and the order and timing of the work and of what others must do.<\/p>\n<ul class=\"hb-ul\"><li>Check the required content list before each submission<\/li><li>Include what others have to provide, and when<\/li><li>Show float honestly rather than hiding it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Always Include a Narrative<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A short narrative explaining what changed and why is what usually secures acceptance.<\/strong><\/p>\n<p class=\"hb-p\">Without it, the reviewer has to reverse-engineer the differences from two versions of a programme, which takes time they do not have and produces rejection by default.<\/p>\n<ul class=\"hb-ul\"><li>What changed since the last accepted version<\/li><li>Why<\/li><li>What effect it has on completion<\/li><li>What you need from the other party<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Pursue the Response<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Under NEC4, within two weeks of the Contractor submitting a programme for acceptance the Project Manager notifies acceptance or the reasons for not accepting it.<\/p>\n<p class=\"hb-p\"><strong>If no response arrives, follow the contractual route rather than letting it lapse. An unanswered submission is not an accepted programme, and the difference matters enormously when you need to demonstrate delay.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Fix the Reasons for Rejection<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Repeated rejection usually means a systemic problem, not a difficult reviewer.<\/p>\n<ul class=\"hb-ul\"><li>Ask what specifically would make it acceptable<\/li><li>Fix the same issue at source rather than per submission<\/li><li>Where you disagree, say so in writing and record it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Align Your Internal Controls<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you aim to hold an accepted programme every period, review it with the customer, and keep internal project controls aligned to the accepted version.<\/strong><\/p>\n<p class=\"hb-p\">Where your internal reporting and your contractual programme tell different stories, you will end up defending both and believing neither.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: The programme is the instrument that proves delay and entitlement. Without an accepted one you are arguing about what should have happened, from memory.<\/strong><\/p>"},{"id":"CCF05","order":5,"q_ref":"8.5","t":"Managing Change And Its Cost","b":"<p class=\"hb-lead\">Change absorbed is margin donated. To score a 10 you need events notified within the contractual period, quotations submitted on time and priced on the correct basis, and the aged unresolved position visible to leadership.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Notify Within the Period, Every Time<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Some contracts bar a late claim outright. Missing the period can extinguish an otherwise good entitlement entirely.<\/strong><\/p>\n<p class=\"hb-p\">Diary the deadline from the date of awareness, not from when you got round to looking at it, and make notification someone's explicit responsibility rather than an assumed one.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Understand How the Process Runs<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Under NEC4, the Project Manager notifies the Contractor that the event is a compensation event and includes in the notification an instruction to the Contractor to submit quotations.<\/p>\n<p class=\"hb-p\"><strong>Know which events you must notify and which the other party notifies, because assuming the wrong one is how periods are missed.<\/strong><\/p>\n<p class=\"hb-p\">Published guidance also covers lack of response, time bars and deemed acceptances — mechanisms that can work for you or against you depending on whether you are watching.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Price on the Contractual Basis<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Not on actual cost recovered afterwards, and not on what feels fair.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Use the assessment basis the contract specifies<\/li><li>Be clear about the date at which the assessment is made, because that determines whose forecast applies<\/li><li>Include time as well as cost, and say so explicitly<\/li><li>Keep the build-up so it can be interrogated<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Close Them, Do Not Just List Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A register that grows is a dispute forming slowly.<\/p>\n<ul class=\"hb-ul\"><li>A regular commercial meeting whose purpose is closure<\/li><li>An agreed agenda working oldest first<\/li><li>Escalation when an event ages past a threshold<\/li><li>A decision to accept or reject, rather than perpetual clarification<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Report the Aged Position and Learn From It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end the age and value of unimplemented events is reported to leadership as a live exposure, and root causes feed back into bidding.<\/strong><\/p>\n<p class=\"hb-p\">Repeated change from the same cause usually means a scope you accepted too readily or an assumption you priced optimistically. That is a bidding lesson, not a commercial one.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Unresolved change is unfunded work you have already done. It converts into a final account argument where the evidence is old and the goodwill is gone.<\/strong><\/p>"},{"id":"CCF06","order":6,"q_ref":"8.6","t":"Contract Close Out","b":"<p class=\"hb-lead\">Contracts that never close consume cash, resource and attention indefinitely. To score a 10 you need close-out planned from award, completion requirements checked before certification, defect correction periods tracked, and lessons carried into the next contract.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know When Your Defect Obligation Starts and Ends<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Under NEC4 the Contractor corrects a notified Defect before the end of the defect correction period, which begins at Completion for Defects notified before Completion, and when the Defect is notified for other Defects.<\/strong><\/p>\n<p class=\"hb-p\">That means every notified defect has its own clock. Tracking one project-level date is not enough, and it is how organisations end up believing they are free of an obligation they still hold.<\/p>\n<ul class=\"hb-ul\"><li>Record the notification date for each defect<\/li><li>Record when its correction period began and ends<\/li><li>Track them individually, not as a batch<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Check What Completion Actually Requires<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Completion is defined by the scope, not by the work looking finished. Go and read what it says before you ask for certification.<\/p>\n<ul class=\"hb-ul\"><li>Documentation, records and certificates required<\/li><li>Testing, commissioning or acceptance activity<\/li><li>Handover or handback requirements<\/li><li>Anything the scope requires that is easy to leave until later<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Clear Change Before It Becomes a Final Account<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Outstanding compensation events settled at the end are settled with hindsight, less evidence and no leverage.<\/strong><\/p>\n<p class=\"hb-p\">Aim to arrive at completion with the change position substantially closed. What remains should be a short, well-documented list rather than a reconstruction.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Manage the Final Assessment and Retention<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Know when the Defects Certificate is due and what triggers it<\/li><li>Diary the final assessment date and prepare for it<\/li><li>Track retention release dates actively — nobody else will<\/li><li>Chase the final payment as a task with an owner<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Plan It From Award and Learn From It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end close-out requirements are identified at award, tracked through delivery, and reviewed at completion with lessons carried forward.<\/strong><\/p>\n<p class=\"hb-p\">Most close-out pain is caused by records that were never collected during delivery because nobody knew they would be needed. Identifying that on day one costs nothing.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: An open contract is working capital you cannot use and a liability you cannot quantify. The cost is invisible, which is exactly why it persists.<\/strong><\/p>"}]},"social_value":{"color":"#84cc16","label":"Social Value & Sustainability","order":9,"chapters":[{"id":"SVS01","order":1,"q_ref":"9.1","t":"Payment Performance Evidence","b":"<p class=\"hb-lead\">How quickly you pay your own supply chain is now a bid question with a number attached. To score a 10 you need measured payment performance over defined periods, and at the top end a leadership commitment that is tracked continuously and visible externally.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand That This Is a Condition, Not a Preference<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Cabinet Office prompt payment policy records that from 1 September 2019, any supplier bidding for a central government contract above five million pounds per year has needed to demonstrate that they have effective payment systems.<\/strong><\/p>\n<p class=\"hb-p\">Above certain values this stops being a virtue and becomes a gate. Network Rail's own strategic business plan also records a focus on timely payment to suppliers.<\/p>\n<p class=\"hb-p\">Find out which of your target contracts sit above the relevant threshold before you need the answer.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Measure the Right Number<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The question is what proportion of invoices you paid within your stated terms, over a defined period.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Set up the report so it can be produced on demand, not reconstructed<\/li><li>Measure by invoice count and by value<\/li><li>Keep historical periods, since bids often ask for a run of them<\/li><li>Know your average payment days as well as your compliance percentage<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Fix the Internal Causes<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Most late payment at supplier scale is not a cash decision. It is an approval step nobody owns.<\/p>\n<ul class=\"hb-ul\"><li>Where do invoices sit longest, and why<\/li><li>Is the delay in receipt, approval, or payment run timing<\/li><li>Are disputes being used as a reason to hold whole invoices<\/li><li>Does anyone own the metric<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Describe the System, Not Just the Result<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The policy guidance is about demonstrating an effective payment system. Be able to describe it:<\/p>\n<ul class=\"hb-ul\"><li>How invoices are received and matched<\/li><li>Who approves, within what timescale<\/li><li>How exceptions and queries are handled<\/li><li>Payment run frequency<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Publish It and Set a Target<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end fair payment is a leadership commitment, tracked continuously, published or externally recognised, with improvement targets set and acted on.<\/strong><\/p>\n<p class=\"hb-p\">Signing up to a recognised payment code, or publishing your performance, converts a compliance obligation into a competitive position — particularly with buyers who are themselves measured on how their supply chain is treated.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Buyers increasingly treat payment performance as a proxy for how you will behave generally. It is also one of the few bid answers that is a hard number you cannot dress up.<\/strong><\/p>"},{"id":"SVS02","order":2,"q_ref":"9.2","t":"Payment Terms And Disputes","b":"<p class=\"hb-lead\">Payment terms agreed after work starts are terms your supplier could not decline. To score a 10 you need terms agreed in writing before work begins, required terms flowed down unchanged, and prompt communication when payment will be late.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Agree Terms Before Work Starts<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The Fair Payment Code guidance requires organisations to establish clear and fair payment terms, ensuring their suppliers understand the payment terms laid out in their contracts, and to agree payment terms with suppliers and put them in writing, before work begins, in clear plain English contracts.<\/strong><\/p>\n<p class=\"hb-p\">Before work begins is the operative phrase, and it is the one broken most often on urgent orders.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Write Them in Plain English<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Terms a small supplier cannot understand are terms they cannot plan around.<\/p>\n<ul class=\"hb-ul\"><li>State the payment period in days and from what event<\/li><li>State what triggers the clock — receipt, acceptance, or a valuation<\/li><li>State what makes an invoice valid<\/li><li>Avoid making payment contingent on your own receipt of payment unless the contract genuinely permits it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Flow Required Terms Down Unchanged<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Where your own contract requires particular payment terms to be passed down, pass them down as they are.<\/strong><\/p>\n<p class=\"hb-p\">Extending terms as money moves down the chain is exactly the behaviour prompt payment policy exists to stop, and it is easy for a buyer to detect.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Tell People Early When Payment Will Be Late<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A supplier who is told is inconvenienced. A supplier who discovers it is damaged.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Notify before the due date, not after<\/li><li>Say when it will be paid<\/li><li>Give a route to escalate<\/li><li>Never use a minor query to hold an entire invoice<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Check the Tier Below and Review the Causes<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end this is embedded in contract management, lower tier payment is checked, and leadership reviews recurring causes.<\/strong><\/p>\n<p class=\"hb-p\">Ask whether money is reaching the organisations below your immediate suppliers, particularly small labour and materials providers. And review the causes of your own late payment — they are almost always internal process, not cash.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Your supply chain's financial stability is your delivery risk. A supplier who fails because of your payment behaviour fails on your contract.<\/strong><\/p>"},{"id":"SVS03","order":3,"q_ref":"9.3","t":"Social Value In Bidding","b":"<p class=\"hb-lead\">Social value commitments are now monitored through contract KPIs, so promising what you cannot deliver is a trap rather than a tactic. To score a 10 you need commitments planned before bidding, proportionate to your size, tracked through delivery, and known to whoever runs the contract.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know How It Will Be Policed<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>PPN 026, the Social Value Model, provides that in scope organisations should ensure that all social value commitments made by suppliers during the procurement process are appropriately monitored and measured via contractual mechanisms, for example key performance indicators, which are communicated to contract managers.<\/strong><\/p>\n<p class=\"hb-p\">The underlying duty on authorities sits in the Public Services (Social Value) Act 2012.<\/p>\n<p class=\"hb-p\">So a commitment made to win becomes a measured obligation. Bid accordingly.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Decide What You Can Deliver First<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Write the answer from what you will actually do, not from what scores well.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>What are you already doing that you have never claimed<\/li><li>What could you add at reasonable cost<\/li><li>What is specific to the community this contract affects<\/li><li>What would you be embarrassed to be measured on<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Be Proportionate<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A small supplier promising a large employment programme is not credible and will not be believed. Evaluators see a great many of these.<\/p>\n<p class=\"hb-p\"><strong>A modest, specific, evidenced commitment scores better than an ambitious vague one, and it survives the contract.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Hand It Over Properly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The single most common failure is that the delivery team never learns what the bid promised.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A handover note listing every commitment<\/li><li>The KPIs they will be measured against<\/li><li>Who owns each one<\/li><li>A reporting rhythm from the start, not from the first review<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Align to the Community and Feed It Back<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end outcomes are set at leadership level, aligned to the communities affected by each contract, measured continuously and fed back into future bids.<\/strong><\/p>\n<p class=\"hb-p\">Offering the same package everywhere is visibly generic. Ask what this particular scheme's neighbours would actually value, and let what worked shape the next bid so your commitments become more credible over time rather than more ambitious.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Social value is weighted in almost every public sector evaluation. Scoring nothing on it is a straightforward competitive loss; promising and failing is worse.<\/strong><\/p>"},{"id":"SVS04","order":4,"q_ref":"9.4","t":"Social Value Strategy And Competence","b":"<p class=\"hb-lead\">Social value without a strategy is a series of donations. To score a 10 you need documented objectives, allocated resource, and named people who understand the difference between activity and outcome — and at the top end it shapes how you buy, not just how you bid.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Meet the Scheme Expectation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-032 Sustainable Railways requires evidence that arrangements are in place to support social value initiatives.<\/strong><\/p>\n<p class=\"hb-p\">Arrangements means something structured. A record of charitable giving is not arrangements.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Write Objectives You Would Defend<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>What are you trying to change, and for whom<\/li><li>Why this rather than something else<\/li><li>What will be different in two years<\/li><li>How much are you prepared to spend on it<\/li><\/ul>\n<p class=\"hb-p\"><strong>Two or three real objectives beat a list covering every theme in the model.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Allocate Real Resource<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">An objective with no budget and no time allocated is a statement of intent.<\/p>\n<ul class=\"hb-ul\"><li>A budget line, however small<\/li><li>Named time, not goodwill in the evenings<\/li><li>A named owner with it in their objectives<\/li><li>Board or senior visibility<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Build the Competence<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's Social Value Competency Guide sets out what competence in this area looks like, including understanding the difference between activities, outputs, outcomes and impact.<\/strong><\/p>\n<p class=\"hb-p\">That distinction is what separates a credible claim from a list of good deeds, and it is learnable in an afternoon.<\/p>\n<ul class=\"hb-ul\"><li>Activity: what you did<\/li><li>Output: how much of it<\/li><li>Outcome: what changed for someone<\/li><li>Impact: what changed that would not have anyway<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Build It Into How You Buy<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end social value is embedded across the organisation, reviewed for social inequalities, built into purchasing, and promoted through your own supply chain.<\/strong><\/p>\n<p class=\"hb-p\">A manufacturer's biggest available social value lever is usually procurement: where you buy, and from whom. That costs nothing extra and it multiplies through the chain.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Buyers can tell within a paragraph whether social value is a strategy or a scrapbook. The second one scores badly and is hard to sustain.<\/strong><\/p>"},{"id":"SVS05","order":5,"q_ref":"9.5","t":"Evidencing Social Value Outcomes","b":"<p class=\"hb-lead\">Counting activity is not evidence of value. To score a 10 you need intended outcomes defined before you start, data collected against them, and at the top end an evaluation that asks whether the change can fairly be attributed to you and what it cost.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Learn the Four Levels<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's Social Value Competency Guide expects an understanding of the difference between activities, outputs, outcomes and impact in a social value context, and ways of assessing and evidencing them.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Activity — we ran a careers programme<\/li><li>Output — forty students attended<\/li><li>Outcome — six entered the industry<\/li><li>Impact — four of those would not have done so otherwise<\/li><\/ul>\n<p class=\"hb-p\">Most reporting stops at output. Buyers have started asking for outcome.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Define the Outcome Before You Start<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>You cannot evidence a change you did not decide to look for.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Write down the intended outcome, dated, before the activity<\/li><li>Say how you will know<\/li><li>Say who will collect the data<\/li><li>Agree it with the client where it is a contractual commitment<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Collect Both Kinds of Evidence<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Numbers show scale; accounts show meaning. You need both, and one without the other is unconvincing.<\/p>\n<ul class=\"hb-ul\"><li>Quantitative: how many, how much, over what period<\/li><li>Qualitative: what participants say happened<\/li><li>Follow-up at a later date, not just at the end of the activity<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Report Honestly, Including Shortfalls<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A candid account of a mixed result is more credible than an unbroken run of successes, and considerably more useful.<\/strong><\/p>\n<p class=\"hb-p\">Say what did not work and what you concluded. Evaluators read a great many social value reports and the uniformly positive ones stop registering.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Evaluate Attribution and Cost<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you ask whether the change can fairly be attributed to you, what it cost to achieve, and what should be repeated, scaled or stopped.<\/strong><\/p>\n<p class=\"hb-p\">Note that no published rail guidance on evaluating social value outcomes exists, so this expectation is drawn from the competency framework rather than a standard. Use a recognised general approach and be transparent about your method.<\/p>\n<p class=\"hb-p\">The point of asking is that it changes what you do next, which is what makes it a strategy rather than a report.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: The next question after 'what did you do' is always 'and did it work'. Organisations that cannot answer it lose the credibility their activity earned them.<\/strong><\/p>"},{"id":"SVS06","order":6,"q_ref":"9.6","t":"Environmental Management And Waste","b":"<p class=\"hb-lead\">An environmental policy is not an environmental management system. To score a 10 you need a defined scope, objectives you measure, a current compliance register and waste managed as a reduction target — with circular thinking in design and purchasing at the top end.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Build a System, Not a Statement<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-032 requires evidence that arrangements are in place to establish, maintain and continually improve on a management system required for managing environmental responsibilities.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A defined scope — what the system covers<\/li><li>Identified interested parties and what they require<\/li><li>Objectives with targets and data<\/li><li>A compliance register, current and reviewed<\/li><li>Internal audit and management review<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Know Your Biggest Impact<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Most organisations manage the impact that is easiest to measure rather than the one that matters most.<\/strong><\/p>\n<p class=\"hb-p\">Work through energy, materials, process emissions, water and waste and rank them honestly. Then set objectives against the top of the list, not the bottom.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Manage Waste as a Reduction Target<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">AP-032 covers zero waste. Treating waste purely as a disposal cost misses both the compliance exposure and the savings.<\/p>\n<ul class=\"hb-ul\"><li>Measure by stream, not as a single total<\/li><li>Start with process scrap and packaging, which are usually the largest and most controllable<\/li><li>Set a reduction target against a baseline<\/li><li>Track segregation and diversion from landfill<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Keep the Compliance Register Real<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Permits and consents, with expiry dates<\/li><li>Duty of care for waste leaving site<\/li><li>Storage of substances and secondary containment<\/li><li>Any discharge consents<\/li><li>Reviewed on a cycle, with a named owner<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Apply Circular Thinking and Look at Your Chain<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end the system is externally assured or independently audited, leadership-driven, and circular thinking is applied to what you design and buy.<\/strong><\/p>\n<p class=\"hb-p\">RSSB's Sustainable Rail Blueprint sets the sector direction on circular procurement. In practice that means designing so material can be recovered, specifying recycled content, and measuring your supply chain's environmental performance alongside your own.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Environmental questions now appear in qualification, tender and contract KPIs alike. A policy with nothing behind it fails all three at once.<\/strong><\/p>"},{"id":"SVS07","order":7,"q_ref":"9.7","t":"Carbon And Net Zero Management","b":"<p class=\"hb-lead\">Carbon is now a bid question and increasingly a contract condition. To score a 10 you need your emissions profile assessed, a documented plan with named ownership and a reduction strategy, and at the top end value chain measurement with independent verification.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Assess the Profile the Scheme Expects<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS AP-032 requires evidence that the supplier has assessed their own emissions profile, considering direct emissions from their operations, which are Scope 1, and those indirectly associated with their activities, which are Scope 2.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Scope 1 — fuel you burn: gas, process fuel, your own vehicles<\/li><li>Scope 2 — electricity and heat you buy<\/li><li>Scope 3 — everything else, including purchased materials and shipping<\/li><\/ul>\n<p class=\"hb-p\">Start with Scope 1 and 2. They are measurable from data you already hold.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Be Explicit About Boundaries<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A carbon number without a stated boundary is not a number, and an assessor will ask.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Which sites and entities are included<\/li><li>Which period it covers<\/li><li>What methodology and emission factors you used<\/li><li>What is excluded, and why<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Write a Plan With an Owner<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A measurement without a plan behind it satisfies nobody.<\/p>\n<ul class=\"hb-ul\"><li>A named owner with it in their objectives<\/li><li>Dated reduction actions, not aspirations<\/li><li>The expected saving from each<\/li><li>A monitoring method and reporting rhythm<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Start With the Actions That Pay for Themselves<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Early carbon reduction in manufacturing is usually also cost reduction, which makes it easy to fund.<\/p>\n<ul class=\"hb-ul\"><li>Lighting, compressed air leaks and heating controls<\/li><li>Machine idle time and out-of-hours load<\/li><li>Half-hourly data to find where consumption actually goes<\/li><li>Renewable procurement, once you have reduced demand<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Extend Into the Value Chain and Verify<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end emissions are measured across operations and value chain, independently verified, and progress reported transparently.<\/strong><\/p>\n<p class=\"hb-p\">For a manufacturer the largest share of the footprint usually sits in purchased materials, so a first estimate of that matters more than a perfect Scope 1 figure. Report progress openly, including where you are behind.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Rail customers have their own carbon targets and increasingly need supplier data to meet them. Suppliers who cannot provide it become an obstacle to something their customer is measured on.<\/strong><\/p>"}]},"product_assurance":{"color":"#ec4899","label":"Product Assurance & Conformity","order":10,"chapters":[{"id":"PAC01","order":1,"q_ref":"10M.1","t":"Knowing What Needs Acceptance","b":"<p class=\"hb-lead\">You cannot sell a product onto the network that is not allowed on it. To score a 10 you need every product line assessed against the published guidance, the conclusion recorded with its reasoning, and acceptance status tracked as part of your product data so a salesperson can see it before they promise anything.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand What Triggers Acceptance<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Rail's Product Acceptance Service Guidance Note defines Controlled Items as safety critical items for use on Network Rail operational infrastructure that require catalogue numbers for which Network Rail Engineering asserts control, and states that for any items in that category it is mandatory that the product acceptance process is followed.<\/strong><\/p>\n<p class=\"hb-p\">The related guidance note on how to decide what needs product acceptance lists categories of typically approved items and items that do not require approval, and notes that all new items and changes to approved products or systems must be submitted for assessment.<\/p>\n<p class=\"hb-p\"><strong>Note that word: changes. A modification to an accepted product needs assessing too.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Assess Every Product Line, and Record Why<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Take each product line in turn, not the range as a whole<\/li><li>Record the conclusion, the guidance relied on, and the date<\/li><li>Record the reasoning, so someone can check it later<\/li><li>Have someone technical sign it<\/li><\/ul>\n<p class=\"hb-p\">A conclusion without reasoning is an opinion that will not survive a change of personnel.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Ask When the Guidance Does Not Cover You<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The published lists are explicitly non-exhaustive, and additional guidance may be required from the product acceptance team or the relevant engineering function.<\/strong><\/p>\n<p class=\"hb-p\">Asking is free and the answer is definitive. Assuming is neither.<\/p>\n<p class=\"hb-p\">Note that criticality is determined by the Network Technical Head for the relevant engineering function, so the judgement is theirs rather than yours.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Watch the Boundary Cases<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Products used in a different application from the one accepted<\/li><li>Components inside an accepted assembly that you have re-sourced<\/li><li>Items you supply into someone else's accepted product<\/li><li>Products where the customer is not Network Rail but the asset is<\/li><\/ul>\n<p class=\"hb-p\"><strong>These are where suppliers discover the requirement late, usually on site.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Track It in Your Product Data<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end acceptance status sits alongside the rest of your product information and informs development decisions.<\/strong><\/p>\n<p class=\"hb-p\">Criticality determines the assurance you will have to fund, so knowing it early changes the business case. Reassess whenever a product changes or is proposed for a new application, and make the status visible to the people who quote.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Discovering that a product needs acceptance after you have won the order is one of the most expensive mistakes available in rail supply, because the lead time cannot be compressed.<\/strong><\/p>"},{"id":"PAC02","order":2,"q_ref":"10M.2","t":"The Product Acceptance Process And Sponsorship","b":"<p class=\"hb-lead\">A manufacturer cannot apply for product acceptance on its own behalf. To score a 10 you need to understand the sponsor route, have sponsors identified before you need them, hold evidence packs ready, and build acceptance lead time into product and commercial planning.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Sponsor Role<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Rail's guidance for product acceptance sponsors records that the role of the Product Acceptance Sponsor is to act as the Applicant, and that a Sponsor may seek out a manufacturer who has a product which needs acceptance, or be contacted by a manufacturer requesting their assistance as a Sponsor.<\/strong><\/p>\n<p class=\"hb-p\">So the application is not yours to make. Your job is to be worth sponsoring and to supply what the sponsor needs.<\/p>\n<p class=\"hb-p\">The Sponsor is responsible for submitting the initial application, liaising with and requesting evidence from manufacturers against the generic and technical requirements, and liaising with the regions to arrange any required trials.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Identify Sponsors Before You Need Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Contractors and asset owners who already use products like yours<\/li><li>Engineering functions with an interest in the asset type<\/li><li>Existing customers who would benefit from your product being accepted<\/li><li>People who have sponsored an application before and know the process<\/li><\/ul>\n<p class=\"hb-p\"><strong>A sponsor relationship built during a live opportunity is a relationship built under time pressure.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Know What Determines the Assurance Burden<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Criticality is determined by the Network Technical Head, and it dictates the level of assurance required, including whether a trial is necessary and whether a System Review Panel must be convened. Where a trial is needed, the Common Safety Method for risk evaluation and assessment is applied.<\/p>\n<p class=\"hb-p\"><strong>That means the cost and duration of acceptance are set by someone else's judgement of your product's criticality, not by your own view of it.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Keep an Evidence Pack Ready<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Expect requests against both generic and technical requirements. Assemble in advance:<\/p>\n<ul class=\"hb-ul\"><li>Technical specification, drawings and design substantiation<\/li><li>Test and type approval evidence<\/li><li>Reliability, availability, maintainability and safety information<\/li><li>Quality system evidence and manufacturing controls<\/li><li>Installation, maintenance and disposal information<\/li><li>In-service history where you have it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Plan the Lead Time Into the Business<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end acceptance timescales are built into product and commercial planning rather than discovered late.<\/strong><\/p>\n<p class=\"hb-p\">Put acceptance milestones in the product development plan ahead of the sales launch date, and manage sponsor relationships the way you manage customer relationships — because that is what they are.<\/p>\n<p class=\"hb-p\">Note that the governing standard, NR/L2/RSE/100/05, sits behind this guidance. Read it via the standards portal, which is free.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Product acceptance is the gate between having a good product and being allowed to sell it. Suppliers who treat it as paperwork discover it is a programme.<\/strong><\/p>"},{"id":"PAC03","order":3,"q_ref":"10M.3","t":"Rail Quality Management System","b":"<p class=\"hb-lead\">Rail customers expect more of a quality system than ISO 9001 asks for. To score a 10 you need to know what the rail sector standard adds, close those gaps in your own system whether or not you certify, and — where your market justifies it — hold the certification your customers are told to look for.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know What the Sector Standard Adds<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The rail quality management standard is ISO 9001 plus particular requirements for the rail sector. The additions are the parts your customers actually ask about:<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Tender and project management, including cost, time, risk and procurement management<\/li><li>Configuration management and change control<\/li><li>Special processes — those you cannot verify by inspecting the output<\/li><li>First article inspection<\/li><li>Obsolescence management and life cycle costing<\/li><li>RAMS: reliability, availability, maintainability and safety<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Understand Why Your Customers Ask<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">ISO/TS 22163:2017 requires evaluation of external providers to include the availability of their qualifications, giving certificates such as ISO 9001 or that document as examples, and requires organisations to maintain a strategy targeting providers compliant to it or to a similar quality management system.<\/p>\n<p class=\"hb-p\"><strong>In other words your customers are directed to prefer suppliers who hold it. That is a commercial fact whatever you think of the standard.<\/strong><\/p>\n<p class=\"hb-p\">Note that ISO 22163:2023 supersedes the 2017 edition. The clause structure is unchanged in the areas that matter here, but work to the current edition.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Do a Gap Analysis Even If You Will Not Certify<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Certification is optional. The capability is not, if you want to supply rolling stock or infrastructure componen
