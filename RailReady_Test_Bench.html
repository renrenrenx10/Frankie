ts.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Map each additional requirement against what you already do<\/li><li>Mark it present, partial or absent, honestly<\/li><li>Put an owner and a date against the gaps<\/li><li>Close the ones that carry customer risk first<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Decide Certification as a Commercial Question<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Which of your target customers require or prefer it<\/li><li>What it costs, including internal preparation time<\/li><li>What work it would open that is currently closed<\/li><li>Whether an alternative, such as demonstrating equivalence, is accepted<\/li><\/ul>\n<p class=\"hb-p\">If you certify, be aware there is a performance grading layer above simple certification, which some customers use. Understand it before you claim anything about your grade.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Use the System, Do Not Just Hold It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you use the performance data the system generates in customer conversations.<\/strong><\/p>\n<p class=\"hb-p\">A supplier who can show trend data on first-pass yield, non-conformance and on-time delivery is having a different conversation from one presenting a certificate.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Rail buyers are explicitly steered towards suppliers with sector quality credentials. Not holding them is survivable; not having the underlying capability is not.<\/strong><\/p>"},{"id":"PAC04","order":4,"q_ref":"10M.4","t":"Design And Configuration Control","b":"<p class=\"hb-lead\">If you cannot say exactly what you built, you cannot bound a defect or repeat an order. To score a 10 you need a documented configuration process covering the product breakdown, identified configuration items and real baselines — and at the top end it stays live through the service life.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Establish the Process<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ISO/TS 22163:2017 requires a documented configuration management process appropriate to the product, applicable to hardware and software.<\/strong><\/p>\n<p class=\"hb-p\">The standard sets out what it must consider as a minimum:<\/p>\n<ul class=\"hb-ul\"><li>Configuration management planning<\/li><li>The product breakdown structure, down to the lowest replaceable units<\/li><li>Identification of configuration items, at least the safety-related ones<\/li><li>Configuration baselines<\/li><li>The change control arrangements<\/li><\/ul>\n<p class=\"hb-p\">Note that the 2023 edition merges configuration management and change control into a single clause. The substance is the same.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Break the Product Down Properly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>To the lowest replaceable unit, not to the level your drawing office finds convenient.<\/strong><\/p>\n<p class=\"hb-p\">The test is whether someone maintaining the product in service could identify and order the part they need to replace, and know whether it is the right one.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Identify Which Items Are Configuration Items<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Not everything needs configuration control, and pretending otherwise makes the system unusable.<\/p>\n<ul class=\"hb-ul\"><li>Identify configuration items deliberately<\/li><li>Include at least the safety-related ones, as the standard requires<\/li><li>Say why an item is or is not controlled<\/li><li>Review the list when the design changes<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Hold the Three Baselines<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The standard requires baselines to be established as a minimum for as-designed, as-built and as-maintained configurations.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>As-designed — what the drawing set says it should be<\/li><li>As-built — what you actually made, per serial number<\/li><li>As-maintained — what it is now, after service intervention<\/li><\/ul>\n<p class=\"hb-p\">Most manufacturers hold the first, some hold the second, and very few hold the third. The third is where rail customers get value, because it is what they are maintaining.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Assess Change Against the Baselines<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end configuration is managed through the service life, change is assessed for impact across the baselines, and the as-maintained picture stays aligned with what your customer holds.<\/strong><\/p>\n<p class=\"hb-p\">A change approved without assessing its effect on the in-service fleet is how a fleet ends up in three different configurations that nobody can distinguish.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Configuration control is what lets you answer the only question that matters after a failure: which other units are affected? Without it the answer is always 'all of them'.<\/strong><\/p>"},{"id":"PAC05","order":5,"q_ref":"10M.5","t":"Traceability And First Article","b":"<p class=\"hb-lead\">Traceability bounds a problem and first article inspection proves the process before you make a thousand of them. To score a 10 you need items traceable to at least the end of warranty, a documented first article process with real release criteria, and both extended to significant bought-in items.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Set the Traceability Requirement<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ISO/TS 22163:2017 requires items to be traceable from their origin up to at least the end of warranty where traceability is required by contract, regulatory or statutory norms, or configuration management.<\/strong><\/p>\n<p class=\"hb-p\">It also requires the organisation to define the method used to identify items, giving machine readable codes, stamping and labelling as examples, and notes that the method can be agreed with the customer.<\/p>\n<ul class=\"hb-ul\"><li>Decide which items require traceability, and record why<\/li><li>Define the identification method for each<\/li><li>Use machine readable identification where you can<\/li><li>Agree it with the customer where they have a preference<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Make It Actually Traceable, Both Ways<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Forwards and backwards. From a material batch to every unit it went into, and from a unit back to every batch in it.<\/strong><\/p>\n<p class=\"hb-p\">Test it. Take a serial number and try to reconstruct its material history, then take a material certificate and try to find every unit it touched. If either takes more than an hour, you do not have working traceability.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Run First Article Inspection to a Process<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ISO/TS 22163:2017 requires a documented process for first article inspection, and specifies what it must include:<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Planning against defined criteria to identify products subject to FAI<\/li><li>Preparation of the FAI<\/li><li>Inspection and verification activities, including review of production processes with focus on critical and special processes<\/li><li>Criteria for release of serial production, conditional release, and rejection<\/li><li>Follow-up of corrective actions<\/li><\/ul>\n<p class=\"hb-p\">That third point is the one most often skipped: FAI reviews the process, not just the part.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Have Real Rejection Criteria<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A first article process with no possible outcome other than pass is theatre.<\/strong><\/p>\n<p class=\"hb-p\">Define in advance what would cause rejection and what a conditional release means, including what conditions attach and who lifts them. Then be willing to use them.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Extend It and Repeat It on Change<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end first article inspection applies to internal and externally provided items alike, and is repeated when something material changes.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A change of supplier<\/li><li>A change of manufacturing site<\/li><li>A change of tooling, process or material<\/li><li>A long production gap<\/li><\/ul>\n<p class=\"hb-p\">Follow up the corrective actions arising, and retain the documented information.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Traceability decides the size of your recall. First article decides whether you find the problem before the recall or after it.<\/strong><\/p>"},{"id":"PAC06","order":6,"q_ref":"10M.6","t":"Counterfeit, Fraudulent And Suspect Items","b":"<p class=\"hb-lead\">There is no rail counterfeit scheme, which means the burden of proving your supply chain is genuine falls entirely on you. To score a 10 you need bought-in items verified before use, sourcing controlled to approved routes, and traceability good enough that one suspect item leads you to all the others.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand Why This Is on You<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>No rail-sector counterfeit, fraudulent and suspect items scheme exists. There is nothing to certify to and nothing to point at.<\/strong><\/p>\n<p class=\"hb-p\">That makes it a genuine differentiator: a supplier who can demonstrate real controls here stands out, because most cannot. The underlying controls are all sourced from quality standards even though the label is not.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Never Use Before Verification<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ISO/TS 22163:2017 requires that externally provided products, processes and services are not used or processed until verified as conforming to specified requirements, or released under an authorised concession.<\/strong><\/p>\n<p class=\"hb-p\">Verification activities must include:<\/p>\n<ul class=\"hb-ul\"><li>Planning, including the extent, frequency, sample size and methods of control<\/li><li>Instructions, checklists or templates for the verification<\/li><li>Obtaining evidence of conformity, such as certificates of conformity, test reports, statistical records and process control sheets<\/li><li>Release of the item<\/li><li>Documentation of the verification<\/li><li>Management of non-conforming items<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Read the Certificate Against the Requirement<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Counterfeit material almost always arrives with convincing paperwork. Filing a certificate is not checking it.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Does the certificate correspond to this item and this batch<\/li><li>Do the reported values fall against the acceptance criteria you specified<\/li><li>Is the issuing body real, and is the format consistent with previous ones<\/li><li>Does the standard cited actually exist at that issue<\/li><\/ul>\n<p class=\"hb-p\">The standard notes that where test reports are used, the data in them must be comparable with the stated acceptance criteria — which only works if someone compares them.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Control Where You Buy From<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Buy critical items through franchised distributors or the original manufacturer<\/li><li>Treat open-market brokers as high risk and verify accordingly<\/li><li>Be suspicious of unusual availability, unusual price, or unusual lead time<\/li><li>Evaluate providers on their people, infrastructure and processes, as the standard requires, not on their website<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Train People and Keep Traceability Tight<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end verification is risk-based, staff are trained to recognise warning signs, and traceability means one suspect item leads you to every other item from the same source.<\/strong><\/p>\n<p class=\"hb-p\">Purchasing and goods inwards staff are your detection layer. They need to know what to look for and to be thanked rather than delayed when they raise something.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: A counterfeit safety-related part that reaches the railway through you is an event you will not recover from commercially, and the absence of a sector scheme means nobody will have checked it but you.<\/strong><\/p>"},{"id":"PAC07","order":7,"q_ref":"10M.7","t":"Special Process Qualification","b":"<p class=\"hb-lead\">Some processes cannot be checked by looking at the result. To score a 10 you need those processes identified and documented with responsibilities, standards, competences and process qualification — and validation for each application, re-validated after change.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Identify Which Processes These Are<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ISO/TS 22163:2017 requires a documented process for the management of special processes, starting with identification of the special processes the organisation plans to use.<\/strong><\/p>\n<p class=\"hb-p\">The standard gives examples: bonding and sealing, casting, crimping, heat treatment, riveting, surface treatment including painting and coating, torque tightening, and welding.<\/p>\n<p class=\"hb-p\"><strong>The test is simple. If you cannot confirm the result by inspecting or testing the finished item non-destructively, it is a special process.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Define Each One Fully<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">For each special process the standard requires definition of:<\/p>\n<ul class=\"hb-ul\"><li>Responsibilities and authorities<\/li><li>Applicable standards<\/li><li>Risk assessment with an appropriate method, such as process FMEA<\/li><li>Work instructions, as a minimum where there is no applicable standard, covering management, manpower, machine, methods, material and environmental conditions<\/li><li>Personnel competences and qualification<\/li><li>Control methods and related documented information<\/li><li>Qualification of the special process<\/li><li>Validation for each specific application, and re-validation after changes<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Get Welding Right If You Weld Rail Vehicles<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>BS EN 15085-2:2020 classifies manufacturers and the components they weld into three levels depending on the safety relevance of the welded component.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>CL 1 — welded railway vehicles and components with high safety relevance<\/li><li>CL 2 — medium safety relevance<\/li><li>CL 3 — low safety relevance<\/li><\/ul>\n<p class=\"hb-p\">Table 1 in the standard allocates common components to levels, and deviations that result in a lower classification must be documented and justified. The standard also sets requirements for welding coordinators and their levels of technical knowledge, and for inspection personnel and welding procedure specifications.<\/p>\n<p class=\"hb-p\"><strong>Hold certification at the level matching what you actually weld, not the level you find convenient.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Qualify the Process, Not Just the Person<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A qualified welder running an unqualified procedure produces an unqualified weld.<\/strong><\/p>\n<p class=\"hb-p\">Both halves are required: personnel competence and qualification, and qualification of the process itself, then validation for the specific application.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Re-Validate on Change and Control Subcontractors<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Change of material, consumable or batch<\/li><li>Change of equipment or settings<\/li><li>Change of personnel<\/li><li>Change of site<\/li><li>A long gap in production<\/li><\/ul>\n<p class=\"hb-p\"><strong>At the top end subcontracted special processes are held to the same standard as your own. A subcontracted plater or heat treater working outside your controls is a gap in your product that no inspection will find.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Special processes are where latent defects are created. By definition you will not find them by inspecting the product, so the only control available is controlling the process.<\/strong><\/p>"}]}},"railready-siteservices":{"rail_fundamentals":{"color":"#00c8d4","label":"Rail Industry Fundamentals","order":1,"chapters":[{"id":"RIF01","order":1,"q_ref":"1.1","t":"Rail Regulatory Framework","b":"<p class=\"hb-lead\">Rail requirements are not arbitrary; they are downstream of a regulatory settlement. To score a 10 you need this written down and briefed rather than held in one head, and you need to be tracking the regulator's publications closely enough to see changes coming before they arrive as a tender.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Machinery<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A periodic review is a statutory process led by the Office of Rail and Road. Its key objective is to establish the level of funding for the mainline GB rail network, and what has to be delivered for it.<\/p>\n<p class=\"hb-p\"><strong>Everything that reaches you as a specification, a volume or a cost pressure starts there.<\/strong><\/p>\n<p class=\"hb-p\">You do not need to be an expert. You need to be able to explain, in two minutes, who decides what your customers must deliver and how that becomes a requirement on you.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Write a One-Page Internal Briefing<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is the cheapest possible improvement on this question, and most suppliers have never done it.<\/strong><\/p>\n<p class=\"hb-p\">One page covering:<\/p>\n<ul class=\"hb-ul\"><li>Who the regulator is and what it does, economic and safety<\/li><li>What the periodic review sets, and over what period<\/li><li>Who the infrastructure manager is and how it is funded<\/li><li>How that reaches you as an order, a standard or a cost expectation<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Brief It to the People Who Need It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Regulatory understanding sitting with one director is a single point of failure and does not change behaviour.<\/p>\n<ul class=\"hb-ul\"><li>Include it in commercial and bid team induction<\/li><li>Cover it with technical staff who write compliance responses<\/li><li>Refresh it when a determination or a major publication lands<\/li><\/ul>\n<p class=\"hb-p\"><strong>A bid team that understands why a requirement exists writes better answers than one that only knows the requirement.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Track the Publications That Matter to You<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Determinations, settlement documents and monitoring publications are public and free. Pick the ones that touch the regions and assets you serve rather than trying to follow everything.<\/p>\n<ul class=\"hb-ul\"><li>The current determination and the settlement for your regions<\/li><li>Annual delivery plan updates<\/li><li>The regulator's monitoring and performance reporting<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Give It a Name and a Slot<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Assign a named owner with regulatory monitoring in their objectives, so it survives a busy quarter.<\/strong><\/p>\n<p class=\"hb-p\">At the top end this feeds planning: you use published material to anticipate changes in demand and requirements before they reach you, rather than reacting once a tender is issued.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Suppliers who understand the regulatory logic can argue about how a requirement is met. Suppliers who do not can only comply with it, expensively.<\/strong><\/p>"},{"id":"RIF02","order":2,"q_ref":"1.2","t":"Planning Around The Funding Cycle","b":"<p class=\"hb-lead\">Rail funding is set on a multi-year cycle precisely so the supply chain can plan. For a service provider the binding constraint is competence, which takes months to build. To score a 10 you need the cycle as a standing, owned input driving recruitment, sponsorship and plant decisions.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand Why the Cycle Exists<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's guidance states that setting funding and outputs on a five-year basis is designed to facilitate efficient and longer-term decision-making by providing stability and certainty about what the railway, including the supply chain, needs to deliver.<\/strong><\/p>\n<p class=\"hb-p\">That certainty is offered to you. A service provider resourcing contract by contract is declining it.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Track the Right Documents<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>The current Strategic Business Plan for the regions you work in<\/li><li>The final determination settlement documents for those regions<\/li><li>Annual delivery plan updates, which are where volumes actually move<\/li><li>Published possession and access strategies for major schemes<\/li><\/ul>\n<p class=\"hb-p\">Note that plans are updated during a control period. The original plan is the starting position, not the answer.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Turn It Into Competence and Resource Decisions<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The test is whether a published volume has ever changed a decision you took.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Headcount planning against expected renewals and maintenance volumes<\/li><li>Sponsorship of competences that take months to obtain and maintain<\/li><li>Plant purchase or long-term hire<\/li><li>Geographic footprint, including depots and welfare<\/li><\/ul>\n<p class=\"hb-p\">Competence is the long lead item. If you start recruiting when the contract is awarded, you are already late.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Make It Standing and Owned<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">At the top end this is a standing input with named ownership, not an annual exercise.<\/p>\n<ul class=\"hb-ul\"><li>A fixed agenda item at business planning<\/li><li>A named owner who watches for published changes<\/li><li>A defined trigger for revisiting the plan when something moves<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Adjust Proactively<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The difference between a 7 and a 10 is whether you move before the effect reaches your order book.<\/strong><\/p>\n<p class=\"hb-p\">When a delivery plan update shifts volumes on a route you work, that is the moment to act. Track how accurate your assumptions turned out to be, and refine them next cycle.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Competence takes months to build and cannot be hired at short notice. The funding cycle is the only forward view of demand the industry publishes, and it is free.<\/strong><\/p>"},{"id":"RIF03","order":3,"q_ref":"1.3","t":"Understanding Your Client's Structure","b":"<p class=\"hb-lead\">Your client is not one organisation, and part of your market sits behind principal contractors rather than with the infrastructure manager at all. To score a 10 you need to understand the devolved structure, map your relationships onto it, and run an engagement plan leadership owns and reviews against results.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Devolved Structure<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's settlement documents state plainly that each region has its own settlement as part of Network Rail's overall determination, will report separately on what it is delivering, and will have its own budget to fund its activities.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Regions, and the routes within them<\/li><li>The System Operator<\/li><li>National functions, which let work differently again<\/li><li>Major programmes and enhancement schemes<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Include the Framework Layer<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>For most service providers the majority of work arrives through a principal contractor or framework holder, not directly.<\/strong><\/p>\n<p class=\"hb-p\">Map that layer as deliberately as you map the client:<\/p>\n<ul class=\"hb-ul\"><li>Which principal contractors hold frameworks on the routes you cover<\/li><li>Where you sit on their approved lists, and against which disciplines<\/li><li>Who does their resourcing, as distinct from who runs their projects<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Map Your Contacts Onto It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Who do you know, where do they sit, and what can they decide<\/li><li>Where are the gaps in regions you claim to cover<\/li><li>Which relationships depend entirely on one individual<\/li><\/ul>\n<p class=\"hb-p\">A contact who moves takes an unmapped relationship with them. A mapped one can be rebuilt.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Pitch to the Buying Behaviour<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A region with its own budget is managing a defined outcome within a fixed envelope; a principal contractor is managing risk and resource availability across several schemes. They respond to different arguments.<\/p>\n<ul class=\"hb-ul\"><li>Regions and routes: deliverability, disruption, handback reliability<\/li><li>Principal contractors: resource certainty, competence depth, mobilisation speed<\/li><li>Programmes: schedule certainty and interface risk<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Own the Plan and Review It on Results<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end engagement is planned, owned at leadership level and reviewed for effectiveness.<\/strong><\/p>\n<p class=\"hb-p\">Review it against enquiries and awards, not against meetings held. And revisit it when the client reorganises or a framework is re-let, which is when positions are won and lost.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Working into a devolved client through an intermediary layer means two structures to understand. Suppliers who only map one of them lose work they never saw advertised.<\/strong><\/p>"},{"id":"RIF04","order":4,"q_ref":"1.4","t":"Outcomes Your Clients Are Held To","b":"<p class=\"hb-lead\">Your clients are held to account against a small set of published objectives. To score a 10 you need to say specifically which one your delivery moves and how — handback punctuality protects train performance — then measure it and take proposals back on the strength of it.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know the Objectives<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR set out at the start of PR23 that its focus would remain on four objectives: safety, performance, asset sustainability and efficiency.<\/strong><\/p>\n<p class=\"hb-p\">Those four words are the language your client is measured in. Using them accurately is not jargon; it is speaking to what they are accountable for.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Make the Handback Link Explicitly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>For a service provider the clearest line runs from your delivery to train performance.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A possession handed back on or before time protects the service<\/li><li>An overrun is a performance event with a cost attached to it<\/li><li>Fewer return visits means less disruptive access consumed<\/li><li>Work completed right first time protects asset sustainability<\/li><\/ul>\n<p class=\"hb-p\">Say this in those terms. Many suppliers deliver it and never claim it.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Get It Into Bids and Reporting<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>A standard bid paragraph, kept current<\/li><li>The same language in your delivery reporting<\/li><li>Case study evidence from schemes where you performed well<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Measure Your Own Contribution<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you measure it rather than asserting it.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Track possessions handed back on or before time<\/li><li>Track overruns, with cause<\/li><li>Track return visits and rework<\/li><li>Agree with the client what would count as evidence, before you start<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Take Proposals Back<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Once you can evidence a handback record, you can propose rather than respond — offering a method that consumes less access, or a sequencing change that reduces disruption.<\/p>\n<p class=\"hb-p\"><strong>Bring a proposal built on data, not on an offer of a meeting.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Every service provider claims to be safe and reliable. Very few can show a handback record and tie it to the client's own performance measure. That difference is visible in an evaluation.<\/strong><\/p>"},{"id":"RIF05","order":5,"q_ref":"1.5","t":"Published Performance Information","b":"<p class=\"hb-lead\">Your customers publish how they are being judged. To score a 10 you need to follow the measures relevant to the parts of the network you serve, use their language in your bids and reporting, and turn a deteriorating measure into a proposal rather than waiting for a tender.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know What Is Published<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">ORR's outcomes framework includes a small number of top-tier success measures used to publicly hold Network Rail to account, alongside regional settlement documents, delivery plan updates and routine monitoring publications.<\/p>\n<p class=\"hb-p\"><strong>All of it is free, and almost none of your competitors read it.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Follow Only What Is Relevant to You<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Following everything means following nothing.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Pick the regions and routes you actually serve<\/li><li>Pick the asset types you actually touch<\/li><li>Pick two or three measures, not twenty<\/li><li>Write the list down so it survives a change of personnel<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Speak Their Measures Back to Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Using your customer's own measure in your bid is disproportionately persuasive, because it shows you understand what they are being judged on.<\/p>\n<ul class=\"hb-ul\"><li>Reference the specific measure, not 'performance' generally<\/li><li>Say how your offer affects it<\/li><li>Repeat it in delivery reporting so the claim is continuous<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Give It an Owner and a Slot<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">At the top end this is a routine, owned input to commercial planning rather than something a keen individual does.<\/p>\n<ul class=\"hb-ul\"><li>A named owner with it in their objectives<\/li><li>A standing item in commercial or business development review<\/li><li>A short internal note when something significant is published<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Turn a Bad Number Into a Proposal<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is the highest-value move available on this question.<\/strong><\/p>\n<p class=\"hb-p\">When a measure goes the wrong way in a region you serve, that is a customer with a problem and a published admission of it. Bring them something specific: a method, a product, a change that addresses that measure.<\/p>\n<p class=\"hb-p\">That is how suppliers get in front of a requirement rather than behind it.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Published performance data is a free, continuously updated list of your customers' current problems. Reading it costs an hour a month.<\/strong><\/p>"},{"id":"RIF06","order":6,"q_ref":"1.6","t":"Value And Efficiency Under Funding Pressure","b":"<p class=\"hb-lead\">Rail money is tight and it has moved towards shorter, more frequent interventions. To score a 10 you need to understand that shift, evidence your productivity inside an access window, and agree how savings will be measured before you start.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Shift<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's conclusion of the 2023 periodic review records that constrained funding means Network Rail will be spending less on renewals and more on life-extending repairs and maintenance in CP7 than in CP6.<\/strong><\/p>\n<p class=\"hb-p\">For a service provider that changes the shape of the work:<\/p>\n<ul class=\"hb-ul\"><li>More frequent, smaller interventions rather than large renewals<\/li><li>More work in short access windows rather than long blockades<\/li><li>Higher value on mobilising quickly and reliably<\/li><li>Less tolerance for return visits<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Compete on What You Get Done, Not the Rate<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Rate is one number and it is easy to undercut. Output per shift is harder to match and worth more.<\/p>\n<ul class=\"hb-ul\"><li>How much of the window is productive versus set-up and clear<\/li><li>How often you finish the planned work<\/li><li>How often you have to come back<\/li><li>How reliably you hand back on time<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Measure Productivity in the Window<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Collect this data even if nobody has asked for it yet. It is the strongest thing you can put in a bid.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Output per shift for repeated activities, trended<\/li><li>Time from possession taken to first productive work<\/li><li>Return visit rate and cause<\/li><li>Handback punctuality<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Agree the Measurement Before You Start<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A saving nobody agreed how to measure is a saving the client will not accept afterwards.<\/p>\n<ul class=\"hb-ul\"><li>Agree the baseline and the method up front, in writing<\/li><li>Agree who collects the data<\/li><li>Agree when you will both look at it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Go Looking for Cost to Remove<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you actively seek out cost your client could avoid, then measure and share what was delivered.<\/strong><\/p>\n<p class=\"hb-p\">Often the biggest available saving is access itself: a method that does the same work in fewer or shorter possessions is worth far more to the client than a lower hourly rate.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Access is the scarcest thing on the railway. A supplier who can prove they use less of it for the same output is competing on the dimension the client actually values.<\/strong><\/p>"},{"id":"RIF07","order":7,"q_ref":"1.7","t":"Routes To Market And Positioning","b":"<p class=\"hb-lead\">Rail work reaches service providers mostly through principal contractors and frameworks, not directly. To score a 10 you need to know where you sit, pursue both routes deliberately, keep your registered scope accurate, and run a qualified opportunity plan with real bid or no bid decisions.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Tiers<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Network Rail's CP7 Strategic Business Plan describes a focus on timely payment to suppliers and incentivising Tier 1 suppliers to employ Tier 2 and 3 suppliers.<\/strong><\/p>\n<p class=\"hb-p\">The subcontract route is not second best; it is a deliberately encouraged part of how work reaches smaller suppliers, and for most service providers it is the main route.<\/p>\n<p class=\"hb-p\">Work out honestly which tier your resource depth, competence coverage and balance sheet support.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Pursue Both Routes on Purpose<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Identify the principal contractors and framework holders on the routes you cover<\/li><li>Get onto their approved lists, which is a different process from scheme qualification<\/li><li>Pursue direct opportunities where your scale supports it<\/li><li>Do not let one route crowd out the other<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Keep Registrations and Registered Scope Current<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>For a service provider the scope you are registered against matters as much as the fact of registration.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Check the codes and disciplines you hold against the work you now do<\/li><li>Check the geography you claim against where you can genuinely resource<\/li><li>Keep certificates, insurances and scheme status in date on the portal<\/li><li>Review at least annually and after any capability change<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Actually Watch the Pipelines<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Network Rail's SME Supplier Guide notes that it advertises contract opportunities on the government's Find a Tender Service above threshold.<\/p>\n<ul class=\"hb-ul\"><li>Give someone the job of reviewing pipelines on a defined rhythm<\/li><li>Set up alerts rather than relying on memory<\/li><li>Watch framework renewal dates, which is when positions change<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Qualify, Decide, and Review<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end pipeline monitoring feeds a qualified opportunity plan with explicit bid or no bid decisions.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Score opportunities against your real competence coverage and resource availability<\/li><li>Say no in writing, with reasons, and stop spending on it<\/li><li>Review wins and losses and change something as a result<\/li><li>Revisit the strategy when contracting models change<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Most service providers who complain that rail is closed to them are registered against the wrong scope and watching the client rather than the contractors who actually let the work.<\/strong><\/p>"},{"id":"RIF08","order":8,"q_ref":"1.8","t":"Readiness For Industry Change","b":"<p class=\"hb-lead\">The organisations you sell to are being restructured. To score a 10 you do not need to predict the outcome; you need to have assessed which of your relationships and routes to market depend on the structure as it stands, and to hold that as a live risk with a named owner.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Follow the Published Material<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The Railways Bill factsheet on Great British Railways states that it will be structured to focus on delivering for its customers locally, with a structure based on geographic business units, each bringing together infrastructure management and passenger operations into a single local team.<\/p>\n<p class=\"hb-p\"><strong>Read the primary material rather than the trade press summary of it. It is short and it is free.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Assess What It Means for You, at Management Level<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The point is not to become an expert on the reform. It is to know your own exposure.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Which relationships depend on a body that may not exist in its current form<\/li><li>Which routes to market run through a structure that may change<\/li><li>Where would an equivalent decision sit afterwards<\/li><li>Which of your registrations or qualifications are tied to a particular buyer<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Treat It as a Risk, Not a News Item<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Put it on the risk register with a named owner and a review date<\/li><li>Record what would trigger action<\/li><li>Say what you would do, at least in outline<\/li><\/ul>\n<p class=\"hb-p\">A risk register entry that has never been reviewed is not a risk being managed.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Build Relationships That Survive Reorganisation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Structural change destroys relationships that live in one person and preserves those that live in delivery performance.<\/p>\n<ul class=\"hb-ul\"><li>Make sure more than one person holds each important relationship<\/li><li>Keep an evidence base of your performance that is portable<\/li><li>Build at the level below the one being reorganised, where people usually stay<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Adjust as Detail Firms Up<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end this is a standing item in leadership risk and strategy review, with mapped impacts and plans that are adjusted as published detail changes.<\/strong><\/p>\n<p class=\"hb-p\">Waiting for the change to complete and then reacting is the expensive option, because everyone else does it at the same time.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Reorganisations redistribute buying authority. Suppliers who mapped their exposure beforehand keep their position; those who did not spend a year finding out who to talk to.<\/strong><\/p>"}]},"safety_culture":{"color":"#ef4444","label":"Rail Safety Culture","order":2,"chapters":[{"id":"RSC01","order":1,"q_ref":"2.1","t":"Understanding Your Safety Culture","b":"<p class=\"hb-lead\">Every supplier says it has a good safety culture. To score a 10 you have to show you went and found out, using a recognised method, that you shared what you found including the uncomfortable parts, and that you act on it at the level of individual teams rather than as a single organisation-wide number.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Use a Recognised Method, Not a Staff Survey<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A general engagement survey is not a safety culture assessment.<\/strong><\/p>\n<p class=\"hb-p\">ORR's maturity model points organisations at safety culture or safety climate assessments using techniques and toolkits such as RSSB's Safety Culture toolkit. Whatever you use, it should:<\/p>\n<ul class=\"hb-ul\"><li>Ask about behaviour and belief, not satisfaction<\/li><li>Allow anonymous response<\/li><li>Reach the front line, not just supervisors and office staff<\/li><li>Produce something you can repeat and compare against later<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Gather the Informal Evidence Too<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The maturity model is explicit that culture shows up during monitoring, inspections, investigations and ordinary dealings with employees and the supply chain. Someone saying in passing that performance pressure sometimes takes priority over risk controls is culture data.<\/p>\n<p class=\"hb-p\"><strong>Give people a way to record that. As well as investigating the comment, write down the background so a picture builds up over time.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A field for cultural observations on inspection and tour forms<\/li><li>A prompt in investigation templates<\/li><li>A note of what people say when the formal part of the meeting has finished<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Share What You Found, Including the Bad Part<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Publishing only the flattering results destroys the credibility of the next assessment.<\/p>\n<ul class=\"hb-ul\"><li>Report the weakest scores as prominently as the strongest<\/li><li>Say what you are going to do about them, and by when<\/li><li>Come back later and say whether it worked<\/li><\/ul>\n<p class=\"hb-p\"><strong>Workforces forgive a poor result. They do not forgive being asked and then ignored.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Act at Team Level<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The maturity model notes that different positive cultural characteristics matter in different parts of a business. A just and fair reporting culture matters most at the front line; a culture of doubt and questioning matters most in engineering functions.<\/p>\n<p class=\"hb-p\">Break your results down far enough to see that, and direct effort at the weakest area rather than spreading it evenly.<\/p>\n<ul class=\"hb-ul\"><li>By site, shift, department or gang<\/li><li>By length of service, which often reveals induction problems<\/li><li>By direct versus subcontracted staff<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Make It a Strategy, Not an Exercise<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end, culture is something you deliberately shape as part of your safety management system.<\/strong><\/p>\n<p class=\"hb-p\">Set out what culture you are trying to build and how you will know. Repeat the assessment on a cycle so you have a trend rather than a snapshot, and treat a deteriorating trend as seriously as an incident.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Culture is the thing that decides what people do when the procedure does not cover the situation. An organisation that has never measured it is guessing about its single biggest safety variable.<\/strong><\/p>"},{"id":"RSC02","order":2,"q_ref":"2.2","t":"Close Call And Near Miss Reporting","b":"<p class=\"hb-lead\">Close Call reporting rates tell an assessor more about your culture than your policy does. To score a 10 you need a route that works from the worksite at night, investigations that reach underlying causes, feedback that closes the loop with the reporter, and trend analysis that finds the areas of high risk before an accident does.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Make Reporting Work at the Worksite<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Every step between seeing something and reporting it costs you reports.<\/strong><\/p>\n<p class=\"hb-p\">Network Rail defines a Close Call as anything that is likely to cause harm or damage, and asks people to recognise, respond and report — fix it if you safely can, challenge unsafe behaviour, tell others, then report. Build the route to fit that:<\/p>\n<ul class=\"hb-ul\"><li>Works out of hours and without a mobile signal<\/li><li>Short enough to complete before the gang moves on<\/li><li>Usable by subcontracted and agency staff<\/li><li>Clear about how reports reach the Close Call system, directly or through the Principal Contractor<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Investigate Properly and Proportionately<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">RISQS CORE audit protocols require you to identify underlying and root causes, use competent investigators, and reach a clear understanding of responsibilities for reporting and investigation on shared worksites.<\/p>\n<ul class=\"hb-ul\"><li>Agree in advance who investigates what when several organisations share a site<\/li><li>Scale the investigation to the potential, not the actual outcome<\/li><li>Look past what the person did to why the situation allowed it<\/li><li>Manage investigations in accordance with client and infrastructure manager requirements<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Track Actions to Closure and Verify Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>An action marked complete without evidence is an action that will reappear.<\/strong><\/p>\n<p class=\"hb-p\">Keep corrective and preventive actions on a tracker with owners and dates, re-assess the risk once the action is in, and brief the gangs and other parties on what the investigation found.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Feed Back to the Person Who Reported<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">This is the single highest-return thing you can do for reporting rates, and it is the most commonly skipped.<\/p>\n<ul class=\"hb-ul\"><li>Tell the reporter what happened as a result, even when the answer is that you decided to do nothing<\/li><li>Cover recent Close Calls in the pre-work briefing so people see reports going somewhere<\/li><li>Thank people publicly for reports that led to change<\/li><\/ul>\n<p class=\"hb-p\"><strong>Reporting rates fall when feedback stops, not when hazards disappear.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Analyse the Trend, Not Just the Report<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">At the top end you use the data strategically. Analyse across sites to find the areas of high risk, share lessons with your client and your subcontractors, and report all safety and environmental close calls onward as required.<\/p>\n<p class=\"hb-p\"><strong>Treat a site whose reporting rate has fallen to zero as a warning sign, not a success.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Close Calls are the only free information you get about your own risk, and your client can see your reporting rate. An organisation that does not collect them is waiting to learn from harm instead.<\/strong><\/p>"},{"id":"RSC03","order":3,"q_ref":"2.3","t":"Just Culture And Response To Error","b":"<p class=\"hb-lead\">How you respond when someone makes a mistake sets the price of honesty in your organisation. To score a 10 you need a written just culture position, applied consistently, that your workforce actually believes in — and at least one occasion where it led you to change a process rather than sanction a person.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand What a Just Culture Is<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">RSSB's guidance describes a just culture as one where the majority believe justice will usually be dispensed and the system is seen as fair. It sits deliberately between two failures:<\/p>\n<ul class=\"hb-ul\"><li>A blame culture, where fear prevents open communication about risk<\/li><li>A no-blame culture, where sloppy practice and negligence creep in<\/li><\/ul>\n<p class=\"hb-p\"><strong>The point is not to excuse everything. It is to be predictable about what is and is not acceptable.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Write Down Acceptable and Unacceptable Behaviour<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The guidance is clear that formalising acceptable and unacceptable behaviours in policies and procedures creates transparency and sets expectations.<\/p>\n<ul class=\"hb-ul\"><li>Say what will always be treated as unacceptable, and be honest about it<\/li><li>Say what will be treated as a system problem rather than a personal one<\/li><li>Explain how the two are told apart<\/li><li>Agree it with staff or their representatives, rather than issuing it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Use the Substitution Test<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>When considering culpability, ask whether a well-motivated, equally competent and comparably qualified individual, in the same circumstances and without hindsight, would have behaved differently.<\/strong><\/p>\n<p class=\"hb-p\">If the answer is no, blaming the individual diverts attention from the organisational weakness that set them up. That test is short enough to use in a real meeting, which is why it survives.<\/p>\n<p class=\"hb-p\">Record that you applied it and what you concluded.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Apply It the Same Way Every Time<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Consistency is what makes it credible. The same behaviour treated differently on different days reads as unfairness whichever way it falls.<\/p>\n<ul class=\"hb-ul\"><li>Review outcomes periodically for consistency between managers, sites and departments<\/li><li>Watch for outcome bias, where the same act is judged by how badly it happened to end<\/li><li>Involve someone independent in serious cases<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Prove It With a Process Change<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Keep evidence of an occasion where the approach led you to change how work is done rather than to discipline someone.<\/strong><\/p>\n<p class=\"hb-p\">That single record does more for your assessment, and for your workforce's trust, than the policy itself. Then check whether people believe it: ask in a survey whether staff think they would be treated fairly, and track the answer.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: People only report what they are not afraid to report. Every other safety system you have depends on this one working.<\/strong><\/p>"},{"id":"RSC04","order":4,"q_ref":"2.4","t":"Confidential Safety Reporting","b":"<p class=\"hb-lead\">Some concerns will never reach you through the line. To score a 10 you need an independent confidential channel that people know about and trust, and you need to treat what comes through it as leadership intelligence rather than as a complaints queue.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Put the Channel in Place<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">CIRAS is the rail sector's independent confidential reporting service. Note that the Sentinel Scheme Rules require Sponsors to be a member of an independent confidential industry reporting service, so for many suppliers this is an obligation rather than an option.<\/p>\n<p class=\"hb-p\"><strong>An internal whistleblowing address is not the same thing. The value comes from independence.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Publicise It Properly and Repeatedly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A channel nobody remembers is assurance on paper only. Once at induction is not enough.<\/p>\n<ul class=\"hb-ul\"><li>Posters where people actually stop, including welfare units and vehicles<\/li><li>Cards issued with site passes or ID<\/li><li>Payslip inserts or intranet reminders on a cycle<\/li><li>Repeated at least annually, and after any event that shakes confidence<\/li><\/ul>\n<p class=\"hb-p\"><strong>Say plainly how confidentiality is protected. Most people who do not use it assume it is not really confidential.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"h
