b-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Extend It Across Contractual Boundaries<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">ORR's maturity model notes that third party confidential reporting across contractual boundaries surfaces concerns that would otherwise stay hidden through unclear reporting routes or fear of jeopardising commercial relationships.<\/p>\n<ul class=\"hb-ul\"><li>Make the channel available to subcontracted and agency workers on your sites<\/li><li>Tell your own supply chain it exists<\/li><li>Make clear that raising a concern will not affect anyone's commercial position<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Respond Visibly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Have a defined route for receiving a concern, investigating it and responding, and make sure the response is visible enough that people can see something happened, without compromising the reporter.<\/p>\n<ul class=\"hb-ul\"><li>A named owner for incoming reports<\/li><li>A target response time<\/li><li>A way of publishing themes and actions without identifying anyone<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Use It as Intelligence, Not Just Assurance<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you review the trends in what is reported confidentially, and why people chose that route rather than an internal one.<\/strong><\/p>\n<p class=\"hb-p\">The maturity model makes the point sharply: this data provides independent insight into safety culture as felt on the ground, and a degree of assurance that your reported performance is genuine — including whether safety targets have started to suppress reporting.<\/p>\n<p class=\"hb-p\">Put those trends in front of your senior team alongside your internal reporting rates.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: A confidential channel is the only route you have to the concerns your management chain is filtering out. Treated seriously it is an early warning system; treated as a formality it is worse than nothing, because it looks like assurance.<\/strong><\/p>"},{"id":"RSC05","order":5,"q_ref":"2.5","t":"Workforce Involvement In Safety","b":"<p class=\"hb-lead\">The gang knows things your safe system of work does not. To score a 10 you need established arrangements for site teams to shape how work is controlled, evidence that contributions actually changed something, and a genuine willingness to be challenged from the worksite.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know the Baseline Duty<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">ORR's maturity model sets out that all employees in Great Britain must be consulted on, not just told about, health and safety issues that affect them, under the Safety Representatives and Safety Committees Regulations 1977 and the Health and Safety (Consultation with Employees) Regulations 1996.<\/p>\n<p class=\"hb-p\"><strong>Consultation is a legal floor, not an achievement. The maturity model expects effective organisations to go further than the law specifies.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Involve the Gang Before the Plan Is Issued<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Consultation after the safe system of work is written is announcement with extra steps.<\/strong><\/p>\n<p class=\"hb-p\">RISQS CORE audit protocols expect evidence of employee engagement when procedures change, when the organisation changes, when new technology or systems are introduced, when risk assessments are carried out, and when performance is reviewed. They also expect regular briefings including Rule Book updates and Sentinel Scheme Rule updates.<\/p>\n<ul class=\"hb-ul\"><li>Get input from the people who will do the job while the method is still open<\/li><li>Use the pre-work briefing as a two-way conversation, not a reading<\/li><li>Ask what was different from the plan at the end of the shift<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Record Suggestions and Answer Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocols require suggestions to be recorded, reviewed, and a response provided. That third step is what makes the first two worth doing.<\/p>\n<ul class=\"hb-ul\"><li>A register with a response against every entry<\/li><li>A visible turnaround time<\/li><li>An honest 'no, and here is why' where that is the answer<\/li><\/ul>\n<p class=\"hb-p\"><strong>An unanswered suggestion scheme trains people to stop suggesting.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Reach Subcontractors and Agency Staff Too<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">On most sites a large share of the workforce is not directly employed by you, and they are often the people with the least protected voice.<\/p>\n<ul class=\"hb-ul\"><li>Include them in briefings and forums, not just inductions<\/li><li>Ask them directly during site tours<\/li><li>Make clear that raising something will not cost them the next shift<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Build a Questioning Attitude<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end, challenge is normal and expected at every level, including challenging a plan issued from the office.<\/strong><\/p>\n<p class=\"hb-p\">The maturity model describes effective organisations as making full use of employees' potential and actively involving them to develop shared values and a culture of trust, openness and empowerment. Back it with an explicit right to stop work.<\/p>\n<p class=\"hb-p\">Treat a site that never challenges anything as a warning sign rather than as a compliant one.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: The gap between how work is imagined in the office and how it is actually done at the worksite is where incidents live. Involvement is the only reliable way to see across it.<\/strong><\/p>"}]},"quality_compliance":{"color":"#22c55e","label":"Quality, Compliance & Assurance","order":3,"chapters":[{"id":"QCA01","order":1,"q_ref":"3.1","t":"Accuracy Of Qualification Information","b":"<p class=\"hb-lead\">Your qualification record is what buyers see before they see you. To score a 10 it needs a named owner, it needs to be accurate about what you can genuinely deliver including your limits, and it needs to be connected to what the business is actually bidding for.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know What Buyers Currently See<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Most organisations have not looked at their own profile as a buyer sees it for over a year.<\/strong><\/p>\n<p class=\"hb-p\">Print it out. Go through it line by line and ask, for each claim, whether you could deliver it starting tomorrow.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Be Honest About Limits<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">RISQS Scheme Rules require that information provided by the organisation accurately reflects the products and services the supplier member is able to provide, and any realistic limitations on volume or delivery locations.<\/p>\n<p class=\"hb-p\"><strong>Stating a limit is not weakness. It is what stops you being invited to something you will have to decline or, worse, accept and fail.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Volume limits you can genuinely sustain<\/li><li>Geographic coverage you can genuinely resource<\/li><li>Lead times that are real rather than aspirational<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Give It One Owner<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Name the person responsible in a procedure, not by custom<\/li><li>Set a review frequency and diary it<\/li><li>Make them responsible for certificates and insurances on the portal, not just the narrative<\/li><li>Give them a route to find out when capability changes<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Connect It to the Pipeline<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end this is a governed business process linked to bid and contract activity.<\/strong><\/p>\n<p class=\"hb-p\">A change in capability or capacity should reach the record before it reaches a bid, and the record should reflect what you are actually pursuing. If you have stopped offering something, take it off.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Review It Where It Will Be Noticed<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Put profile accuracy on a leadership agenda rather than leaving it to administration. It takes five minutes and it is the cheapest protection there is against being disqualified for a stale document.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Buyers search, filter and shortlist on this data. An inaccurate record either hides you from work you could win, or wins you work you cannot deliver.<\/strong><\/p>"},{"id":"QCA02","order":2,"q_ref":"3.2","t":"Assurance Requirements For What You Supply","b":"<p class=\"hb-lead\">The assurance you have to pass depends on the service and the lifecycle phase. To score a 10 you need to know the assurance level attached to every code you hold, know which of them the construction regulations affect, hold only codes you can evidence, and review selection with technical and commercial input.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand How the Classification Works<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The Rail Industry Commodity Classification List explains that the required assurance level sits at the intersection of a commodity and a lifecycle phase — a letter indicating the level required, or a hyphen where no assurance intervention is considered necessary at that step.<\/strong><\/p>\n<p class=\"hb-p\">The same discipline can therefore carry different requirements at construction and at maintenance.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Know Which Level Each Code Carries<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Version 9 of the RICCL sets out three levels:<\/p>\n<ul class=\"hb-ul\"><li>V — Verification: an annual set of procurement-specific questions<\/li><li>A — Audit: a systematic and independent examination of processes, records, controls and activities<\/li><li>W — Witnessed: an independent technical assessment, new in Version 9<\/li><\/ul>\n<p class=\"hb-p\"><strong>Note that CDM-affected codes were made auditable in an earlier version. Work out which of the codes you hold that covers.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Hold Only What You Can Evidence<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Every code you hold is a code you may be audited against.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Remove codes for disciplines you no longer self-deliver<\/li><li>Do not claim adjacent disciplines speculatively<\/li><li>Where a code is aspirational, plan the assurance before you claim it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Prepare for the Assurance Each Code Brings<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Which codes are auditable and when the audit is due<\/li><li>Which require third party or witnessed assessment, and the lead time<\/li><li>Which parts of your management system each one exercises<\/li><li>Which will bring a CDM-focused audit<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Review With Technical and Commercial Together<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end code selection is a governed decision aligned to strategy, not an artefact of registration day.<\/strong><\/p>\n<p class=\"hb-p\">Bring the engineering and commercial leads into the same review. Where you believe a classification is wrong for the work you actually do, raise it through the proper route rather than working around it.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Claiming a code you cannot evidence is the fastest way to fail an audit you did not need to take. Missing one you could hold quietly removes you from searches you would win.<\/strong><\/p>"},{"id":"QCA03","order":3,"q_ref":"3.3","t":"Control Of Assured Scope","b":"<p class=\"hb-lead\">Working outside your assured scope is one of the few things that can suspend you outright. To score a 10 you need a scope check built into acceptance so it cannot be skipped under pressure, extensions arranged before the work starts, and any limitation treated as a governance matter rather than an administrative one.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Consequence<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS Scheme Rules provide for limitation where an auditor reports that a supplier is undertaking work on the railway infrastructure that is not within the scope of their certification.<\/strong><\/p>\n<p class=\"hb-p\">That is discovered at audit, long after the work, and the consequence lands on your whole qualification rather than on the single job.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Put the Check Where It Cannot Be Skipped<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A scope check that depends on someone remembering will fail on the busy week.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Build it into your enquiry, bid or order acceptance checklist as a mandatory field<\/li><li>Require a named sign-off, not a tick<\/li><li>Make the assured scope easy to look up, in plain language<\/li><li>Give people an explicit route to say no<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Arrange Extensions Before, Not After<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Scope extensions take time. Starting the process after you have won the work means either delaying the customer or working outside scope while you wait.<\/p>\n<ul class=\"hb-ul\"><li>Identify likely extensions from your pipeline, not from your order book<\/li><li>Start early enough for assurance to be in place before delivery<\/li><li>Track the application so it does not stall<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Watch for Scope Creep Inside a Contract<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The common failure is not taking on obviously unqualified work. It is a contract that grows.<\/strong><\/p>\n<p class=\"hb-p\">A job that starts inside scope and drifts outside it during delivery is the hardest case to catch, because nobody re-checks. Build a re-check into significant variations.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Treat Limitations as a Governance Signal<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">At the top end you track any limitations or restrictions placed on your qualification and their causes, and act on them at leadership level.<\/p>\n<p class=\"hb-p\"><strong>Where scope repeatedly constrains the business, that is a strategic decision — extend it deliberately, or stop pursuing that work — not a recurring irritation.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Scope is the one area where doing good work is no defence. Being outside it is a finding regardless of how well the job went.<\/strong><\/p>"},{"id":"QCA04","order":4,"q_ref":"3.4","t":"Audit Readiness And Evidence","b":"<p class=\"hb-lead\">Audits are won or lost before the auditor arrives. To score a 10 you need evidence submitted within the scheme's timescales, the people who will be interviewed briefed, and readiness that is continuous rather than manufactured for the visit.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know That Part of It Happens Before the Visit<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS guidance records that Stage 1 of the audit requires the supplier to upload a portion of their management system and audit evidence into the portal for review by a competent desktop auditor.<\/strong><\/p>\n<p class=\"hb-p\">Late or incomplete submission costs you before anyone arrives, and it sets the auditor's expectations for everything that follows.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Plan Each Audit Like a Project<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>A preparation plan with owners and dates<\/li><li>The submission deadline diarised backwards from the audit date<\/li><li>A named person co-ordinating<\/li><li>A dry run against the protocol you will be audited to<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Brief the People Who Will Be Interviewed<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Auditors talk to the people doing the work, and they can tell the difference between someone describing their job and someone reciting a procedure.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Tell people the audit is happening and why<\/li><li>Make sure they can describe what they actually do<\/li><li>Tell them it is fine to say they do not know and to fetch someone<\/li><li>Do not coach answers — it is obvious and it damages credibility<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Fix What You Find in Preparation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Preparation usually surfaces gaps. Fix the ones you can and be upfront about the ones you cannot.<\/p>\n<p class=\"hb-p\"><strong>An organisation that says 'we found this ourselves and here is the plan' scores better than one that hopes it will not come up.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Make Readiness Continuous<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end an audit could begin at short notice and you would be fine.<\/strong><\/p>\n<p class=\"hb-p\">Test that with your own internal audits against the same requirements, rather than waiting for the external one. Own readiness at senior level so it is a property of the business, not a project that runs twice a year.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: A well-run organisation that prepares badly scores worse than an average one that prepares well. The audit measures what you can show, not what you do.<\/strong><\/p>"},{"id":"QCA05","order":5,"q_ref":"3.5","t":"Non-Conformance Close-Out","b":"<p class=\"hb-lead\">Findings are cheap; unclosed findings are expensive. To score a 10 you need every finding on one tracker with owners and dates, closure verified with evidence, and root cause analysis that changes the system rather than the instance.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Escalation Risk<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS Scheme Rules record that a Major Non-Compliance will be raised against the CORE Monitoring and Measuring requirement for failure to close out Minor Non-Compliances.<\/strong><\/p>\n<p class=\"hb-p\">An overdue minor finding is therefore not an administrative delay. It is a live risk of a major finding on a different requirement entirely.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Use One Tracker for Everything<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Separate registers for audits, customer complaints and internal findings hide the pattern that connects them.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Every finding from every source, in one place<\/li><li>Owner, target date and current status<\/li><li>Source and severity, so you can filter<\/li><li>Visible to management, not buried in a quality folder<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Verify Closure With Evidence<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">'Closed' should mean someone independent looked at something.<\/p>\n<ul class=\"hb-ul\"><li>Attach the evidence, not a statement that it exists<\/li><li>Have someone other than the action owner confirm closure<\/li><li>Re-check a sample later to see whether it held<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Look for the Cause, Not the Instance<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Fixing the specific non-conformance and calling it corrective action is why findings repeat.<\/strong><\/p>\n<p class=\"hb-p\">Ask why the system permitted it. The action that follows should change a process, a control or a competence, not just the affected item.<\/p>\n<ul class=\"hb-ul\"><li>Use a structured method rather than an opinion<\/li><li>Distinguish correction from corrective action<\/li><li>Check whether the same weakness exists elsewhere<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Review the Trend at Leadership Level<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">At the top end findings are analysed for trend and drive management system improvement under leadership review.<\/p>\n<p class=\"hb-p\"><strong>Three findings against the same clause in eighteen months is a system problem, and it will be obvious to your auditor before it is obvious to you.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Auditors form a view of an organisation from how it handles what it already knows is wrong. An aged open finding says more than the finding itself.<\/strong><\/p>"},{"id":"QCA06","order":6,"q_ref":"3.6","t":"Management System Policies And Objectives","b":"<p class=\"hb-lead\">Policies are the cheapest thing to get right and the most commonly wrong. To score a 10 they must be current, director-endorsed, communicated to everyone including agency staff, reviewed at least annually, and carry objectives that are monitored.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Meet the Formal Requirements<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS CORE audit protocols set out precisely what is expected of policies:<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Dated and current<\/li><li>Endorsed at top level management, at director level<\/li><li>Covering all areas of the organisation's business<\/li><li>Communicated to all employees on initial induction and following policy changes, and to key suppliers and other interested parties<\/li><li>Reviewed regularly, annually as a minimum<\/li><\/ul>\n<p class=\"hb-p\">Most policy findings are against one of those five, not against the content.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Hold the Full Policy Set Rail Expects<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The protocols expect more than the usual three. As a minimum, policies covering:<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Health and safety<\/li><li>Quality<\/li><li>Environment<\/li><li>Drugs and alcohol<\/li><li>Fatigue management, covering working hours<\/li><li>Data protection<\/li><li>Modern slavery, where applicable<\/li><\/ul>\n<p class=\"hb-p\">Missing drugs and alcohol or fatigue is a common and entirely avoidable finding for a service provider.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Set Objectives You Actually Track<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Three or four objectives per policy, not fifteen<\/li><li>A number, a target and an owner for each<\/li><li>Reported somewhere on a regular cycle<\/li><li>Reviewed and reset when they are met<\/li><\/ul>\n<p class=\"hb-p\"><strong>A policy with no objectives cannot be improved against, and an objective with no data is a slogan.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Communicate It to Everyone on Site<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Communication is a specified requirement. For a service provider the hard part is reach.<\/p>\n<ul class=\"hb-ul\"><li>Induction records covering agency and subcontracted staff, not only employees<\/li><li>A re-issue record after each change, with acknowledgement<\/li><li>Evidence it reached key suppliers and interested parties<\/li><li>A way of reaching people who never come to the office<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Move From Holding a System to Using One<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end the management system genuinely runs the business.<\/strong><\/p>\n<p class=\"hb-p\">Internal audits that change decisions, management reviews that allocate resource, and certification maintained where clients or codes require it with findings closed. No rail requirement compels ISO certification — decide it commercially and be able to explain the decision either way.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Policies are the first thing an auditor reads and the easiest place to lose marks for reasons that have nothing to do with how good your business is.<\/strong><\/p>"},{"id":"QCA07","order":7,"q_ref":"3.7","t":"Legal And Standards Register","b":"<p class=\"hb-lead\">You cannot comply with what you have not identified, and rail documents change often. To score a 10 you need a register scoped to the work you do, recording the issue you are working to, with a named owner and a controlled process that moves procedures, briefings and competence together.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Build the Register the Protocol Expects<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS CORE audit protocols require a register of the legislation and standards that are applicable to the scope of works.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>The legislation that applies to your activities<\/li><li>The Rule Book modules and standards you work to<\/li><li>Client and infrastructure manager standards you have accepted<\/li><li>The issue of each, and when you last checked<\/li><\/ul>\n<p class=\"hb-p\">Scope it to what you do. A register listing everything is unusable.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Record the Issue, Not Just the Title<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Rule Book modules and rail standards reissue regularly, with defined dates on which they come into force.<\/strong><\/p>\n<p class=\"hb-p\">Record which issue you are working to and when you last verified it. Briefing a superseded issue is a serious exposure on site, not a paperwork problem.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Give Someone the Job of Watching<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>A named owner with the review in their objectives<\/li><li>A defined review frequency<\/li><li>Alerts for Rule Book and Sentinel Scheme Rule updates<\/li><li>A route for site staff to flag a change they have been told about elsewhere<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Brief Changes to the Site Teams Affected<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS CORE protocols specifically expect delivery of regular briefings, Rule Book updates and Sentinel Scheme Rule updates.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Identify who is affected by each change<\/li><li>Brief them before the come-into-force date, and record attendance<\/li><li>Check afterwards that it is being applied<\/li><li>Cover subcontracted and agency staff, who often miss the briefing<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Implement Through Controlled Change<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end changes are horizon scanned, assessed for business impact at senior level, and implemented through a controlled process.<\/strong><\/p>\n<p class=\"hb-p\">Procedures, briefings and competence requirements should all move together on a planned date.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Compliance failures are rarely refusals. They are almost always a competent person working diligently to a Rule Book issue that changed last month.<\/strong><\/p>"},{"id":"QCA08","order":8,"q_ref":"3.8","t":"Managing Multiple Qualification Routes","b":"<p class=\"hb-lead\">Rail runs more than one qualification scheme and they are not interchangeable. To score a 10 you need to know which your target buyers actually use, manage your position under each, and treat the portfolio as a commercial decision owned at leadership level.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know That There Is More Than One Route<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS is the principal scheme. Achilles Link-up is the rail sector scheme operated as an alternative route: its Audit Scheme Rule Book states that the Link-Up Audit provides Achilles customers with assurance and visibility of a supplier's level of compliance against one or more Network Rail Supplier Qualification modules.<\/strong><\/p>\n<p class=\"hb-p\">Note that Link-up is the rail scheme. UVDB is the utilities scheme and is not the same thing, which is a common and costly confusion.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Find Out What Your Buyers Actually Use<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Ask them. This takes one email and it is the highest-value action on this question.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Which scheme each target buyer searches<\/li><li>Which modules or codes they filter on<\/li><li>Whether a framework you want requires a particular scheme<\/li><li>Whether a principal contractor imposes their own additional qualification<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Manage Each Position Actively<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Track modules or codes held under each scheme<\/li><li>Track questionnaire completeness and audit status<\/li><li>Track renewal dates, and start early<\/li><li>Keep the same capability story consistent across schemes<\/li><\/ul>\n<p class=\"hb-p\"><strong>Qualification lapsing mid-bid is an avoidable and unrecoverable way to lose work.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Decide Deliberately What Is Worth Holding<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Schemes cost money and audit time. That makes the portfolio a commercial decision, not an administrative default.<\/p>\n<ul class=\"hb-ul\"><li>What does each scheme actually open<\/li><li>What does it cost, including internal time<\/li><li>Is there a buyer you would win work from if you held it<\/li><li>Is there one you are paying for and gaining nothing from<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Own It at Leadership Level<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end qualification is managed as one portfolio serving a route to market.<\/strong><\/p>\n<p class=\"hb-p\">Put the decision in front of the leadership team with the cost and the expected return, and revisit it when your target market changes.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Being invisible on the scheme your best prospect uses is indistinguishable, from their side, from not existing.<\/strong><\/p>"}]},"leadership_gov":{"color":"#60a5fa","label":"Leadership & Governance","order":4,"chapters":[{"id":"LDG01","order":1,"q_ref":"4.1","t":"Leadership Commitment To Rail Safety","b":"<p class=\"hb-lead\">Rail clients read leadership before they read your procedures. To score a 10 here you need more than a signed policy: your gangs have to be able to say what leadership expects of them, and you need at least one decision on record where you stood a job down and accepted the programme hit.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Say What You Actually Expect<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Write down the railway-specific expectations, not generic safety slogans.<\/strong><\/p>\n<p class=\"hb-p\">A useful statement names the behaviours you want at 2am when the possession is running late. For site work that usually means:<\/p>\n<ul class=\"hb-ul\"><li>Stopping work when the safe system of work does not match what you found<\/li><li>Reporting a Close Call even when it makes the shift look bad<\/li><li>Refusing to start without the right competence on site<\/li><li>Telling the client early that you will not finish, rather than rushing the last hour<\/li><\/ul>\n<p class=\"hb-p\">Keep it to a page. A statement nobody can remember at the end of a night shift is a statement nobody will follow.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Give It a Regular Channel<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Pick channels your site people actually attend and use them consistently:<\/p>\n<ul class=\"hb-ul\"><li>Pre-work briefings and shift handovers<\/li><li>Safety stand-downs after an event, and periodically when nothing has happened<\/li><li>Senior safety tours with a structure, not a visit<\/li><li>A short written brief when the client raises something<\/li><\/ul>\n<p class=\"hb-p\"><strong>Frequency beats polish. A rough monthly message lands better than an immaculate annual one.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Check It Landed<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">This is the step most organisations skip, and it is the one assessors ask about.<\/p>\n<ul class=\"hb-ul\"><li>Ask people on site what they believe leadership expects, and write down what they say<\/li><li>Put a question in your staff survey on whether people believe they can stop work<\/li><li>Compare what supervisors brief against what the senior team believes it said<\/li><\/ul>\n<p class=\"hb-p\">Where the answers come back thin, that is your starting point. Showing you looked is worth more than assuming you already knew.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Make One Costly Decision Visible<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Nothing evidences leadership commitment like a decision that hurt.<\/strong><\/p>\n<p class=\"hb-p\">Hold a record of a shift you stood down, a possession you handed back early, or a job you declined because you could not resource it competently. Record the decision, who took it, and what it cost in programme or margin.<\/p>\n<p class=\"hb-p\">Then tell people about it. A decision nobody hears about changes nothing.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Push It Down to Supervisors and Controllers<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Leadership that stops at the office is not a culture, it is a communications exercise. ORR's maturity model is explicit that identifying and promoting the right leadership styles at all levels is what supports a positive culture.<\/p>\n<ul class=\"hb-ul\"><li>Give supervisors and controllers of site safety the same messages and the standing to repeat them<\/li><li>Recognise the supervisor who stopped a job, publicly<\/li><li>Reflect the expectations in objectives and appraisals, so they carry weight<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: A supplier whose site teams cannot describe what leadership expects will not stop work when it matters, and rail clients know it. This question is where assessors form their first impression of everything else.<\/strong><\/p>"},{"id":"LDG02","order":2,"q_ref":"4.2","t":"Governance, Oversight And Accountabilities","b":"<p class=\"hb-lead\">Governance is not a diagram. To score a 10 here you have to show that someone senior owns rail work, that they see real information about it often enough to act, and that when a measure moved the wrong way they did something visible about it.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Name Who Is Accountable<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Put a name against rail work at senior level, not a function.<\/strong><\/p>\n<p class=\"hb-p\">Set out, in writing:<\/p>\n<ul class=\"hb-ul\"><li>Who is accountable for rail safety, quality and delivery<\/li><li>Who owns each specific rail obligation, such as scheme registration, competence, or customer reporting<\/li><li>Who deputises when they are away<\/li><\/ul>\n<p class=\"hb-p\">Where the same person holds several of these, say so. A small organisation with one accountable director and a clear list beats a large one with an ambiguous matrix.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Decide What They See, and How Often<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Governance fails most often because the information arrives too late or too smooth. Agree a short reporting pack and a fixed rhythm:<\/p>\n<ul class=\"hb-ul\"><li>Safety and quality performance, including the things that went wrong<\/li><li>Open findings and their age<\/li><li>Customer or client escalations<\/li><li>Competence, resource or capability exposures<\/li><\/ul>\n<p class=\"hb-p\"><strong>Six real measures reviewed monthly is worth more than thirty reviewed annually.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Give It Terms of Reference<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Whatever your governing body is called, write down its membership, frequency, quorum and what it decides. ORR's maturity model expects an effective board to set direction, define the arrangements for managing risk, ensure resources are provided, and delegate through a structure and a management system.<\/p>\n<p class=\"hb-p\">Keep minutes that record decisions, not attendance.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Build a Route for Conflicts<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Acknowledge that safety and quality will sometimes conflict with cost and delivery, and say how that gets resolved.<\/strong><\/p>\n<p class=\"hb-p\">The maturity model expects the potential for conflict between safety and other business objectives to be acknowledged and minimised, with a process for resolving it. In practice that means:<\/p>\n<ul class=\"hb-ul\"><li>A stated escalation route when someone believes a commercial decision is unsafe or non-compliant<\/li><li>Authority levels that say who can accept what<\/li><li>Evidence that the route has been used at least once<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Move From Reporting to Challenge<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">This is the difference between a 7 and a 10. At 7 the senior team is informed. At 10 it argues with what it is shown.<\/p>\n<ul class=\"hb-ul\"><li>Test the assumptions behind a favourable number before accepting it<\/li><li>Ask what the data does not cover<\/li><li>Compare yourself against something external rather than only against last month<\/li><li>Direct resource at the weakest area, and record that you did<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Rail buyers are themselves regulated and governed, and they recognise real governance quickly. A framework that only confirms good news is the one that misses the problem that reaches your customer.<\/strong><\/p>"},{"id":"LDG03","order":3,"q_ref":"4.3","t":"Supervision And Visible Leadership","b":"<p class=\"hb-lead\">Supervision is where the safe system of work either happens or does not. To score a 10 you need defined accountabilities for managers and supervisors, spans of control you have actually assessed for dispersed night work, and evidence that what supervision finds changes something.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Write Supervision Into the Role<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Put safety duties in supervisor and controller role profiles, and assess them at appraisal.<\/strong><\/p>\n<p class=\"hb-p\">Be specific about what each is responsible for:<\/p>\n<ul class=\"hb-ul\"><li>Confirming the safe system of work matches what is actually on the ground<\/li><li>Briefing the gang and confirming it was understood<\/li><li>Checking completed work and the state of the site at handback<\/li><li>Raising and recording problems rather than absorbing them<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Assess Your Spans of Control<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">ORR's maturity model requires that adequate supervision is provided, with spans of control and supervisory ratios that are appropriate and realistic, taking account of the nature of the work, the dispersion of staff and human factors.<\/p>\n<p class=\"hb-p\"><strong>For dispersed night work that is a calculation, not an assumption. Do it and write it down.<\/strong><\/p>\n<p class=\"hb-p\">Count how many worksites one supervisor covers on a night shift, how far apart they are, and how much of the shift is spent driving rather than supervising. If the honest answer is that they cannot reach every site, the ratio is wrong regardless of what the org chart says.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Give Supervision a Structure<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Unstructured presence produces unstructured findings. Give supervisors something to look at and somewhere to record it:<\/p>\n<ul class=\"hb-ul\"><li>A short site inspection or safe system of work check sheet<\/li><li>A defined frequency and coverage across sites and shifts<\/li><li>A place to record what was found and what was done<\/li><li>A route for anything they cannot fix on the night<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Close the Loop<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Findings that go nowhere teach supervisors that looking is pointless.<\/strong><\/p>\n<p class=\"hb-p\">Track what supervision raises alongside your Close Calls and audit findings, and make sure at least some of it visibly changes a method, a briefing or the way a site is set up. Then tell the supervisor who raised it.<\/p>\n<p class=\"hb-p\">Be able to point at one change to a safe system of work and trace it back to a supervisory observation.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Develop the Non-Technical Skills<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Most supervisors are promoted for technical ability and then asked to coach, challenge and have difficult conversations at three in the morning. Those are separate skills and they can be taught.<\/p>\n<ul class=\"hb-ul\"><li>Coaching and giving feedback<\/li><li>Challenging upwards without confrontation<\/li><li>Running an effective pre-work briefing<\/li><li>Recognising fatigue and pressure in their gang<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Supervisors are the only management layer most of your site workforce ever experiences. If supervision is stretched across too many sites, everything above it is theory.<\/strong><\/p>"}]},"human_perf":{"color":"#a78bfa","label":"Human Performance","order":5,"chapters":[{"id":"HUP01","order":1,"q_ref":"5.1","t":"Competence Management System","b":"<p class=\"hb-lead\">A wallet full of cards is not a competence management system. A card shows an assessment once happened; it does not show competence is currently held. To score a 10 you need a system built from activities and risk, with workplace monitoring, reassessment, and audit of the system itself.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Start From Activities and Risk, Not From Cards<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>ORR's guidance sets out fifteen principles across five phases, and the first phase is establishing requirements: identify activities and assess risks, then select standards.<\/strong><\/p>\n<p class=\"hb-p\">Competence and fitness are required by the Railways and Other Guided Transport Systems (Safety) Regulations 2006 in Part 4 on safety critical work — a legal duty, not good practice.<\/p>\n<ul class=\"hb-ul\"><li>List the activities your people actually perform on site<\/li><li>Assess which carry safety risk, and how much<\/li><li>Set the standard competence will be measured against<\/li><li>Then decide what training and assessment delivers it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Design the System Before You Run It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Phase two covers developing procedures and methods, deciding how to meet the standards, establishing training and assessment requirements, and maintaining managers' competencies.<\/p>\n<p class=\"hb-p\"><strong>Supervisors, controllers of site safety and assessors need maintained competence too. An assessor whose own competence has lapsed invalidates everything they signed.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Control What People Are Allowed to Do on Site<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Phase three is implementation: select and recruit, train, develop and assess, and control activities undertaken.<\/p>\n<ul class=\"hb-ul\"><li>An authorisation record saying what each person may do, not just what card they hold<\/li><li>A check before the shift that the person is authorised for that role on that job<\/li><li>A defined route for someone gaining experience under supervision<\/li><li>Automatic removal of authorisation on lapse, not removal by memory<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Monitor in the Workplace, Not Just at Renewal<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Phase four is where most systems stop. Monitoring and reassessing performance, updating competence, managing sub-standard performance, and keeping records.<\/strong><\/p>\n<p class=\"hb-p\">Workplace monitoring means watching someone do the job on a real shift, not reviewing their file. Have a fair route for sub-standard performance that is not automatically removal from site — most shortfalls are training or supervision problems.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Audit the System Itself<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Phase five is verify, audit and review the system, and it is the difference between a 7 and a 10.<\/p>\n<ul class=\"hb-ul\"><li>Audit whether assessments are being done properly, not just whether they exist<\/li><li>Check that records match who is actually turning up<\/li><li>Review the system when work, technology or organisation changes<\/li><li>Include non-technical skills — communication, situational awareness, decision making<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Competence is a legal requirement for safety critical work and the first thing a client probes. Managing to card expiry dates alone leaves the substance entirely unmanaged.<\/strong><\/p>"},{"id":"HUP02","order":2,"q_ref":"5.2","t":"Human Factors And Error Prevention","b":"<p class=\"hb-lead\">Human error is a predictable consequence of how work is set up, not a character flaw — and night work, handovers and end-of-possession pressure make it more likely. To score a 10 you need error considered when safe systems of work are planned, and investigations that reach underlying causes.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Adopt the Principle<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's guidance on applying human factors within safety management systems states principle P2.1: identify underlying causes that influence human performance and do not focus solely on an individual's actions.<\/strong><\/p>\n<p class=\"hb-p\">The same guidance reports the ten incident and human performance factors identified in trackworker near misses, so this is not abstract for site work.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Design Error Out of the Safe System of Work<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The guidance covers applying human factors in the design and re-design of procedures, systems, tasks and equipment, and in supporting change management.<\/p>\n<ul class=\"hb-ul\"><li>Brief at a time when people can absorb it, not at the end of a long journey<\/li><li>Make handovers structured, with a defined minimum content<\/li><li>Consider lighting, weather, noise and fatigue when planning the method<\/li><li>Plan for the last hour of the possession, when pressure peaks and shortcuts appear<\/li><\/ul>\n<p class=\"hb-p\"><strong>A control that depends on someone being careful at 4am is not a control.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Bring Human Factors Into Change<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">When the plan changes on the night — a different worksite, a shortened possession, a substituted person in charge — error risk rises sharply and nobody reassesses.<\/p>\n<ul class=\"hb-ul\"><li>Have a defined re-brief when the plan changes materially<\/li><li>Say who can authorise a change on site, and who cannot<\/li><li>Check that everyone heard it, including anyone who arrived late<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Investigate Past the Individual<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>If an investigation concludes with what someone did, it has stopped one step early.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>What made the error likely, or easy<\/li><li>What defences should have caught it and did not<\/li><li>Would a competent colleague, on that shift, have done the same<\/li><li>Was the plan achievable in the time available<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Trend, Involve and Learn From Success<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you look across incidents and Close Calls for trends in underlying causes, involve front-line staff in safety decisions, and learn from shifts that went well.<\/strong><\/p>\n<p class=\"hb-p\">Studying why work normally succeeds tells you what your gangs are quietly compensating for. That is the failure waiting to happen when the person who usually compensates is off.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: You cannot train people out of being human, least of all on a night shift. The safest organisations design work so that care is not the last line of defence.<\/strong><\/p>"},{"id":"HUP03","order":3,"q_ref":"5.3","t":"Fatigue Policy And Ownership","b":"<p class=\"hb-lead\">Fatigue is the defining risk of night and possession work. To score a 10 you need a written policy saying what you will do, who will do it and how, an explicit position on what happens when someone is too tired to continue, and account taken of travel to and from remote sites.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Write the Policy the Guidance Describes<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's guidance states that the purpose of a Fatigue Policy is to set out a dutyholder's intention regarding their aims for managing fatigue, what they will do, who will do it and how they will do it.<\/strong><\/p>\n<p class=\"hb-p\">RISQS CORE audit protocols also expect a fatigue management policy covering working hours, so this is a scheme requirement as well as good practice.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Say What Happens at 2am With the Job Unfinished<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is the clause that makes the policy real, and the one most often missing.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>What a person should do if they believe they are too tired to work safely<\/li><li>What the person in charge at the worksite must do in response<\/li><li>That making that call will not be penalised, and will not cost them the next shift<\/li><li>Who is contactable out of hours to authorise cover<\/li><\/ul>\n<p class=\"hb-p\">Without this, the decision falls to whoever is on the worksite, under possession pressure, with nothing to point at.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Count the Whole Door-to-Door Day<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Travel is the hidden part of a site shift and the part most often excluded from the policy.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Time from leaving home to arriving at the worksite<\/li><li>Time from handback to arriving home<\/li><li>Who is driving, and how far, after a twelve-hour night<\/li><li>Whether accommodation is provided for distant work, and when<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Name Responsibilities<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Who owns the policy<\/li><li>Who plans and approves rosters and overtime<\/li><li>Who monitors actual hours<\/li><li>Who can stand someone down, and who authorises replacement cover at short notice<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Own It at Director Level and Extend It<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end the policy is owned and signed at director level, consulted on with staff representatives, reviewed on a defined cycle, and extended to agency and subcontracted resource.<\/strong><\/p>\n<p class=\"hb-p\">A worker who has already done a shift for another employer is your risk the moment they arrive on your worksite. Ask the question at mobilisation.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Fatigue degrades attention, judgement and the willingness to speak up — the three things a night possession depends on entirely. It is invisible until it produces an incident.<\/strong><\/p>"},{"id":"HUP04","order":4,"q_ref":"5.4","t":"Monitoring Actual Working Patterns","b":"<p class=\"hb-lead\">Rosters are designed within limits and then worked outside them, and for site work travel does most of the damage. To score a 10 you need to measure what people actually worked door to door, compare it against your own standards, and act on the exceedances.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Measure Actual, Not Planned<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RSSB's guidance states that to be effective, a fatigue risk management system should incorporate procedures for measuring and monitoring the levels of fatigue of actual, not only planned, working patterns.<\/strong><\/p>\n<p class=\"hb-p\">A compliant roster tells you what you intended. It tells you nothing about the possession that overran by three hours followed by a two-hour drive home.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Capture Everything That Adds Hours<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Overtime, planned and unplanned<\/li><li>Travel to and from the worksite, both ways<\/li><li>Overrun at handback<\/li><li>Shift exchanges and swaps between individuals<\/li><li>Cover for absence<\/li><li>Shifts worked for other employers, where you can establish them<\/li><\/ul>\n<p class=\"hb-p\"><strong>Travel and overrun are the two that turn a compliant twelve-hour shift into an eighteen-hour day.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Set Your Own Limits and Mean Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Set limits appropriate to night and weekend work and write them down. Then enforce them.<\/p>\n<p class=\"hb-p\"><strong>A monitored limit that is never enforced is worse than no limit at all: it documents that you knew and did nothing.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Define what constitutes an exceedance<\/li><li>Define who is notified and what they must do<\/li><li>Record the action taken, including where you accepted the risk and why<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=
