known that principal contractors subcontract, but there is no planned approach and registrations are not maintained.","feedback":"Routes to market are pursued opportunistically. Lapsed or inaccurate registrations mean opportunities are missed before they are ever seen.","goalFeedback":""},{"score":7,"desc":"The organisation knows where its capability sits in the tiers, pursues direct and subcontract routes in a planned way, and keeps its registrations and pipeline monitoring current.","feedback":"Routes to market are understood and pursued in a planned way, with registrations maintained and pipelines monitored.","goalFeedback":"Identify the principal contractors and framework holders relevant to the work you do, and pursue them alongside direct opportunities rather than instead of them. Keep every registration and portal profile accurate and current, including the scope you are registered against, and give someone responsibility for reviewing pipelines regularly."},{"score":10,"desc":"A route to market strategy is set at leadership level, covers direct and tiered routes, feeds a qualified opportunity plan, and is reviewed against results.","feedback":"Route to market is a leadership-owned strategy feeding a qualified opportunity plan, and is reviewed against results and changing contracting models.","goalFeedback":"Turn pipeline monitoring into a qualified opportunity plan with explicit bid or no bid decisions, and review win and loss outcomes to improve. Revisit the strategy when contracting models change, because the tier you work in can change with them."}]},{"statement":"Is your organisation prepared for changes in how its rail clients are structured and how they buy?","topic":"Readiness For Industry Change","handbookUrl":"https://nuccol.co.uk/railready-rail-industry-fundamentals-readiness-for-industry-change/","options":[{"score":0,"desc":"The organisation is unaware that the bodies it works for are being reorganised.","feedback":"A structural change to the client base is approaching unnoticed. Relationships and framework positions built on the current structure are at risk.","goalFeedback":""},{"score":2,"desc":"Individuals have picked up news of the change, but no assessment has been made of what it means.","feedback":"The change is known about but has not been thought through, so no preparation has begun.","goalFeedback":""},{"score":7,"desc":"Published material is followed, the direction of the change is understood, and management has assessed what it means for clients, contacts and routes to market.","feedback":"The direction of industry change is understood and its implications for the business have been assessed at management level.","goalFeedback":"Assess at management level which of your relationships and framework positions depend on the structure as it stands today, and where a reorganisation would put those decisions instead. Understanding that infrastructure and operations are being brought together locally tells you where to build new relationships."},{"score":10,"desc":"Industry transition is a standing item in leadership risk and strategy review, with a named owner and plans adjusted as published detail changes.","feedback":"Industry transition is actively owned at leadership level, with mapped impacts and plans that are adjusted as published detail changes.","goalFeedback":"Hold it as a standing risk and strategy item with a named owner and a mapped view of affected clients and relationships. Adjust the plan as published detail firms up, rather than waiting for the change to complete and then reacting."}]}],"excellence":"Suppliers to the GB mainline railway work inside a regulated, publicly funded system with its own multi-year funding cycle, its own organisational structure and its own published performance measures. Service providers who understand what their clients are being held to account for, how those clients are funded, and how work is advertised and qualified for, compete far more effectively than those relying on informal contacts. This module assesses how well your organisation understands the industry it works in, and how deliberately it uses that understanding to plan, position and bid."},"Rail Safety Culture":{"questions":[{"statement":"Does your organisation actively find out what its safety culture is on site, rather than assuming it?","topic":"Understanding Your Safety Culture","handbookUrl":"https://nuccol.co.uk/railready-rail-safety-culture-understanding-your-safety-culture/","options":[{"score":0,"desc":"Safety culture is never discussed or assessed.","feedback":"Culture is neither described nor measured, so any statement made about it in a tender is untested.","goalFeedback":""},{"score":2,"desc":"Leadership has a view on the culture, but it is not tested with the site workforce.","feedback":"A management view of culture exists but has not been checked against what people on site experience, and the two often differ.","goalFeedback":""},{"score":7,"desc":"Culture is assessed periodically using a recognised method, and the findings are shared and acted on.","feedback":"Safety culture is assessed and the findings are acted on, giving a real rather than assumed picture.","goalFeedback":"Use a recognised approach such as a safety culture or safety climate assessment rather than a general staff survey, and gather informal intelligence during site inspections and investigations as well. Share what you find with the workforce, including the uncomfortable parts, and act on it visibly."},{"score":10,"desc":"Culture is understood at the level of individual sites and gangs, and is deliberately shaped as part of the safety management system.","feedback":"Safety culture is understood at site and team level, deliberately shaped and tracked over time as part of the safety management system.","goalFeedback":"Recognise that different cultural characteristics matter in different parts of the business, and set out a culture strategy as part of your safety management system. Track how the picture changes across sites and shifts, and use it to direct effort where the culture is weakest."}]},{"statement":"Do your people report Close Calls from site, and does the organisation act on them?","topic":"Close Call And Near Miss Reporting","handbookUrl":"https://nuccol.co.uk/railready-rail-safety-culture-close-call-and-near-miss-reporting/","options":[{"score":0,"desc":"There is no route for site staff to report a Close Call.","feedback":"Nothing is captured before it becomes an accident, and you will be unable to demonstrate Close Call reporting to a principal contractor or to Network Rail.","goalFeedback":""},{"score":2,"desc":"People can raise concerns informally, but few do and nothing is recorded.","feedback":"Reporting depends on individuals speaking up to the right person. With no record there is no trend and no evidence of action.","goalFeedback":""},{"score":7,"desc":"A formal Close Call process is in place, reports are recorded and closed out, and reporters get feedback.","feedback":"Close Call reporting is formal, recorded and closed out, with feedback to reporters.","goalFeedback":"Make sure the reporting route works from the worksite and out of hours, that people know to recognise, respond and report rather than only to report, that every report gets a visible response, and that reporters hear what happened as a result."},{"score":10,"desc":"Reporting is high across all sites, trends are analysed to find areas of high risk, and learning is shared with clients and subcontractors.","feedback":"Close Call reporting is strong across sites, trends are analysed to identify areas of high risk, and learning is shared with clients and subcontractors.","goalFeedback":"Use the data strategically as well as tactically. Analyse trends to identify areas of high risk rather than only fixing individual reports, share learning with your client and your subcontractors, and treat a falling reporting rate on a site as a warning rather than an improvement."}]},{"statement":"Does your organisation respond fairly and consistently when something goes wrong on site?","topic":"Just Culture And Response To Error","handbookUrl":"https://nuccol.co.uk/railready-rail-safety-culture-just-culture-and-response-to-error/","options":[{"score":0,"desc":"The response to an error is to remove the individual from site or to discipline them.","feedback":"A blame response drives reporting underground. Fear prevents open communication about risk, and the organisational causes are never found.","goalFeedback":""},{"score":2,"desc":"The response varies with the supervisor and the seriousness of the outcome.","feedback":"Without an agreed approach the same behaviour is treated differently on different sites, which staff read as unfairness whichever way it falls.","goalFeedback":""},{"score":7,"desc":"A documented just culture approach distinguishes honest error from negligence, and is applied consistently across sites.","feedback":"A just culture approach is documented and consistently applied, distinguishing honest error from negligence.","goalFeedback":"Write down what counts as acceptable and unacceptable behaviour so expectations are transparent, and gain the workforce's agreement to it. When judging culpability, apply a test such as asking whether a comparably competent colleague in the same circumstances would have behaved differently."},{"score":10,"desc":"The just culture approach is trusted by the site workforce and demonstrably shifts attention to organisational causes.","feedback":"The just culture approach is trusted by site staff and demonstrably directs attention to underlying organisational weaknesses rather than to individuals.","goalFeedback":"Sustain trust by showing where the approach has led you to change a safe system of work rather than to sanction a person, reviewing decisions for consistency across sites, and checking with staff whether they believe the system is fair. Trust is the outcome that matters, not the policy."}]},{"statement":"Do your site staff and subcontractors have a confidential route to raise a safety concern they do not feel able to raise internally?","topic":"Confidential Safety Reporting","handbookUrl":"https://nuccol.co.uk/railready-rail-safety-culture-confidential-safety-reporting/","options":[{"score":0,"desc":"There is no confidential route, only the supervisory chain.","feedback":"Anyone who does not feel able to speak to their supervisor has nowhere to go, so those concerns simply do not surface.","goalFeedback":""},{"score":2,"desc":"A confidential route exists on paper, but site staff are unaware of it or doubt it is confidential.","feedback":"The channel exists but is not trusted or not known about, which produces the appearance of assurance without the substance.","goalFeedback":""},{"score":7,"desc":"An independent confidential reporting channel is in place, publicised at site level, and available to subcontractors as well as direct staff.","feedback":"An independent confidential channel is in place and publicised on site, and concerns raised through it receive a response.","goalFeedback":"Publicise the channel at every site rather than once at induction, make clear how confidentiality is protected, and respond to what comes through it in a way people can see. Extend it across contractual boundaries so a subcontractor's worker can raise a concern about your site."},{"score":10,"desc":"Confidential reporting is used as leadership intelligence, with trends reviewed at senior level and learning shared across the contract chain.","feedback":"Confidential reporting is treated as leadership intelligence, reviewed at senior level and used to surface concerns that cross contractual boundaries.","goalFeedback":"Use the data as an independent test of what you believe about your culture. Review the trends in what is reported confidentially, and why people chose that route, at senior level, and share learning and corrective actions with your client and subcontractors."}]},{"statement":"Are your site teams involved in identifying safety risks and improving how work is done?","topic":"Workforce Involvement In Safety","handbookUrl":"https://nuccol.co.uk/railready-rail-safety-culture-workforce-involvement-in-safety/","options":[{"score":0,"desc":"Safety decisions are made by management alone, with no input from the people doing the work.","feedback":"The people who know most about how the work is actually done on site have no way to influence how it is controlled.","goalFeedback":""},{"score":2,"desc":"Site staff are consulted occasionally, usually after a method has been fixed.","feedback":"Involvement is presentational rather than real, and site teams will recognise it as such.","goalFeedback":""},{"score":7,"desc":"There are established arrangements for site teams to contribute to risk assessment and safe systems of work, and contributions are acted on.","feedback":"Workforce involvement in safety is established and contributions are acted on, though reach may be uneven across sites and subcontractors.","goalFeedback":"Involve the gang early, while the safe system of work is still being planned rather than after it is issued. Make sure the arrangements reach subcontracted and agency workers as well as direct staff, and close the loop by telling people what changed as a result of what they said."},{"score":10,"desc":"Involvement is embedded, with everyone on site expected to question and improve controls as part of normal work.","feedback":"Workforce involvement is fully embedded, with a questioning attitude and challenge treated as normal at every level on site.","goalFeedback":"Sustain a questioning attitude at every level, including the freedom to stop work or challenge a plan issued from the office. Support it with work groups that own improvements, and treat the absence of challenge from a site as a warning sign rather than as agreement."}]}],"excellence":"Safety culture is what your people do at two in the morning when nobody is checking. This section looks at whether your organisation understands its own culture rather than assuming it, whether close calls are reported freely from the worksite, how you respond when someone makes a mistake, and whether your workforce has a route to raise a concern they cannot raise with their supervisor. Rail clients judge suppliers on this as much as on paperwork."},"Quality and Compliance":{"questions":[{"statement":"Does your organisation keep its supplier qualification information accurate and current?","topic":"Accuracy Of Qualification Information","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-accuracy-of-qualification-information/","options":[{"score":0,"desc":"There is no reliable picture of what the organisation's qualification records currently say about it.","feedback":"Nobody knows what buyers can see. The organisation may be presenting capability it no longer has, or hiding capability it does.","goalFeedback":""},{"score":2,"desc":"Details are updated occasionally, usually when someone chases.","feedback":"Records drift out of date between prompts, so what a buyer sees is a snapshot of an earlier business.","goalFeedback":""},{"score":7,"desc":"A named owner keeps registration details, documents and capability claims accurate and current.","feedback":"Qualification information is accurate and current, with clear ownership, though the process may not yet be joined up with bidding.","goalFeedback":"Give one person clear ownership, and make sure what you claim reflects what you can genuinely resource, including realistic limits on volume and the geography you can actually cover. Overstating capability is a faster route to losing a client than declining the work."},{"score":10,"desc":"Accuracy is managed as a business process, reviewed by leadership and linked to bid and contract activity.","feedback":"Qualification information is managed as a governed business process, reviewed by leadership and aligned with bid and contract activity.","goalFeedback":"Link the record to what the business is actually pursuing, so a change in resource or competence reaches the record before it reaches a bid. Review it at leadership level rather than leaving it to administration."}]},{"statement":"Does your organisation understand the qualification and assurance requirements that apply to the services it provides?","topic":"Assurance Requirements For What You Supply","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-assurance-requirements-for-what-you-supply/","options":[{"score":0,"desc":"It is not known which codes the organisation holds or what assurance each one requires.","feedback":"The organisation cannot tell whether it is qualified for the work it is bidding for, or what it would have to pass to become so.","goalFeedback":""},{"score":2,"desc":"Codes were selected at registration and have not been revisited since.","feedback":"Selections made once, often at speed, still govern what buyers can see and what assurance the organisation is exposed to.","goalFeedback":""},{"score":7,"desc":"Codes are reviewed deliberately, the assurance level attached to each is understood, and only codes that can be evidenced are held.","feedback":"Code holdings and their assurance requirements are understood and deliberately managed.","goalFeedback":"Understand that the assurance required depends on both the service and the lifecycle phase, so the same discipline can carry different requirements at construction and at maintenance. Note which of your codes are affected by the construction regulations. Hold only what you can evidence, and prepare for the assurance activity each code brings before you claim it."},{"score":10,"desc":"Code selection is reviewed with commercial and technical input, tracked against market strategy, and challenged where classification looks wrong.","feedback":"Code selection is a governed decision informed by technical and commercial input, aligned to strategy and challenged where it appears misclassified.","goalFeedback":"Bring technical and commercial people to the review together, so codes follow the strategy rather than history. Where you believe a classification is wrong for the work you actually do, raise it through the proper route rather than working around it."}]},{"statement":"Does your organisation control the scope of its qualification, so that it only takes on work it has been assured for?","topic":"Control Of Assured Scope","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-control-of-assured-scope/","options":[{"score":0,"desc":"There is no check on whether work taken on falls inside the assured scope.","feedback":"The organisation may already be working outside its scope on the railway infrastructure. Discovery of that at audit can bring a limitation or a suspension.","goalFeedback":""},{"score":2,"desc":"Scope is considered informally at bid stage but is not documented or checked consistently.","feedback":"Scope is a matter of individual judgement, so an unfamiliar enquiry can be accepted before anyone checks.","goalFeedback":""},{"score":7,"desc":"Enquiries and bids are checked against the assured scope, and extensions to scope are arranged before the work is taken on.","feedback":"Assured scope is checked before work is accepted, and extensions are arranged in advance.","goalFeedback":"Build the scope check into your bid or work acceptance process so it cannot be skipped under mobilisation pressure, and start any scope extension early enough that assurance is in place before you go to site rather than after."},{"score":10,"desc":"Scope control is embedded in governance, with limitations, restrictions and their causes tracked and acted on by leadership.","feedback":"Scope control is embedded in governance, and limitations and their root causes are owned and acted on at leadership level.","goalFeedback":"Track any limitations or restrictions placed on your qualification, and treat their causes as a governance matter rather than an administrative one. Where scope repeatedly constrains the business, decide deliberately whether to extend it or to stop pursuing that work."}]},{"statement":"Does your organisation prepare properly for assurance audits, including submitting evidence in advance when the scheme requires it?","topic":"Audit Readiness And Evidence","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-audit-readiness-and-evidence/","options":[{"score":0,"desc":"No preparation is made, and evidence is assembled only when the auditor asks for it.","feedback":"Audits are met unprepared. Findings that follow are usually about the absence of records rather than the absence of practice.","goalFeedback":""},{"score":2,"desc":"Preparation is a last minute effort by one or two people shortly before the audit date.","feedback":"Readiness rests on a short burst of effort by a few individuals, and any absence at the wrong moment leaves the organisation exposed.","goalFeedback":""},{"score":7,"desc":"Each audit is planned, required evidence is gathered and submitted within the scheme's timescales, and the people involved are briefed.","feedback":"Audits are planned for, evidence is submitted on time and staff are briefed.","goalFeedback":"Note that some schemes review a portion of your management system before the visit, so late submission costs you before the auditor arrives. Brief the supervisors and site staff who may be interviewed, so they can describe what they actually do rather than reciting a procedure."},{"score":10,"desc":"Audit readiness is continuous, tested by the organisation's own internal reviews, and owned by senior management.","feedback":"Audit readiness is continuous, internally tested and owned at senior level rather than created for the visit.","goalFeedback":"Keep evidence in a state where an audit could begin at short notice, and test that with your own internal site and system reviews rather than waiting for the external one. Own readiness at senior level so it is a property of the business rather than a project."}]},{"statement":"Does your organisation close out audit findings and non-conformances with corrective action that prevents recurrence?","topic":"Non-Conformance Close-Out","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-non-conformance-close-out/","options":[{"score":0,"desc":"Findings are received but are not tracked or closed in any structured way.","feedback":"Findings accumulate unaddressed. Failure to close a minor finding can itself escalate into a major one.","goalFeedback":""},{"score":2,"desc":"Findings are responded to individually, but there is no tracker and closure is not verified.","feedback":"Action is taken but not evidenced or checked, so the organisation cannot show closure and the same finding tends to return.","goalFeedback":""},{"score":7,"desc":"All findings are logged with owners and target dates, and closure is verified with evidence.","feedback":"Findings are tracked, owned and closed with verified evidence.","goalFeedback":"Keep one tracker for findings from every source, including client site audits and your own inspections, with an owner and a date each. Verify closure with evidence rather than assertion, and treat an overdue minor finding as a live risk rather than an administrative delay."},{"score":10,"desc":"Findings are analysed for root cause and trends, and used to improve the management system, with leadership review.","feedback":"Findings are analysed for root cause and trend, and drive management system improvement under leadership review.","goalFeedback":"Look past the individual finding to why the system allowed it, and act on the pattern rather than the instance. Review trends across sites at leadership level so repeat findings drive a change to the system rather than another corrective action."}]},{"statement":"Does your organisation have management system policies for quality, environment and health and safety that set objectives and are actually used?","topic":"Management System Policies And Objectives","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-management-system-policies-and-objectives/","options":[{"score":0,"desc":"No management system policies exist for quality, environment or health and safety.","feedback":"There is nothing stating what the organisation commits to, so nothing to manage against and nothing a client can rely on.","goalFeedback":""},{"score":2,"desc":"Policies exist but are undated, unendorsed or not communicated, and set no objectives.","feedback":"Policies exist as documents rather than as commitments. Without objectives they cannot be monitored or improved against.","goalFeedback":""},{"score":7,"desc":"Current policies are endorsed at director level, communicated, reviewed at least annually, and set objectives that are monitored.","feedback":"Policies are current, endorsed, communicated and carry monitored objectives.","goalFeedback":"Make sure each policy is dated, endorsed at director level, covers the whole business and reaches employees at induction and after every change, including agency and subcontracted staff. Remember that rail schemes also expect policies on drugs and alcohol, fatigue, data protection and modern slavery. Set objectives and monitor them."},{"score":10,"desc":"The management system genuinely runs the business, supported by internal audit, management review and, where clients require it, third party certification.","feedback":"The management system is genuinely used to run the business, with internal audit, management review and certification where required driving improvement.","goalFeedback":"Move from holding a system to using one. Run internal audits and management reviews that change decisions, drive continual improvement against your objectives, and maintain third party certification where your clients or your codes require it, keeping findings closed."}]},{"statement":"Does your organisation identify, record and act on the legislation, standards and client requirements that apply to the work it delivers?","topic":"Legal And Standards Register","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-legal-and-standards-register/","options":[{"score":0,"desc":"There is no register of applicable legislation, standards or client requirements.","feedback":"The organisation cannot demonstrate that it knows what applies to it, which is a common early audit failure.","goalFeedback":""},{"score":2,"desc":"Key requirements are known informally by individuals, but nothing is recorded or reviewed.","feedback":"Compliance rests on personal knowledge. When that person is unavailable, so is the knowledge.","goalFeedback":""},{"score":7,"desc":"A register of applicable legislation, standards and client requirements is maintained, reviewed for changes, and updates are communicated.","feedback":"A register of applicable requirements is maintained, reviewed and communicated.","goalFeedback":"Scope the register to the work you actually do rather than listing everything, record the issue or version you are working to, and give someone responsibility for checking for changes. Rule book and standards issues change more often than most registers do. Communicate what changes to the site teams it affects, not only to the office."},{"score":10,"desc":"Requirement changes are horizon scanned, assessed for business impact by senior leaders, and implemented through a controlled process.","feedback":"Requirement changes are horizon scanned, assessed at senior level for impact and implemented through controlled change.","goalFeedback":"Look ahead for changes rather than reacting to them, assess their business impact at senior level, and implement through a controlled change process so procedures, briefings and competence all move together. A superseded rule book issue briefed late is a serious exposure on site."}]},{"statement":"Does your organisation know which qualification schemes its rail clients use, and manage its position under each of them?","topic":"Managing Multiple Qualification Routes","handbookUrl":"https://nuccol.co.uk/railready-quality-compliance-assurance-managing-multiple-qualification-routes/","options":[{"score":0,"desc":"It is not known which qualification schemes rail buyers use, or whether the organisation is on them.","feedback":"The organisation may be invisible to clients who search only the scheme it is not registered on.","goalFeedback":""},{"score":2,"desc":"A registration is held but is largely dormant, with codes, questionnaires and audit status untracked.","feedback":"A dormant registration gives no assurance to a client and can lapse without anyone noticing.","goalFeedback":""},{"score":7,"desc":"The organisation knows which schemes its clients use, which codes it holds under each, and keeps questionnaires and audits current and renewed in time.","feedback":"Qualification routes are known and actively managed, with codes and renewals kept current under each scheme.","goalFeedback":"Find out which scheme each of your target clients and principal contractors actually uses, since the rail sector runs more than one and they are not interchangeable. Track renewal dates, code accuracy and audit status for each, and start renewal early enough that qualification never lapses mid-contract."},{"score":10,"desc":"Qualification routes are managed together as part of a planned route to market, with readiness, code accuracy and renewal owned at leadership level.","feedback":"Qualification routes are managed together as a leadership-owned part of route to market, with readiness and accuracy maintained across schemes.","goalFeedback":"Manage your qualifications as one portfolio serving a route to market rather than as separate administrative obligations. Decide deliberately which schemes and modules are worth the cost for the clients you are targeting, and own that decision at leadership level."}]}],"excellence":"Rail buyers rely on shared, independent assurance rather than auditing every supplier themselves. A service provider's standing depends on registering accurately, claiming only the service codes it can evidence, keeping its qualification current, and passing audit where the codes it holds demand it. Excellent organisations treat qualification as a live management responsibility rather than an annual administrative task, controlling the scope of what they claim, closing findings at root cause, and running a management system that actually governs the work."},"Leadership and Governance":{"questions":[{"statement":"Does your leadership team clearly communicate and demonstrate the safety expectations that apply to your work on or near the operational railway?","topic":"Leadership Commitment To Rail Safety","handbookUrl":"https://nuccol.co.uk/railready-leadership-governance-leadership-commitment-to-rail-safety/","options":[{"score":0,"desc":"Leadership does not communicate any specific expectations for railway work.","feedback":"There is no visible leadership commitment to railway safety. Expectations need to be set and communicated by senior management before anything else can be embedded.","goalFeedback":""},{"score":2,"desc":"Railway safety expectations are mentioned occasionally, but not consistently or visibly.","feedback":"Leadership refers to railway safety from time to time, but the message is inconsistent and site teams are unlikely to be able to repeat it.","goalFeedback":""},{"score":7,"desc":"Leadership communicates clear, consistent railway safety expectations that site teams can describe.","feedback":"Railway safety expectations are communicated clearly and consistently, and are understood across the workforce.","goalFeedback":"Keep leadership messaging regular and specific rather than general. Use briefings, site visits and safety stand-downs to reinforce what is expected of people working on or near the line, and check by asking staff at the worksite what they believe the expectations are."},{"score":10,"desc":"Leaders model railway safety expectations in their own decisions and are seen to do so on site.","feedback":"Leadership visibly models railway safety expectations, including where those expectations conflict with programme pressure.","goalFeedback":"Hold the position by making safety expectations visible in decisions that cost something, such as standing a job down when the safe system of work is not right. Develop the same behaviours in supervisors and controllers of site safety so leadership is not confined to the senior team, and share your approach with your subcontractors."}]},{"statement":"Does your organisation have clear governance and defined accountabilities for its work on the railway?","topic":"Governance, Oversight And Accountabilities","handbookUrl":"https://nuccol.co.uk/railready-leadership-governance-governance-oversight-and-accountabilities/","options":[{"score":0,"desc":"No formal governance for railway work and no defined accountabilities.","feedback":"Nobody owns railway work at a senior level. Define who is accountable for safety, competence and delivery on the railway, and how that accountability is exercised.","goalFeedback":""},{"score":2,"desc":"Some oversight of railway work exists, but roles and accountabilities are unclear or overlapping.","feedback":"Oversight happens, but accountabilities are not written down or are held by several people at once, which makes it hard to see where a decision was taken.","goalFeedback":""},{"score":7,"desc":"A documented governance framework defines who is accountable for railway work and how it is overseen.","feedback":"Governance and accountabilities for railway work are clearly defined, documented and understood.","goalFeedback":"Keep the framework current as your scope of railway work grows. Make sure directors receive safety and delivery information often enough to act on it, that named individuals own each obligation, and that conflicts between safety requirements and programme pressure have a route to resolution."},{"score":10,"desc":"Governance is embedded, with director-level review that actively challenges safety performance and directs improvement.","feedback":"Governance is fully embedded, and director-level review provides genuine challenge and direction rather than assurance alone.","goalFeedback":"Move oversight from reporting to challenge. Test the assumptions behind the safety performance you are shown, seek external comparison, and use governance to direct resource at the weakest area rather than to confirm that all is well."}]},{"statement":"Are your managers and supervisors held accountable for safety performance, and are they present at the worksite?","topic":"Supervision And Visible Leadership","handbookUrl":"https://nuccol.co.uk/railready-leadership-governance-supervision-and-visible-leadership/","options":[{"score":0,"desc":"Managers and supervisors are not held accountable for safety, and rarely visit worksites.","feedback":"Accountability stops at policy level. Managers and supervisors need defined safety responsibilities and a reason to be present where work is happening.","goalFeedback":""},{"score":2,"desc":"Some managers visit site, but accountability and presence depend on the individual.","feedback":"Supervisory engagement varies by person rather than by design, so standards are applied unevenly across sites and shifts.","goalFeedback":""},{"score":7,"desc":"Managers and supervisors have defined safety accountabilities and carry out regular worksite engagement.","feedback":"Supervisory accountability is defined and worksite engagement is regular, though the quality of that engagement can vary.","goalFeedback":"Make site presence purposeful rather than routine. Give supervisors a structure for what to look at and how to record what they find, review spans of control so supervision is realistic for dispersed teams and night work, and feed findings into improvement."},{"score":10,"desc":"Supervisory accountability is embedded, with realistic spans of control and engagement that measurably improves safety performance.","feedback":"Supervisory accountability is fully embedded, spans of control are realistic for dispersed site work, and engagement demonstrably improves safety performance.","goalFeedback":"Sustain this by reviewing supervisory ratios whenever work, staffing or shift patterns change, developing non-technical skills such as coaching and challenge in your supervisors, and using what supervision finds to drive change rather than to record compliance."}]}],"excellence":"Visible leadership and clear governance set the tone for everything a rail supplier does. This section assesses whether your leadership team communicates and demonstrates rail safety expectations, whether accountabilities for work on or near the operational railway are defined and owned, and whether your directors provide real direction and challenge rather than passive oversight. It looks for leadership that your people recognise at the worksite, not only in policy documents."},"Human Performance":{"questions":[{"statement":"Does your organisation have a system for establishing, developing and maintaining the competence its work requires?","topic":"Competence Management System","handbookUrl":"https://nuccol.co.uk/railready-human-performance-competence-management-system/","options":[{"score":0,"desc":"Competence requirements have not been identified and there is no system for managing them.","feedback":"The organisation cannot say what competence its work requires, so it cannot know whether the people it sends to site have it.","goalFeedback":""},{"score":2,"desc":"Competence is managed by tracking card expiry dates, with no underlying system.","feedback":"A card is evidence that an assessment once happened, not that competence is currently held. Managing to expiry dates alone leaves the substance unmanaged.","goalFeedback":""},{"score":7,"desc":"Activities and their risks are identified, standards are set, and staff are trained, assessed and recorded against them.","feedback":"A competence management system is in place covering requirements, training, assessment and records.","goalFeedback":"Start from the activities you carry out and the risks they carry, then set the standards competence will be measured against. Cover selection, training, assessment, records and how you control what a person is allowed to do on site, and remember that supervisors and assessors need maintained competence too."},{"score":10,"desc":"Performance is monitored and reassessed, sub-standard performance is managed, and the system itself is verified, audited and reviewed.","feedback":"The competence system is maintained and improved, with performance monitored, sub-standard performance managed, and the system itself audited and reviewed.","goalFeedback":"Close the loop. Monitor and reassess performance in the workplace rather than relying on the original assessment, have a defined route for managing sub-standard performance, and verify and audit the system itself so you know it is working. Include non-technical skills such as communication, situational awareness and decision making."}]},{"statement":"Does your organisation design its work so that people are less likely to make mistakes, and look for underlying causes when they do?","topic":"Human Factors And Error Prevention","handbookUrl":"https://nuccol.co.uk/railready-human-performance-human-factors-and-error-prevention/","options":[{"score":0,"desc":"Human error is treated as carelessness and is not considered when work is planned.","feedback":"Error is treated as a personal failing rather than a predictable outcome of how work is set up, so the same mistakes recur.","goalFeedback":""},{"score":2,"desc":"Error-prone tasks are recognised informally by supervisors, but nothing is done at the planning stage.","feedback":"Gangs know which jobs catch them out, but that knowledge does not reach the people who write the safe systems of work.","goalFeedback":""},{"score":7,"desc":"Error is considered when safe systems of work, briefings and equipment are planned or changed, and investigations look beyond the individual's actions.","feedback":"Human factors are considered in planning safe systems of work, and investigations look beyond individual actions to underlying causes.","goalFeedback":"Build human factors into planning and change rather than adding it afterwards, giving particular attention to briefings at the start of a night shift, handovers, and tasks carried out under time pressure near the end of a possession. When something goes wrong, identify the underlying causes that influenced performance rather than stopping at what the person did."},{"score":10,"desc":"Trends in underlying causes are analysed across incidents, front-line staff shape safety decisions, and the organisation also learns from what goes well.","feedback":"Underlying causes are trended across incidents, front-line staff shape safety decisions, and learning is drawn from successful work as well as failures.","goalFeedback":"Look across incidents and close calls for trends in underlying causes rather than treating each one alone. Include front-line staff or their representatives in safety policy and decision making, and study the shifts that go well as deliberately as the ones that fail."}]},{"statement":"Does your organisation have a written fatigue policy setting out what it will do about fatigue risk, who is responsible, and what people should do when someone is too tired to work safely?","topic":"Fatigue Policy And Ownership","handbookUrl":"https://nuccol.co.uk/railready-human-performance-fatigue-policy-and-ownership/","options":[{"score":0,"desc":"Nothing is written on fatigue and there is no agreed position on what site staff should do if they are too tired to work.","feedback":"Fatigue is unmanaged in a business built on night and possession work. Decisions about fitness to continue are being taken informally at the worksite with nothing to support them.","goalFeedback":""},{"score":2,"desc":"Fatigue is mentioned in general health and safety material, but no policy sets out aims, responsibilities or expected behaviours.","feedback":"Fatigue is acknowledged without being managed. Nobody is accountable and nothing is expected of anyone in particular.","goalFeedback":""},{"score":7,"desc":"A documented fatigue policy covers aims, named responsibilities, expected behaviours and what to do when too tired to work safely, and is communicated to staff.","feedback":"A documented fatigue policy is in place, communicated, and covers aims, responsibilities and expected behaviours.","goalFeedback":"Set out your aims for managing fatigue, who will do what, and how. Be explicit about what you expect a person to do if they are too tired to work safely and what the person in charge at the worksite should do in response. Account for travel time to and from remote sites, which is often the hidden part of a shift."},{"score":10,"desc":"The policy is owned at director level, supports an open and just culture around fatigue, is consulted on with staff representatives, reviewed on a cycle, and extended to subcontracted and agency resource.","feedback":"The fatigue policy is director-owned, consulted on, reviewed on a cycle, supports a just culture, and extends to subcontracted and agency resource.","goalFeedback":"Own and sign the policy at director level, consult staff representatives on it, and review it on a defined cycle. Extend the same expectations to agency and subcontracted people, since a worker fatigued from a shift for another employer is your risk once they are on your worksite."}]},{"statement":"Does your organisation monitor the hours its people actually work, including travel and shift changes, and assess those patterns for fatigue risk?","topic":"Monitoring Actual Working Patterns","handbookUrl":"https://nuccol.co.uk/railready-human-performance-monitoring-actual-working-patterns/","options":[{"score":0,"desc":"Working patterns are not reviewed for fatigue risk, either as planned or as worked.","feedback":"The organisation has no idea what its people are actually working, so it cannot know whether anyone is at risk on a night shift.","goalFeedback":""},{"score":2,"desc":"Planned rosters are looked at when designed, but what people actually worked is not checked.","feedback":"A roster designed within limits can be worked well outside them once late finishes, travel and cover are added, and none of that is visible.","goalFeedback":""},{"score":7,"desc":"Actual hours including overtime, travel and shift swaps are monitored, compared against the organisation's standards, and deviations are acted on.","feedback":"Actual working patterns are monitored against standards and deviations are acted on.","goalFeedback":"Measure what was worked, not what was planned, and include travel to and from site, overrun at handback and shifts worked for other employers where you can establish them. Compare against your own limits and act on the exceedances you find, because a monitored limit that is never enforced is worse than no limit at all."},{"score":10,"desc":"Fatigue indicators are tracked over time, a fatigue assessment tool is used where appropriate, and trends are reported to senior management.","feedback":"Fatigue indicators are tracked and trended, assessed with appropriate tools, and reported to senior management.","goalFeedback":"Track the indicators that build a picture over time, including overtime, shift exchange, sickness absence and travel, and use a recognised fatigue assessment tool where the pattern of night and weekend work warrants it. Report trends to senior management so resourcing decisions are informed by them."}]},{"statement":"Can your site staff report that they are too tired to work safely without fear of penalty, and does the organisation act on those reports?","topic":"Fatigue Reporting And Response","handbookUrl":"https://nuccol.co.uk/railready-human-performance-fatigue-reporting-and-response/","options":[{"score":0,"desc":"There is no route to raise fatigue, and doing so would be treated as a performance or attendance matter.","feedback":"Reporting fatigue carries a personal cost, so nobody does it and the organisation stays blind to the risk on its night shifts.","goalFeedback":""},{"score":2,"desc":"Fatigue can be mentioned to a supervisor, but the response depends on the individual and nothing is recorded.","feedback":"Whether a tired person is stood down depends on which supervisor is on the shift, and no record exists to learn from.","goalFeedback":""},{"score":7,"desc":"A stated non-punitive reporting route exists including asking to be relieved from duty, reports are recorded and acted on, and investigations prompt for fatigue.","feedback":"A non-punitive fatigue reporting route exists, reports are recorded and acted on, and investigations consider fatigue.","goalFeedback":"State clearly that reporting fatigue will not be penalised, and mean it, including where someone asks to be relieved mid-shift with a job unfinished. Record what is reported and what was done, and prompt for fatigue as a possible factor in every incident and close call investigation."},{"score":10,"desc":"Reports and survey findings are analysed for common causes, results are fed back to staff, and roster or resourcing changes follow with senior management sighted.","feedback":"Fatigue reports are analysed for common cause, fed back to staff, and drive roster and resourcing change under senior oversight.","goalFeedback":"Analyse reports for common causes rather than handling them one at a time, feed the findings back to site teams so they see the point of reporting, and make the roster or resourcing changes the analysis points to. Keep senior management sighted on the outcome."}]},{"statement":"Does your organisation assess and reduce the risk of musculoskeletal injury from the handling its people do on site, and train them accordingly?","topic":"Manual Handling And Musculoskeletal Risk","handbookUrl":"https://nuccol.co.uk/railready-human-performance-manual-handling-and-musculoskeletal-risk/","options":[{"score":0,"desc":"Manual handling risk has not been assessed and no handling training is provided.","feedback":"Musculoskeletal injury is among the most common causes of lost time in the sector, and nothing is being done about it.","goalFeedback":""},{"score":2,"desc":"People are told to lift carefully and some equipment is provided, but no specific task is assessed and nothing is recorded.","feedback":"General advice substitutes for assessment. Without looking at the actual operations, the genuinely harmful ones go unnoticed.","goalFeedback":""},{"score":7,"desc":"Handling operations are identified, those that cannot be avoided are assessed, controls and mechanical aids are in place, and staff are trained.","feedback":"Handling operations are assessed, controlled and supported by training and equipment.","goalFeedback":"Avoid the handling you can, assess what remains, and reduce the risk as far as possible. Observe the operations on site rather than assessing them on paper, giving attention to carrying materials over ballast and sleepers, working in restricted spaces and handling in the dark. Provide aids that suit the task and train people to use them."},{"score":10,"desc":"Cumulative exposure is managed as well as single lifts, early reporting of discomfort is encouraged and acted on, and handling is designed out where possible.","feedback":"Cumulative exposure is managed, early discomfort is reported and acted on, and handling is designed out where practicable.","goalFeedback":"Manage cumulative exposure across a shift and a roster, not only the heaviest single lift. Encourage people to report discomfort early and act when they do, and keep looking for opportunities to design handling out through better delivery to the worksite, mechanical aids or method change."}]},{"statement":"Does your organisation have its own documented drugs and alcohol arrangements, including how it decides that a test is required?","topic":"Drugs And Alcohol Arrangements","handbookUrl":"https://nuccol.co.uk/railready-human-performance-drugs-and-alcohol-arrangements/","options":[{"score":0,"desc":"There are no drugs and alcohol arrangements, and it is unclear who would decide on or carry out a test.","feedback":"The organisation could not meet an infrastructure manager's requirement at short notice and has no defensible basis for acting on a suspicion at the worksite.","goalFeedback":""},{"score":2,"desc":"The client's policy is relied on and testing is arranged when asked, with managers deciding case by case and little written down.","feedback":"Decisions rest on individual judgement without a record, which is difficult to defend afterwards for either the organisation or the worker.","goalFeedback":""},{"score":7,"desc":"A documented process covers the test types that apply, and grounds for suspicion are recorded on a form completed with the worker before a test is arranged.","feedback":"Documented drugs and alcohol arrangements are in place, with the decision to test recorded and evidenced.","goalFeedback":"Hold your own process rather than relying on a client's, covering the test types relevant to your work including post-incident. Have the responsible manager document the grounds of reasonable suspicion with the worker before deciding a for-cause test is required, and make sure someone competent to do that is reachable out of hours."},{"score":10,"desc":"Responsible managers are trained in the decision process, arrangements are reviewed against each new issue of the applicable standard, and support routes for impairment and prescribed medicines are defined.","feedback":"Managers are trained, arrangements are kept current with the standard, and impairment and medicines are covered by defined support routes.","goalFeedback":"Train the managers and supervisors who make these decisions rather than assuming the form is enough, and review your arrangements against each new issue of the infrastructure manager's standard. Define how prescribed medicines and other sources of impairment are declared and supported before a shift, and verify that your testing provider's scope and accreditation are current."}]}],"excellence":"People are the part of any rail supplier most easily overloaded and least easily inspected. Competence gaps, fatigue, impairment, physical strain and error-prone task design rarely announce themselves; they are visible in rosters, competence records, task design and reporting culture long before they appear in an incident. This module looks at how your organisation builds and maintains the competence its work requires, designs work so that people are less likely to make mistakes, controls fatigue and impairment across night and possession work, and manages the handling that causes most musculoskeletal injury. The bar throughout is not awareness but arrangements that are written down, applied consistently and reviewed."},"Supply Chain Readiness":{"questions":[{"statement":"Does your organisation select and approve its subcontractors and labour suppliers against defined criteria before placing work with them?","topic":"Supplier Selection And Approval","handbookUrl":"https://nuccol.co.uk/railready-supply-chain-readiness-supplier-selection-and-approval/","options":[{"score":0,"desc":"Subcontractors and labour suppliers are engaged without any approval step or defined selection criteria.","feedback":"There is no approval process. Resource is engaged on price or availability, so nothing prevents an unsuitable organisation putting people on the railway under your name.","goalFeedback":""},{"score":2,"desc":"Subcontractors are checked informally, and the criteria vary between contracts or managers.","feedback":"Some checking happens, but it is not written down or applied consistently, so approval depends on who is resourcing the job.","goalFeedback":""},{"score":7,"desc":"A controlled approved list is maintained, and subcontractors are assessed against documented criteria before engagement.","feedback":"Subcontractor selection and approval are controlled and documented, with a maintained approved list.","goalFeedback":"Keep the criteria proportionate to what each organisation provides, so that a supplier of safety critical resource is assessed more searchingly than a supplier of welfare units. Record the assessment, re-check approval periodically rather than only at first use, and make it impossible to engage an unapproved subcontractor at short notice."},{"score":10,"desc":"Approval is risk-based, periodically reviewed, and informed by past performance on site.","feedback":"Subcontractor approval is risk-based, evidence-led and periodically reviewed, with site performance feeding directly into future engagement decisions.","goalFeedback":"Sustain this by feeding site performance, close calls and delivery data back into approval decisions, reviewing the criteria as your scope of railway work changes, and developing subcontractors who are close to the standard rather than only removing those who fall below it."}]},{"statement":"Does your organisation pass the requirements of its rail client down to its subcontractors and labour suppliers?","topic":"Flow-Down Of Customer Requirements","handbookUrl":"https://nuccol.co.uk/railready-supply-chain-readiness-flow-down-of-customer-requirements/","options":[{"score":0,"desc":"Client requirements are not passed on to subcontractors in any form.","feedback":"Requirements stop at your door. Subcontractors cannot meet obligations they have never been told about, and the shortfall will surface on site.","goalFeedback":""},{"score":2,"desc":"Some requirements are passed on, usually verbally at mobilisation or only when asked.","feedback":"Flow-down happens by exception rather than by design, so what a subcontractor knows depends on who briefed them.","goalFeedback":""},{"score":7,"desc":"Client requirements are formally flowed down in subcontract documents, and subcontractors confirm they understand them.","feedback":"Client requirements are formally flowed down and acknowledged, giving subcontractors a clear basis for compliance.","goalFeedback":"Make flow-down proportionate to risk, so an organisation providing safety critical resource receives the full competence, medical and briefing requirements rather than a scope line. Record the subcontractor's acknowledgement, and check at mobilisation that what turns up reflects what was specified."},{"score":10,"desc":"Flow-down is systematic and verified, with evidence that subcontractors can and do meet the requirements passed to them.","feedback":"Flow-down is systematic and independently verified, and you can demonstrate that subcontractors are able to meet the requirements passed to them.","goalFeedback":"Move from telling to verifying. Satisfy yourself that each subcontractor is genuinely able to work in accordance with the client requirement, revisit flow-down whenever the client changes a requirement, and check that requirements reach any second-tier labour supplier where risk warrants it."}]},{"statement":"Does your organisation monitor how its subcontractors actually perform, during and after the work?","topic":"Monitoring Supplier Performance","handbookUrl":"https://nuccol.co.uk/railready-supply-chain-readiness-monitoring-supplier-performance/","options":[{"score":0,"desc":"Subcontractor performance is not monitored.","feedback":"You have no view of whether subcontractors work as agreed. Problems are discovered only when the client raises them.","goalFeedback":""},{"score":2,"desc":"Poor performance is noticed and dealt with case by case, but nothing is recorded or trended.","feedback":"Performance is managed reactively. Without records you cannot tell a one-off from a pattern, or justify removing a subcontractor.","goalFeedback":""},{"score":7,"desc":"Subcontractor performance is measured against defined criteria and recorded, with issues formally raised and closed out.","feedback":"Subcontractor performance is measured, recorded and acted on, though the depth of monitoring may not yet be matched to risk.","goalFeedback":"Extend monitoring beyond programme and cost to the things your client cares about, such as competence records, close call reporting and safe system of work compliance. Carry out risk-based inspections of the subcontractors that matter most, and make sure corrective actions raised are tracked to closure."},{"score":10,"desc":"Monitoring is risk-based and includes worksite inspection and audit, with results reviewed after contract and used to improve.","feedback":"Subcontractor monitoring is risk-based, includes worksite inspection and audit, and post-contract review results are used to improve both subcontractors and your own process.","goalFeedback":"Keep the loop closed. Hold post-contract reviews, communicate what they find across the business rather than only within the delivery team, and use the results to develop subcontractors and refine your selection criteria."}]},{"statement":"Are the subcontractors and agency staff working under your control co-ordinated, inducted and supervised?","topic":"Control Of Contractors On Your Work","handbookUrl":"https://nuccol.co.uk/railready-supply-chain-readiness-control-of-contractors-on-your-work/","options":[{"score":0,"desc":"Subcontractors and agency staff work with no induction, co-ordination or supervision.","feedback":"People who do not know the site rules, hazards or emergency arrangements are on the worksite unsupervised. This is the most common route to a serious incident involving a subcontracted worker.","goalFeedback":""},{"score":2,"desc":"Some induction happens, but co-ordination and supervision depend on who is running the shift.","feedback":"Arrangements exist but are applied unevenly, so the level of control a subcontractor receives varies by site and by supervisor.","goalFeedback":""},{"score":7,"desc":"Subcontractors receive a documented site induction, interfaces are agreed in advance and supervision is defined.","feedback":"Subcontractor induction, co-ordination and supervision are defined and applied, though the depth may not always be matched to the risk of the task.","goalFeedback":"Make sure the induction covers the site's specific hazards and emergency arrangements rather than generic content, that who does what and when is agreed before the shift starts, and that someone is named to supervise and to check the completed work."},{"score":10,"desc":"Subcontractor control is fully embedded, including assessment of the new hazards their activities introduce.","feedback":"Subcontractor control is fully embedded, and you assess and manage the hazards that subcontractors' own activities introduce.","goalFeedback":"Sustain this by assessing the hazards a subcontractor's activity introduces to the worksite and to others working nearby, including anything left behind at handback, and by reviewing your subcontractor management system rather than only individual jobs."}]},{"statement":"Does your organisation retain enough understanding of the work it subcontracts to specify and challenge it?","topic":"Intelligent Customer Capability","handbookUrl":"https://nuccol.co.uk/railready-supply-chain-readiness-intelligent-customer-capability/","options":[{"score":0,"desc":"The organisation relies entirely on subcontractors to define what is needed and to confirm it is right.","feedback":"You cannot specify or challenge the work you subcontract. If a subcontractor's judgement is wrong, nothing in your organisation is capable of catching it.","goalFeedback":""},{"score":2,"desc":"A few individuals hold the knowledge, and it is not documented or developed.","feedback":"Understanding sits with particular people rather than with the organisation, so capability walks off site when they do.","goalFeedback":""},{"score":7,"desc":"The organisation has identified and maintains the technical knowledge needed to specify, supervise and accept subcontracted work.","feedback":"The organisation retains the understanding needed to specify and accept subcontracted work, though it may rest on a small number of people.","goalFeedback":"Identify which subcontracted activities carry the most risk, and make sure the knowledge to specify and challenge them is held by more than one person and is written down. Involve technically competent staff in subcontractor selection and in accepting completed work, not only in commercial review."},{"score":10,"desc":"Intelligent customer capability is deliberately maintained, resourced and refreshed as the scope of subcontracted work changes.","feedback":"Intelligent customer capability is deliberately maintained and resourced, and is refreshed as the scope of subcontracted work changes.","goalFeedback":"Treat this as a capability to be planned rather than assumed. Review it whenever you subcontract a new activity or take on an unfamiliar discipline, build succession into the roles that hold it, and use it to challenge subcontractors constructively rather than only to check them."}]}],"excellence":"A rail customer inherits the weaknesses of everyone in your supply chain. This section assesses how you select, approve and monitor the subcontractors, labour suppliers and plant providers you rely on, whether you pass your client's requirements down to them intact, and whether you retain enough understanding of the work to supervise and challenge it. It is about supplier assurance, not social value, which is covered separately."},"Security of Information":{"questions":[{"statement":"Does your organisation have documented cyber security and data protection arrangements with defined ownership?","topic":"Cyber Security Assurance","handbookUrl":"https://nuccol.co.uk/railready-security-of-information-cyber-security-assurance/","options":[{"score":0,"desc":"No documented cyber security or data protection arrangements exist.","feedback":"Cyber security is unmanaged. The organisation would fail any assurance requirement covering digital systems or personal data, including the personal and medical data held on its site workforce.","goalFeedback":""},{"score":2,"desc":"Basic IT measures such as antivirus and passwords are relied on, with no documented policy or ownership.","feedback":"Technical controls exist without a management framework. Responsibilities, incident handling and data protection obligations are undefined.","goalFeedback":""},{"score":7,"desc":"Documented cyber security and data protection arrangements exist with defined ownership, applied consistently and reviewed.","feedback":"Cyber security is managed through a documented system with named ownership. External certification may not be held, and monitoring may still be developing.","goalFeedback":"Hold a top-level policy that states leadership commitment to preventing breaches, commits investment and resource to cyber resilience, and covers training, reporting breaches to the relevant external authorities and disciplinary action. Remember that competence, medical and fatigue records held on your workforce are personal data. Where you hold external certification, keep evidence that findings raised have been actioned and closed."},{"score":10,"desc":"Certification is maintained, arrangements are audited on a risk-based schedule, and improvement plans address emerging threats.","feedback":"Cyber security is mature, externally assured and continually improved against a changing threat picture.","goalFeedback":"Run audits and management reviews at a frequency set by risk and by contract requirements, and track corrective actions through to closure. Maintain a forward-looking improvement plan with leadership support that takes account of new and emerging risks, so resilience keeps pace with the threat rather than the last incident."}]},{"statement":"Does your organisation control who has access to sensitive information, systems and premises?","topic":"Access To Information And Premises","handbookUrl":"https://nuccol.co.uk/railready-security-of-information-access-to-information-and-premises/","options":[{"score":0,"desc":"Access to information, systems and premises is uncontrolled.","feedback":"Anyone inside the office or compound can reach anything. There is no basis on which to accept client information such as asset data or access plans that carry handling conditions.","goalFeedback":""},{"score":2,"desc":"Some access controls exist, but they are not defined by role and are rarely reviewed.","feedback":"Controls exist but have grown by accident. Access accumulates as people move between contracts and is seldom withdrawn.","goalFeedback":""},{"score":7,"desc":"Access to systems, data and premises is granted by role, recorded, and withdrawn when people leave or move off the contract.","feedback":"Access to information, systems and premises is controlled by role, recorded and withdrawn on leaving, though review may not yet be routine.","goalFeedback":"Work to the principle that the minimum number of people have the access they need without it impacting delivery. Identify which groups of people present a risk, apply any additional screening a particular work activity warrants, log and monitor who reaches sensitive data, and check the physical controls on offices, compounds and the places where plans and devices are stored."},{"score":10,"desc":"Access governance is formally defined, monitored and periodically reviewed, and extends to subcontracted and agency personnel.","feedback":"Access governance is formally defined, monitored and reviewed, and covers subcontracted and agency personnel as well as direct employees.","goalFeedback":"Sustain this with a documented access governance framework, an audit trail of who accessed what, and periodic review that actually removes redundant access, including for agency and subcontracted staff whose engagements end without notice. Reinforce it by promoting a positive security culture on site as well as in the office."}]},{"statement":"Would your organisation know if it suffered a cyber security or data breach, and would it know what to do?","topic":"Security Incident Response","handbookUrl":"https://nuccol.co.uk/railready-security-of-information-security-incident-response/","options":[{"score":0,"desc":"There is no plan for detecting or responding to a breach.","feedback":"A breach would be discovered late, if at all, and the response would be improvised under pressure. Your client would not be told in time.","goalFeedback":""},{"score":2,"desc":"The response would depend on the IT provider or on whoever noticed the problem.","feedback":"There is an assumption that someone would deal with it, but no defined roles, no continuity arrangements and no notification route.","goalFeedback":""},{"score":7,"desc":"A documented incident management plan defines detection, resolution and recovery, and roles are assigned.","feedback":"Incident management is documented and roles are assigned, covering detection, resolution and recovery.","goalFeedback":"Make sure detection is proportionate to the risks you have identified rather than assumed, and that business continuity arrangements cover the systems your site operations depend on, such as competence checking and resource planning. Name who communicates with the client and with the relevant external authorities and by when."},{"score":10,"desc":"The plan is exercised, incidents and actions are tracked, and changes made after an incident are monitored for effectiveness.","feedback":"Incident management is exercised and reviewed, with post-incident changes monitored to confirm they were effective.","goalFeedback":"Test the plan rather than only holding it, so weaknesses appear in an exercise rather than in a real event. Include the scenario in which a systems outage stops you verifying competence before a shift. Track incidents and actions to closure, and monitor the changes you made afterwards to confirm they worked."}]},{"statement":"Does your organisation identify which of its own subcontractors present a cyber security risk, and set proportionate requirements for them?","topic":"Supply Chain Cyber Risk","handbookUrl":"https://nuccol.co.uk/railready-security-of-information-supply-chain-cyber-risk/","options":[{"score":0,"desc":"Cyber security is not considered when selecting or managing subcontractors.","feedback":"Supply chain cyber risk is not recognised. The organisation may be exposing client systems and data through third parties it has not assessed.","goalFeedback":""},{"score":2,"desc":"Reliance is placed on a subcontractor's general reputation, with no assessment and no contract requirements.","feedback":"Subcontractor selection is informal on cyber matters. Without contractual expectations there is no basis for holding one to account after a breach.","goalFeedback":""},{"score":7,"desc":"Subcontractors presenting cyber risk are identified, and proportionate cyber requirements are written into subcontract conditions.","feedback":"Supply chain cyber risk is identified and reflected in subcontracts. Ongoing assurance and monitoring may not yet be routine.","goalFeedback":"Make sure the expectations you set are justifiable, achievable and proportionate to the service or data involved, so smaller subcontractors are not shut out by requirements they cannot meet. Give particular attention to anyone handling client asset data, access plans or your workforce's personal and medical records."},{"score":10,"desc":"Subcontractor cyber assurance is maintained through routine audit or technical assessment, with performance monitored and acted on.","feedback":"Supply chain cyber risk is actively assured and monitored, and you can demonstrate both the requirement and the evidence of compliance.","goalFeedback":"Keep assurance live through routine audits and technical assessments rather than a one-off check at onboarding, and hold the records so a client spot check can be answered immediately. Monitor performance and act where it falls short, escalating or replacing subcontractors who cannot meet the requirements you have set."}]}],"excellence":"Rail suppliers hold information their clients cannot afford to lose: asset data, possession and access plans, site information and personal data about their own people. This section assesses whether cyber security and data protection are managed rather than assumed, who can reach your systems and your premises, what happens when something goes wrong, and whether the same expectations reach the subcontractors you pass information to."},"Contracting and Commercial":{"questions":[{"statement":"Before signing, does your organisation review and understand the contract terms and the scope of works, and brief the delivery team on what they mean?","topic":"Contract And Scope Review Before Signature","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-contract-and-scope-review-before-signature/","options":[{"score":0,"desc":"Contracts are signed without a structured review of the terms or the scope.","feedback":"The organisation cannot say what it has agreed to. Obligations and liabilities are discovered on site or in dispute.","goalFeedback":""},{"score":2,"desc":"Someone reads the contract before signing, but the review is informal and findings are not passed on.","feedback":"Understanding stays with the reviewer. The site team works to its assumptions rather than to the contract's terms.","goalFeedback":""},{"score":7,"desc":"A documented pre-signature review covers the form, the options selected, client amendments, completeness of the contract data and the scope of works, and the delivery team is briefed.","feedback":"A documented pre-signature review is carried out and its findings are briefed to the delivery team.","goalFeedback":"Check that the contract data is complete, since gaps in it create ambiguity rather than flexibility. Read the client's amendments as carefully as the standard terms, because that is where risk is usually transferred, particularly around access and possession risk. Then brief the people who will deliver on site, not only those who signed."},{"score":10,"desc":"Pre-signature review is a governed step with defined sign-off, findings feed the price, the delivery plan and the scopes issued to subcontractors, and the pattern of terms accepted is reviewed by senior management.","feedback":"Pre-signature review is governed, feeds pricing, planning and flow-down, and the portfolio-level pattern of accepted terms is reviewed at senior level.","goalFeedback":"Make review a governed step with a named sign-off, and let its findings shape the price, the plan and the scopes you pass down to subcontractors. Have senior management review the terms the business is accepting across its whole portfolio, because risk accepted one contract at a time accumulates."}]},{"statement":"Does your organisation know which contract form and edition governs each of its contracts, and work to the terms of the edition actually in use?","topic":"Contract Form And Edition Awareness","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-contract-form-and-edition-awareness/","options":[{"score":0,"desc":"Which form or edition each contract uses is not tracked and would have to be looked up.","feedback":"Teams administer contracts from memory of a different one. Notices go to the wrong person, in the wrong form, or too late.","goalFeedback":""},{"score":2,"desc":"The broad family of contract is known, but terms and processes are used interchangeably across editions and projects.","feedback":"Working to the wrong edition's defined terms and timescales is a common and avoidable source of lost entitlement.","goalFeedback":""},{"score":7,"desc":"The form, edition and options are recorded for every contract, and site and commercial teams work to the terms of the edition actually in use.","feedback":"Contract form, edition and options are recorded and teams work to the correct terms.","goalFeedback":"Record the form, edition, main option, dispute option and secondary options for every contract in one place your teams can reach. Where an older edition uses different defined terms and processes, make sure the people administering it on site know which set applies to them."},{"score":10,"desc":"Awareness is maintained across the business through training and templates, and any agreed variation to the terms of a legacy contract is formally documented.","feedback":"Edition awareness is maintained through training and templates, and variations to legacy contracts are formally documented.","goalFeedback":"Cover the differences between editions in training and build them into your templates and notice formats, so the right form is used by default. Where the parties agree to work a legacy contract differently, document the variation formally rather than relying on custom and practice."}]},{"statement":"Does your organisation give early warning of matters that could affect cost, time or quality as soon as it becomes aware of them?","topic":"Early Warning Of Problems","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-early-warning-of-problems/","options":[{"score":0,"desc":"Issues are raised only once they have already caused a delay or a cost.","feedback":"By the time the client hears, the options for avoiding the impact have gone. This is the single most common cause of avoidable dispute.","goalFeedback":""},{"score":2,"desc":"Concerns are flagged informally in meetings or by email, with no consistent process for issuing them formally.","feedback":"An informal mention is not a notice. Entitlement and goodwill are both lost when the record does not show a warning was given.","goalFeedback":""},{"score":7,"desc":"Matters are notified through the contractual route as soon as the organisation becomes aware, the early warning register is maintained, and the meetings are attended.","feedback":"Early warnings are notified contractually and on time, and the register and meetings are maintained.","goalFeedback":"Notify as soon as you become aware, not once you are certain, and use the route the contract specifies rather than an email. Make sure site staff know that what they see at the worksite, such as an unexpected buried service or an access constraint, is exactly what early warning exists for."},{"score":10,"desc":"Early warning is treated as a risk management tool with visible leadership support, mitigation is agreed jointly with the client, and how early matters are raised is measured.","feedback":"Early warning is a leadership-backed risk tool, mitigation is agreed jointly, and timeliness of warnings is measured and improved.","goalFeedback":"Make clear at leadership level that raising an early warning is expected and never penalised internally, since the fear of looking incompetent is what suppresses them. Work with the client on mitigation rather than only recording the risk, and measure how early you raise matters so you can improve it."}]},{"statement":"Does your organisation submit a programme for acceptance at the intervals the contract requires, and explain what has changed since the last one?","topic":"Programme And Delivery Planning","handbookUrl":"https://nuccol.co.uk/railready-contracting-commercial-frameworks-programme-and-delivery-planning/","options":[{"score":0,"desc":"No programme is submitted beyond the one produced at tender, if that.","feedback":"There is no agreed picture of when anything will happen, so delay cannot be demonstrated and entitlement cannot be established.","goalFeedback":""},{"score":2,"desc":"Programmes are submitted occasionally, are often rejected or unanswered, and acceptance is not pursued.","feedba
