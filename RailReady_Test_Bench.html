rd-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Treat It as a Risk, Not a News Item<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Put it on the risk register with a named owner and a review date<\/li><li>Record what would trigger action<\/li><li>Say what you would do, at least in outline<\/li><\/ul>\n<p class=\"hb-p\">A risk register entry that has never been reviewed is not a risk being managed.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Build Relationships That Survive Reorganisation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Structural change destroys relationships that live in one person and preserves those that live in delivery performance.<\/p>\n<ul class=\"hb-ul\"><li>Make sure more than one person holds each important relationship<\/li><li>Keep an evidence base of your performance that is portable<\/li><li>Build at the level below the one being reorganised, where people usually stay<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Adjust as Detail Firms Up<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end this is a standing item in leadership risk and strategy review, with mapped impacts and plans that are adjusted as published detail changes.<\/strong><\/p>\n<p class=\"hb-p\">Waiting for the change to complete and then reacting is the expensive option, because everyone else does it at the same time.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Reorganisations redistribute buying authority. Suppliers who mapped their exposure beforehand keep their position; those who did not spend a year finding out who to talk to.<\/strong><\/p>"}]},"safety_culture":{"color":"#ef4444","label":"Rail Safety Culture","order":2,"chapters":[{"id":"RSC01","order":1,"q_ref":"2.1","t":"Understanding Your Safety Culture","b":"<p class=\"hb-lead\">Every supplier says it has a good safety culture. To score a 10 you have to show you went and found out, using a recognised method, that you shared what you found including the uncomfortable parts, and that you act on it at the level of individual teams rather than as a single organisation-wide number.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Use a Recognised Method, Not a Staff Survey<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A general engagement survey is not a safety culture assessment.<\/strong><\/p>\n<p class=\"hb-p\">ORR's maturity model points organisations at safety culture or safety climate assessments using techniques and toolkits such as RSSB's Safety Culture toolkit. Whatever you use, it should:<\/p>\n<ul class=\"hb-ul\"><li>Ask about behaviour and belief, not satisfaction<\/li><li>Allow anonymous response<\/li><li>Reach the front line, not just supervisors and office staff<\/li><li>Produce something you can repeat and compare against later<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Gather the Informal Evidence Too<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The maturity model is explicit that culture shows up during monitoring, inspections, investigations and ordinary dealings with employees and the supply chain. Someone saying in passing that performance pressure sometimes takes priority over risk controls is culture data.<\/p>\n<p class=\"hb-p\"><strong>Give people a way to record that. As well as investigating the comment, write down the background so a picture builds up over time.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>A field for cultural observations on inspection and tour forms<\/li><li>A prompt in investigation templates<\/li><li>A note of what people say when the formal part of the meeting has finished<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Share What You Found, Including the Bad Part<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Publishing only the flattering results destroys the credibility of the next assessment.<\/p>\n<ul class=\"hb-ul\"><li>Report the weakest scores as prominently as the strongest<\/li><li>Say what you are going to do about them, and by when<\/li><li>Come back later and say whether it worked<\/li><\/ul>\n<p class=\"hb-p\"><strong>Workforces forgive a poor result. They do not forgive being asked and then ignored.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Act at Team Level<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The maturity model notes that different positive cultural characteristics matter in different parts of a business. A just and fair reporting culture matters most at the front line; a culture of doubt and questioning matters most in engineering functions.<\/p>\n<p class=\"hb-p\">Break your results down far enough to see that, and direct effort at the weakest area rather than spreading it evenly.<\/p>\n<ul class=\"hb-ul\"><li>By site, shift, department or gang<\/li><li>By length of service, which often reveals induction problems<\/li><li>By direct versus subcontracted staff<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Make It a Strategy, Not an Exercise<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end, culture is something you deliberately shape as part of your safety management system.<\/strong><\/p>\n<p class=\"hb-p\">Set out what culture you are trying to build and how you will know. Repeat the assessment on a cycle so you have a trend rather than a snapshot, and treat a deteriorating trend as seriously as an incident.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Culture is the thing that decides what people do when the procedure does not cover the situation. An organisation that has never measured it is guessing about its single biggest safety variable.<\/strong><\/p>"},{"id":"RSC02","order":2,"q_ref":"2.2","t":"Close Call And Near Miss Reporting","b":"<p class=\"hb-lead\">Reporting rates tell an assessor more about your culture than your policy does. To score a 10 you need a route people actually use, investigations that reach underlying causes, feedback that closes the loop with the reporter, and trend analysis that finds the areas of high risk before an accident does.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Make Reporting Easy at the Point of the Hazard<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Every step between seeing something and reporting it costs you reports.<\/strong><\/p>\n<p class=\"hb-p\">RISQS CORE audit protocols require arrangements to report, investigate and analyse accidents, incidents, close calls and near misses involving your employees and activities. Build the route to fit the work:<\/p>\n<ul class=\"hb-ul\"><li>Available where the work happens, not only at a desk<\/li><li>Short enough to complete in a couple of minutes<\/li><li>Usable by agency and contract staff, not just employees<\/li><li>Anonymous as an option, named by default<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Investigate Properly and Proportionately<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocols require you to identify the underlying and root causes, use competent investigators, and manage events appropriately to their severity.<\/p>\n<ul class=\"hb-ul\"><li>Define who is competent to investigate, and train them<\/li><li>Scale the investigation to the potential, not the actual outcome<\/li><li>Look past what the person did to why the situation allowed it<\/li><li>Record findings so someone else could follow the reasoning<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Track Actions to Closure and Verify Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>An action marked complete without evidence is an action that will reappear.<\/strong><\/p>\n<p class=\"hb-p\">Keep corrective and preventive actions on a tracker with owners and dates, re-assess the risk once the action is in, and brief employees and other affected parties on what the investigation found.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Feed Back to the Person Who Reported<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">This is the single highest-return thing you can do for reporting rates, and it is the most commonly skipped.<\/p>\n<ul class=\"hb-ul\"><li>Tell the reporter what happened as a result, even when the answer is that you decided to do nothing<\/li><li>Publish a summary so people see reports going somewhere<\/li><li>Thank people publicly for reports that led to change<\/li><\/ul>\n<p class=\"hb-p\"><strong>Reporting rates fall when feedback stops, not when hazards disappear.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Analyse the Trend, Not Just the Report<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">At the top end you use the data strategically. Produce and analyse statistics, identify the areas of high risk, and share lessons with clients and across sites.<\/p>\n<p class=\"hb-p\"><strong>Treat a falling reporting rate as a warning sign, not an improvement. It almost never means there is less to report.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Near misses are the only free information you get about your own risk. An organisation that does not collect them is waiting to learn from harm instead.<\/strong><\/p>"},{"id":"RSC03","order":3,"q_ref":"2.3","t":"Just Culture And Response To Error","b":"<p class=\"hb-lead\">How you respond when someone makes a mistake sets the price of honesty in your organisation. To score a 10 you need a written just culture position, applied consistently, that your workforce actually believes in — and at least one occasion where it led you to change a process rather than sanction a person.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand What a Just Culture Is<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">RSSB's guidance describes a just culture as one where the majority believe justice will usually be dispensed and the system is seen as fair. It sits deliberately between two failures:<\/p>\n<ul class=\"hb-ul\"><li>A blame culture, where fear prevents open communication about risk<\/li><li>A no-blame culture, where sloppy practice and negligence creep in<\/li><\/ul>\n<p class=\"hb-p\"><strong>The point is not to excuse everything. It is to be predictable about what is and is not acceptable.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Write Down Acceptable and Unacceptable Behaviour<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The guidance is clear that formalising acceptable and unacceptable behaviours in policies and procedures creates transparency and sets expectations.<\/p>\n<ul class=\"hb-ul\"><li>Say what will always be treated as unacceptable, and be honest about it<\/li><li>Say what will be treated as a system problem rather than a personal one<\/li><li>Explain how the two are told apart<\/li><li>Agree it with staff or their representatives, rather than issuing it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Use the Substitution Test<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>When considering culpability, ask whether a well-motivated, equally competent and comparably qualified individual, in the same circumstances and without hindsight, would have behaved differently.<\/strong><\/p>\n<p class=\"hb-p\">If the answer is no, blaming the individual diverts attention from the organisational weakness that set them up. That test is short enough to use in a real meeting, which is why it survives.<\/p>\n<p class=\"hb-p\">Record that you applied it and what you concluded.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Apply It the Same Way Every Time<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Consistency is what makes it credible. The same behaviour treated differently on different days reads as unfairness whichever way it falls.<\/p>\n<ul class=\"hb-ul\"><li>Review outcomes periodically for consistency between managers, sites and departments<\/li><li>Watch for outcome bias, where the same act is judged by how badly it happened to end<\/li><li>Involve someone independent in serious cases<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Prove It With a Process Change<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Keep evidence of an occasion where the approach led you to change how work is done rather than to discipline someone.<\/strong><\/p>\n<p class=\"hb-p\">That single record does more for your assessment, and for your workforce's trust, than the policy itself. Then check whether people believe it: ask in a survey whether staff think they would be treated fairly, and track the answer.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: People only report what they are not afraid to report. Every other safety system you have depends on this one working.<\/strong><\/p>"},{"id":"RSC04","order":4,"q_ref":"2.4","t":"Confidential Safety Reporting","b":"<p class=\"hb-lead\">Some concerns will never reach you through the line. To score a 10 you need an independent confidential channel that people know about and trust, and you need to treat what comes through it as leadership intelligence rather than as a complaints queue.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Put the Channel in Place<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">CIRAS is the rail sector's independent confidential reporting service. Note that the Sentinel Scheme Rules require Sponsors to be a member of an independent confidential industry reporting service, so for many suppliers this is an obligation rather than an option.<\/p>\n<p class=\"hb-p\"><strong>An internal whistleblowing address is not the same thing. The value comes from independence.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Publicise It Properly and Repeatedly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A channel nobody remembers is assurance on paper only. Once at induction is not enough.<\/p>\n<ul class=\"hb-ul\"><li>Posters where people actually stop, including welfare units and vehicles<\/li><li>Cards issued with site passes or ID<\/li><li>Payslip inserts or intranet reminders on a cycle<\/li><li>Repeated at least annually, and after any event that shakes confidence<\/li><\/ul>\n<p class=\"hb-p\"><strong>Say plainly how confidentiality is protected. Most people who do not use it assume it is not really confidential.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Extend It Across Contractual Boundaries<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">ORR's maturity model notes that third party confidential reporting across contractual boundaries surfaces concerns that would otherwise stay hidden through unclear reporting routes or fear of jeopardising commercial relationships.<\/p>\n<ul class=\"hb-ul\"><li>Make the channel available to subcontracted and agency workers on your sites<\/li><li>Tell your own supply chain it exists<\/li><li>Make clear that raising a concern will not affect anyone's commercial position<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Respond Visibly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Have a defined route for receiving a concern, investigating it and responding, and make sure the response is visible enough that people can see something happened, without compromising the reporter.<\/p>\n<ul class=\"hb-ul\"><li>A named owner for incoming reports<\/li><li>A target response time<\/li><li>A way of publishing themes and actions without identifying anyone<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Use It as Intelligence, Not Just Assurance<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end you review the trends in what is reported confidentially, and why people chose that route rather than an internal one.<\/strong><\/p>\n<p class=\"hb-p\">The maturity model makes the point sharply: this data provides independent insight into safety culture as felt on the ground, and a degree of assurance that your reported performance is genuine — including whether safety targets have started to suppress reporting.<\/p>\n<p class=\"hb-p\">Put those trends in front of your senior team alongside your internal reporting rates.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: A confidential channel is the only route you have to the concerns your management chain is filtering out. Treated seriously it is an early warning system; treated as a formality it is worse than nothing, because it looks like assurance.<\/strong><\/p>"},{"id":"RSC05","order":5,"q_ref":"2.5","t":"Workforce Involvement In Safety","b":"<p class=\"hb-lead\">The people doing the work know things your risk assessments do not. To score a 10 you need established arrangements for them to shape how work is controlled, evidence that contributions actually changed something, and a genuine willingness to be challenged from below.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know the Baseline Duty<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">ORR's maturity model sets out that all employees in Great Britain must be consulted on, not just told about, health and safety issues that affect them, under the Safety Representatives and Safety Committees Regulations 1977 and the Health and Safety (Consultation with Employees) Regulations 1996.<\/p>\n<p class=\"hb-p\"><strong>Consultation is a legal floor, not an achievement. The maturity model expects effective organisations to go further than the law specifies.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Involve People Before Decisions Are Fixed<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Consultation after a decision is announcement with extra steps.<\/strong><\/p>\n<p class=\"hb-p\">RISQS CORE audit protocols expect evidence of employee engagement specifically when:<\/p>\n<ul class=\"hb-ul\"><li>Procedures are to be changed<\/li><li>The organisation is to be changed<\/li><li>New technology, systems or processes are to be introduced<\/li><li>Risk assessments are being carried out<\/li><li>General performance matters are reviewed<\/li><\/ul>\n<p class=\"hb-p\">Get operator input while a method or control is still open, not once it is written.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Record Suggestions and Answer Them<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocols require suggestions to be recorded, reviewed, and a response provided. That third step is what makes the first two worth doing.<\/p>\n<ul class=\"hb-ul\"><li>A register with a response against every entry<\/li><li>A visible turnaround time<\/li><li>An honest 'no, and here is why' where that is the answer<\/li><\/ul>\n<p class=\"hb-p\"><strong>An unanswered suggestion scheme trains people to stop suggesting.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Reach Everyone, Not Just Representatives<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Representative structures are necessary but not sufficient. Make sure involvement reaches shop floor staff, night shifts, agency workers and the quiet ones.<\/p>\n<ul class=\"hb-ul\"><li>Ask directly during inspections and tours<\/li><li>Use short, specific consultations rather than general invitations<\/li><li>Vary who is asked, so it is not always the same confident voices<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Build a Questioning Attitude<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end, challenge is normal and expected at every level, including upwards.<\/strong><\/p>\n<p class=\"hb-p\">The maturity model describes effective organisations as making full use of employees' potential and actively involving them to develop shared values and a culture of trust, openness and empowerment. Support it with work groups that own improvements and professional debate that is allowed to be uncomfortable.<\/p>\n<p class=\"hb-p\">Treat the absence of challenge as a warning sign rather than as agreement.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: The gap between how work is imagined and how work is actually done is where incidents live. Involvement is the only reliable way to see across it.<\/strong><\/p>"}]},"quality_compliance":{"color":"#22c55e","label":"Quality, Compliance & Assurance","order":3,"chapters":[{"id":"QCA01","order":1,"q_ref":"3.1","t":"Accuracy Of Qualification Information","b":"<p class=\"hb-lead\">Your qualification record is what buyers see before they see you. To score a 10 it needs a named owner, it needs to be accurate about what you can genuinely deliver including your limits, and it needs to be connected to what the business is actually bidding for.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know What Buyers Currently See<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Most organisations have not looked at their own profile as a buyer sees it for over a year.<\/strong><\/p>\n<p class=\"hb-p\">Print it out. Go through it line by line and ask, for each claim, whether you could deliver it starting tomorrow.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Be Honest About Limits<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">RISQS Scheme Rules require that information provided by the organisation accurately reflects the products and services the supplier member is able to provide, and any realistic limitations on volume or delivery locations.<\/p>\n<p class=\"hb-p\"><strong>Stating a limit is not weakness. It is what stops you being invited to something you will have to decline or, worse, accept and fail.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Volume limits you can genuinely sustain<\/li><li>Geographic coverage you can genuinely resource<\/li><li>Lead times that are real rather than aspirational<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Give It One Owner<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Name the person responsible in a procedure, not by custom<\/li><li>Set a review frequency and diary it<\/li><li>Make them responsible for certificates and insurances on the portal, not just the narrative<\/li><li>Give them a route to find out when capability changes<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Connect It to the Pipeline<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end this is a governed business process linked to bid and contract activity.<\/strong><\/p>\n<p class=\"hb-p\">A change in capability or capacity should reach the record before it reaches a bid, and the record should reflect what you are actually pursuing. If you have stopped offering something, take it off.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Review It Where It Will Be Noticed<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Put profile accuracy on a leadership agenda rather than leaving it to administration. It takes five minutes and it is the cheapest protection there is against being disqualified for a stale document.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Buyers search, filter and shortlist on this data. An inaccurate record either hides you from work you could win, or wins you work you cannot deliver.<\/strong><\/p>"},{"id":"QCA02","order":2,"q_ref":"3.2","t":"Assurance Requirements For What You Supply","b":"<p class=\"hb-lead\">The assurance you have to pass depends on what you supply and at which lifecycle phase. To score a 10 you need to know the assurance level attached to every code you hold, hold only codes you can evidence, and review selection with technical and commercial input rather than leaving it as it was set at registration.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand How the Classification Works<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The Rail Industry Commodity Classification List explains that the required assurance level sits at the intersection of a commodity and a lifecycle phase — a letter indicating the level required, or a hyphen where no assurance intervention is considered necessary at that step.<\/strong><\/p>\n<p class=\"hb-p\">That has a practical consequence people miss: the same product can carry different requirements at supply and at maintenance.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Know Which Level Each Code Carries<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Version 9 of the RICCL sets out three levels:<\/p>\n<ul class=\"hb-ul\"><li>V — Verification: an annual set of procurement-specific questions<\/li><li>A — Audit: a systematic and independent examination of processes, records, controls and activities<\/li><li>W — Witnessed: an independent technical assessment to verify quality, compliance and safety of critical goods and services, new in Version 9<\/li><\/ul>\n<p class=\"hb-p\"><strong>Codes flagged W require third party assurance such as a RISAS assessment. If you hold one and did not know, find out now.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Hold Only What You Can Evidence<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Every code you hold is a code you may be audited against.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Remove codes for products you no longer supply<\/li><li>Do not claim adjacent codes speculatively<\/li><li>Where a code is aspirational, plan the assurance before you claim it, not after<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Prepare for the Assurance Each Code Brings<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Work out, code by code, what passing would require and whether you could do it today.<\/p>\n<ul class=\"hb-ul\"><li>Which codes are auditable and when the audit is due<\/li><li>Which require third party or witnessed assessment, and the lead time for arranging it<\/li><li>Which parts of your management system each one exercises<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Review With Technical and Commercial Together<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end code selection is a governed decision aligned to strategy, not an artefact of registration day.<\/strong><\/p>\n<p class=\"hb-p\">Bring engineering and sales into the same review so codes follow where the business is going. Where you believe a classification is wrong for what you actually supply, raise it through the proper route rather than working around it — the list is maintained and change can be recommended.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Claiming a code you cannot evidence is the fastest way to fail an audit you did not need to take. Missing one you could hold quietly removes you from searches you would win.<\/strong><\/p>"},{"id":"QCA03","order":3,"q_ref":"3.3","t":"Control Of Assured Scope","b":"<p class=\"hb-lead\">Working outside your assured scope is one of the few things that can suspend you outright. To score a 10 you need a scope check built into acceptance so it cannot be skipped under pressure, extensions arranged before the work starts, and any limitation treated as a governance matter rather than an administrative one.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Consequence<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS Scheme Rules provide for limitation where an auditor reports that a supplier is undertaking work on the railway infrastructure that is not within the scope of their certification.<\/strong><\/p>\n<p class=\"hb-p\">That is discovered at audit, long after the work, and the consequence lands on your whole qualification rather than on the single job.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Put the Check Where It Cannot Be Skipped<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A scope check that depends on someone remembering will fail on the busy week.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Build it into your enquiry, bid or order acceptance checklist as a mandatory field<\/li><li>Require a named sign-off, not a tick<\/li><li>Make the assured scope easy to look up, in plain language<\/li><li>Give people an explicit route to say no<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Arrange Extensions Before, Not After<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Scope extensions take time. Starting the process after you have won the work means either delaying the customer or working outside scope while you wait.<\/p>\n<ul class=\"hb-ul\"><li>Identify likely extensions from your pipeline, not from your order book<\/li><li>Start early enough for assurance to be in place before delivery<\/li><li>Track the application so it does not stall<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Watch for Scope Creep Inside a Contract<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>The common failure is not taking on obviously unqualified work. It is a contract that grows.<\/strong><\/p>\n<p class=\"hb-p\">A job that starts inside scope and drifts outside it during delivery is the hardest case to catch, because nobody re-checks. Build a re-check into significant variations.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Treat Limitations as a Governance Signal<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">At the top end you track any limitations or restrictions placed on your qualification and their causes, and act on them at leadership level.<\/p>\n<p class=\"hb-p\"><strong>Where scope repeatedly constrains the business, that is a strategic decision — extend it deliberately, or stop pursuing that work — not a recurring irritation.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Scope is the one area where doing good work is no defence. Being outside it is a finding regardless of how well the job went.<\/strong><\/p>"},{"id":"QCA04","order":4,"q_ref":"3.4","t":"Audit Readiness And Evidence","b":"<p class=\"hb-lead\">Audits are won or lost before the auditor arrives. To score a 10 you need evidence submitted within the scheme's timescales, the people who will be interviewed briefed, and readiness that is continuous rather than manufactured for the visit.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know That Part of It Happens Before the Visit<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS guidance records that Stage 1 of the audit requires the supplier to upload a portion of their management system and audit evidence into the portal for review by a competent desktop auditor.<\/strong><\/p>\n<p class=\"hb-p\">Late or incomplete submission costs you before anyone arrives, and it sets the auditor's expectations for everything that follows.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Plan Each Audit Like a Project<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>A preparation plan with owners and dates<\/li><li>The submission deadline diarised backwards from the audit date<\/li><li>A named person co-ordinating<\/li><li>A dry run against the protocol you will be audited to<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Brief the People Who Will Be Interviewed<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Auditors talk to the people doing the work, and they can tell the difference between someone describing their job and someone reciting a procedure.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Tell people the audit is happening and why<\/li><li>Make sure they can describe what they actually do<\/li><li>Tell them it is fine to say they do not know and to fetch someone<\/li><li>Do not coach answers — it is obvious and it damages credibility<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Fix What You Find in Preparation<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Preparation usually surfaces gaps. Fix the ones you can and be upfront about the ones you cannot.<\/p>\n<p class=\"hb-p\"><strong>An organisation that says 'we found this ourselves and here is the plan' scores better than one that hopes it will not come up.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Make Readiness Continuous<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end an audit could begin at short notice and you would be fine.<\/strong><\/p>\n<p class=\"hb-p\">Test that with your own internal audits against the same requirements, rather than waiting for the external one. Own readiness at senior level so it is a property of the business, not a project that runs twice a year.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: A well-run organisation that prepares badly scores worse than an average one that prepares well. The audit measures what you can show, not what you do.<\/strong><\/p>"},{"id":"QCA05","order":5,"q_ref":"3.5","t":"Non-Conformance Close-Out","b":"<p class=\"hb-lead\">Findings are cheap; unclosed findings are expensive. To score a 10 you need every finding on one tracker with owners and dates, closure verified with evidence, and root cause analysis that changes the system rather than the instance.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Understand the Escalation Risk<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS Scheme Rules record that a Major Non-Compliance will be raised against the CORE Monitoring and Measuring requirement for failure to close out Minor Non-Compliances.<\/strong><\/p>\n<p class=\"hb-p\">An overdue minor finding is therefore not an administrative delay. It is a live risk of a major finding on a different requirement entirely.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Use One Tracker for Everything<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Separate registers for audits, customer complaints and internal findings hide the pattern that connects them.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Every finding from every source, in one place<\/li><li>Owner, target date and current status<\/li><li>Source and severity, so you can filter<\/li><li>Visible to management, not buried in a quality folder<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Verify Closure With Evidence<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">'Closed' should mean someone independent looked at something.<\/p>\n<ul class=\"hb-ul\"><li>Attach the evidence, not a statement that it exists<\/li><li>Have someone other than the action owner confirm closure<\/li><li>Re-check a sample later to see whether it held<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Look for the Cause, Not the Instance<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Fixing the specific non-conformance and calling it corrective action is why findings repeat.<\/strong><\/p>\n<p class=\"hb-p\">Ask why the system permitted it. The action that follows should change a process, a control or a competence, not just the affected item.<\/p>\n<ul class=\"hb-ul\"><li>Use a structured method rather than an opinion<\/li><li>Distinguish correction from corrective action<\/li><li>Check whether the same weakness exists elsewhere<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Review the Trend at Leadership Level<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">At the top end findings are analysed for trend and drive management system improvement under leadership review.<\/p>\n<p class=\"hb-p\"><strong>Three findings against the same clause in eighteen months is a system problem, and it will be obvious to your auditor before it is obvious to you.<\/strong><\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Auditors form a view of an organisation from how it handles what it already knows is wrong. An aged open finding says more than the finding itself.<\/strong><\/p>"},{"id":"QCA06","order":6,"q_ref":"3.6","t":"Management System Policies And Objectives","b":"<p class=\"hb-lead\">Policies are the cheapest thing to get right and the most commonly wrong. To score a 10 they must be current, endorsed at director level, communicated properly, reviewed at least annually, and carry objectives that are actually monitored — with certification where your customers require it.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Meet the Formal Requirements<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS CORE audit protocols set out precisely what is expected of policies:<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Dated and current<\/li><li>Endorsed at top level management, at director level<\/li><li>Covering all areas of the organisation's business<\/li><li>Communicated to all employees on initial induction and following policy changes, and to key suppliers and other interested parties<\/li><li>Reviewed regularly, annually as a minimum<\/li><\/ul>\n<p class=\"hb-p\">Most policy findings are against one of those five, not against the content.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Include What Each Policy Must Contain<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">The protocols specify content. The Quality Policy statement must state whether the organisation is certified to any standards, must set and monitor quality objectives, and must commit to working with organisations and customers to maintain the highest quality standards and to continual improvement.<\/p>\n<ul class=\"hb-ul\"><li>The Health and Safety Policy needs commitment to safety so far as reasonably practicable, sufficient resources, setting and monitoring objectives, continual improvement, and safe behaviours<\/li><li>The Environmental Policy needs commitment to preventing pollution, protecting the environment, minimising life cycle impact including disposal, objectives and continual improvement<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Set Objectives You Actually Track<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>A policy with no objectives cannot be improved against, and an objective with no data is a slogan.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Three or four objectives per policy, not fifteen<\/li><li>A number, a target and an owner for each<\/li><li>Reported somewhere on a regular cycle<\/li><li>Reviewed and reset when they are met<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Communicate It Properly<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Communication is a specified requirement, not an afterthought. Keep the evidence:<\/p>\n<ul class=\"hb-ul\"><li>Induction records showing policies were issued<\/li><li>A re-issue record after each change, with acknowledgement<\/li><li>Evidence they reached key suppliers and interested parties<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Move From Holding a System to Using One<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end the management system genuinely runs the business.<\/strong><\/p>\n<p class=\"hb-p\">That shows up as internal audits that change decisions, management reviews that allocate resource, and certification maintained where customers or codes require it with findings closed. Note that no rail requirement compels ISO certification — it is a customer and code-driven expectation, so decide it commercially and be able to explain your decision either way.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Policies are the first thing an auditor reads and the easiest place to lose marks for reasons that have nothing to do with how good your business is.<\/strong><\/p>"},{"id":"QCA07","order":7,"q_ref":"3.7","t":"Legal And Standards Register","b":"<p class=\"hb-lead\">You cannot comply with what you have not identified. To score a 10 you need a register scoped to the work you actually do, recording the issue you are working to, with a named owner watching for changes and a controlled process that moves drawings, procedures and training together.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Build the Register the Protocol Expects<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS CORE audit protocols require a register of the legislation and standards that are applicable to the scope of works.<\/strong><\/p>\n<p class=\"hb-p\">Scope it to what you do. A register listing every standard in the sector is unusable and tells an auditor you have not thought about it.<\/p>\n<ul class=\"hb-ul\"><li>The legislation that applies to your activities<\/li><li>The standards you build or test to<\/li><li>Customer-specific requirements you have accepted<\/li><li>The issue or version of each, and when you last checked<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Record the Issue, Not Just the Title<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>This is the detail that turns a list into a control.<\/strong><\/p>\n<p class=\"hb-p\">Working to a superseded issue is a finding, and it is invisible unless you record which issue you are working to and when you last verified it.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Give Someone the Job of Watching<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>A named owner with the review in their objectives<\/li><li>A defined review frequency<\/li><li>Subscriptions or alerts where they exist, rather than memory<\/li><li>A route for anyone in the business to flag a change they have heard about<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Communicate Changes to the People Affected<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">A change that reaches the quality function and stops there has not been implemented.<\/p>\n<ul class=\"hb-ul\"><li>Identify who is affected by each change<\/li><li>Brief them, and record it<\/li><li>Check that they applied it<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Implement Through Controlled Change<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end changes are horizon scanned, assessed for business impact at senior level, and implemented through a controlled process.<\/strong><\/p>\n<p class=\"hb-p\">That means drawings, work instructions, inspection criteria and training all move together, on a planned date, rather than drifting apart. A standard update that reaches the drawing but not the inspector is a non-conformance waiting to be found.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Compliance failures are rarely refusals. They are almost always someone working diligently to a document that changed.<\/strong><\/p>"},{"id":"QCA08","order":8,"q_ref":"3.8","t":"Managing Multiple Qualification Routes","b":"<p class=\"hb-lead\">Rail runs more than one qualification scheme and they are not interchangeable. To score a 10 you need to know which your target buyers actually use, manage your position under each, and treat the portfolio as a commercial decision owned at leadership level.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Know That There Is More Than One Route<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>RISQS is the principal scheme. Achilles Link-up is the rail sector scheme operated as an alternative route: its Audit Scheme Rule Book states that the Link-Up Audit provides Achilles customers with assurance and visibility of a supplier's level of compliance against one or more Network Rail Supplier Qualification modules.<\/strong><\/p>\n<p class=\"hb-p\">Note that Link-up is the rail scheme. UVDB is the utilities scheme and is not the same thing, which is a common and costly confusion.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Find Out What Your Buyers Actually Use<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Ask them. This takes one email and it is the highest-value action on this question.<\/strong><\/p>\n<ul class=\"hb-ul\"><li>Which scheme each target buyer searches<\/li><li>Which modules or codes they filter on<\/li><li>Whether a framework you want requires a particular scheme<\/li><li>Whether a principal contractor imposes their own additional qualification<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Manage Each Position Actively<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<ul class=\"hb-ul\"><li>Track modules or codes held under each scheme<\/li><li>Track questionnaire completeness and audit status<\/li><li>Track renewal dates, and start early<\/li><li>Keep the same capability story consistent across schemes<\/li><\/ul>\n<p class=\"hb-p\"><strong>Qualification lapsing mid-bid is an avoidable and unrecoverable way to lose work.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Decide Deliberately What Is Worth Holding<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Schemes cost money and audit time. That makes the portfolio a commercial decision, not an administrative default.<\/p>\n<ul class=\"hb-ul\"><li>What does each scheme actually open<\/li><li>What does it cost, including internal time<\/li><li>Is there a buyer you would win work from if you held it<\/li><li>Is there one you are paying for and gaining nothing from<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Own It at Leadership Level<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>At the top end qualification is managed as one portfolio serving a route to market.<\/strong><\/p>\n<p class=\"hb-p\">Put the decision in front of the leadership team with the cost and the expected return, and revisit it when your target market changes.<\/p>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Being invisible on the scheme your best prospect uses is indistinguishable, from their side, from not existing.<\/strong><\/p>"}]},"leadership_gov":{"color":"#60a5fa","label":"Leadership & Governance","order":4,"chapters":[{"id":"LDG01","order":1,"q_ref":"4.1","t":"Leadership Commitment To Rail Safety","b":"<p class=\"hb-lead\">Rail customers read leadership before they read your procedures. To score a 10 here you need more than a signed policy: your people have to be able to say what leadership expects of them on rail work, and you need at least one decision on record where that expectation cost you something and you held it anyway.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Say What You Actually Expect<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Write down the rail-specific expectations, not generic quality slogans.<\/strong><\/p>\n<p class=\"hb-p\">A useful statement names the behaviours you want when things are difficult, not when they are easy. For rail work that usually means:<\/p>\n<ul class=\"hb-ul\"><li>Stopping and asking rather than assuming, when a specification is ambiguous<\/li><li>Reporting a non-conformance you found yourself<\/li><li>Refusing to ship on a quality concern even when the customer is chasing<\/li><li>Raising a problem early rather than hoping it resolves<\/li><\/ul>\n<p class=\"hb-p\">Keep it to a page. A statement nobody can remember is a statement nobody can follow.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Give It a Regular Channel<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Pick channels your people actually attend and use them consistently:<\/p>\n<ul class=\"hb-ul\"><li>Production and shift start meetings<\/li><li>Quarterly all-staff briefings<\/li><li>Shop floor walks with a structure, not a stroll<\/li><li>A short written brief when a rail customer raises something<\/li><\/ul>\n<p class=\"hb-p\"><strong>Frequency beats polish. A rough monthly message lands better than an immaculate annual one.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Check It Landed<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">This is the step most organisations skip, and it is the one assessors ask about.<\/p>\n<ul class=\"hb-ul\"><li>Ask people directly what they believe leadership expects, and write down what they say<\/li><li>Put a question in your staff survey on whether leaders visibly prioritise quality<\/li><li>Compare what supervisors tell their teams against what the senior team believes it said<\/li><\/ul>\n<p class=\"hb-p\">Where the answers come back thin, that is not a failure. It is your starting point, and showing you looked is worth more than assuming you already knew.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Make One Costly Decision Visible<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Nothing evidences leadership commitment like a decision that hurt.<\/strong><\/p>\n<p class=\"hb-p\">Hold a record of an occasion where you stopped a shipment, scrapped a batch, told a customer you would be late rather than send something marginal, or invested ahead of a requirement. Record the decision, who took it, and what it cost.<\/p>\n<p class=\"hb-p\">Then tell people about it. A decision nobody hears about changes nothing.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Push It Down to Supervisors<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Leadership that stops at the senior team is not a culture, it is a communications exercise. ORR's maturity model is explicit that identifying and promoting the right leadership styles at all levels is what supports a positive culture.<\/p>\n<ul class=\"hb-ul\"><li>Give supervisors the same messages and the standing to repeat them<\/li><li>Recognise supervisors who raise problems rather than absorb them<\/li><li>Reflect the expectations in objectives and appraisals, so they carry weight<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: A supplier whose staff cannot describe what leadership expects will not sustain quality when the pressure comes on, and rail customers know it. This question is where assessors form their first impression of everything else.<\/strong><\/p>"},{"id":"LDG02","order":2,"q_ref":"4.2","t":"Governance, Oversight And Accountabilities","b":"<p class=\"hb-lead\">Governance is not a diagram. To score a 10 here you have to show that someone senior owns rail work, that they see real information about it often enough to act, and that when a measure moved the wrong way they did something visible about it.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Name Who Is Accountable<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Put a name against rail work at senior level, not a function.<\/strong><\/p>\n<p class=\"hb-p\">Set out, in writing:<\/p>\n<ul class=\"hb-ul\"><li>Who is accountable for rail safety, quality and delivery<\/li><li>Who owns each specific rail obligation, such as scheme registration, competence, or customer reporting<\/li><li>Who deputises when they are away<\/li><\/ul>\n<p class=\"hb-p\">Where the same person holds several of these, say so. A small organisation with one accountable director and a clear list beats a large one with an ambiguous matrix.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Decide What They See, and How Often<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Governance fails most often because the information arrives too late or too smooth. Agree a short reporting pack and a fixed rhythm:<\/p>\n<ul class=\"hb-ul\"><li>Safety and quality performance, including the things that went wrong<\/li><li>Open findings and their age<\/li><li>Customer or client escalations<\/li><li>Competence, resource or capability exposures<\/li><\/ul>\n<p class=\"hb-p\"><strong>Six real measures reviewed monthly is worth more than thirty reviewed annually.<\/strong><\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Give It Terms of Reference<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Whatever your governing body is called, write down its membership, frequency, quorum and what it decides. ORR's maturity model expects an effective board to set direction, define the arrangements for managing risk, ensure resources are provided, and delegate through a structure and a management system.<\/p>\n<p class=\"hb-p\">Keep minutes that record decisions, not attendance.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>4. Build a Route for Conflicts<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Acknowledge that safety and quality will sometimes conflict with cost and delivery, and say how that gets resolved.<\/strong><\/p>\n<p class=\"hb-p\">The maturity model expects the potential for conflict between safety and other business objectives to be acknowledged and minimised, with a process for resolving it. In practice that means:<\/p>\n<ul class=\"hb-ul\"><li>A stated escalation route when someone believes a commercial decision is unsafe or non-compliant<\/li><li>Authority levels that say who can accept what<\/li><li>Evidence that the route has been used at least once<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>5. Move From Reporting to Challenge<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">This is the difference between a 7 and a 10. At 7 the senior team is informed. At 10 it argues with what it is shown.<\/p>\n<ul class=\"hb-ul\"><li>Test the assumptions behind a favourable number before accepting it<\/li><li>Ask what the data does not cover<\/li><li>Compare yourself against something external rather than only against last month<\/li><li>Direct resource at the weakest area, and record that you did<\/li><\/ul>\n  <\/div>\n<\/div>\n<p class=\"hb-p\"><strong>Why this matters: Rail buyers are themselves regulated and governed, and they recognise real governance quickly. A framework that only confirms good news is the one that misses the problem that reaches your customer.<\/strong><\/p>"},{"id":"LDG03","order":3,"q_ref":"4.3","t":"Supervision And Visible Leadership","b":"<p class=\"hb-lead\">Supervision is where policy either becomes practice or does not. To score a 10 you need defined accountabilities for managers and supervisors, spans of control you have actually assessed rather than inherited, and evidence that what supervision finds changes something.<\/p>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>1. Write Supervision Into the Role<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\"><strong>Put safety and quality duties in supervisor role profiles, and assess them at appraisal.<\/strong><\/p>\n<p class=\"hb-p\">Be specific about what a supervisor is responsible for:<\/p>\n<ul class=\"hb-ul\"><li>Checking work in progress against the specification and the method<\/li><li>Verifying completed work before it moves on<\/li><li>Briefing changes and confirming they were understood<\/li><li>Raising and recording problems rather than absorbing them<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>2. Assess Your Spans of Control<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">ORR's maturity model requires that adequate supervision is provided, with spans of control and supervisory ratios that are appropriate and realistic, taking account of the nature of the work, the dispersion of staff and human factors.<\/p>\n<p class=\"hb-p\"><strong>That is a calculation, not an assumption. Do it and write it down.<\/strong><\/p>\n<p class=\"hb-p\">Take each shift and area in turn and ask how many people one supervisor is genuinely overseeing, how far apart they are, and whether the work needs close attention or occasional attention. Night and weekend cover is where ratios usually break.<\/p>\n  <\/div>\n<\/div>\n<div class=\"hb-card\">\n  <div class=\"hb-card-header\" style=\"border-left-color:#00c8d4\">\n    <svg class=\"hb-card-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#00c8d4\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M9 9h6M9 12h6M9 15h4\"/><\/svg>\n    <span>3. Give Supervision a Structure<\/span>\n  <\/div>\n  <div class=\"hb-card-body\">\n<p class=\"hb-p\">Unstructured presence produces unstructured findings. Gi
